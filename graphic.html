<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Study graphic · NCLEX Success Center</title>
  <style>
    :root{--ink:#17344f;--cream:#fcf8f2;--paper:#fffdf9;--rose:#bd6f7f;--muted:#567087;--line:#d8e1db}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(1000px,calc(100% - 28px));margin:auto;padding:24px 0 60px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .bar a,.bar button{color:var(--ink);font:800 .78rem Inter,sans-serif;text-decoration:none;background:none;border:0;border-bottom:1px solid currentColor;cursor:pointer;padding:0 0 2px}
    .eyebrow{margin:0 0 8px;color:var(--rose);font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0 0 8px;font:700 clamp(1.7rem,4vw,2.5rem) Georgia,serif;letter-spacing:-.04em}
    p{color:var(--muted);line-height:1.6;margin:0 0 14px}
    .tags span{display:inline-block;margin:0 6px 6px 0;padding:4px 9px;border-radius:999px;background:#f7e5e3;color:var(--rose);font-size:.68rem;font-weight:800}
    img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);margin-top:10px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="bar"><a id="back" href="student-dashboard.html">← Back to my dashboard</a><a id="dl" href="#" download target="_blank" rel="noopener">Open full size / save</a></div>
    <p class="eyebrow" id="meta">Study graphic</p>
    <h1 id="title">Loading…</h1>
    <p id="desc"></p>
    <div class="tags" id="tags"></div>
    <img id="img" alt="" hidden>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');
    const $=id=>document.getElementById(id);
    (async()=>{
      const {data:{session}}=await db.auth.getSession();
      if(!session){location.replace('student-login.html');return}
      const {data:admin}=await db.from('app_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
      if(admin)$('back').href='madison-graphics.html',$('back').textContent='← Back to graphics library';
      const id=new URLSearchParams(location.search).get('id');
      const {data:g}=id?await db.from('graphics').select('*').eq('id',id).maybeSingle():{data:null};
      if(!g){$('title').textContent='This graphic could not be found.';return}
      const {data:signed}=await db.storage.from('graphics-library').createSignedUrl(g.image_path,3600);
      document.title=g.title+' · NCLEX Success Center';
      $('title').textContent=g.title;
      $('desc').textContent=g.description||'';
      $('meta').textContent=[g.body_system,g.nclex_category].filter(Boolean).join(' · ')||'Study graphic';
      (g.tags||[]).forEach(t=>{const s=document.createElement('span');s.textContent=t;$('tags').appendChild(s)});
      if(signed){$('img').src=signed.signedUrl;$('img').alt=g.title;$('img').hidden=false;$('dl').href=signed.signedUrl}
    })();
  </script>
</body>
</html>
