<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Module 4 · Cardiac · NCLEX Success Center</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fcf8f2;color:#17344f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gate{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fffdf9;border:1px solid #d8e1db;padding:32px;box-shadow:0 16px 48px #17344f12}.eyebrow{margin:0 0 10px;color:#bd6f7f;font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0 0 14px;font:700 2.2rem/1 Georgia,serif;color:#382338}.copy{margin:0;color:#567087;line-height:1.6}.error{margin-top:18px;padding:13px 15px;background:#fde9e7;color:#9c382d;border-radius:10px;font-weight:650}.back{display:inline-block;margin-top:18px;color:#17344f;font-size:.85rem;font-weight:800;text-decoration:none;border-bottom:1px solid currentColor}iframe{display:none;width:100%;height:100vh;border:0;background:#fff}
  </style>
</head>
<body>
  <main id="gate" class="gate"><section class="card"><p class="eyebrow">NCLEX Success Center</p><h1>Opening Module 4…</h1><p class="copy">Checking your secure student access before opening Cardiac.</p><div id="error" class="error" hidden></div><a class="back" href="student-dashboard.html">← Back to my study plan</a></section></main>
  <iframe id="module" title="Module 4 Cardiac"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');
    const gate=document.getElementById('gate'),frame=document.getElementById('module'),errorBox=document.getElementById('error');
    let currentStudent=null;
    function fail(message){errorBox.textContent=message;errorBox.hidden=false}
    window.saveM4Result=async function(score,total,answers){
      if(!currentStudent)return{ok:false,message:'Student session is unavailable.'};
      const {error}=await db.from('module_results').insert({student_id:currentStudent.id,module_key:'m4',score,total,answers});
      if(error){console.error('Module result save failed:',error);return{ok:false,message:'Your score could not be saved yet.'}}
      return{ok:true,message:'Results saved to your Success Center.'};
    };
    async function init(){
      const {data:{session}}=await db.auth.getSession();
      if(!session){location.replace('student-login.html');return}
      const {data:student,error:studentError}=await db.from('students').select('id').eq('auth_user_id',session.user.id).maybeSingle();
      if(studentError||!student){await db.auth.signOut();location.replace('student-login.html');return}
      currentStudent=student;
      const {data:access,error:accessError}=await db.from('student_module_access').select('enabled').eq('student_id',student.id).eq('module_key','m4').maybeSingle();
      if(accessError){fail('We could not verify your Module 4 access. Please return to your study plan and try again.');return}
      if(!access?.enabled){fail('Module 4 is not currently assigned to your account.');return}
      frame.src='module4-guide.html';
      frame.style.display='block';gate.style.display='none';
    }
    init();
  </script>
</body>
</html>
