<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="nclex-option-protocol" content="sata-order-v1">
  <title>Synthetic combined NGN and SATA fixture</title>
  <link rel="stylesheet" href="../exam-ui.css">
  <script src="../option-presentation.js?v=ngn-sata-v1"></script>
  <script src="../ngn-scoring.js?v=ngn-sata-v1"></script>
  <script src="../exam-ui-ngn.js?v=ngn-sata-v1"></script>
  <script src="../ngn-author-ngn.js?v=ngn-sata-v1"></script>
</head>
<body>
  <button id="author" type="button">Open synthetic author</button>
  <div id="root"></div>
  <script>
    const source = [3, 4, 5].map(n => ({
      id: 'combined-' + n, type: 'sata', schemaVersion: 1, textFormat: 'plain', scoringVersion: 'ngn-v1',
      stem: 'Synthetic SATA with ' + n + ' correct options.',
      options: Array.from({ length: 6 }, (_, i) => 'Synthetic option ' + i),
      correct: Array.from({ length: n }, (_, i) => i), rationale: 'Synthetic overall rationale.',
      optionRationales: Object.fromEntries(Array.from({ length: 6 }, (_, i) => [i, 'Synthetic explanation ' + i]))
    }));
    const bank = [source[0], { kind: 'case', id: 'combined-case', scenario: 'Synthetic case', textFormat: 'plain',
      tabs: ['notes', 'labs'].map((id, i) => ({ id, label: i ? 'Labs' : 'Notes', columns: ['Finding'],
        entries: [{ at: '2026-10-21T08:00', cells: [{ t: 'Synthetic clinical record ' + id }] }] })), items: source.slice(1) }];
    window.exam = new ExamUI.Exam(document.getElementById('root'), {
      title: 'Synthetic combined local test', items: ExamUI.prepare(bank, { shuffleOptions: false }),
      storageKey: 'combined-fixture', showTimer: false, instant: true,
      onFinish: result => {
        window.result = result;
        document.getElementById('root').innerHTML = result.items.map((item, i) => ExamUI.reviewHtml(item, result.ans[i])).join('');
      }
    });
    document.getElementById('author').onclick = () => {
      window.exam.destroy();
      document.getElementById('root').innerHTML = '';
      window.author = NGNAuthor.mount(document.getElementById('root'), source[0]);
    };
  </script>
</body>
</html>
