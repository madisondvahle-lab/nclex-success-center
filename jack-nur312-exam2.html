<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NUR 312 · Exam 2 Practice</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assessment-persistence.js"></script>
<style>
:root{--ink:#17344f;--cream:#fcf8f2;--paper:#fffdf9;--rose:#bd6f7f;--plum:#382338;--muted:#567087;--line:#d8e1db;--soft:#f5eee8;--green:#167052;--red:#9c382d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(820px,calc(100% - 36px));margin:auto}.top{padding:24px 0;border-bottom:1px solid #e2e8e3}.brand{font:700 1.2rem Georgia,serif}.hero{padding:48px 0 26px}.eyebrow{color:var(--rose);font-weight:900;text-transform:uppercase;letter-spacing:.13em;font-size:.7rem;margin:0 0 8px}h1{font:700 clamp(2.4rem,6vw,4rem)/.95 Georgia,serif;color:var(--plum);letter-spacing:-.055em;margin:0}.hero p:last-child{color:var(--muted);line-height:1.6;max-width:650px}.progress{height:8px;background:#e8e1dc;border-radius:999px;overflow:hidden;margin:20px 0}.progress span{display:block;height:100%;background:var(--rose);transition:width .25s}.save-status{min-height:1.4em;color:var(--muted);font-size:.82rem}.save-status.saved{color:var(--green)}.save-status.error{color:var(--red)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:27px;box-shadow:0 10px 32px #17344f0b;margin-bottom:35px}.meta{font-size:.72rem;color:var(--rose);font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}.stem{font:700 1.25rem/1.45 Georgia,serif;color:var(--plum);margin:0 0 20px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 15px;color:var(--ink);font:650 .94rem/1.4 Inter,sans-serif;cursor:pointer}.option:hover{border-color:var(--rose)}.option.selected{border:2px solid var(--plum);background:var(--soft)}.option.correct{border:2px solid var(--green);background:#e7f5ee}.option.wrong{border:2px solid var(--red);background:#fde9e7}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}button.action{border:0;border-radius:999px;padding:12px 19px;font-weight:850;cursor:pointer}.primary{background:var(--plum);color:#fff}.secondary{background:var(--soft);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.feedback{display:none;margin-top:18px;border-radius:12px;padding:15px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#e7f5ee;color:#0f5d42}.feedback.bad{background:#fde9e7;color:#7e3029}.result{text-align:center;padding:15px 0}.score{font:700 4rem Georgia,serif;color:var(--plum)}.hidden{display:none!important}@media(max-width:600px){.card{padding:20px}.actions{flex-direction:column}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">Study With Madison, RN · NUR 312 Practice</div></header>
<section class="hero"><p class="eyebrow">Jack’s assigned practice</p><h1>Exam 2 Practice</h1><p>92 questions covering EKG interpretation, dysrhythmias, cardiac conditions, procedures, devices, medications, and calculations.</p><div class="progress"><span id="bar"></span></div><div id="saveStatus" class="save-status" aria-live="polite"></div></section>
<section class="card" id="quiz"><div class="meta" id="meta"></div><p class="stem" id="stem"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action secondary" id="back">Previous</button><button class="action primary" id="submit">Check answer</button><button class="action primary hidden" id="next">Next question</button></div></section>
<section class="card hidden" id="results"><div class="result"><p class="eyebrow">Practice Complete</p><h2>Your Score</h2><div class="score" id="score"></div><p id="summary"></p></div></section>
</main>
<script>
const SUPABASE_URL="https://pmjwwktwlsqpetwfvolb.supabase.co",SUPABASE_ANON_KEY="sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT",assessmentKey="jack-nur312-exam2",sessionKey=globalThis.crypto?.randomUUID?globalThis.crypto.randomUUID():`jack-nur312-${Date.now()}`;
let Q=[],i=0,selected=null,answered=false,score=0,persistence={db:null,attempt:null,revision:0};const responses=[];
const $=id=>document.getElementById(id),bar=$("bar"),meta=$("meta"),stem=$("stem"),options=$("options"),feedback=$("feedback"),submit=$("submit"),next=$("next"),back=$("back"),saveStatus=$("saveStatus");
function setSaveStatus(type,message){saveStatus.textContent=message;saveStatus.className=`save-status ${type}`}
async function setupPersistence(){if(!window.supabase||!window.NCLEX_ASSESSMENT_PERSISTENCE){setSaveStatus("","Results will not be saved in this browser.");return}persistence.db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{session},error}=await persistence.db.auth.getSession();if(error)throw error;if(!session){setSaveStatus("","Sign in through Student Login to save this test.");return}persistence.attempt=await NCLEX_ASSESSMENT_PERSISTENCE.createAttempt({supabase:persistence.db,sessionKey,assessmentKey,assessmentTitle:"NUR 312 Exam 2 Practice",assessmentVersion:"jack-nur312-exam2-v1",targetQuestions:Q.length,checkpoint:{schemaVersion:1,currentQuestion:0,answered:[]}});persistence.revision=Number(persistence.attempt.checkpoint_revision||0);setSaveStatus("saved","Your responses are being saved.");}
function orderFor(index){const order=Q[index].o.map((_,n)=>n);for(let n=order.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[order[n],order[j]]=[order[j],order[n]]}return order}
async function saveResponse(index,originalIndex,correct){if(!persistence.attempt)return;const saved=await NCLEX_ASSESSMENT_PERSISTENCE.recordResponse({supabase:persistence.db,attemptId:persistence.attempt.id,expectedRevision:persistence.revision,response:{id:Q[index].id,source:Q[index].source,type:"mcq",difficulty:Q[index].difficulty,topic:Q[index].topic,selectedAnswer:originalIndex,correctAnswer:Q[index].a,correct},checkpoint:{schemaVersion:1,currentQuestion:index,answered:responses.map((r,n)=>r?.answered?{id:Q[n].id,selected:r.original}:null).filter(Boolean)},abilityEstimate:score/Q.length});persistence.revision=saved.checkpointRevision;setSaveStatus("saved","Your responses are being saved.")}
function render(){const q=Q[i],r=responses[i],order=r?.order||orderFor(i);if(!r)responses[i]={order};selected=r?.selected??null;answered=r?.answered??false;meta.textContent=`Question ${i+1} of ${Q.length} · ${q.type}`;stem.textContent=q.q;bar.style.width=`${((i+1)/Q.length)*100}%`;options.innerHTML="";const correctDisplay=order.indexOf(q.a);order.forEach((original,n)=>{const b=document.createElement("button");b.className="option";b.textContent=`${String.fromCharCode(65+n)}. ${q.o[original]}`;if(selected===n)b.classList.add("selected");if(answered){b.disabled=true;if(n===correctDisplay)b.classList.add("correct");if(n===selected&&selected!==correctDisplay)b.classList.add("wrong")}b.onclick=()=>{if(!answered){selected=n;responses[i].selected=n;options.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");submit.disabled=false}};options.appendChild(b)});feedback.className="feedback";feedback.innerHTML="";if(answered){const correct=selected===correctDisplay;feedback.className=`feedback show ${correct?"good":"bad"}`;feedback.innerHTML=`<strong>${correct?"Correct":"Not quite."}</strong><br>${q.r}`}submit.classList.toggle("hidden",answered);next.classList.toggle("hidden",!answered);submit.disabled=selected===null;back.disabled=i===0;next.textContent=i===Q.length-1?"See results":"Next question"}
submit.onclick=async()=>{if(selected===null)return;const q=Q[i],order=responses[i].order,original=order[selected],correct=original===q.a;answered=true;if(!responses[i].answered){responses[i].answered=true;responses[i].original=original;if(correct)score++}render();try{await saveResponse(i,original,correct)}catch(error){setSaveStatus("error",error.message||"This response could not be saved.")}};
next.onclick=()=>{if(i===Q.length-1)return showResults();i++;render()};back.onclick=()=>{if(i>0){i--;render()}};
function showResults(){$("quiz").classList.add("hidden");$("results").classList.remove("hidden");const pct=Math.round(score/Q.length*100);$("score").textContent=`${score}/${Q.length}`;$("summary").textContent=`${pct}% · Review the rationales for any missed concepts.`;bar.style.width="100%";if(persistence.attempt){setSaveStatus("","Saving your completed result…");NCLEX_ASSESSMENT_PERSISTENCE.finalizeAttempt({supabase:persistence.db,attemptId:persistence.attempt.id,result:null,abilityEstimate:pct/100}).then(()=>setSaveStatus("saved","Your completed result was saved.")).catch(error=>setSaveStatus("error",error.message||"Your completed result could not be saved."))}}
async function init(){const response=await fetch("jack-nur312-exam2-question-bank.json");if(!response.ok)throw new Error("The NUR 312 question bank could not be loaded.");Q=await response.json();await setupPersistence();render()}init().catch(error=>setSaveStatus("error",error.message||"This practice test could not be loaded."));
</script></body></html>
