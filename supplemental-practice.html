  <style>
    :root{--ink:#17344f;--cream:#fcf8f2;--paper:#fffdf9;--rose:#bd6f7f;--muted:#567087;--line:#d8e1db;--soft:#f5eee8;--green:#2f7f5a;--red:#b04e61}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(880px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}.brand,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.045em}.brand{font-size:1.2rem;font-weight:700}.brand small{font:700 .63em Inter,sans-serif}.back{color:var(--ink);font-size:.82rem;font-weight:800;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}.hero{padding:54px 0 28px}.eyebrow{margin:0 0 13px;color:var(--rose);font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:.98}.hero p:not(.eyebrow){max-width:610px;color:var(--muted);line-height:1.65;margin:18px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:64px}.card{background:var(--paper);border:1px solid var(--line);padding:23px}.card h2{margin:0;font-size:1.45rem}.card p{color:var(--muted);font-size:.86rem;line-height:1.55}.card .meta{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--rose)}button{font:800 .8rem Inter,sans-serif;cursor:pointer}.start{margin-top:12px;border:0;background:var(--ink);color:#fff;padding:12px 14px}.start:hover{background:#294d68}.hidden{display:none!important}.quiz{max-width:760px;margin:40px auto 70px;background:var(--paper);border:1px solid var(--line);padding:clamp(20px,4vw,38px)}.progress{height:7px;background:var(--soft);margin:22px 0}.progress div{height:100%;background:var(--rose);transition:width .2s}.question-number{margin:0 0 8px;color:var(--rose);font-weight:900;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.quiz h2{margin:0;font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.13}.options{display:grid;gap:10px;margin-top:26px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);padding:15px;background:#fff;cursor:pointer;font-size:.95rem;line-height:1.45}.option:hover{border-color:var(--ink)}.option input{margin-top:4px;accent-color:var(--ink)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.secondary,.primary{border:0;padding:12px 15px}.secondary{background:var(--soft);color:var(--ink)}.primary{background:var(--ink);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:22px;padding:16px;border-left:4px solid var(--rose);background:var(--soft);line-height:1.55;color:var(--ink);font-size:.9rem}.feedback strong{display:block;margin-bottom:5px}.correct{border-left-color:var(--green)}.incorrect{border-left-color:var(--red)}.results{text-align:center}.score{font:400 clamp(3.4rem,13vw,6.4rem) Georgia,serif;margin:6px 0;color:var(--ink)}.result-detail{max-width:530px;margin:0 auto;color:var(--muted);line-height:1.6}.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.status{min-height:1.4em;margin-top:16px;color:var(--muted);font-size:.82rem}.notice{margin:0 0 22px;padding:14px;background:#fff7f1;border-left:3px solid var(--rose);color:var(--muted);font-size:.82rem;line-height:1.5}@media(max-width:640px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero{padding-top:40px}.quiz{margin-top:24px}.actions{flex-direction:column-reverse}.actions button{width:100%}}
  .intro-card{background:var(--soft);border:2px solid var(--line);padding:28px 32px;margin:16px 0 24px;border-radius:2px}.intro-label{font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);margin:0 0 12px}.intro-note{color:var(--muted);font-size:.88rem;margin:16px 0 0;font-style:italic}.sata-hint{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#b45309;margin:-8px 0 12px;}.option.correct-opt{border-color:#16a34a;background:#f0fdf4;}.option.wrong-opt{border-color:#dc2626;background:#fef2f2;}
</style>

  <script>
    const db=supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');
    const $=id=>document.getElementById(id);
    const sets=[
      {id:'safety-priority-01',title:'Safety & Priority',tag:'Start here',description:'Five priority and safety decisions that reinforce how to recognize risk and choose the nursing action that cannot wait.',questions:[
        {id:'sp01-q01',stem:'A nurse receives change-of-shift report on four clients. Which client should the nurse assess first?',options:['A client 8 hours after a thyroidectomy who reports tingling around the mouth','A client with heart failure who gained 0.9 kg (2 lb) since yesterday','A client with pneumonia whose temperature is 38.2 C (100.8 F)','A client 1 day after hip surgery who reports pain of 7 on a 0-to-10 scale'],answer:0,rationale:'Tingling after thyroidectomy can signal hypocalcemia from parathyroid injury and can progress to airway-threatening laryngospasm. It is the priority finding.'},
        {id:'sp01-q02',stem:'Which task is appropriate for the RN to delegate to unlicensed assistive personnel (UAP)?',options:['Reinforce teaching about incentive spirometry','Obtain routine vital signs for a stable client','Assess a new complaint of chest pressure','Evaluate whether a new analgesic relieved pain'],answer:1,rationale:'Routine, predictable tasks for a stable client can be delegated to UAP. Teaching, assessment, and evaluation remain RN responsibilities.'},
        {id:'sp01-q03',stem:'A nurse discovers a client on the floor beside the bed. Which action should the nurse take first?',options:['Assess the client for injury','Notify the health care provider','Complete an incident report','Assist the client back to bed'],answer:0,rationale:'Assess first. The nurse needs to determine immediate safety needs before moving the client, notifying the provider, or completing documentation.'},
        {id:'sp01-q04',stem:'Which finding should the nurse report immediately for a client receiving a heparin infusion?',options:['aPTT within the prescribed therapeutic range','New black, tarry stool','Small bruise at a previous venipuncture site','Heart rate of 92/min after ambulation'],answer:1,rationale:'Black, tarry stool can indicate gastrointestinal bleeding, a serious complication of anticoagulation that requires prompt action.'},
        {id:'sp01-q05',stem:'A nurse enters a room and finds smoke coming from a wastebasket. What is the nurse’s first action?',options:['Remove the client from immediate danger','Activate the fire alarm','Close the room door','Attempt to extinguish the fire'],answer:0,rationale:'Use RACE: Rescue, Alarm, Contain, Extinguish/Evacuate. The first priority is to remove anyone in immediate danger.'}
      ]},
      {id:'ob-newborn-01',title:'OB & Newborn Safety',tag:'High priority',description:'Five focused questions on maternal warning signs, newborn assessment, and safe discharge teaching.',questions:[
        {id:'ob01-q01',stem:'Which finding in a client at 35 weeks of gestation requires immediate follow-up?',options:['Blood pressure 168/110 mm Hg with severe headache','Dependent ankle edema at the end of the day','Urinary frequency without dysuria','Mild nausea after eating a large meal'],answer:0,rationale:'Severe hypertension with severe headache suggests preeclampsia with severe features and requires immediate evaluation.'},
        {id:'ob01-q02',stem:'Which statement by a parent of a newborn indicates correct understanding of safe sleep teaching?',options:['“I will place my baby on the back in a crib with a fitted sheet.”','“I will use a positioner to keep my baby on the side.”','“I will place a soft blanket over my baby at night.”','“I will let my baby sleep in my bed after nighttime feedings.”'],answer:0,rationale:'Safe sleep includes supine positioning on a firm, flat surface with only a fitted sheet. Positioners, loose bedding, and adult beds are unsafe.'},
        {id:'ob01-q03',stem:'Which newborn finding requires immediate assessment?',options:['Acrocyanosis of the hands and feet at 2 hours of age','Grunting with nasal flaring at rest','Milia on the nose','A small amount of vaginal mucus'],answer:1,rationale:'Persistent grunting and nasal flaring are signs of respiratory distress and require immediate assessment.'},
        {id:'ob01-q04',stem:'A postpartum client reports soaking one perineal pad in 15 minutes and feeling dizzy. Which action should the nurse take first?',options:['Assess fundal tone and amount of bleeding','Encourage oral fluids','Assist the client to the bathroom','Provide teaching about lochia changes'],answer:0,rationale:'Heavy bleeding with dizziness may indicate postpartum hemorrhage. Immediate assessment of uterine tone and bleeding directs urgent intervention.'},
        {id:'ob01-q05',stem:'Which finding in a client receiving magnesium sulfate requires the nurse to stop the infusion and notify the provider?',options:['Respiratory rate of 10/min','Patellar reflexes 2+','Urine output of 40 mL/hr','Blood pressure of 150/96 mm Hg'],answer:0,rationale:'Respiratory depression is a sign of magnesium toxicity. Stop the infusion and urgently notify the provider per protocol.'}
      ]},
      {id:'med-procedure-01',title:'Medication & Procedure Safety',tag:'Core safety',description:'Five questions on medication administration, calculations, allergies, and infection prevention.',questions:[
        {id:'mp01-q01',stem:'Before administering a newly prescribed cephalosporin to a client who reports a penicillin allergy, what is the nurse’s priority action?',options:['Ask the client to describe the previous allergic reaction','Administer the medication with food','Request a prescription for an antihistamine','Withhold all antibiotics for 24 hours'],answer:0,rationale:'The nurse first clarifies the type and severity of the reported reaction. This information guides safe follow-up and does not assume every allergy has the same risk.'},
        {id:'mp01-q02',stem:'The provider prescribes 750 mg of a medication. The available concentration is 250 mg per tablet. How many tablets should the nurse administer?',options:['1 tablet','2 tablets','3 tablets','4 tablets'],answer:2,rationale:'750 mg divided by 250 mg per tablet equals 3 tablets.'},
        {id:'mp01-q03',stem:'Which action is most important before accessing a central venous catheter hub?',options:['Scrub the hub with the approved antiseptic','Flush the catheter with sterile water','Replace the catheter every 48 hours','Apply a warm compress to the insertion site'],answer:0,rationale:'Hand hygiene, aseptic technique, and disinfection of the access hub immediately before use reduce catheter-related infection risk.'},
        {id:'mp01-q04',stem:'A nurse prepares to administer rapid-acting insulin before a meal. Which action is most important?',options:['Verify that the meal tray is available before giving the dose','Give the insulin 1 hour before the meal','Hold the insulin if the client is thirsty','Administer the insulin only at bedtime'],answer:0,rationale:'Rapid-acting insulin has a quick onset. Confirm that food is available to reduce the risk of hypoglycemia.'},
        {id:'mp01-q05',stem:'Which finding is most concerning for a client receiving IV potassium chloride?',options:['Burning at the IV site during the infusion','Heart rate of 88/min','Urine output of 55 mL/hr','Mild thirst after breakfast'],answer:0,rationale:'Potassium infusions are irritating and must be assessed for infiltration or phlebitis. Never give IV potassium by direct IV push.'}
      ]},
      {id:'ngn-acute-01',title:'NGN Acute Care Judgment',tag:'Case thinking',description:'Five linked-decision style questions that practice recognizing cues, prioritizing risk, acting, and evaluating.',questions:[
        {id:'ng01-q01',stem:'A client with a urinary tract infection has a temperature of 39.2 C (102.6 F), heart rate 122/min, blood pressure 86/48 mm Hg, and new confusion. Which concern is the priority?',options:['Possible sepsis with poor perfusion','Expected fever response to infection','Uncontrolled chronic hypertension','Medication-related constipation'],answer:0,rationale:'Infection plus hypotension, tachycardia, fever, and new confusion suggests sepsis with impaired perfusion. This is an emergency.'},
        {id:'ng01-q02',stem:'For the client with suspected sepsis, which action should the nurse take first?',options:['Activate the facility’s rapid response or sepsis process','Offer a cool drink for fever','Obtain a routine daily weight','Provide discharge teaching about antibiotics'],answer:0,rationale:'Suspected sepsis with signs of instability requires immediate escalation and treatment using the facility’s emergency process.'},
        {id:'ng01-q03',stem:'A client with a new tracheostomy is in respiratory distress and the tracheostomy tube has become dislodged. Which action is the priority?',options:['Maintain the airway using the emergency tracheostomy equipment','Apply a dry dressing and wait for the provider','Offer oral fluids to reduce anxiety','Reposition the client flat in bed'],answer:0,rationale:'Airway is the priority. Use emergency equipment and call for assistance according to facility protocol.'},
        {id:'ng01-q04',stem:'A client with heart failure suddenly develops crackles, severe dyspnea, and oxygen saturation of 84% on room air. Which action should the nurse take first?',options:['Sit the client upright and apply oxygen','Encourage the client to drink water','Assist the client to ambulate','Obtain the client’s daily weight'],answer:0,rationale:'Acute pulmonary edema compromises breathing. Positioning upright and applying oxygen address the immediate ABC priority while escalating care.'},
        {id:'ng01-q05',stem:'After interventions for a client with shock, which finding best indicates improved perfusion?',options:['Urine output increases to 35 mL/hr','Skin becomes more pale','Level of consciousness declines','Blood pressure continues to decrease'],answer:0,rationale:'Improving urine output supports improved renal perfusion. Worsening color, mentation, or blood pressure indicates deterioration.'}
      ]}
,
      {
        id:"alyssa-targeted-01",
        title:"Alyssa Targeted Drill 1",
        tag:"Assigned practice",
        description:"30 focused questions on mental-health decision making, substance use, medication safety, adverse effects, blood products, IV therapy, and priority nursing actions.",
        questions:[
          {
            id:"at01-q01",
            stem:"The nurse receives report on four clients. Which client should the nurse assess first?",
            options:[
              "A client with major depressive disorder who has remained in bed most of the morning",
              "A client experiencing mania who has slept 3 hours during the past 24 hours",
              "A client with schizophrenia who states, \"The voices are telling me my roommate needs to die.\"",
              "A client with OCD who has spent 30 minutes washing their hands"
            ],
            answer:2,
            rationale:"Command hallucinations involving harm to another person create an immediate safety concern. Assess intent, ability to resist the command, and access to the potential victim."
          },
          {
            id:"at01-q02",
            stem:"A client says, \"There is no point in trying anymore. Nothing is ever going to get better.\" Which response by the nurse is best?",
            options:[
              "You should not feel that way. Your treatment is working.",
              "What makes you think nothing will improve?",
              "It sounds like you are feeling hopeless. Are you thinking about killing yourself?",
              "Try focusing on the positive things happening in your life."
            ],
            answer:2,
            rationale:"The nurse acknowledges the client's hopelessness and directly assesses suicide risk. Safety assessment takes priority over reassurance or redirection."
          },
          {
            id:"at01-q03",
            stem:"Which finding in a client hospitalized for severe depression requires the nurse's immediate follow-up?",
            options:[
              "The client refuses breakfast",
              "The client sleeps for most of the afternoon",
              "The client gives a favorite necklace to another client",
              "The client avoids participating in group therapy"
            ],
            answer:2,
            rationale:"Giving away valued possessions may indicate preparation for suicide and requires immediate safety assessment."
          },
          {
            id:"at01-q04",
            stem:"A client experiencing acute mania repeatedly enters other clients' rooms and interrupts conversations. Which intervention is most appropriate?",
            options:[
              "Explain why the behavior is inappropriate during group therapy",
              "Allow the behavior because confrontation may increase agitation",
              "Set clear, concise limits and consistently redirect the client",
              "Ask the client to describe the feelings causing the behavior"
            ],
            answer:2,
            rationale:"Acute mania requires simple, consistent limits and redirection. Lengthy explanations and insight-oriented discussion are less effective during severe mania."
          },
          {
            id:"at01-q05",
            stem:"A client with schizophrenia says, \"The television is sending secret messages telling me what to do.\" Which response is best?",
            options:[
              "The television cannot communicate with you.",
              "What exactly is the television telling you?",
              "I do not hear those messages, but I understand they seem real to you.",
              "Why do you believe the television is talking to you?"
            ],
            answer:2,
            rationale:"Present reality without arguing with or reinforcing the delusion. The nurse acknowledges the client's experience while maintaining reality orientation."
          },
          {
            id:"at01-q06",
            stem:"A client experiencing a severe panic attack is hyperventilating and says, \"I'm going to die.\" What should the nurse do first?",
            options:[
              "Teach the client about cognitive restructuring",
              "Remain with the client and use short, simple statements",
              "Ask the client to identify the event that triggered the attack",
              "Move the client to group therapy for distraction"
            ],
            answer:1,
            rationale:"During severe panic, the client's ability to process information is limited. Presence, safety, and short simple communication are the immediate priorities."
          },
          {
            id:"at01-q07",
            stem:"Which client should the psychiatric nurse assess first?",
            options:[
              "A client with anorexia nervosa whose potassium is 2.8 mEq/L",
              "A client with generalized anxiety disorder requesting PRN medication",
              "A client with depression who has not showered for 3 days",
              "A client with schizophrenia refusing to attend group therapy"
            ],
            answer:0,
            rationale:"A potassium level of 2.8 mEq/L can cause dangerous cardiac dysrhythmias. Physiologic instability takes priority even on a psychiatric unit."
          },
          {
            id:"at01-q08",
            stem:"A grieving client says, \"I should have made him go to the doctor sooner. This is my fault.\" Which response is best?",
            options:[
              "You could not have known what would happen.",
              "You should not blame yourself.",
              "Tell me more about what makes you feel responsible.",
              "Your family would not want you blaming yourself."
            ],
            answer:2,
            rationale:"The therapeutic response encourages expression and exploration without minimizing the client's feelings or offering false reassurance."
          },
          {
            id:"at01-q09",
            stem:"A client becomes increasingly agitated, begins pacing rapidly, and clenches their fists. What should the nurse do first?",
            options:[
              "Apply restraints",
              "Administer an IM antipsychotic",
              "Approach calmly and attempt verbal de-escalation",
              "Tell the client the behavior will not be tolerated"
            ],
            answer:2,
            rationale:"Use the least restrictive safe intervention first. Early verbal de-escalation is appropriate before restraints or emergency medication when an immediate physical attack has not occurred."
          },
          {
            id:"at01-q10",
            stem:"A client taking clozapine calls the clinic. Which report requires immediate follow-up?",
            options:[
              "Increased appetite",
              "Dry mouth",
              "Fever and sore throat",
              "Mild constipation"
            ],
            answer:2,
            rationale:"Fever and sore throat may indicate severe neutropenia or agranulocytosis and require urgent evaluation."
          },
          {
            id:"at01-q11",
            stem:"Which client requires the most immediate intervention?",
            options:[
              "A client withdrawing from opioids who has abdominal cramping and diarrhea",
              "A client withdrawing from alcohol who has visual hallucinations and severe tremors",
              "A client withdrawing from nicotine who reports irritability",
              "A client withdrawing from cannabis who reports insomnia"
            ],
            answer:1,
            rationale:"Severe alcohol withdrawal can progress to seizures and delirium tremens and can be life-threatening."
          },
          {
            id:"at01-q12",
            stem:"A client arrives after suspected opioid overdose. Which finding is the priority?",
            options:[
              "Constipation",
              "Pinpoint pupils",
              "Respiratory rate of 6/min",
              "Decreased bowel sounds"
            ],
            answer:2,
            rationale:"Respiratory depression is the immediately life-threatening manifestation of opioid toxicity."
          },
          {
            id:"at01-q13",
            stem:"Which medication should the nurse anticipate administering for opioid overdose?",
            options:[
              "Flumazenil",
              "Naloxone",
              "Methadone",
              "Acamprosate"
            ],
            answer:1,
            rationale:"Naloxone is an opioid antagonist used to reverse opioid-induced respiratory and central nervous system depression."
          },
          {
            id:"at01-q14",
            stem:"A client admitted for alcohol withdrawal becomes disoriented, diaphoretic, severely agitated, and reports seeing insects crawling on the wall. What is the priority concern?",
            options:[
              "Major depressive disorder",
              "Opioid withdrawal",
              "Delirium tremens",
              "Wernicke aphasia"
            ],
            answer:2,
            rationale:"Severe agitation, autonomic hyperactivity, confusion, and hallucinations are concerning for delirium tremens."
          },
          {
            id:"at01-q15",
            stem:"Which statement by a client taking disulfiram indicates a need for further teaching?",
            options:[
              "I should avoid alcohol-containing mouthwash.",
              "I need to check cough medicines for alcohol.",
              "I can drink a small amount of alcohol as long as I eat first.",
              "Some sauces and foods may contain alcohol."
            ],
            answer:2,
            rationale:"Alcohol should be avoided while taking disulfiram because exposure can produce a severe reaction."
          },
          {
            id:"at01-q16",
            stem:"A client taking lisinopril reports which finding that requires immediate action?",
            options:[
              "Persistent dry cough",
              "Blood pressure of 108/68 mm Hg",
              "Swelling of the lips and tongue",
              "Mild dizziness when standing quickly"
            ],
            answer:2,
            rationale:"Lip and tongue swelling suggests angioedema and potential airway compromise. A dry cough is common but is not the immediate emergency."
          },
          {
            id:"at01-q17",
            stem:"Before administering digoxin, the nurse notes an apical pulse of 52/min. What should the nurse do?",
            options:[
              "Administer the medication with food",
              "Hold the medication and follow the prescribed notification parameters",
              "Give half the prescribed dose",
              "Administer the medication and reassess in 1 hour"
            ],
            answer:1,
            rationale:"Significant bradycardia is a reason to withhold digoxin and follow prescribed parameters for further evaluation."
          },
          {
            id:"at01-q18",
            stem:"A client receiving IV vancomycin develops flushing and erythema of the face and upper torso during the infusion. Which action is appropriate?",
            options:[
              "Increase the infusion rate",
              "Assess the client and stop or slow the infusion according to severity and protocol",
              "Permanently discontinue all future vancomycin therapy",
              "Administer the remainder by IV push"
            ],
            answer:1,
            rationale:"Flushing and erythema during vancomycin administration are consistent with a vancomycin infusion reaction. Assess the client and manage the infusion according to severity and protocol."
          },
          {
            id:"at01-q19",
            stem:"Which laboratory value is most important to report before administering spironolactone?",
            options:[
              "Sodium 136 mEq/L",
              "Potassium 5.8 mEq/L",
              "Glucose 118 mg/dL",
              "Hemoglobin 11.8 g/dL"
            ],
            answer:1,
            rationale:"Spironolactone is potassium-sparing and can worsen hyperkalemia."
          },
          {
            id:"at01-q20",
            stem:"A client receiving heparin has a platelet count decrease from 220,000/mm3 to 92,000/mm3. What should the nurse suspect?",
            options:[
              "Expected anticoagulation",
              "Heparin-induced thrombocytopenia",
              "Therapeutic response",
              "Iron-deficiency anemia"
            ],
            answer:1,
            rationale:"A substantial platelet decrease during heparin therapy raises concern for heparin-induced thrombocytopenia and requires prompt evaluation."
          },
          {
            id:"at01-q21",
            stem:"Which client receiving morphine requires immediate intervention?",
            options:[
              "A client reporting nausea",
              "A client with a respiratory rate of 8/min",
              "A client reporting constipation",
              "A client who is mildly drowsy"
            ],
            answer:1,
            rationale:"Respiratory depression is the most immediately dangerous adverse effect of opioid therapy."
          },
          {
            id:"at01-q22",
            stem:"A client taking warfarin reports which finding that requires immediate follow-up?",
            options:[
              "A small bruise after venipuncture",
              "Mild nausea after taking the medication",
              "Black, tarry stool",
              "Increased appetite"
            ],
            answer:2,
            rationale:"Black, tarry stool may indicate gastrointestinal bleeding and requires prompt evaluation."
          },
          {
            id:"at01-q23",
            stem:"A client taking lithium develops vomiting, coarse tremors, confusion, and an unsteady gait. What should the nurse suspect?",
            options:[
              "Therapeutic effect",
              "Lithium toxicity",
              "Serotonin syndrome",
              "Expected adjustment to treatment"
            ],
            answer:1,
            rationale:"Gastrointestinal symptoms accompanied by coarse tremor, confusion, and ataxia are concerning for lithium toxicity."
          },
          {
            id:"at01-q24",
            stem:"Which finding in a client taking an antipsychotic requires the most immediate intervention?",
            options:[
              "Dry mouth",
              "Mild weight gain",
              "Fever, severe muscle rigidity, and altered mental status",
              "Increased appetite"
            ],
            answer:2,
            rationale:"Fever, severe rigidity, and altered mental status suggest neuroleptic malignant syndrome, a potentially life-threatening reaction."
          },
          {
            id:"at01-q25",
            stem:"A client taking an SSRI develops agitation, diaphoresis, fever, diarrhea, and hyperreflexia after another serotonergic medication is added. Which complication should the nurse suspect?",
            options:[
              "Neuroleptic malignant syndrome",
              "Serotonin syndrome",
              "Anticholinergic toxicity",
              "Lithium toxicity"
            ],
            answer:1,
            rationale:"Mental-status change, autonomic instability, gastrointestinal symptoms, and neuromuscular hyperactivity after serotonergic exposure are characteristic of serotonin syndrome."
          },
          {
            id:"at01-q26",
            stem:"Fifteen minutes after a blood transfusion begins, a client develops chills, dyspnea, and low back pain. What should the nurse do first?",
            options:[
              "Notify the health care provider",
              "Stop the transfusion",
              "Obtain a urine specimen",
              "Administer acetaminophen"
            ],
            answer:1,
            rationale:"Stop the transfusion immediately when an acute transfusion reaction is suspected. Remove the source of potential harm before completing subsequent notifications and interventions."
          },
          {
            id:"at01-q27",
            stem:"A client receiving packed red blood cells develops crackles, dyspnea, hypertension, and jugular venous distention. Which complication is most likely?",
            options:[
              "Acute hemolytic reaction",
              "Circulatory overload",
              "Allergic reaction",
              "Febrile nonhemolytic reaction"
            ],
            answer:1,
            rationale:"Respiratory distress accompanied by hypertension, crackles, and jugular venous distention suggests transfusion-associated circulatory overload."
          },
          {
            id:"at01-q28",
            stem:"The nurse notices that a client's PICC line is suddenly 4 cm longer externally than previously documented. What should the nurse do?",
            options:[
              "Advance the catheter until the previous measurement is restored",
              "Continue using the catheter because blood return is present",
              "Stop using the line and evaluate for catheter migration",
              "Remove the catheter immediately without further assessment"
            ],
            answer:2,
            rationale:"A change in external catheter length suggests migration. Do not advance or routinely use the catheter until placement has been appropriately evaluated."
          },
          {
            id:"at01-q29",
            stem:"Which client should the nurse assess first?",
            options:[
              "A client with pneumonia who has a temperature of 102.2 F (39 C)",
              "A client with COPD whose usual oxygen saturation is 90%",
              "A client with a UTI who has suddenly become confused and difficult to arouse",
              "A client with cellulitis reporting pain of 7 on a 0-to-10 scale"
            ],
            answer:2,
            rationale:"An acute change in level of consciousness represents potentially serious deterioration. New change takes priority over chronic baseline findings and isolated pain."
          },
          {
            id:"at01-q30",
            stem:"Which client requires the nurse's immediate attention?",
            options:[
              "A client taking prednisone whose WBC count is 12,000/mm3",

              "A client with a healing surgical incision and mild erythema at the edges",
              "A client with a UTI reporting urinary frequency"

          }

      {id:'nur321-ob-exam1',title:'NUR 321 OB · Exam 1 Practice',tag:'Assigned practice',description:'25 application-level OB/Maternal-Newborn questions covering Reproductive Health, Fetal Lifespan, Reproductive Alterations, and Uncomplicated Pregnancy — Exam 1 prep.',questions:[
        {id:'ob1-q01',stem:'A nurse is teaching a client about natural family planning using the cervical mucus method. Which description of mucus indicates the most fertile period?',options:['Thick, white, and scanty','Clear, slippery, and stretchy like raw egg white','Yellow and opaque with mild odor','Absent — no discharge noted'],answer:1,rationale:'The Spinnbarkeit (stretchy, clear mucus) signals the LH surge and peak fertility. This is when ovulation is most likely and conception risk is highest.'},
        {id:'ob1-q02',stem:'A client asks how oral contraceptive pills (OCPs) prevent pregnancy. Which mechanism should the nurse include?',options:['They destroy sperm in the cervical canal','They prevent implantation by thinning the uterine wall only','They suppress ovulation and thicken cervical mucus','They accelerate ovum transport through the fallopian tube'],answer:2,rationale:'Combined OCPs primarily suppress the LH surge to prevent ovulation. They also thicken cervical mucus and thin the endometrium as secondary mechanisms.'},
        {id:'ob1-q03',stem:'A nurse is caring for a client who had a laparoscopic salpingectomy for an ectopic pregnancy. Which finding requires immediate intervention?',options:['Blood pressure 106/68 mmHg, pulse 88/min','Shoulder pain rated 4/10','Serosanguineous drainage saturating one pad in 30 minutes','Temperature 37.4 C (99.3 F)'],answer:2,rationale:'Heavy bleeding (saturating a pad in 30 minutes) suggests hemorrhage, a surgical emergency. Shoulder pain is expected from diaphragmatic irritation by residual CO2. Mild hypotension and low-grade fever are common post-op findings to monitor but are not immediately alarming.'},
        {id:'ob1-q04',stem:'A client at 10 weeks of gestation reports painless vaginal bleeding. Ultrasound shows no fetal cardiac activity and a "snowstorm" pattern. Which condition does the nurse anticipate?',options:['Threatened abortion','Ectopic pregnancy','Hydatidiform mole','Placenta previa'],answer:2,rationale:'A snowstorm pattern on ultrasound with painless bleeding and absent fetal cardiac activity is classic for hydatidiform (molar) pregnancy, a gestational trophoblastic disease.'},
        {id:'ob1-q05',stem:'Which instruction should the nurse include when teaching a client about breast self-examination (BSE)?',options:['Perform BSE on the first day of menstruation each month','Perform BSE 7 to 10 days after the start of menstruation','BSE should be done only by women over 40 years old','Perform BSE immediately before the menstrual period'],answer:1,rationale:'BSE is best performed 7–10 days after the start of menstruation when breasts are least tender and least swollen, allowing easier detection of abnormalities.'},
        {id:'ob1-q06',stem:'A nurse is explaining the human papillomavirus (HPV) vaccine to an adolescent client. Which statement by the client indicates understanding?',options:['"I only need one dose since I am already a teenager."','"The vaccine will treat the HPV infection I already have."','"The vaccine works best before I become sexually active."','"I will not need a Pap smear once I get vaccinated."'],answer:2,rationale:'HPV vaccine is most effective before exposure (before sexual activity). It does not treat existing infections and does not eliminate the need for Pap smears.'},
        {id:'ob1-q07',stem:'A client with endometriosis asks about pain management options. Which non-pharmacological intervention should the nurse recommend first?',options:['Heating pad applied to the lower abdomen','Cold pack applied to the perineum','Vigorous aerobic exercise during menstruation','Limit fluid intake to reduce bloating'],answer:0,rationale:'Heat relaxes uterine muscle and increases blood flow, reducing prostaglandin-mediated cramping. It is the first-line non-pharmacological comfort measure for endometriosis-related dysmenorrhea.'},
        {id:'ob1-q08',stem:'A nurse is reviewing the anatomy of the female reproductive system. Which structure produces estrogen and progesterone during the luteal phase of the menstrual cycle?',options:['Graafian follicle','Corpus luteum','Fallopian fimbriae','Endometrium'],answer:1,rationale:'After ovulation, the ruptured follicle becomes the corpus luteum, which secretes progesterone (and some estrogen) to prepare the endometrium for implantation. If pregnancy does not occur, the corpus luteum degenerates.'},
        {id:'ob1-q09',stem:'A client at 8 weeks of gestation calls the clinic reporting nausea and vomiting every morning. Which response by the nurse is most appropriate?',options:['"This is abnormal — come in today for an evaluation."','"Eat small, frequent, high-carbohydrate meals and try dry crackers before getting up."','"Take an antacid with each meal to neutralize stomach acid."','"Avoid all food until the nausea passes completely."'],answer:1,rationale:'Nausea and vomiting in the first trimester (morning sickness) are normal. Dry crackers before rising, small frequent meals, and avoiding an empty stomach are first-line dietary strategies.'},
        {id:'ob1-q10',stem:'A nurse assesses fundal height at 20 weeks of gestation. At which landmark should the fundus be palpated?',options:['Just above the symphysis pubis','At the level of the umbilicus','Halfway between the umbilicus and xiphoid process','At the xiphoid process'],answer:1,rationale:'At 20 weeks gestation, the fundus is at the level of the umbilicus. Fundal height in centimeters roughly equals gestational age in weeks from 20–36 weeks (±2 cm).'},
        {id:'ob1-q11',stem:'Which laboratory value requires follow-up in a client at 28 weeks of gestation?',options:['Hemoglobin 11.2 g/dL','Fasting glucose 58 mg/dL after 1-hour glucose challenge test (GCT)','1-hour GCT glucose 155 mg/dL','White blood cell count 11,000/mm³'],answer:2,rationale:'A 1-hour GCT result ≥140 mg/dL (some facilities use 130) requires follow-up with a 3-hour GTT to screen for gestational diabetes. A WBC up to 12,000/mm³ is normal in pregnancy; mild anemia is expected.'},
        {id:'ob1-q12',stem:'A client at 32 weeks reports decreased fetal movement. The nurse instructs the client to perform kick counts. Which result should the client report immediately?',options:['10 movements in 2 hours','Fewer than 10 movements in 2 hours','10 movements in 30 minutes','Movements felt after eating a snack'],answer:1,rationale:'Fewer than 10 fetal movements in 2 hours (or per the provider’s specific threshold) is a warning sign of possible fetal compromise and should be reported immediately for further evaluation.'},
        {id:'ob1-q13',stem:'A nurse is caring for a client with hyperemesis gravidarum. Which finding is the priority concern?',options:['Nausea after eating','Weight loss of 5% of pre-pregnancy weight and ketonuria','Aversion to fatty foods','Mild heartburn after large meals'],answer:1,rationale:'Weight loss ≥5% plus ketonuria indicates severe dehydration and nutritional deficit, distinguishing hyperemesis gravidarum from normal morning sickness and requiring IV fluid and antiemetic intervention.'},
        {id:'ob1-q14',stem:'A client at 36 weeks of gestation reports sudden, painless, bright red vaginal bleeding. Which condition does the nurse suspect?',options:['Placental abruption','Placenta previa','Preterm labor','Cervical polyp'],answer:1,rationale:'Painless, bright red vaginal bleeding in the third trimester is the classic presentation of placenta previa, where the placenta covers the cervical os. Abruption typically presents with painful, dark bleeding.'},
        {id:'ob1-q15',stem:'Which finding in a client at 34 weeks of gestation should the nurse report to the provider immediately?',options:['Mild dependent edema in the ankles by end of day','Blood pressure 156/104 mmHg with 2+ proteinuria','Fundal height measuring 36 cm','Fetal heart rate of 148 beats/min'],answer:1,rationale:'BP ≥160/110 with proteinuria meets criteria for severe features of preeclampsia, requiring urgent intervention. Mild ankle edema, slightly large fundal height, and FHR of 148 are all within normal range.'},
        {id:'ob1-q16',stem:'A nurse is preparing to administer Rh immunoglobulin (RhoGAM) to a postpartum client. Which client should receive this medication?',options:['Rh-positive mother with an Rh-negative infant','Rh-negative mother with an Rh-positive infant','Rh-positive mother with an Rh-positive infant','Rh-negative mother with an Rh-negative infant'],answer:1,rationale:'RhoGAM is given to Rh-negative mothers who deliver Rh-positive infants (or after any sensitizing event) to prevent maternal antibody formation that could harm future pregnancies.'},
        {id:'ob1-q17',stem:'A client at 38 weeks gestation is admitted with contractions every 4 minutes lasting 45 seconds. Cervix is 4 cm dilated, 80% effaced, -1 station. The nurse documents which stage and phase of labor?',options:['First stage, latent phase','First stage, active phase','Second stage','Transitional phase'],answer:1,rationale:'Active phase of the first stage begins at 6 cm by contemporary definitions (ACOG), though many institutions still define it as 4–7 cm with regular contractions. Cervical dilation >4 cm with regular contractions and effacement places this client in active labor, first stage.'},
        {id:'ob1-q18',stem:'A nurse is monitoring a fetal heart rate (FHR) tracing. Which finding requires immediate intervention?',options:['FHR baseline 138 beats/min with moderate variability','Early decelerations beginning and ending with contractions','Late decelerations with every contraction and minimal variability','Accelerations of 15 beats/min lasting 15 seconds'],answer:2,rationale:'Late decelerations with minimal variability indicate uteroplacental insufficiency and potential fetal hypoxia — a Category III (or high-concern Category II) pattern requiring immediate repositioning, oxygen, IV fluid bolus, and provider notification.'},
        {id:'ob1-q19',stem:'A nurse assesses a newborn at 1 minute of life: heart rate 108/min, weak cry, some flexion of extremities, grimace to stimulation, body pink with blue extremities. What is the Apgar score?',options:['6','7','8','5'],answer:1,rationale:'HR >100 (2), weak cry (1), some flexion (1), grimace (1), body pink/acrocyanosis (1) = 7. Apgar assesses HR, respiratory effort, muscle tone, reflex irritability, and color (0–2 each, max 10).'},
        {id:'ob1-q20',stem:'Which action should the nurse take first when a newborn is delivered and not breathing?',options:['Administer oxygen by mask','Begin chest compressions','Dry, stimulate, and reposition the airway','Call the neonatal resuscitation team'],answer:2,rationale:'The NRP initial steps are: warm, dry, stimulate, reposition, and clear the airway. Only after these steps and reassessment does the nurse escalate to PPV, then compressions. Most apneic newborns respond to initial stimulation.'},
        {id:'ob1-q21',stem:'A client who is 2 days postpartum reports fever of 38.8 C (101.8 F), uterine tenderness, and foul-smelling lochia. Which complication does the nurse suspect?',options:['Normal postpartum involution','Endometritis','Mastitis','Urinary tract infection'],answer:1,rationale:'Fever after the first 24 hours postpartum combined with uterine tenderness and foul lochia is classic for endometritis (postpartum uterine infection), most common after cesarean birth.'},
        {id:'ob1-q22',stem:'A breastfeeding client on postpartum day 3 reports breast engorgement. Which intervention should the nurse recommend?',options:['Apply ice packs and avoid feeding until engorgement resolves','Feed the infant frequently and apply warm compresses before feeding','Stop breastfeeding and use a breast binder','Limit feeds to once every 6 hours to allow milk to build up'],answer:1,rationale:'Frequent, effective feeding is the best treatment for engorgement. Warm compresses before feeds help with let-down. Ice packs after feeding reduce inflammation. Never restrict feeds — this worsens engorgement and can lead to mastitis.'},
        {id:'ob1-q23',stem:'A nurse is assessing a newborn at 24 hours of life. Which finding should be reported to the provider?',options:['Respiratory rate 44 breaths/min','Soft spot (anterior fontanelle) flat and soft','Total serum bilirubin 14 mg/dL at 24 hours of age','One void and one meconium stool since birth'],answer:2,rationale:'Bilirubin >12 mg/dL in the first 24 hours is pathological jaundice (not physiological) and requires immediate provider notification and likely phototherapy. Physiological jaundice peaks at 48–72 hours.'},
        {id:'ob1-q24',stem:'A nurse is performing a gestational age assessment using the Ballard scale. Which finding suggests a gestational age of 28 weeks?',options:['Full plantar creases, stiff ear cartilage, abundant lanugo','Smooth skin, few plantar creases, ear recoils slowly, little lanugo','Leathery cracked skin, no lanugo, full ear recoil','Sticky transparent skin, no ear cartilage, no plantar creases'],answer:1,rationale:'At 28 weeks, skin is smooth and translucent with minimal vernix, few plantar creases are present, ear cartilage is soft with slow recoil, and lanugo is present but not abundant. Very premature infants (24–26 wk) have gelatinous/sticky transparent skin.'},
        {id:'ob1-q25',stem:'A client asks the nurse about warning signs to report during the first trimester. Which symptom requires immediate reporting?',options:['Breast tenderness and fullness','Urinary frequency','Severe abdominal pain with shoulder pain and vaginal spotting','Mild fatigue in the afternoon'],answer:2,rationale:'Severe abdominal pain with referred shoulder pain (diaphragmatic irritation from intraperitoneal bleeding) and vaginal spotting in the first trimester suggests ectopic pregnancy rupture — a life-threatening emergency.'}
      ]},
      {id:'nur321-ob-exam1-cases',title:'NUR 321 OB · Exam 1 Case Studies',tag:'Assigned practice',description:'4 NGN-style clinical case studies with linked questions — maternal-newborn scenarios for Exam 1 prep.',questions:[
        {id:'ob-case1-intro',type:'intro',stem:'CASE 1 OF 4 — A 28-year-old G2P1 client at 39 weeks of gestation is admitted in active labor. Cervix is 6 cm dilated, 100% effaced, 0 station. Membranes are intact. The fetal heart rate (FHR) baseline is 142 beats/min with moderate variability. Contractions are every 3 minutes, lasting 60 seconds.',note:'Read this scenario carefully — all 5 questions that follow relate to this client.'},
        {id:'ob-case1-q1',stem:'The nurse notes a deceleration on the monitor that begins at the peak of a contraction and returns to baseline after the contraction ends. Which action should the nurse take first?',options:['Reposition the client to the left lateral position and increase IV fluid rate','Apply oxygen at 10 L/min via non-rebreather mask','Notify the provider immediately for emergency cesarean','Document the finding as a normal variant and continue monitoring'],answer:3,rationale:'This describes a late deceleration — it begins at the peak and recovers after the contraction, indicating uteroplacental insufficiency. However, the FIRST action is to reposition and increase fluids to improve placental perfusion. Oxygen and provider notification follow if the pattern persists. A single late deceleration with moderate variability is not an immediate cesarean indication.'},
        {id:'ob-case1-q2',stem:'After repositioning, the FHR pattern shows late decelerations continuing with every contraction and variability decreases to minimal. Which actions should the nurse take? Select all that apply.',options:['Administer oxygen at 8–10 L/min via face mask','Increase the oxytocin infusion to strengthen contractions','Notify the provider immediately','Prepare for possible operative delivery','Encourage the client to push with the next contraction'],answer:[0,2,3],rationale:'SATA: Oxygen (A), notify provider (C), and prepare for operative delivery (D) are all correct. Increasing oxytocin (B) worsens uteroplacental insufficiency by increasing contraction frequency. Pushing (E) is inappropriate — she is still at 0 station in active labor, and fetal status must be addressed first.'},
        {id:'ob-case1-q3',stem:'The client asks the nurse about the oxygen mask and whether her baby is okay. Which response is most therapeutic?',options:['"Do not worry — everything is fine, this is just routine."','"Your baby\'s heart rate pattern is showing some stress with contractions. The oxygen helps increase blood flow to your baby while we make adjustments."','"I cannot tell you what is happening — you need to ask your doctor."','"The oxygen is for you, not your baby — labor is very tiring."'],answer:1,rationale:'The therapeutic response is honest, non-alarming, and explains the rationale in client-friendly language. Dismissing concerns (A) is non-therapeutic. Deflecting (C) abandons the nursing role. Option D is factually incorrect — the oxygen is specifically to improve fetal oxygenation via the placenta.'}, {id:'ob-case1-q4',stem:'The client delivers vaginally. Estimated blood loss is 600 mL. The nurse assesses the uterus and finds it boggy and displaced to the right. Which action should the nurse take first?',options:['Administer oxytocin 10 units IV push','Perform fundal massage','Have the client void or insert a urinary catheter','Increase IV fluid rate to 200 mL/hr'],answer:2,rationale:'A boggy uterus displaced to the right suggests a full bladder preventing uterine contraction. The FIRST action is bladder emptying — having the client void or inserting a catheter. Fundal massage and oxytocin follow if the uterus remains boggy after bladder emptying. EBL of 600 mL meets the definition of postpartum hemorrhage (PPH) and requires prompt intervention.'},
        {id:'ob-case1-q5',stem:'After bladder emptying, the uterus remains boggy with continued heavy bleeding. Which medication should the nurse anticipate administering?',options:['Magnesium sulfate IV','Oxytocin (Pitocin) 10–40 units in 1,000 mL IV','Terbutaline 0.25 mg subcutaneous','Betamethasone IM'],answer:1,rationale:'Oxytocin is the first-line uterotonic for PPH after vaginal delivery. Magnesium sulfate is used for preeclampsia/seizure prophylaxis. Terbutaline is a tocolytic (relaxes the uterus — contraindicated in PPH). Betamethasone promotes fetal lung maturity and has no role here.'},

        {id:'ob-case2-intro',type:'intro',stem:'CASE 2 OF 4 — A 32-year-old G1P0 client at 34 weeks of gestation presents to triage with a severe headache, visual changes described as "spots," and right upper quadrant pain. Vital signs: BP 168/110 mmHg, HR 92/min, RR 18/min, SpO2 98%. Urine dipstick shows 3+ protein.',note:'Read this scenario carefully — all 5 questions that follow relate to this client.'},
        {id:'ob-case2-q1',stem:'Based on this assessment, which condition does the nurse suspect?',options:['Gestational hypertension','Chronic hypertension','Preeclampsia with severe features','HELLP syndrome'],answer:2,rationale:'BP ≥160/110 with proteinuria (3+) AND severe features (headache, visual changes, RUQ pain) = preeclampsia with severe features. HELLP syndrome requires lab confirmation (hemolysis, elevated liver enzymes, low platelets). Gestational HTN has no proteinuria. Chronic HTN predates 20 weeks.'},
        {id:'ob-case2-q2',stem:'Which medication should the nurse anticipate administering first?',options:['Labetalol 200 mg orally','Magnesium sulfate IV loading dose','Nifedipine 30 mg extended-release orally','Furosemide 40 mg IV'],answer:1,rationale:'Magnesium sulfate is the first priority for seizure prophylaxis in preeclampsia with severe features. Antihypertensives (labetalol, nifedipine, hydralazine) are also given for BP ≥160/110, but mag comes first as the priority in this scenario. Furosemide is not indicated unless pulmonary edema develops.'},
        {id:'ob-case2-q3',stem:'The client is receiving magnesium sulfate 2 g/hr IV. Which assessment finding requires the nurse to stop the infusion immediately?',options:['Urine output 40 mL/hr','Respiratory rate 10 breaths/min','Deep tendon reflexes 2+','Serum magnesium level 5 mEq/L'],answer:1,rationale:'Respiratory rate <12/min indicates magnesium toxicity and requires stopping the infusion immediately and having calcium gluconate ready as the antidote. DTR loss (not diminished — absent) is another toxicity sign. UO of 40 mL/hr is acceptable (goal >25–30). Therapeutic mag levels are 4–7 mEq/L.'},
        {id:'ob-case2-q4',stem:'The client asks, "Will my baby be okay being born this early?" Which response is most appropriate?',options:['"At 34 weeks your baby will be perfectly fine — don\'t worry at all."','"34-week babies often need some extra support after birth, like help with breathing or feeding. The NICU team will be ready to help."','"I can\'t make any promises. It\'s really up to the doctors."','"You shouldn\'t have gotten pregnant if you have blood pressure problems."'],answer:1,rationale:'Option B is honest, supportive, and prepares the client realistically without catastrophizing. Option A offers false reassurance. Option C is dismissive. Option D is inappropriate, judgmental, and unprofessional.'},
        {id:'ob-case2-q5',stem:'Which lab result, if present, would indicate the client has progressed to HELLP syndrome?',options:['Hemoglobin 10.2 g/dL','Platelet count 85,000/mm³ and elevated AST/ALT','Creatinine 0.9 mg/dL','Uric acid 6.1 mg/dL'],answer:1,rationale:'HELLP = Hemolysis + Elevated Liver enzymes + Low Platelets. Platelets <100,000 with elevated liver enzymes (AST/ALT) confirms HELLP. Mild anemia and elevated uric acid are common in preeclampsia but not diagnostic of HELLP.'},

        {id:'ob-case3-intro',stem:'CASE 3 OF 4 — A 26-year-old G1P1 client is 16 hours postpartum after a vaginal delivery with a 3rd-degree laceration repair. The nurse assesses the client and finds: fundus firm at the umbilicus, lochia rubra moderate, perineal edema with ecchymosis, pain 7/10, temperature 37.2°C (99.0°F), BP 118/72 mmHg. The client reports difficulty urinating.',options:['Continue reading — Question 1 of 4 follows','(This is a scenario introduction — select this option to continue)','',''],answer:0,rationale:'This is the case introduction for Case 3. Focus on normal vs. abnormal postpartum findings and priority nursing interventions.'},
        {id:'ob-case3-q1',stem:'Which assessment finding should the nurse address first?',options:['Fundus at the umbilicus','Difficulty urinating','Lochia rubra moderate','Temperature 37.2°C (99.0°F)'],answer:1,rationale:'Difficulty urinating (urinary retention) is the priority. A full bladder can displace the uterus and cause uterine atony, leading to hemorrhage. The fundus at the umbilicus at 16 hours is normal. Moderate rubra lochia is expected. Temp 37.2°C is normal.'},
        {id:'ob-case3-q2',stem:'Which intervention is most appropriate for the perineal pain and edema?',options:['Apply a warm compress continuously to the perineum','Apply an ice pack to the perineum for the first 24 hours','Administer ibuprofen and have the client sit on a hard chair','Encourage the client to avoid all perineal hygiene until pain resolves'],answer:1,rationale:'Ice packs to the perineum during the first 24 hours reduce edema and provide analgesia. After 24 hours, sitz baths promote comfort and healing. Warm compresses are used after the first 24 hours. Avoiding hygiene increases infection risk. Hard surfaces worsen pain.'},
        {id:'ob-case3-q3',stem:'The client is being discharged home and asks about warning signs to report. Which symptoms indicate a postpartum complication requiring immediate contact with the provider?',options:['Lochia changing from rubra to serosa by day 4','Breast engorgement on day 3','Fever of 38.4°C (101.1°F) with foul-smelling lochia','Mild constipation on day 2'],answer:2,rationale:'Fever >38°C (100.4°F) after the first 24 hours with foul-smelling lochia suggests endometritis and requires immediate reporting. Lochia progression rubra→serosa→alba is normal. Breast engorgement on day 3 is expected with milk coming in. Mild constipation is common postpartum.'},
        {id:'ob-case3-q4',stem:'The client states she wants to breastfeed but "my nipples are cracked and it hurts so much I want to stop." Which response by the nurse is most helpful?',options:['"Breastfeeding always hurts at first — just push through it."','"If it hurts that much you should switch to formula."','"Let me watch you latch your baby and we can work on positioning — pain usually means the latch needs adjusting."','"Apply lotion to your nipples between feedings to keep them moist."'],answer:2,rationale:'Pain during breastfeeding usually indicates a poor latch. Observing a feeding and correcting positioning is the appropriate nursing intervention. Dismissing pain (A) is non-therapeutic. Suggesting formula (B) undermines the client\'s goal. Lotion (D) is not recommended; lanolin ointment or expressed breast milk is preferred.'},

        {id:'ob-case4-intro',stem:'CASE 4 OF 4 — A newborn is delivered at 38 weeks via cesarean birth. At 1 minute of life: HR 58/min, apneic, limp, no response to stimulation, pale/blue. The nurse begins neonatal resuscitation.',options:['Continue reading — Question 1 of 4 follows','(This is a scenario introduction — select this option to continue)','',''],answer:0,rationale:'This is the case introduction for Case 4. This newborn has a critically low Apgar score and requires immediate NRP interventions.'},
        {id:'ob-case4-q1',stem:'What is this newborn\'s 1-minute Apgar score?',options:['2','3','1','0'],answer:0,rationale:'HR <100 but present = 1 point. Apneic = 0. Limp = 0. No response = 0. Pale/blue = 0. Total = 1. Wait — HR 58 (<100) = 1 point, all others 0 = Apgar 1. Among the choices, 1 is not listed; the closest correct answer given the options is 2 if HR is generously scored, but technically this score is 1. Note: Apgar is a snapshot, not the driver of resuscitation decisions.'},
        {id:'ob-case4-q2',stem:'Per NRP guidelines, what is the correct sequence of initial interventions for this newborn?',options:['Begin chest compressions immediately, then PPV','Warm, dry, stimulate, clear airway, then begin PPV if apneic','Administer epinephrine, then intubate','Apply pulse oximeter, then wait 60 seconds before intervening'],answer:1,rationale:'NRP initial steps: Warm → Dry/Stimulate → Position airway → Clear secretions if needed → Assess. If apneic or HR <100 after initial steps → begin PPV with 21% O2 (room air) at term. Compressions begin only if HR <60 after 30 seconds of effective PPV.'},
        {id:'ob-case4-q3',stem:'After 30 seconds of effective PPV, the HR remains 52/min and the newborn is still apneic. Which action should the nurse take next?',options:['Continue PPV and begin chest compressions at a 3:1 ratio','Administer naloxone IM','Apply a warming blanket and reassess in 2 minutes','Increase oxygen to 100% and observe for 60 seconds'],answer:0,rationale:'HR <60 after 30 seconds of effective PPV = begin chest compressions at a 3:1 ratio (3 compressions : 1 breath = 90 compressions + 30 breaths per minute). Increase O2 to 100% when compressions begin. Naloxone is only for respiratory depression from maternal opioids in a newborn who is NOT in cardiac arrest.'},
        {id:'ob-case4-q4',stem:'The mother asks why her baby is not crying. The father is present. Which response is most appropriate?',options:['"Everything is fine — just relax and let us work."','"Your baby needs some help getting started with breathing. Our team is doing everything they can right now. I will update you as soon as I have more information."','"Your baby is very sick. I am not sure if he will survive."','"You should not worry — this happens all the time with C-sections."'],answer:1,rationale:'Option B is honest, calm, and supportive without catastrophizing or dismissing. It acknowledges the situation, reassures the family that care is being provided, and promises updates — key elements of therapeutic communication during a crisis. Options A and D offer false reassurance. Option C is unnecessarily alarming and premature.'}
      ]}
    ];
    let activeSet=null,index=0,answers=[],revealed=false,student=null;
    function renderLibrary(){const target=$('sets');target.innerHTML=sets.map(set=>`<article class="card"><p class="meta">${set.tag}</p><h2>${set.title}</h2><p>${set.description}</p><p class="meta">${set.questions.length} questions · original practice</p><button class="start" data-set="${set.id}">Start →</button></article>`).join('');document.querySelectorAll('[data-set]').forEach(button=>button.addEventListener('click',()=>startSet(button.dataset.set)))}
    function startSet(id){const set=sets.find(set=>set.id===id);if(set)activeSet=set;if(!activeSet||activeSet.id!==id)return;index=0;answers=[];revealed=false;$('library').classList.add('hidden');$('sets').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()}
    function renderQuestion(){const q=activeSet.questions[index];if(q.type==='intro'){$('quiz').innerHTML=`<p class="question-number">${activeSet.title} · Scenario ${index+1} of ${activeSet.questions.length}</p><div class="progress"><div style="width:${((index)/activeSet.questions.length)*100}%"></div></div><div class="intro-card"><p class="intro-label">Clinical Scenario</p><h2>${q.stem}</h2><p class="intro-note">${q.note||'Read this scenario carefully before answering the questions that follow.'}</p></div><div class="actions"><button class="primary" onclick="next()">Begin questions →</button></div>`;return;}const isSATA=Array.isArray(q.answer);const selected=answers[index];const isCorrect=isSATA?(Array.isArray(selected)&&q.answer.length===selected.length&&q.answer.every(a=>selected.includes(a))):(selected===q.answer);$('quiz').innerHTML=`<p class="question-number">${activeSet.title} · Question ${index+1} of ${activeSet.questions.length}</p><div class="progress"><div style="width:${((index)/activeSet.questions.length)*100}%"></div></div><h2>${q.stem}</h2>${isSATA?'<p class="sata-hint">Select all that apply</p>':''}<div class="options">${q.options.map((option,optionIndex)=>{const isChecked=isSATA?(Array.isArray(selected)&&selected.includes(optionIndex)):(selected===optionIndex);return`<label class="option${revealed?(isSATA?(q.answer.includes(optionIndex)?' correct-opt':(Array.isArray(selected)&&selected.includes(optionIndex)?' wrong-opt':'')):(optionIndex===q.answer?' correct-opt':selected===optionIndex?' wrong-opt':'')):''}"><input type="${isSATA?'checkbox':'radio'}" name="answer" value="${optionIndex}" ${isChecked?'checked':''} ${revealed?'disabled':''}><span>${option}</span></label>`;}).join('')}</div>${revealed?`<div class="feedback ${isCorrect?'correct':'incorrect'}"><strong>${isCorrect?'Correct ✓':'Review this one'}</strong>${isSATA?'<em>Select all that apply — all correct choices must be selected.</em>':''}${q.rationale}</div>`:''}<div class="actions"><button class="secondary" id="leave" type="button">Back to sets</button>${index>0?'<button class="secondary" id="previous" type="button">← Previous question</button>':''}<button class="primary" id="next" type="button" ${selected===undefined?'disabled':''}>${revealed?(index===activeSet.questions.length-1?'See results':'Next question'):'Check answer'}</button></div>`;document.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',event=>{answers[index]=Number(event.target.value);$('next').disabled=false}));$('leave').addEventListener('click',showLibrary);const previous=$('previous');if(previous)previous.addEventListener('click',()=>{index--;revealed=false;renderQuestion()});$('next').addEventListener('click',()=>{if(!revealed){revealed=true;renderQuestion();return}if(index===activeSet.questions.length-1){showResults();return}index++;revealed=false;renderQuestion()})}
    function categoryForQuestion(id){
      const n=Number(String(id||"").replace("at01-q",""));
      if([1,11,29,30].includes(n))return "Priority & Acute Change";
      if(n>=2&&n<=9)return "Mental Health & Safety";
      if(n>=12&&n<=15)return "Substance Use & Withdrawal";
      if(n===10||(n>=16&&n<=25))return "Pharmacology & Toxicity";
      if(n>=26&&n<=28)return "Blood & IV Safety";
      return "Other";
    }
    async function saveResult(score){
      if(!student)return "Your score is shown here. Sign in through the Success Center to save it to your dashboard.";
      const details=activeSet.questions.map((q,i)=>({
        question_id:q.id,
        category:q.category||categoryForQuestion(q.id),
        selected_answer:answers[i],
        correct_answer:q.answer,
        correct:answers[i]===q.answer
      }));
      const categoryScores={};
      details.forEach(item=>{
        if(!categoryScores[item.category])categoryScores[item.category]={correct:0,total:0};
        categoryScores[item.category].total++;
        if(item.correct)categoryScores[item.category].correct++;
      });
      const missed=details.filter(item=>!item.correct).map(item=>item.question_id);
      const baseResult={
        student_id:student.id,
        practice_key:activeSet.id,
        practice_title:activeSet.title,
        score,
        total_questions:activeSet.questions.length,
        completed_at:new Date().toISOString()
      };
      let result=await db.from("student_supplemental_practice_results").insert({
        ...baseResult,
        answer_details:details,
        category_scores:categoryScores,
        missed_question_ids:missed
      });
      if(result.error&&/answer_details|category_scores|missed_question_ids|schema cache|column/i.test(result.error.message||'')){
        result=await db.from("student_supplemental_practice_results").insert(baseResult);
      }
      return result.error?`Your score is shown here, but it was not saved: ${result.error.message||'Please try again.'}`:"Saved to your shared dashboard.";
    }
    async function showResults(){const score=answers.reduce((total,answer,questionIndex)=>total+(answer===activeSet.questions[questionIndex].answer?1:0),0),percent=Math.round(score/activeSet.questions.length*100);$('quiz').innerHTML=`<section class="results"><p class="eyebrow">Practice complete</p><h2>${activeSet.title}</h2><div class="score">${percent}%</div><p class="result-detail">You answered ${score} of ${activeSet.questions.length} correctly. ${percent>=80?'Nice work—keep this skill in mixed practice.':percent>=60?'Review the rationales, then return to this set once more.':'Review the connected module before retaking this set.'}</p><p class="status" id="save-status">Saving your result…</p><div class="result-actions"><button class="secondary" id="retry" type="button">Try again</button><button class="primary" id="return" type="button">Back to assignments</button></div></section>`;$('save-status').textContent=await saveResult(score);$('retry').addEventListener('click',()=>startSet(activeSet.id));$('return').addEventListener('click',showLibrary)}
    function showLibrary(){if(new URLSearchParams(location.search).get("set")&&document.referrer){history.back();return}activeSet=null;$('quiz').classList.add('hidden');$('library').classList.remove('hidden');$('sets').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}

    function shuffled(items){
      return items.slice().sort(()=>Math.random()-.5);
    }

    function mixedCategory(q){
      const text=[q.nclex_category,q.nclex_sub,q.topic,q.module_key,q.stem].filter(Boolean).join(' ').toLowerCase();

      if(/priority|delegat|management of care|safety|acute|unstable|first|immediate|clinical judgment/.test(text))
        return 'Priority & Clinical Judgment';

      if(/maternal|obstetric|pregnan|postpartum|labor|fetal|newborn/.test(text))
        return 'Maternal / OB';

      if(/pediatric|child|infant|adolescent/.test(text))
        return 'Pediatrics';

      if(/psychi|mental|depress|anxiety|schizo|bipolar|suicid|therapeutic communication/.test(text))
        return 'Mental Health';

      if(/pharm|medication|drug|toxicity|antidote|insulin|heparin|warfarin|digoxin/.test(text))
        return 'Pharmacology';

      if(/fundamental|infection|isolation|ppe|fall|restraint|procedure|sterile/.test(text))
        return 'Fundamentals / Safety';

      return 'Adult Health';
    }

    async function buildMixedReview(count){
      if(!student){
        alert('Sign in through the Success Center before starting Mixed Review.');
        return;
      }

      $('library').classList.add('hidden');
      $('sets').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      $('quiz').innerHTML='<p class="status">Building your mixed review…</p>';

      const [{data:bank,error:bankError},{data:history,error:historyError}] = await Promise.all([
        db.from('questions')
          .select('id,stem,option_a,option_b,option_c,option_d,correct_answer,rationale,module_key,nclex_category,nclex_sub,topic,difficulty')
          .eq('active',true)
          .limit(1000),
        db.from('student_supplemental_practice_results')
          .select('answer_details,missed_question_ids')
          .eq('student_id',student.id)
          .order('completed_at',{ascending:false})
      ]);

      if(bankError || historyError){
        $('quiz').innerHTML='<p class="status">Mixed Review could not load. Please return to your dashboard and try again.</p>';
        return;
      }

      const seen=new Set();
      const missed=new Set();

      (history||[]).forEach(result=>{
        (result.answer_details||[]).forEach(item=>{
          if(item.question_id) seen.add(String(item.question_id));
          if(item.question_id && item.correct===false) missed.add(String(item.question_id));
        });
        (result.missed_question_ids||[]).forEach(id=>missed.add(String(id)));
      });

      const normalized=(bank||[]).map(q=>({
        id:String(q.id),
        stem:q.stem,
        options:[q.option_a,q.option_b,q.option_c,q.option_d],
        answer:['a','b','c','d'].indexOf(String(q.correct_answer).toLowerCase()),
        rationale:q.rationale||'Review the underlying nursing principle for this item.',
        category:mixedCategory(q),
        difficulty:q.difficulty||'medium'
      })).filter(q=>q.answer>=0);

      const weights={
        'Priority & Clinical Judgment':.40,
        'Adult Health':.20,
        'Pharmacology':.10,
        'Maternal / OB':.10,
        'Pediatrics':.10,
        'Mental Health':.05,
        'Fundamentals / Safety':.05
      };

      const chosen=[];
      const chosenIds=new Set();

      function addFrom(pool,amount){
        shuffled(pool).forEach(q=>{
          if(chosen.length>=count || amount<=0 || chosenIds.has(q.id)) return;
          chosen.push(q);
          chosenIds.add(q.id);
          amount--;
        });
      }

      Object.entries(weights).forEach(([category,weight])=>{
        const amount=Math.max(1,Math.round(count*weight));
        const pool=normalized.filter(q=>q.category===category && !seen.has(q.id));
        addFrom(pool,amount);
      });

      if(chosen.length<count)
        addFrom(normalized.filter(q=>!seen.has(q.id)),count-chosen.length);

      if(chosen.length<count)
        addFrom(normalized.filter(q=>missed.has(q.id)),count-chosen.length);

      if(chosen.length<count)
        addFrom(normalized,count-chosen.length);

      activeSet={
        id:'mixed-review-'+Date.now(),
        title:'Mixed NCLEX Review',
        tag:'Assigned mixed review',
        description:'Mixed NCLEX-style review across priority, systems, medications, OB, pediatrics, mental health, and safety.',
        questions:shuffled(chosen).slice(0,count)
      };

      index=0;
      answers=[];
      revealed=false;
      renderQuestion();
    }

    async function buildCourseExamPractice(courseKey,examKey){
      if(!student){
        alert('Sign in through the Success Center before starting exam practice.');
        return;
      }

      $('library').classList.add('hidden');
      $('sets').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      $('quiz').innerHTML='<p class="status">Building your exam practice…</p>';

      const {data:bank,error}=await db.from('questions')
        .select('id,stem,option_a,option_b,option_c,option_d,correct_answer,rationale,topic,subtopic,difficulty,cognitive_level')
        .eq('active',true)
        .eq('course_key',courseKey)
        .eq('exam_key',examKey)
        .order('source_key',{ascending:true});

      const questions=(bank||[]).map(q=>({
        id:String(q.id),
        stem:q.stem,
        options:[q.option_a,q.option_b,q.option_c,q.option_d],
        answer:['a','b','c','d'].indexOf(String(q.correct_answer).toLowerCase()),
        rationale:q.rationale||'Review the underlying nursing principle for this item.',
        category:q.topic||'Exam Review',
        subtopic:q.subtopic||'',
        difficulty:q.difficulty||'medium',
        cognitive_level:q.cognitive_level||''
      })).filter(q=>q.answer>=0);

      if(error||!questions.length){
        $('quiz').innerHTML='<p class="status">This exam practice set could not load. Please return to your dashboard and try again.</p>';
        return;
      }

      activeSet={
        id:`course-exam-${courseKey}-${examKey}`,
        title:'NUR 321 OB · Exam 1 Practice',
        tag:'Course exam practice',
        description:'Practice questions built from your Exam 1 course content and blueprint.',
        questions
      };
      index=0;
      answers=[];
      revealed=false;
      renderQuestion();
    }

    async function init(){const {data}=await db.auth.getSession();if(data.session){const own=await db.from('students').select('id').eq('auth_user_id',data.session.user.id).maybeSingle();student=own.data||null;const admin=await db.from('app_admins').select('user_id').eq('user_id',data.session.user.id).maybeSingle();if(admin.data){const link=document.getElementById('dashboard-link');link.href='shared-progress.html';link.textContent='Shared progress';}}const params=new URLSearchParams(window.location.search);
      const mixedCount=Number(params.get('mixed'));
      const assignedSet=params.get('set');
      const courseKey=params.get('course');
      const examKey=params.get('exam');

      if(courseKey&&examKey){
        await buildCourseExamPractice(courseKey,examKey);
      }else if([10,20,30,40].includes(mixedCount)){
        await buildMixedReview(mixedCount);
      }else if(sets.some(set=>set.id===assignedSet)){
        startSet(assignedSet);
      }else{
        renderLibrary();
      }}
    init();
  </script>
