<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Supplemental Practice · Study With Madison RN</title>
  <style>
    :root{--ink:#17344f;--cream:#fcf8f2;--paper:#fffdf9;--rose:#bd6f7f;--muted:#567087;--line:#d8e1db;--soft:#f5eee8;--green:#2f7f5a;--red:#b04e61}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(880px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}.brand,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.045em}.brand{font-size:1.2rem;font-weight:700}.brand small{font:700 .63em Inter,sans-serif}.back{color:var(--ink);font-size:.82rem;font-weight:800;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}.hero{padding:54px 0 28px}.eyebrow{margin:0 0 13px;color:var(--rose);font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:.98}.hero p:not(.eyebrow){max-width:610px;color:var(--muted);line-height:1.65;margin:18px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:64px}.card{background:var(--paper);border:1px solid var(--line);padding:23px}.card h2{margin:0;font-size:1.45rem}.card p{color:var(--muted);font-size:.86rem;line-height:1.55}.card .meta{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--rose)}button{font:800 .8rem Inter,sans-serif;cursor:pointer}.start{margin-top:12px;border:0;background:var(--ink);color:#fff;padding:12px 14px}.start:hover{background:#294d68}.hidden{display:none!important}.quiz{max-width:760px;margin:40px auto 70px;background:var(--paper);border:1px solid var(--line);padding:clamp(20px,4vw,38px)}.progress{height:7px;background:var(--soft);margin:22px 0}.progress div{height:100%;background:var(--rose);transition:width .2s}.question-number{margin:0 0 8px;color:var(--rose);font-weight:900;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.quiz h2{margin:0;font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.13}.options{display:grid;gap:10px;margin-top:26px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);padding:15px;background:#fff;cursor:pointer;font-size:.95rem;line-height:1.45}.option:hover{border-color:var(--ink)}.option input{margin-top:4px;accent-color:var(--ink)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.secondary,.primary{border:0;padding:12px 15px}.secondary{background:var(--soft);color:var(--ink)}.primary{background:var(--ink);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:22px;padding:16px;border-left:4px solid var(--rose);background:var(--soft);line-height:1.55;color:var(--ink);font-size:.9rem}.feedback strong{display:block;margin-bottom:5px}.correct{border-left-color:var(--green)}.incorrect{border-left-color:var(--red)}.results{text-align:center}.score{font:400 clamp(3.4rem,13vw,6.4rem) Georgia,serif;margin:6px 0;color:var(--ink)}.result-detail{max-width:530px;margin:0 auto;color:var(--muted);line-height:1.6}.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.status{min-height:1.4em;margin-top:16px;color:var(--muted);font-size:.82rem}.notice{margin:0 0 22px;padding:14px;background:#fff7f1;border-left:3px solid var(--rose);color:var(--muted);font-size:.82rem;line-height:1.5}@media(max-width:640px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero{padding-top:40px}.quiz{margin-top:24px}.actions{flex-direction:column-reverse}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><span class="brand">Study With Madison <small>RN</small></span><a class="back" href="student-dashboard.html">My dashboard</a></header>
    <section class="hero" id="library">
      <p class="eyebrow">Supplemental practice</p>
      <h1>Practice the next skill.</h1>
      <p>Short, original NCLEX-style practice sets for when an outside QBank is unavailable. Choose only the set Madison assigned to you.</p>
    </section>
    <section class="grid" id="sets" aria-label="Supplemental practice sets"></section>
    <section class="quiz hidden" id="quiz" aria-live="polite"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');
    const $=id=>document.getElementById(id);
    const sets=[
      {id:'safety-priority-01',title:'Safety & Priority',tag:'Start here',description:'Five priority and safety decisions that reinforce how to recognize risk and choose the nursing action that cannot wait.',questions:[
        {id:'sp01-q01',stem:'A nurse receives change-of-shift report on four clients. Which client should the nurse assess first?',options:['A client 8 hours after a thyroidectomy who reports tingling around the mouth','A client with heart failure who gained 0.9 kg (2 lb) since yesterday','A client with pneumonia whose temperature is 38.2 C (100.8 F)','A client 1 day after hip surgery who reports pain of 7 on a 0-to-10 scale'],answer:0,rationale:'Tingling after thyroidectomy can signal hypocalcemia from parathyroid injury and can progress to airway-threatening laryngospasm. It is the priority finding.'},
        {id:'sp01-q02',stem:'Which task is appropriate for the RN to delegate to unlicensed assistive personnel (UAP)?',options:['Reinforce teaching about incentive spirometry','Obtain routine vital signs for a stable client','Assess a new complaint of chest pressure','Evaluate whether a new analgesic relieved pain'],answer:1,rationale:'Routine, predictable tasks for a stable client can be delegated to UAP. Teaching, assessment, and evaluation remain RN responsibilities.'},
        {id:'sp01-q03',stem:'A nurse discovers a client on the floor beside the bed. Which action should the nurse take first?',options:['Assess the client for injury','Notify the health care provider','Complete an incident report','Assist the client back to bed'],answer:0,rationale:'Assess first. The nurse needs to determine immediate safety needs before moving the client, notifying the provider, or completing documentation.'},
        {id:'sp01-q04',stem:'Which finding should the nurse report immediately for a client receiving a heparin infusion?',options:['aPTT within the prescribed therapeutic range','New black, tarry stool','Small bruise at a previous venipuncture site','Heart rate of 92/min after ambulation'],answer:1,rationale:'Black, tarry stool can indicate gastrointestinal bleeding, a serious complication of anticoagulation that requires prompt action.'},
        {id:'sp01-q05',stem:'A nurse enters a room and finds smoke coming from a wastebasket. What is the nurse’s first action?',options:['Remove the client from immediate danger','Activate the fire alarm','Close the room door','Attempt to extinguish the fire'],answer:0,rationale:'Use RACE: Rescue, Alarm, Contain, Extinguish/Evacuate. The first priority is to remove anyone in immediate danger.'}
      ]},
      {id:'ob-newborn-01',title:'OB & Newborn Safety',tag:'High priority',description:'Five focused questions on maternal warning signs, newborn assessment, and safe discharge teaching.',questions:[
        {id:'ob01-q01',stem:'Which finding in a client at 35 weeks of gestation requires immediate follow-up?',options:['Blood pressure 168/110 mm Hg with severe headache','Dependent ankle edema at the end of the day','Urinary frequency without dysuria','Mild nausea after eating a large meal'],answer:0,rationale:'Severe hypertension with severe headache suggests preeclampsia with severe features and requires immediate evaluation.'},
        {id:'ob01-q02',stem:'Which statement by a parent of a newborn indicates correct understanding of safe sleep teaching?',options:['“I will place my baby on the back in a crib with a fitted sheet.”','“I will use a positioner to keep my baby on the side.”','“I will place a soft blanket over my baby at night.”','“I will let my baby sleep in my bed after nighttime feedings.”'],answer:0,rationale:'Safe sleep includes supine positioning on a firm, flat surface with only a fitted sheet. Positioners, loose bedding, and adult beds are unsafe.'},
        {id:'ob01-q03',stem:'Which newborn finding requires immediate assessment?',options:['Acrocyanosis of the hands and feet at 2 hours of age','Grunting with nasal flaring at rest','Milia on the nose','A small amount of vaginal mucus'],answer:1,rationale:'Persistent grunting and nasal flaring are signs of respiratory distress and require immediate assessment.'},
        {id:'ob01-q04',stem:'A postpartum client reports soaking one perineal pad in 15 minutes and feeling dizzy. Which action should the nurse take first?',options:['Assess fundal tone and amount of bleeding','Encourage oral fluids','Assist the client to the bathroom','Provide teaching about lochia changes'],answer:0,rationale:'Heavy bleeding with dizziness may indicate postpartum hemorrhage. Immediate assessment of uterine tone and bleeding directs urgent intervention.'},
        {id:'ob01-q05',stem:'Which finding in a client receiving magnesium sulfate requires the nurse to stop the infusion and notify the provider?',options:['Respiratory rate of 10/min','Patellar reflexes 2+','Urine output of 40 mL/hr','Blood pressure of 150/96 mm Hg'],answer:0,rationale:'Respiratory depression is a sign of magnesium toxicity. Stop the infusion and urgently notify the provider per protocol.'}
      ]},
      {id:'med-procedure-01',title:'Medication & Procedure Safety',tag:'Core safety',description:'Five questions on medication administration, calculations, allergies, and infection prevention.',questions:[
        {id:'mp01-q01',stem:'Before administering a newly prescribed cephalosporin to a client who reports a penicillin allergy, what is the nurse’s priority action?',options:['Ask the client to describe the previous allergic reaction','Administer the medication with food','Request a prescription for an antihistamine','Withhold all antibiotics for 24 hours'],answer:0,rationale:'The nurse first clarifies the type and severity of the reported reaction. This information guides safe follow-up and does not assume every allergy has the same risk.'},
        {id:'mp01-q02',stem:'The provider prescribes 750 mg of a medication. The available concentration is 250 mg per tablet. How many tablets should the nurse administer?',options:['1 tablet','2 tablets','3 tablets','4 tablets'],answer:2,rationale:'750 mg divided by 250 mg per tablet equals 3 tablets.'},
        {id:'mp01-q03',stem:'Which action is most important before accessing a central venous catheter hub?',options:['Scrub the hub with the approved antiseptic','Flush the catheter with sterile water','Replace the catheter every 48 hours','Apply a warm compress to the insertion site'],answer:0,rationale:'Hand hygiene, aseptic technique, and disinfection of the access hub immediately before use reduce catheter-related infection risk.'},
        {id:'mp01-q04',stem:'A nurse prepares to administer rapid-acting insulin before a meal. Which action is most important?',options:['Verify that the meal tray is available before giving the dose','Give the insulin 1 hour before the meal','Hold the insulin if the client is thirsty','Administer the insulin only at bedtime'],answer:0,rationale:'Rapid-acting insulin has a quick onset. Confirm that food is available to reduce the risk of hypoglycemia.'},
        {id:'mp01-q05',stem:'Which finding is most concerning for a client receiving IV potassium chloride?',options:['Burning at the IV site during the infusion','Heart rate of 88/min','Urine output of 55 mL/hr','Mild thirst after breakfast'],answer:0,rationale:'Potassium infusions are irritating and must be assessed for infiltration or phlebitis. Never give IV potassium by direct IV push.'}
      ]},
      {id:'ngn-acute-01',title:'NGN Acute Care Judgment',tag:'Case thinking',description:'Five linked-decision style questions that practice recognizing cues, prioritizing risk, acting, and evaluating.',questions:[
        {id:'ng01-q01',stem:'A client with a urinary tract infection has a temperature of 39.2 C (102.6 F), heart rate 122/min, blood pressure 86/48 mm Hg, and new confusion. Which concern is the priority?',options:['Possible sepsis with poor perfusion','Expected fever response to infection','Uncontrolled chronic hypertension','Medication-related constipation'],answer:0,rationale:'Infection plus hypotension, tachycardia, fever, and new confusion suggests sepsis with impaired perfusion. This is an emergency.'},
        {id:'ng01-q02',stem:'For the client with suspected sepsis, which action should the nurse take first?',options:['Activate the facility’s rapid response or sepsis process','Offer a cool drink for fever','Obtain a routine daily weight','Provide discharge teaching about antibiotics'],answer:0,rationale:'Suspected sepsis with signs of instability requires immediate escalation and treatment using the facility’s emergency process.'},
        {id:'ng01-q03',stem:'A client with a new tracheostomy is in respiratory distress and the tracheostomy tube has become dislodged. Which action is the priority?',options:['Maintain the airway using the emergency tracheostomy equipment','Apply a dry dressing and wait for the provider','Offer oral fluids to reduce anxiety','Reposition the client flat in bed'],answer:0,rationale:'Airway is the priority. Use emergency equipment and call for assistance according to facility protocol.'},
        {id:'ng01-q04',stem:'A client with heart failure suddenly develops crackles, severe dyspnea, and oxygen saturation of 84% on room air. Which action should the nurse take first?',options:['Sit the client upright and apply oxygen','Encourage the client to drink water','Assist the client to ambulate','Obtain the client’s daily weight'],answer:0,rationale:'Acute pulmonary edema compromises breathing. Positioning upright and applying oxygen address the immediate ABC priority while escalating care.'},
        {id:'ng01-q05',stem:'After interventions for a client with shock, which finding best indicates improved perfusion?',options:['Urine output increases to 35 mL/hr','Skin becomes more pale','Level of consciousness declines','Blood pressure continues to decrease'],answer:0,rationale:'Improving urine output supports improved renal perfusion. Worsening color, mentation, or blood pressure indicates deterioration.'}
      ]}
    ];
    let activeSet=null,index=0,answers=[],revealed=false,student=null;
    function renderLibrary(){const target=$('sets');target.innerHTML=sets.map(set=>`<article class="card"><p class="meta">${set.tag}</p><h2>${set.title}</h2><p>${set.description}</p><p class="meta">${set.questions.length} questions · original practice</p><button class="start" data-set="${set.id}">Start →</button></article>`).join('');document.querySelectorAll('[data-set]').forEach(button=>button.addEventListener('click',()=>startSet(button.dataset.set)))}
    function startSet(id){activeSet=sets.find(set=>set.id===id);index=0;answers=[];revealed=false;$('library').classList.add('hidden');$('sets').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()}
    function renderQuestion(){const q=activeSet.questions[index],selected=answers[index];$('quiz').innerHTML=`<p class="question-number">${activeSet.title} · Question ${index+1} of ${activeSet.questions.length}</p><div class="progress"><div style="width:${((index)/activeSet.questions.length)*100}%"></div></div><h2>${q.stem}</h2><div class="options">${q.options.map((option,optionIndex)=>`<label class="option"><input type="radio" name="answer" value="${optionIndex}" ${selected===optionIndex?'checked':''} ${revealed?'disabled':''}><span>${option}</span></label>`).join('')}</div>${revealed?`<div class="feedback ${selected===q.answer?'correct':'incorrect'}"><strong>${selected===q.answer?'Correct':'Review this one'}</strong>${q.rationale}</div>`:''}<div class="actions"><button class="secondary" id="leave" type="button">Back to sets</button><button class="primary" id="next" type="button" ${selected===undefined?'disabled':''}>${revealed?(index===activeSet.questions.length-1?'See results':'Next question'):'Check answer'}</button></div>`;document.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',event=>{answers[index]=Number(event.target.value);$('next').disabled=false}));$('leave').addEventListener('click',showLibrary);$('next').addEventListener('click',()=>{if(!revealed){revealed=true;renderQuestion();return}if(index===activeSet.questions.length-1){showResults();return}index++;revealed=false;renderQuestion()})}
    async function saveResult(score){if(!student)return 'Your score is shown here. Sign in through the Success Center to save it to your dashboard.';const result=await db.from('student_supplemental_practice_results').insert({student_id:student.id,practice_key:activeSet.id,practice_title:activeSet.title,score,total_questions:activeSet.questions.length,completed_at:new Date().toISOString()});return result.error?'Your score is shown here. We could not save it to the dashboard just yet.':'Saved to your shared dashboard.'}
    async function showResults(){const score=answers.reduce((total,answer,questionIndex)=>total+(answer===activeSet.questions[questionIndex].answer?1:0),0),percent=Math.round(score/activeSet.questions.length*100);$('quiz').innerHTML=`<section class="results"><p class="eyebrow">Practice complete</p><h2>${activeSet.title}</h2><div class="score">${percent}%</div><p class="result-detail">You answered ${score} of ${activeSet.questions.length} correctly. ${percent>=80?'Nice work—keep this skill in mixed practice.':percent>=60?'Review the rationales, then return to this set once more.':'Review the connected module before retaking this set.'}</p><p class="status" id="save-status">Saving your result…</p><div class="result-actions"><button class="secondary" id="retry" type="button">Try again</button><button class="primary" id="return" type="button">Back to assignments</button></div></section>`;$('save-status').textContent=await saveResult(score);$('retry').addEventListener('click',()=>startSet(activeSet.id));$('return').addEventListener('click',showLibrary)}
    function showLibrary(){activeSet=null;$('quiz').classList.add('hidden');$('library').classList.remove('hidden');$('sets').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
    async function init(){const {data}=await db.auth.getSession();if(data.session){const own=await db.from('students').select('id').eq('auth_user_id',data.session.user.id).maybeSingle();student=own.data||null}const assignedSet=new URLSearchParams(window.location.search).get('set');if(sets.some(set=>set.id===assignedSet))startSet(assignedSet);else renderLibrary()}
    init();
  </script>
</body>
</html>
