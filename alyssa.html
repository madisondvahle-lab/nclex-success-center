// ─── QUESTION BANK ────────────────────────────────────────────────────────────
const QUESTION_BANK = [

  // ══ PHARMACOLOGY ══

  { id:"ph1", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is preparing to administer digoxin 0.125 mg PO to a client with heart failure. Before giving the medication, which assessment is the priority?",
    options:["Assess blood pressure","Assess apical pulse for one full minute","Assess respiratory rate","Assess urine output"],
    correct:[1], rationale:{ correct:"Digoxin slows the heart rate (negative chronotropy). The apical pulse must be assessed for a full minute before administration — hold if HR <60 bpm in adults.", wrong:["Blood pressure is not the priority pre-assessment for digoxin.","Respiratory rate is not the primary pre-administration check for digoxin.","Urine output is monitored in heart failure but is not the priority before giving digoxin."]}},

  { id:"ph2", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A client on warfarin therapy has an INR of 5.8 and is actively bleeding from a wound. Which intervention does the nurse anticipate?",
    options:["Administer vitamin K and fresh frozen plasma as ordered","Increase the warfarin dose to re-stabilize the INR","Apply pressure only and recheck INR in 6 hours","Administer protamine sulfate IV"],
    correct:[0], rationale:{ correct:"Supratherapeutic INR with active bleeding requires reversal with vitamin K (reverses warfarin) and FFP (replaces clotting factors) — both are anticipated orders.", wrong:["Increasing warfarin worsens anticoagulation and bleeding risk.","Pressure alone is insufficient when INR is 5.8 with active bleeding.","Protamine sulfate reverses heparin, not warfarin."]}},

  { id:"ph3", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is caring for a client prescribed metoprolol succinate for hypertension. Which finding should the nurse report to the provider before administration?",
    options:["Blood pressure 138/84 mmHg","Apical pulse of 48 bpm","Respiratory rate of 16 breaths/min","Serum potassium of 4.1 mEq/L"],
    correct:[1], rationale:{ correct:"Metoprolol is a beta-blocker that slows heart rate. A pulse of 48 bpm is bradycardic — the nurse should hold the dose and notify the provider.", wrong:["BP 138/84 is elevated but not a contraindication to giving a beta-blocker.","RR 16 is normal.","Potassium 4.1 is within normal range."]}},

  { id:"ph4", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A client is receiving IV vancomycin. The nurse notes the client's face, neck, and upper chest are flushed and the client reports itching. What is the priority action?",
    options:["Stop the infusion and prepare for anaphylaxis","Slow the infusion rate and monitor the client closely","Administer diphenhydramine and restart at the original rate","Discontinue the IV line and notify the provider of an allergy"],
    correct:[1], rationale:{ correct:"This is Red Man Syndrome — a rate-dependent infusion reaction to vancomycin, not a true allergic reaction. Slowing the rate typically resolves symptoms.", wrong:["Red Man Syndrome is not anaphylaxis — anaphylaxis includes hypotension, bronchospasm, and angioedema.","Diphenhydramine may be used as an adjunct, but slowing the rate is the first-line action.","The IV line does not need to be discontinued — rate adjustment resolves Red Man Syndrome."]}},

  { id:"ph5", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is teaching a client newly prescribed levothyroxine for hypothyroidism. Which statement by the client indicates understanding?",
    options:["'I will take my pill with my morning coffee.'","'I should take it on an empty stomach 30–60 minutes before breakfast.'","'I can take it with my calcium supplement to help absorption.'","'I only need to take it when I feel tired.'"],
    correct:[1], rationale:{ correct:"Levothyroxine is best absorbed on an empty stomach 30–60 minutes before eating. Food, calcium, and iron interfere with absorption.", wrong:["Coffee can reduce absorption — not recommended.","Calcium significantly reduces levothyroxine absorption.","Levothyroxine must be taken daily — not symptom-based."]}},

  { id:"ph6", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A client prescribed lithium carbonate 300 mg TID reports nausea, vomiting, and hand tremors. The serum lithium level is 1.9 mEq/L. What is the nurse's priority action?",
    options:["Reassure the client that these are expected early side effects","Hold the lithium and notify the provider immediately","Give the next dose with a full glass of water and a snack","Reduce the dose by half and recheck in 24 hours"],
    correct:[1], rationale:{ correct:"Therapeutic lithium is 0.6–1.2 mEq/L. A level of 1.9 mEq/L is toxic. Nausea, vomiting, and tremors are signs of toxicity — hold and notify.", wrong:["These symptoms at a level of 1.9 are not expected side effects — they indicate toxicity.","Giving more lithium with a toxic level worsens the toxicity.","The nurse cannot independently reduce a medication dose."]}},

  { id:"ph7", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is administering magnesium sulfate IV to a client with preeclampsia. Which finding requires the nurse to stop the infusion immediately?",
    options:["Urine output of 35 mL/hr","Deep tendon reflexes absent","Respiratory rate of 16 breaths/min","Blood pressure 148/96 mmHg"],
    correct:[1], rationale:{ correct:"Loss of deep tendon reflexes (DTRs) is a sign of magnesium toxicity and indicates impending respiratory arrest. The infusion must be stopped immediately.", wrong:["Urine output of 35 mL/hr is acceptable — hold if <25–30 mL/hr.","RR of 16 is normal — hold if <12 breaths/min.","BP 148/96 is elevated but not an indication to stop mag sulfate."]}},

  { id:"ph8", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is preparing to administer furosemide 40 mg IV to a client with heart failure. Which lab result is most important to review first?",
    options:["Serum sodium","Serum potassium","Blood glucose","Serum creatinine"],
    correct:[1], rationale:{ correct:"Furosemide is a loop diuretic that causes potassium wasting (hypokalemia). Reviewing potassium before administration prevents dangerous dysrhythmias.", wrong:["Sodium is monitored but not the priority pre-administration check.","Blood glucose is not directly affected by furosemide administration.","Creatinine is important for renal function but potassium is the priority safety check."]}},

  { id:"ph9", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A client is prescribed metformin for type 2 diabetes and is scheduled for a CT scan with contrast today. What is the nurse's best action?",
    options:["Administer metformin as scheduled and proceed","Hold metformin before and after the contrast procedure and notify the provider","Give half the dose before the scan and resume full dose tomorrow","Skip today's dose only and resume the following morning"],
    correct:[1], rationale:{ correct:"Metformin must be held before and after iodinated contrast due to the risk of contrast-induced nephropathy leading to lactic acidosis — a life-threatening complication.", wrong:["Giving metformin before contrast is contraindicated.","Half-dosing does not adequately reduce the risk of lactic acidosis.","The provider must be notified and the hold must extend after the scan as well."]}},

  { id:"ph10", type:"sata", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is caring for a client receiving heparin IV infusion for DVT. Select ALL nursing assessments that are essential during therapy.",
    options:["Monitor aPTT results every 6 hours per protocol","Check blood pressure every 15 minutes","Assess for signs of bleeding including urine, stool, and IV sites","Monitor platelet count daily for heparin-induced thrombocytopenia (HIT)","Assess urine output hourly","Weigh the client daily"],
    correct:[0,2,3], rationale:{ correct:"aPTT monitors anticoagulation levels, bleeding assessment identifies hemorrhage, and daily platelet monitoring detects HIT — a serious complication of heparin therapy.", wrong:["Q15 min BP is not required for routine heparin therapy.","Hourly urine output is not a standard heparin monitoring parameter.","Daily weight is used in fluid management, not specifically for heparin monitoring."]}},

  { id:"ph11", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is educating a client prescribed atorvastatin (Lipitor). Which statement by the client indicates a need for further teaching?",
    options:["'I should report any unexplained muscle pain or weakness.'","'I can take this medication with grapefruit juice in the morning.'","'I should have my liver enzymes checked periodically.'","'I will continue taking this even if I feel fine.'"],
    correct:[1], rationale:{ correct:"Grapefruit juice inhibits the metabolism of statins, dramatically increasing drug levels and the risk of myopathy and rhabdomyolysis.", wrong:["Muscle pain/weakness may indicate myopathy or rhabdomyolysis — important to report.","Periodic LFTs are required to monitor for statin-related hepatotoxicity.","Statins are taken long-term regardless of symptoms."]}},

  { id:"ph12", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A postpartum client who delivered 6 hours ago is prescribed oxytocin (Pitocin) IV to prevent hemorrhage. The nurse notes the client has urine output of 20 mL over the past 2 hours. What is the priority action?",
    options:["Increase the oxytocin rate to stimulate uterine contraction","Hold the oxytocin and notify the provider","Continue the infusion — oliguria is expected postpartum","Document the finding and reassess in 1 hour"],
    correct:[1], rationale:{ correct:"Oxytocin has antidiuretic properties and can cause water intoxication and oliguria. Urine output of 20 mL in 2 hours (10 mL/hr) is below the threshold of 30 mL/hr — hold and notify.", wrong:["Increasing the rate would worsen fluid retention.","Oliguria is not a normal expected postpartum finding and must be addressed.","Waiting an hour with a urine output of 10 mL/hr delays necessary intervention."]}},

  { id:"ph13", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is reviewing a new prescription for amoxicillin 500 mg PO TID for a client. The client reports a prior reaction to cephalexin. What is the nurse's best action?",
    options:["Administer the medication — amoxicillin and cephalexin are unrelated","Hold the medication and contact the provider — cross-sensitivity is possible","Administer half the dose and observe for 30 minutes","Ask the client if the reaction was severe before deciding"],
    correct:[1], rationale:{ correct:"Amoxicillin is a penicillin and cephalexin is a cephalosporin — both are beta-lactam antibiotics. Cross-sensitivity exists in approximately 1–10% of clients, especially with severe penicillin allergy. The provider must be notified.", wrong:["Cross-reactivity between penicillins and cephalosporins is clinically significant.","Administering any dose without clarification puts the client at risk.","The nurse's role is to notify the provider, not independently assess severity to decide."]}},

  { id:"ph14", type:"bowtie", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    caseIntro:"A 34-year-old client with bipolar disorder is admitted after taking double her prescribed lithium dose for 3 days. Current lithium level: 2.3 mEq/L. VS: BP 104/68, HR 58, RR 14. Client reports coarse tremors, confusion, and has had 4 episodes of diarrhea today.",
    stem:"Complete the bow-tie clinical judgment item.",
    leftLabel:"Nursing Actions (Select 2)", centerLabel:"Condition", rightLabel:"Parameters to Monitor (Select 2)",
    leftOptions:["Hold lithium and prepare for IV hydration","Administer the next scheduled lithium dose","Monitor neurological status and seizure precautions","Encourage the client to drink extra fluids only"],
    centerOptions:["Lithium toxicity","Therapeutic lithium level","Bipolar depressive episode","Medication non-adherence"],
    rightOptions:["Serum lithium level and urine output","Blood glucose and weight","Deep tendon reflexes and neurological status","Bowel pattern and sleep quality"],
    correctLeft:[0,2], correctCenter:[0], correctRight:[0,2],
    rationale:{ condition:"Lithium level 2.3 mEq/L (toxic >1.5), coarse tremors, confusion, and diarrhea confirm lithium toxicity.", actions:"Holding lithium and IV hydration promote renal excretion of lithium. Neurological monitoring and seizure precautions protect patient safety.", outcomes:"Serial lithium levels confirm clearance; DTRs and neuro status track toxicity resolution.", wrong:"Giving another dose or oral fluids alone are inadequate in acute toxicity with a level of 2.3."}},

  { id:"ph15", type:"casestudy", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    caseIntro:"A 58-year-old client is admitted with acute decompensated heart failure. Current medications include carvedilol, lisinopril, and spironolactone. Morning labs: K+ 6.1 mEq/L, Na+ 138 mEq/L, BUN 24 mg/dL, Cr 1.3 mg/dL. The provider orders furosemide 80 mg IV push now.",
    questions:[
      { qid:"ph15a", stem:"Which medication should the nurse question given the morning lab results?", type:"mcq",
        options:["Carvedilol","Lisinopril","Spironolactone","Furosemide"],
        correct:[2], rationale:"Spironolactone is a potassium-sparing diuretic. With K+ already at 6.1 mEq/L (hyperkalemia), giving spironolactone risks life-threatening dysrhythmias. The nurse should hold it and notify the provider."},
      { qid:"ph15b", stem:"Before administering furosemide IV push, which assessment is the priority?", type:"mcq",
        options:["Blood glucose","Apical heart rate and rhythm","Blood pressure and urine output baseline","Temperature and respiratory rate"],
        correct:[2], rationale:"Furosemide causes rapid diuresis — baseline blood pressure and urine output are critical to monitor for hypotension and to evaluate therapeutic response."},
      { qid:"ph15c", stem:"Select ALL findings that indicate furosemide therapy is effective.", type:"sata",
        options:["Urine output increases to 200 mL/hr","Weight increases by 1 kg","Bilateral crackles diminish on auscultation","Edema decreases in lower extremities","Blood pressure drops to 78/50 mmHg","Client reports less shortness of breath"],
        correct:[0,2,3,5], rationale:"Increased urine output, reduced crackles, decreased edema, and improved dyspnea all indicate effective diuresis and reduced fluid overload."}
    ]},

  // ══ MANAGEMENT OF CARE ══

  { id:"mc1", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is planning care for four clients. Which client should the nurse assess first?",
    options:["A client with stable COPD on 2L O2 requesting pain medication rated 4/10","A postoperative client with a blood pressure of 88/52 and increasing restlessness","A client awaiting discharge instructions for a new insulin regimen","A client with a temperature of 38.1°C who received acetaminophen 1 hour ago"],
    correct:[1], rationale:{ correct:"Hypotension (88/52) with restlessness in a postoperative client suggests hemorrhage, hypovolemic shock, or sepsis — an immediate life-threatening emergency.", wrong:["Mild pain in a stable client is not the priority.","Discharge teaching is important but not urgent.","A low-grade fever after acetaminophen is expected and not emergent."]}},

  { id:"mc2", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A charge nurse is making assignments. Which client is most appropriate to assign to an agency (travel) nurse unfamiliar with the unit?",
    options:["A client admitted this morning with new-onset chest pain","A client on day 3 post-op after appendectomy who is stable and ambulating","A client with DKA on an insulin drip requiring hourly glucose monitoring","A client with active suicidal ideation requiring one-to-one observation"],
    correct:[1], rationale:{ correct:"A stable post-op day 3 client is predictable and appropriate for an agency nurse unfamiliar with unit-specific protocols.", wrong:["New-onset chest pain requires a nurse familiar with the unit's cardiac protocols.","DKA with insulin drip requires complex titration and unit protocol familiarity.","Suicidal one-to-one observation requires experienced safety assessment."]}},

  { id:"mc3", type:"sata", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is preparing to delegate tasks to a UAP at the start of the shift. Select ALL tasks that may be appropriately delegated.",
    options:["Ambulating a stable post-op day 2 client","Assessing breath sounds after a bronchodilator treatment","Collecting a routine urine specimen from a client with a Foley catheter","Teaching a client about a low-sodium diet","Measuring and recording vital signs on a stable client","Evaluating effectiveness of a new pain medication"],
    correct:[0,2,4], rationale:{ correct:"Ambulation, specimen collection, and vital signs on stable clients are routine tasks that may be delegated to UAP with supervision.", wrong:["Assessment (breath sounds) requires clinical judgment — RN only.","Client teaching requires nursing knowledge and cannot be delegated.","Evaluating medication effectiveness is a nursing assessment responsibility."]}},

  { id:"mc4", type:"mcq", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse receives morning report. Which client should be seen first?",
    options:["A client with type 2 diabetes whose fasting glucose is 215 mg/dL","A client with a tracheostomy whose SpO2 dropped from 97% to 89% and who is increasingly anxious","A client post-op day 1 requesting pain medication rated 6/10","A client awaiting a chest x-ray result from 2 hours ago"],
    correct:[1], rationale:{ correct:"Acute hypoxemia (SpO2 89%) in a client with a tracheostomy — who may have a mucus plug or dislodged tube — is a potential airway emergency requiring immediate assessment.", wrong:["Glucose 215 in a known diabetic is concerning but not emergent.","Pain 6/10 is important but secondary to airway compromise.","Awaiting a result is not an immediate clinical priority."]}},

  { id:"mc5", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A client with decision-making capacity refuses a recommended blood transfusion. What is the nurse's best action?",
    options:["Contact the family to obtain consent","Document the refusal, ensure the client understands the risks, and notify the provider","Administer the transfusion because it is medically necessary","Ask the provider to override the refusal"],
    correct:[1], rationale:{ correct:"A competent adult has the legal and ethical right to refuse treatment. The nurse documents the informed refusal, ensures the client understands the consequences, and notifies the provider.", wrong:["Family cannot override a competent adult's refusal.","Administering treatment against a competent client's wishes is battery.","Providers cannot override a competent patient's refusal."]}},

  { id:"mc6", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is using SBAR to communicate a client's change in condition to the provider. The nurse states: 'I believe he may be developing sepsis based on his fever, tachycardia, and elevated WBC.' Which component of SBAR is this?",
    options:["Situation","Background","Assessment","Recommendation"],
    correct:[2], rationale:{ correct:"The Assessment component is the nurse's clinical interpretation and analysis of the data — what the nurse thinks is happening.", wrong:["Situation briefly states the current problem.","Background provides relevant clinical history.","Recommendation states what the nurse is requesting from the provider."]}},

  { id:"mc7", type:"mcq", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse discovers a colleague documented that wound care was completed but the supplies are still unopened at the bedside. What is the nurse's priority action?",
    options:["Confront the colleague privately and ask them to correct the note","Report the concern through the appropriate chain of command and ensure the wound care is completed","Add a nursing note contradicting the documentation without further action","Ignore the situation since the wound care can be done now"],
    correct:[1], rationale:{ correct:"Falsified documentation is a serious ethical and legal violation. The nurse must protect client safety by completing the wound care and reporting the falsification through proper channels.", wrong:["Private confrontation does not fulfill the nurse's duty to report unsafe practice.","Adding a note without reporting the falsification is insufficient.","Ignoring falsified documentation fails the nurse's ethical and legal obligations."]}},

  { id:"mc8", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is witnessing informed consent for an elective knee replacement. The client says, 'I still don't know what could go wrong.' What should the nurse do?",
    options:["Explain the surgical risks in detail and have the client sign","Proceed — the surgeon already obtained consent","Hold the consent process and notify the provider to return and re-explain","Ask the client to read the consent form independently"],
    correct:[2], rationale:{ correct:"Valid informed consent requires that the client understands the procedure, risks, benefits, and alternatives. The nurse must notify the provider when understanding is lacking.", wrong:["Explaining surgical risks is the surgeon's responsibility, not the nurse's role in witnessing.","Proceeding without understanding is not valid informed consent.","Reading the form alone does not guarantee understanding."]}},

  { id:"mc9", type:"sata", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is receiving report on five clients. Select ALL clients who require immediate assessment before other tasks.",
    options:["A client with new slurred speech and right arm weakness","A client requesting a warm blanket","A client whose SpO2 is 86% on room air","A client with heart failure whose weight increased 3 lbs overnight","A client with blood pressure 80/44 and altered mental status","A client asking for discharge paperwork"],
    correct:[0,2,4], rationale:{ correct:"Stroke symptoms (slurred speech, arm weakness), severe hypoxemia (SpO2 86%), and hypotension with altered mental status are all immediate life threats requiring first response.", wrong:["A warm blanket is a comfort request.","Weight gain of 3 lbs overnight needs follow-up but is not immediately life-threatening.","Discharge paperwork is a low-priority administrative task."]}},

  { id:"mc10", type:"casestudy", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    caseIntro:"A charge nurse is managing a busy medical-surgical unit. A UAP reports that a client fell in the hallway while trying to walk to the bathroom alone. The client is awake, alert, and reporting left hip pain. The UAP has helped the client back to bed.",
    questions:[
      { qid:"mc10a", stem:"What is the nurse's priority action?", type:"mcq",
        options:["Complete an incident report","Assess the client immediately for injury","Ask the UAP for a full account of events","Notify the family"],
        correct:[1], rationale:"Client safety and assessment are the immediate priority after a fall. The nurse must assess for injury before completing documentation or notifications."},
      { qid:"mc10b", stem:"Select ALL actions that are part of the nurse's post-fall responsibilities.", type:"sata",
        options:["Assess the client for pain, range of motion, and neurovascular status","Complete a fall incident report per facility policy","Notify the provider of the fall and assessment findings","Ask the UAP to document the fall in the medical record","Implement additional fall prevention measures","Reassess the client's pain medication needs"],
        correct:[0,1,2,4,5], rationale:"Post-fall care includes assessment, incident reporting, provider notification, safety measure updates, and pain reassessment. Documentation in the medical record is the RN's responsibility, not the UAP's."},
      { qid:"mc10c", stem:"The provider orders an x-ray of the left hip. While waiting for transport, the client states 'I feel like something is wrong with my leg.' The nurse notes the left leg appears externally rotated and shortened. What does this suggest?", type:"mcq",
        options:["Muscle spasm from the fall","Hip fracture","Nerve damage from the fall","This is a normal post-fall finding"],
        correct:[1], rationale:"External rotation and shortening of the leg after a fall with hip pain are classic signs of a hip fracture requiring urgent provider notification and x-ray confirmation."}
    ]},

  // ══ PEDS / OB ══

  { id:"ob1", type:"mcq", difficulty:2, blueprint:"Health Promotion & Maintenance", category:"Ante/Intra/Postpartum",
    stem:"A nurse is assessing a client at 10 weeks gestation at her first prenatal visit. Which finding should be reported to the provider as abnormal?",
    options:["Nausea and vomiting in the morning","Blood pressure 144/92 mmHg","Fatigue and mild breast tenderness","Weight gain of 1 lb since last month"],
    correct:[1], rationale:{ correct:"BP of 144/92 in the first trimester is abnormal and may indicate chronic hypertension — a risk factor for preeclampsia and fetal growth restriction requiring provider evaluation.", wrong:["Nausea and vomiting (morning sickness) are common in the first trimester.","Fatigue and breast tenderness are normal early pregnancy symptoms.","1 lb weight gain is appropriate in the first trimester."]}},

  { id:"ob2", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A client at 38 weeks gestation presents with sudden onset of painless, bright red vaginal bleeding. She reports no contractions. What does the nurse suspect?",
    options:["Abruptio placentae","Placenta previa","Bloody show","Vasa previa"],
    correct:[1], rationale:{ correct:"Painless, bright red vaginal bleeding in the third trimester is the hallmark of placenta previa — the placenta covers the cervical os and bleeds when the cervix begins to thin.", wrong:["Abruptio placentae presents with painful, dark bleeding and uterine rigidity.","Bloody show is light pink/brown mucoid discharge associated with labor onset.","Vasa previa is rare and presents with rupture of membranes and fetal bradycardia."]}},

  { id:"ob3", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A nurse is monitoring a client in active labor with an epidural. The client's blood pressure drops from 118/76 to 84/52 following epidural placement. What is the nurse's priority action?",
    options:["Increase the epidural rate","Place the client in left lateral position and administer IV fluid bolus per order","Notify the provider and document the finding","Administer oxygen and assess fetal heart tones only"],
    correct:[1], rationale:{ correct:"Epidural-induced hypotension is common. Left lateral positioning (relieves aortic compression), IV fluid bolus, and oxygen are the immediate interventions.", wrong:["Increasing the epidural rate worsens hypotension.","Provider notification is important but positioning and fluid bolus must happen simultaneously and urgently.","Oxygen and FHT assessment alone are insufficient — maternal BP must be corrected."]}},

  { id:"ob4", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A nurse is caring for a client with severe preeclampsia. Which finding indicates the client may be progressing to eclampsia?",
    options:["BP 158/106 with 3+ proteinuria","New onset of severe headache, visual changes, and epigastric pain","Mild ankle edema and weight gain of 2 lbs this week","Fetal heart rate of 145 bpm with accelerations"],
    correct:[1], rationale:{ correct:"Severe headache, visual disturbances (scotoma, blurred vision), and epigastric/RUQ pain are warning signs of impending eclampsia (seizure) and require immediate intervention.", wrong:["Severe BP with proteinuria confirms preeclampsia but not the progression warning signs.","Mild edema and weight gain are common in normal pregnancy.","Normal FHR with accelerations is reassuring."]}},

  { id:"ob5", type:"sata", difficulty:2, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A nurse is performing a postpartum assessment on a client 4 hours after a vaginal delivery. Select ALL normal expected findings.",
    options:["Uterus firm and midline at the umbilicus","Lochia rubra with small clots smaller than a quarter","Blood pressure 128/80 mmHg","Uterus boggy and displaced to the right","Temperature 38.4°C (101.2°F)","Bladder distension with urine output 20 mL/hr"],
    correct:[0,1,2], rationale:{ correct:"A firm, midline fundus at the umbilicus, lochia rubra with small clots, and stable blood pressure are all normal postpartum findings at 4 hours.", wrong:["A boggy, displaced uterus suggests bladder distension causing uterine displacement — abnormal and needs intervention.","Temp 38.4°C at 4 hours postpartum may suggest infection or other pathology and should be reported.","Urine output of 20 mL/hr is oliguria — abnormal and requires assessment."]}},

  { id:"ob6", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A nurse assesses a postpartum client 12 hours after delivery and notes a boggy uterus above and to the right of the umbilicus with heavy lochia rubra. What is the nurse's priority action?",
    options:["Administer oxytocin IM as ordered","Assist the client to void or catheterize the bladder, then massage the fundus","Document the finding and notify the provider","Increase IV fluid rate and recheck in 30 minutes"],
    correct:[1], rationale:{ correct:"A boggy, displaced uterus is caused by a full bladder preventing proper uterine contraction. The priority is bladder emptying — then fundal massage to promote involution.", wrong:["Oxytocin may be needed if the uterus remains boggy after bladder emptying, but that comes second.","Documentation and notification come after the immediate intervention.","IV fluids worsen the bladder distension."]}},

  { id:"ob7", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    stem:"A nurse is monitoring a fetal heart rate tracing. The nurse notes a deceleration that begins at the peak of the contraction, has the lowest point after the contraction peak, and takes more than 30 seconds to return to baseline. How should the nurse interpret this?",
    options:["Early deceleration — normal response to head compression","Variable deceleration — cord compression","Late deceleration — uteroplacental insufficiency","Acceleration — reassuring sign"],
    correct:[2], rationale:{ correct:"Late decelerations mirror contractions but are offset — nadir occurs after the contraction peak and slow to return. They indicate uteroplacental insufficiency and are a nonreassuring pattern.", wrong:["Early decelerations mirror contractions precisely and are caused by head compression — benign.","Variable decelerations are abrupt, V-shaped, and variable in timing — caused by cord compression.","Accelerations are increases above baseline — a reassuring sign."]}},

  { id:"ob8", type:"bowtie", difficulty:3, blueprint:"Physiological Integrity", category:"Ante/Intra/Postpartum",
    caseIntro:"A 29-year-old client is 39 weeks gestation, G2P1, in active labor. The FHR baseline is 158 bpm with late decelerations appearing after each contraction. BP 96/60, IV oxytocin infusing at 12 mU/min. Client is in supine position.",

// ─── CAT ENGINE ───────────────────────────────────────────────────────────────
const MIN_Q = 75;
const MAX_Q = 130;
const PASS_THRESHOLD = 0.72;
const FAIL_THRESHOLD = 0.28;
const CONFIDENCE_CUTOFF = 0.90;

function updateAbility(ability, correct, difficulty) {
  const diffMap = { 1: -0.5, 2: 0, 3: 0.5 };
  const delta = correct ? 0.15 + (diffMap[difficulty] || 0) * 0.05 : -0.15 + (diffMap[difficulty] || 0) * 0.05;
  return Math.max(0, Math.min(1, ability + delta));
}

function getConfidence(history) {
  if (history.length < 10) return 0;
  const recentCorrect = history.slice(-10).filter(h => h.correct).length / 10;
  const spread = history.length / MAX_Q;
  return Math.min(0.99, spread * 0.6 + Math.abs(recentCorrect - 0.5) * 0.8);
}

function shouldStop(history, ability) {
  if (history.length < MIN_Q) return null;
  const confidence = getConfidence(history);
  if (confidence >= CONFIDENCE_CUTOFF) {
    return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  }
  if (history.length >= MAX_Q) {
    return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  }
  return null;
}

function pickNextQuestion(bank, history, profile, ability) {
  const usedIds = new Set(history.map(h => h.id));
  const available = bank.filter(q => !usedIds.has(q.id));
  if (!available.length) return null;

  let targetDiff;
  if (ability >= 0.7) targetDiff = 3;
  else if (ability >= 0.4) targetDiff = 2;
  else targetDiff = 1;

  const weak = profile?.weakAreas || [];
  const weakMatches = available.filter(q =>
    weak.some(w => q.blueprint?.toLowerCase().includes(w.toLowerCase()) || q.category?.toLowerCase().includes(w.toLowerCase()))
  );
  const pool = (weakMatches.length > 0 && Math.random() < 0.65) ? weakMatches : available;
  return [...pool].sort((a, b) => Math.abs(a.difficulty - targetDiff) - Math.abs(b.difficulty - targetDiff))[0];
}

// ─── UI ATOMS ─────────────────────────────────────────────────────────────────
function Tag({ children, color, bg, border }) {
  return <span style={{ fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:99, letterSpacing:0.8, textTransform:"uppercase", background:bg||"#f1f5f9", color:color||"#64748b", border:border?`1px solid ${border}`:"none" }}>{children}</span>;
}

function Btn({ children, onClick, disabled, variant="primary", small }) {
  const base = { border:"none", borderRadius:10, fontFamily:"Georgia,serif", fontWeight:700, cursor:disabled?"default":"pointer", letterSpacing:0.5, padding: small?"9px 18px":"13px 28px", fontSize: small?13:15 };
  const variants = {
    primary:{ background:disabled?"#e2e8f0":"#0f172a", color:disabled?"#94a3b8":"#fff" },
    outline:{ background:"#f8fafc", color:"#475569", border:"1.5px solid #e2e8f0" }
  };
  return <button style={{...base,...variants[variant]}} onClick={onClick} disabled={disabled}>{children}</button>;
}

function OptionBtn({ letter, text, state, onClick }) {
  const base = { display:"flex", alignItems:"flex-start", gap:12, padding:"13px 16px", borderRadius:10, border:"2px solid #e2e8f0", background:"#f8fafc", cursor:"pointer", textAlign:"left", width:"100%", fontFamily:"Georgia,serif", fontSize:15, transition:"all 0.15s" };
  const states = { selected:{ border:"2px solid #0ea5e9", background:"#f0f9ff" }, correct:{ border:"2px solid #10b981", background:"#f0fdf4", cursor:"default" }, wrong:{ border:"2px solid #ef4444", background:"#fef2f2", cursor:"default" }, dim:{ border:"2px solid #f1f5f9", background:"#f8fafc", opacity:0.45, cursor:"default" }, neutral:{} };
  return (
    <button style={{...base,...states[state||"neutral"]}} onClick={onClick}>
      <span style={{ minWidth:26, height:26, borderRadius:"50%", background:"#e2e8f0", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:"#475569", flexShrink:0, marginTop:1 }}>{letter}</span>
      <span style={{ flex:1, color:"#1e293b", lineHeight:1.55 }}>{text}</span>
      {state==="correct" && <span style={{ color:"#10b981", fontWeight:700, fontSize:16 }}>✓</span>}
      {state==="wrong" && <span style={{ color:"#ef4444", fontWeight:700, fontSize:16 }}>✗</span>}
    </button>
  );
}

// ─── QUESTION RENDERERS ───────────────────────────────────────────────────────
function MCQQuestion({ q, submitted, selected, onSelect }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
      {q.options.map((opt,idx) => {
        let state = "neutral";
        if (submitted) { if(idx===q.correct[0]) state="correct"; else if(idx===(selected||[])[0]&&idx!==q.correct[0]) state="wrong"; else state="dim"; }
        else if ((selected||[]).includes(idx)) state="selected";
        return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>!submitted&&onSelect(idx)} />;
      })}
    </div>
  );
}

function SATAQuestion({ q, submitted, selected, onSelect }) {
  return (
    <div>
      <div style={{ fontSize:12, color:"#64748b", marginBottom:10, fontStyle:"italic" }}>Select all that apply — choose every correct option.</div>
      <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
        {q.options.map((opt,idx) => {
          let state = "neutral";
          if (submitted) { if(q.correct.includes(idx)) state="correct"; else if((selected||[]).includes(idx)) state="wrong"; else state="dim"; }
          else if ((selected||[]).includes(idx)) state="selected";
          return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>!submitted&&onSelect(idx)} />;
        })}
      </div>
    </div>
  );
}

function BowTieQuestion({ q, submitted, btState, onBTSelect }) {
  const col = { display:"flex", flexDirection:"column", gap:6, flex:1, minWidth:160 };
  const colHead = { fontSize:11, fontWeight:700, color:"#64748b", letterSpacing:0.8, textTransform:"uppercase", marginBottom:4 };
  const colLimit = { left:2, center:1, right:2 };

  function BtOpt({ label, selected, correct, wrong, dim, onClick }) {
    let bg="#f8fafc",border="1.5px solid #e2e8f0",color="#1e293b";
    if(dim){color="#cbd5e1";border="1.5px solid #f1f5f9";}
    if(selected){bg="#f0f9ff";border="1.5px solid #0ea5e9";}
    if(correct){bg="#f0fdf4";border="1.5px solid #10b981";color="#065f46";}
    if(wrong){bg="#fef2f2";border="1.5px solid #ef4444";color="#991b1b";}
    return <button onClick={onClick} style={{ padding:"8px 10px", borderRadius:8, border, background:bg, color, fontSize:13, textAlign:"left", cursor:(submitted||!onClick)?"default":"pointer", fontFamily:"Georgia,serif", lineHeight:1.4, width:"100%" }}>{correct&&"✓ "}{wrong&&"✗ "}{label}</button>;
  }

  function handleSelect(key, idx) {
    if(submitted) return;
    const limit = colLimit[key];
    const sel = btState[key]||[];
    let next;
    if(sel.includes(idx)) { next = sel.filter(x=>x!==idx); }
    else if(sel.length < limit) { next = [...sel, idx]; }
    else { next = limit===1 ? [idx] : sel; }
    onBTSelect(key, next);
  }

  function renderCol(options, correctArr, key) {
    const sel = btState[key]||[];
    const limit = colLimit[key];
    return options.map((opt,idx) => {
      const isSel=sel.includes(idx);
      const isCorr=submitted&&correctArr.includes(idx);
      const isWrong=submitted&&isSel&&!correctArr.includes(idx);
      const isDim=submitted&&!isCorr&&!isSel;
      const isDisabled=!submitted&&!isSel&&sel.length>=limit;
      return <BtOpt key={idx} label={opt} selected={!submitted&&isSel} correct={isCorr} wrong={isWrong} dim={isDim||isDisabled} onClick={isDisabled?null:()=>handleSelect(key,idx)} />;
    });
  }

  const leftSel=(btState.left||[]).length, centerSel=(btState.center||[]).length, rightSel=(btState.right||[]).length;

  function SlotBadge({ filled, total }) {
    return <div style={{ fontSize:10, color: filled===total?"#10b981":"#94a3b8", marginBottom:6, fontWeight:600 }}>{filled}/{total} selected</div>;
  }

  return (
    <div>
      {!submitted&&(
        <div style={{ fontSize:12, color:"#64748b", marginBottom:14, fontStyle:"italic", background:"#f0f9ff", padding:"10px 14px", borderRadius:8, border:"1px solid #bae6fd" }}>
          🎯 <strong>Bow-Tie Format:</strong> Select <strong>2 nursing actions</strong> (left) → identify <strong>1 condition</strong> (center) → select <strong>2 parameters to monitor</strong> (right)
        </div>
      )}
      <div style={{ display:"flex", gap:8, marginBottom:20, alignItems:"flex-start" }}>
        <div style={col}>
          <div style={colHead}>⚕️ {q.leftLabel}</div>
          {!submitted&&<SlotBadge filled={leftSel} total={2} />}
          {renderCol(q.leftOptions, q.correctLeft, "left")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={{ ...col, maxWidth:180 }}>
          <div style={colHead}>🔍 {q.centerLabel}</div>
          {!submitted&&<SlotBadge filled={centerSel} total={1} />}
          {renderCol(q.centerOptions, q.correctCenter, "center")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={col}>
          <div style={colHead}>🎯 {q.rightLabel}</div>
          {!submitted&&<SlotBadge filled={rightSel} total={2} />}
          {renderCol(q.rightOptions, q.correctRight, "right")}
        </div>
      </div>
    </div>
  );
}

function CaseStudyQuestion({ q, submitted, csAnswers, onCSAnswer }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      {q.questions.map((sub,si) => {
        const sel = csAnswers[sub.qid]||[];
        return (
          <div key={sub.qid} style={{ background:"#f8fafc", borderRadius:12, padding:"16px 18px", border:"1px solid #e2e8f0" }}>
            <div style={{ fontWeight:700, fontSize:12, color:"#64748b", marginBottom:8, letterSpacing:0.5 }}>QUESTION {si+1} OF {q.questions.length}</div>
            <div style={{ fontFamily:"Georgia,serif", fontSize:15, lineHeight:1.65, color:"#0f172a", marginBottom:12 }}>{sub.stem}</div>
            {sub.type==="sata"&&<div style={{ fontSize:11, color:"#94a3b8", marginBottom:8, fontStyle:"italic" }}>Select all that apply</div>}
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {sub.options.map((opt,idx) => {
                let state="neutral";
                if(submitted){ if(sub.correct.includes(idx)) state="correct"; else if(sel.includes(idx)) state="wrong"; else state="dim"; }
                else if(sel.includes(idx)) state="selected";
                return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>{ if(submitted)return; if(sub.type==="mcq") onCSAnswer(sub.qid,[idx]); else { const cur=csAnswers[sub.qid]||[]; onCSAnswer(sub.qid,cur.includes(idx)?cur.filter(x=>x!==idx):[...cur,idx]); }}} />;
              })}
            </div>
            {submitted&&<div style={{ marginTop:12, padding:"10px 14px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0", fontSize:13, color:"#475569", lineHeight:1.6 }}><strong>Rationale:</strong> {sub.rationale}</div>}
          </div>
        );
      })}
    </div>
  );
}

const FOCUS_AREAS = ["Pharmacology","Management of Care","Pediatrics","OB/Maternity","Prioritization","Delegation","Safe Medication Administration","Fluid & Electrolytes"];

function ProfileScreen({ onStart }) {
  const [attempts,setAttempts]=useState("first"); const [weak,setWeak]=useState(["Pharmacology","Management of Care","Pediatrics","OB/Maternity"]); const [mode,setMode]=useState("practice");
  const inp={ width:"100%", padding:"10px 14px", borderRadius:8, border:"1.5px solid #e2e8f0", fontSize:14, fontFamily:"Georgia,serif", color:"#0f172a", background:"#fff", outline:"none", boxSizing:"border-box" };

  function toggleWeak(area) {
    setWeak(w => w.includes(area) ? w.filter(x=>x!==area) : [...w, area]);
  }

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f172a,#1e293b)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"32px 16px", fontFamily:"Georgia,serif" }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"36px 40px", maxWidth:680, width:"100%", boxShadow:"0 25px 60px rgba(0,0,0,0.4)" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:13, fontWeight:700, letterSpacing:2, color:"#0ea5e9", textTransform:"uppercase", marginBottom:6 }}>NCLEX-RN · 2026 Blueprint</div>
          <h1 style={{ fontSize:28, fontWeight:700, color:"#0f172a", marginBottom:6 }}>Hi, Alyssa! 👋</h1>
          <p style={{ color:"#64748b", fontSize:15 }}>Your personalized adaptive NCLEX quiz — focused on Pharmacology, Management of Care, and Peds/OB.</p>
        </div>

        <div style={{ marginBottom:22 }}>
          <label style={{ fontWeight:700, fontSize:13, color:"#374151", display:"block", marginBottom:8 }}>NCLEX Attempt</label>
          <div style={{ display:"flex", gap:10 }}>
            {[["first","First Attempt"],["repeat","Repeat Attempt"]].map(([v,l])=>(
              <button key={v} onClick={()=>setAttempts(v)} style={{ flex:1, padding:"10px 0", borderRadius:9, border: attempts===v?"2px solid #0ea5e9":"1.5px solid #e2e8f0", background: attempts===v?"#f0f9ff":"#f8fafc", color: attempts===v?"#0369a1":"#475569", fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"Georgia,serif" }}>{l}</button>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:22 }}>
          <label style={{ fontWeight:700, fontSize:13, color:"#374151", display:"block", marginBottom:8 }}>Focus Areas (select your weak spots)</label>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {FOCUS_AREAS.map(area=>(
              <button key={area} onClick={()=>toggleWeak(area)} style={{ padding:"7px 14px", borderRadius:99, border: weak.includes(area)?"2px solid #0ea5e9":"1.5px solid #e2e8f0", background: weak.includes(area)?"#f0f9ff":"#f8fafc", color: weak.includes(area)?"#0369a1":"#64748b", fontWeight:600, fontSize:12, cursor:"pointer", fontFamily:"Georgia,serif" }}>{area}</button>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:28 }}>
          <label style={{ fontWeight:700, fontSize:13, color:"#374151", display:"block", marginBottom:8 }}>Mode</label>
          <div style={{ display:"flex", gap:10 }}>
            {[["practice","Practice Mode (see rationales)"],["exam","Exam Mode (no rationales)"]].map(([v,l])=>(
              <button key={v} onClick={()=>setMode(v)} style={{ flex:1, padding:"10px 0", borderRadius:9, border: mode===v?"2px solid #10b981":"1.5px solid #e2e8f0", background: mode===v?"#f0fdf4":"#f8fafc", color: mode===v?"#047857":"#475569", fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"Georgia,serif" }}>{l}</button>
            ))}
          </div>
        </div>

        <Btn onClick={()=>onStart({ name:"Alyssa", attempts, weakAreas:weak, mode })}>Start My Adaptive Quiz →</Btn>

        <div style={{ marginTop:20, padding:"14px 16px", background:"#f8fafc", borderRadius:10, border:"1px solid #e2e8f0", fontSize:12, color:"#64748b", lineHeight:1.6 }}>
          <strong>How this works:</strong> Questions adapt to your performance in real-time. Your focus areas (Pharmacology, Management of Care, Peds/OB) will appear more frequently. The quiz ends when the CAT engine is confident in your level.
        </div>
      </div>
    </div>
  );
}

// ─── RATIONALE PANEL ─────────────────────────────────────────────────────────
function RationalePanel({ q, selected, btState, isCorrectQ }) {
  if (q.type === "bowtie") {
    return (
      <div style={{ background: isCorrectQ?"#f0fdf4":"#fef2f2", border:`1.5px solid ${isCorrectQ?"#86efac":"#fca5a5"}`, borderRadius:12, padding:"16px 20px", marginBottom:20 }}>
        <div style={{ fontWeight:700, fontSize:13, color: isCorrectQ?"#166534":"#991b1b", marginBottom:10 }}>
          {isCorrectQ ? "✓ Correct!" : "✗ Review Needed"}
        </div>
        <div style={{ fontSize:13, color:"#374151", lineHeight:1.65 }}>
          <div style={{ marginBottom:8 }}><strong>Condition:</strong> {q.rationale.condition}</div>
          <div style={{ marginBottom:8 }}><strong>Actions:</strong> {q.rationale.actions}</div>
          <div style={{ marginBottom:8 }}><strong>Monitoring:</strong> {q.rationale.outcomes}</div>
          <div><strong>Distractors:</strong> {q.rationale.wrong}</div>
        </div>
      </div>
    );
  }
  if (q.type === "casestudy") return null;

  const correct = q.correct;
  const sel = selected || [];
  return (
    <div style={{ background: isCorrectQ?"#f0fdf4":"#fef2f2", border:`1.5px solid ${isCorrectQ?"#86efac":"#fca5a5"}`, borderRadius:12, padding:"16px 20px", marginBottom:20 }}>
      <div style={{ fontWeight:700, fontSize:13, color: isCorrectQ?"#166534":"#991b1b", marginBottom:8 }}>
        {isCorrectQ ? "✓ Correct!" : "✗ Review Needed"}
      </div>
      <div style={{ fontSize:13, color:"#374151", lineHeight:1.65 }}>
        <div style={{ marginBottom:8 }}><strong>Why correct:</strong> {q.rationale?.correct}</div>
        {Array.isArray(q.rationale?.wrong) && q.rationale.wrong.map((w,i)=>(
          <div key={i} style={{ marginBottom:4 }}>✗ <em>{q.options[q.type==="mcq" ? [0,1,2,3].filter(x=>!correct.includes(x))[i] : i]}</em>: {w}</div>
        ))}
      </div>
    </div>
  );
}

// ─── RESULTS SCREEN ───────────────────────────────────────────────────────────
function ResultsScreen({ history, ability, verdict, profile, onRestart }) {
  const total = history.length;
  const correct = history.filter(h=>h.correct).length;
  const pct = Math.round((correct/total)*100);

  const byBlueprint = {};
  history.forEach(h => {
    const bp = h.blueprint || "Other";
    if (!byBlueprint[bp]) byBlueprint[bp] = { correct:0, total:0 };
    byBlueprint[bp].total++;
    if (h.correct) byBlueprint[bp].correct++;
  });

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f172a,#1e293b)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"32px 16px", fontFamily:"Georgia,serif" }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"36px 40px", maxWidth:680, width:"100%", boxShadow:"0 25px 60px rgba(0,0,0,0.4)" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:48, marginBottom:10 }}>{verdict==="PASS" ? "🎉" : "📚"}</div>
          <div style={{ fontSize:22, fontWeight:700, color: verdict==="PASS"?"#166534":"#991b1b", marginBottom:6 }}>
            {verdict==="PASS" ? "Above the Passing Standard" : "Below the Passing Standard"}
          </div>
          <div style={{ fontSize:15, color:"#64748b" }}>Great work, Alyssa — here's your performance breakdown.</div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:24 }}>
          {[["Questions","#0ea5e9",total],["Correct","#10b981",correct],["Score","#f59e0b",`${pct}%`]].map(([l,c,v])=>(
            <div key={l} style={{ background:"#f8fafc", borderRadius:12, padding:"16px", textAlign:"center", border:"1px solid #e2e8f0" }}>
              <div style={{ fontSize:26, fontWeight:700, color:c }}>{v}</div>
              <div style={{ fontSize:12, color:"#94a3b8", fontWeight:600, marginTop:4, letterSpacing:0.5 }}>{l.toUpperCase()}</div>
            </div>
          ))}
        </div>

        <div style={{ marginBottom:24 }}>
          <div style={{ fontWeight:700, fontSize:13, color:"#374151", marginBottom:12, letterSpacing:0.5 }}>PERFORMANCE BY DOMAIN</div>
          {Object.entries(byBlueprint).map(([bp,data])=>{
            const bpPct = Math.round((data.correct/data.total)*100);
            const color = CAT_COLORS[bp] || "#94a3b8";
            return (
              <div key={bp} style={{ marginBottom:12 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                  <span style={{ fontSize:13, color:"#374151" }}>{bp}</span>
                  <span style={{ fontSize:13, fontWeight:700, color }}>{data.correct}/{data.total} ({bpPct}%)</span>
                </div>
                <div style={{ background:"#e2e8f0", borderRadius:99, height:8 }}>
                  <div style={{ width:`${bpPct}%`, background:color, borderRadius:99, height:8, transition:"width 0.6s" }} />
                </div>
              </div>
            );
          })}
        </div>

        <Btn onClick={onRestart}>Retake Quiz →</Btn>
      </div>
    </div>
  );
}

// ─── PROGRESS BAR ─────────────────────────────────────────────────────────────
function ProgressBar({ history, ability }) {
  const pct = Math.round(ability * 100);
  return (
    <div style={{ background:"#fff", borderBottom:"1px solid #e2e8f0", padding:"12px 24px", display:"flex", alignItems:"center", gap:16 }}>
      <div style={{ fontSize:13, color:"#64748b", minWidth:90 }}>Q{history.length + 1} · Alyssa</div>
      <div style={{ flex:1, background:"#e2e8f0", borderRadius:99, height:7 }}>
        <div style={{ width:`${pct}%`, background:"#0ea5e9", borderRadius:99, height:7, transition:"width 0.4s" }} />
      </div>
      <div style={{ fontSize:12, fontWeight:700, color:"#0ea5e9", minWidth:60, textAlign:"right" }}>Level {pct}%</div>
    </div>
  );
}

// ─── QUIZ ENGINE ──────────────────────────────────────────────────────────────
function QuizScreen({ profile, onFinish }) {
  const [history, setHistory] = useState([]);
  const [ability, setAbility] = useState(0.5);
  const [currentQ, setCurrentQ] = useState(() => pickNextQuestion(QUESTION_BANK, [], profile, 0.5));
  const [selected, setSelected] = useState([]);
  const [btState, setBtState] = useState({ left:[], center:[], right:[] });
  const [csAnswers, setCSAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [verdict, setVerdict] = useState(null);

  if (verdict) {
    return <ResultsScreen history={history} ability={ability} verdict={verdict} profile={profile} onRestart={()=>window.location.reload()} />;
  }

  if (!currentQ) {
    const v = ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
    return <ResultsScreen history={history} ability={ability} verdict={v} profile={profile} onRestart={()=>window.location.reload()} />;
  }

  function isAnswerComplete() {
    if (currentQ.type === "mcq") return selected.length === 1;
    if (currentQ.type === "sata") return selected.length > 0;
    if (currentQ.type === "bowtie") return (btState.left||[]).length===2 && (btState.center||[]).length===1 && (btState.right||[]).length===2;
    if (currentQ.type === "casestudy") return currentQ.questions.every(q => (csAnswers[q.qid]||[]).length > 0);
    return false;
  }

  function isCorrect() {
    if (currentQ.type === "mcq") return selected[0] === currentQ.correct[0];
    if (currentQ.type === "sata") {
      const a=[...selected].sort().join(","), b=[...currentQ.correct].sort().join(",");
      return a === b;
    }
    if (currentQ.type === "bowtie") {
      const leftOk=[...( btState.left||[])].sort().join(",") === [...currentQ.correctLeft].sort().join(",");
      const centerOk=(btState.center||[])[0] === currentQ.correctCenter[0];
      const rightOk=[...(btState.right||[])].sort().join(",") === [...currentQ.correctRight].sort().join(",");
      return leftOk && centerOk && rightOk;
    }
    if (currentQ.type === "casestudy") {
      return currentQ.questions.every(sub => {
        const ans = csAnswers[sub.qid] || [];
        const a=[...ans].sort().join(","), b=[...sub.correct].sort().join(",");
        return a === b;
      });
    }
    return false;
  }

  function handleSubmit() {
    const correct = isCorrect();
    const newAbility = updateAbility(ability, correct, currentQ.difficulty);
    const newHistory = [...history, { id:currentQ.id, correct, blueprint:currentQ.blueprint, difficulty:currentQ.difficulty }];

    if (profile.mode === "exam") {
      const v = shouldStop(newHistory, newAbility);
      setHistory(newHistory);
      setAbility(newAbility);
      if (v) { setVerdict(v); return; }
      const next = pickNextQuestion(QUESTION_BANK, newHistory, profile, newAbility);
      setCurrentQ(next);
      setSelected([]); setBtState({ left:[], center:[], right:[] }); setCSAnswers({});
    } else {
      setSubmitted(true);
      setHistory(newHistory);
      setAbility(newAbility);
    }
  }

  function handleNext() {
    const v = shouldStop(history, ability);
    if (v) { setVerdict(v); return; }
    const next = pickNextQuestion(QUESTION_BANK, history, profile, ability);
    setCurrentQ(next);
    setSelected([]); setBtState({ left:[], center:[], right:[] }); setCSAnswers({});
    setSubmitted(false);
  }

  const diffStyle = DIFF_COLORS[currentQ.difficulty] || DIFF_COLORS[2];
  const bpColor = CAT_COLORS[currentQ.blueprint] || "#64748b";

  return (
    <div style={{ minHeight:"100vh", background:"#f1f5f9", fontFamily:"Georgia,serif" }}>
      <ProgressBar history={history} ability={ability} />
      <div style={{ maxWidth:780, margin:"0 auto", padding:"28px 16px" }}>
        <div style={{ background:"#fff", borderRadius:16, padding:"28px 32px", boxShadow:"0 4px 24px rgba(0,0,0,0.07)", marginBottom:20 }}>

          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:18 }}>
            <Tag bg={bpColor+"22"} color={bpColor} border={bpColor+"55"}>{currentQ.blueprint}</Tag>
            <Tag bg={diffStyle.bg} color={diffStyle.text}>{DIFF_LABELS[currentQ.difficulty]}</Tag>
            <Tag>{NGN_LABELS[currentQ.type]}</Tag>
            <Tag>{currentQ.category}</Tag>
          </div>

          {currentQ.caseIntro && (
            <div style={{ background:"#f8fafc", borderRadius:10, padding:"14px 18px", marginBottom:18, border:"1px solid #e2e8f0", fontSize:14, color:"#374151", lineHeight:1.7 }}>
              <div style={{ fontWeight:700, fontSize:11, color:"#94a3b8", letterSpacing:0.8, marginBottom:6 }}>CLINICAL SCENARIO</div>
              {currentQ.caseIntro}
            </div>
          )}

          <div style={{ fontSize:16, fontWeight:700, color:"#0f172a", lineHeight:1.6, marginBottom:18 }}>{currentQ.stem}</div>

          {currentQ.type === "mcq" && <MCQQuestion q={currentQ} submitted={submitted} selected={selected} onSelect={(idx)=>setSelected([idx])} />}
          {currentQ.type === "sata" && <SATAQuestion q={currentQ} submitted={submitted} selected={selected} onSelect={(idx)=>setSelected(s=>s.includes(idx)?s.filter(x=>x!==idx):[...s,idx])} />}
          {currentQ.type === "bowtie" && <BowTieQuestion q={currentQ} submitted={submitted} btState={btState} onBTSelect={(key,val)=>setBtState(s=>({...s,[key]:val}))} />}
          {currentQ.type === "casestudy" && <CaseStudyQuestion q={currentQ} submitted={submitted} csAnswers={csAnswers} onCSAnswer={(qid,ans)=>setCSAnswers(s=>({...s,[qid]:ans}))} />}

          {submitted && profile.mode === "practice" && <RationalePanel q={currentQ} selected={selected} btState={btState} isCorrectQ={isCorrect()} />}

          <div style={{ display:"flex", justifyContent:"flex-end", gap:12 }}>
            {!submitted ? (
              <Btn onClick={handleSubmit} disabled={!isAnswerComplete()}>Submit Answer</Btn>
            ) : (
              <Btn onClick={handleNext}>Next Question →</Btn>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [profile, setProfile] = useState(null);
  if (!profile) return <ProfileScreen onStart={setProfile} />;
  return <QuizScreen profile={profile} onFinish={()=>setProfile(null)} />;
}

ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
