name: M4 recovery sanitizer

on:
  push:
    branches:
      - restore/m4-verbatim
    paths:
      - '.github/workflows/m4-recovery-sanitize.yml'
      - '.agents/tools/sanitize_m4_legacy.py'
      - '.agents/tools/validate_m4_recovery.py'
      - 'module4-guide.html'
      - 'module4-secure.html'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/m4-recovery-sanitize.yml'
      - '.agents/tools/sanitize_m4_legacy.py'
      - '.agents/tools/validate_m4_recovery.py'
      - 'module4-guide.html'
      - 'module4-secure.html'

permissions:
  contents: write

jobs:
  sanitize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: restore/m4-verbatim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize legacy M4 wiring
        run: python3 .agents/tools/sanitize_m4_legacy.py
      - name: Validate clinical integrity and secure wiring
        run: python3 .agents/tools/validate_m4_recovery.py
      - name: Validate diff formatting
        run: git diff --check
      - name: Show scoped diff
        run: git diff -- module4-guide.html
      - name: Commit sanitized source if changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- module4-guide.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module4-guide.html
          git commit -m 'fix: sanitize legacy M4 student wiring'
          git push origin HEAD:restore/m4-verbatim
