  { num:11, name:"Labs in Pregnancy",               ids:["q10","q19"] },

const QUESTIONS = [

  // ══════════════ SECTION 1 — CONCEPT CHECK ══════════════

  { id:"q1", section:1, type:"mcq", difficulty:1,
    concept:{ num:1, name:"RH Incompatibility & RhoGAM" },
    stem:"A nurse is educating a group of prenatal patients about blood type incompatibility. Which scenario places a fetus at risk for hemolytic disease of the newborn?",
    options:[
      "Rh-positive mother carrying an Rh-positive fetus",
      "Rh-negative mother carrying an Rh-positive fetus",
      "Rh-positive mother carrying an Rh-negative fetus",
      "Rh-negative mother carrying an Rh-negative fetus"
    ],
    correct:[1],
    rationale:{ correct:"When an Rh-negative mother carries an Rh-positive fetus, fetal Rh-positive RBCs can cross the placenta, causing the mother to develop anti-Rh antibodies. In subsequent pregnancies, these antibodies attack the fetus's RBCs — causing hemolytic disease of the newborn. KEY PEARL: Rh– mom + Rh+ baby = risk. RhoGAM prevents sensitization.",
      wrong:["If both mother and fetus are Rh-positive, there is no incompatibility and no risk of hemolytic disease.","When the mother is Rh-positive, she cannot develop anti-Rh antibodies — her own blood is Rh-positive, so there is no incompatibility regardless of fetal type.","When both mother and fetus are Rh-negative, no incompatibility exists — RhoGAM is not needed."]}},

  { id:"q2", section:1, type:"mcq", difficulty:1,
    concept:{ num:1, name:"RH Incompatibility & RhoGAM" },
    stem:"An Rh-negative patient delivers an Rh-positive infant. The nurse knows that RhoGAM (Rho(D) immune globulin) must be administered within which timeframe postpartum?",
    options:[
      "Within 24 hours of delivery",
      "Within 48 hours of delivery",
      "Within 72 hours of delivery",
      "Within 7 days of delivery"
    ],
    correct:[2],
    rationale:{ correct:"RhoGAM must be administered within 72 hours (3 days) postpartum to prevent the Rh-negative mother from becoming sensitized to Rh-positive blood. It is also given routinely at 28 weeks gestation, and after any sensitizing event (miscarriage, amniocentesis, trauma, ectopic pregnancy, etc.).",
      wrong:["24 and 48-hour windows are too narrow — the guideline is 72 hours postpartum.","7 days is too late — RhoGAM must be given within 72 hours to be effective in preventing sensitization."]}},

  { id:"q3", section:1, type:"mcq", difficulty:1,
    concept:{ num:2, name:"Preeclampsia Criteria" },
    stem:"A nurse is reviewing the diagnostic criteria for preeclampsia with a student nurse. Which combination of findings establishes a diagnosis of preeclampsia?",
    options:[
      "Blood pressure ≥130/80 mmHg on one occasion after 16 weeks gestation",
      "Blood pressure ≥140/90 mmHg on two occasions 4 hours apart, with proteinuria ≥300 mg/24 hours, after 20 weeks gestation",
      "Any elevated blood pressure before 20 weeks gestation with headache and edema",
      "Blood pressure ≥160/110 mmHg on one occasion with severe headache and visual changes"
    ],
    correct:[1],
    rationale:{ correct:"Preeclampsia is diagnosed by BP ≥140/90 mmHg (measured on two occasions, at least 4 hours apart) WITH proteinuria ≥300 mg/24 hours (or 3+ on dipstick), occurring after 20 weeks gestation. NCLEX CLUE: Must be AFTER 20 weeks — before 20 weeks with hypertension suggests chronic hypertension, not preeclampsia.",
      wrong:["The threshold is ≥140/90 on TWO occasions — not 130/80, and not a single reading.","Hypertension before 20 weeks is classified as chronic hypertension — preeclampsia, by definition, occurs after 20 weeks.","BP ≥160/110 describes SEVERE-RANGE preeclampsia with severe features — while this meets criteria, option B describes the standard diagnostic criteria more completely."]}},

  { id:"q4", section:1, type:"mcq", difficulty:1,
    concept:{ num:3, name:"Eclampsia & HELLP Syndrome" },
    stem:"A nurse is reviewing a patient's labs and sees: low platelets, elevated liver enzymes, and indirect signs of hemolysis. The nurse recognizes these findings as consistent with which obstetric complication?",
    options:[
      "Gestational diabetes with hepatic involvement",
      "HELLP syndrome — a severe variant of preeclampsia",
      "Normal third-trimester lab changes related to increased blood volume",
      "Preterm labor with associated inflammatory response"
    ],
    correct:[1],
    rationale:{ correct:"HELLP syndrome = Hemolysis + Elevated Liver enzymes + Low Platelets. It is a severe, life-threatening variant of preeclampsia. MEMORY TRICK: H-E-L-L-P spells out the findings. These lab abnormalities combined in a pregnant patient require immediate provider notification — HELLP can rapidly progress to maternal and fetal death.",
      wrong:["These findings are not consistent with gestational diabetes — HELLP involves hemolysis, hepatic damage, and thrombocytopenia.","Low platelets and elevated liver enzymes are NEVER normal in pregnancy — these are emergency findings.","HELLP is not related to preterm labor — it is a severe preeclampsia complication requiring emergent management."]}},

  { id:"q5", section:1, type:"mcq", difficulty:1,
    concept:{ num:4, name:"Fetal Heart Rate Patterns" },
    stem:"A nurse observes early decelerations on the fetal monitor — the FHR dips symmetrically and returns to baseline with each contraction. What is the most appropriate nursing interpretation?",
    options:[
      "This is a late deceleration pattern — notify the provider immediately and prepare for emergency delivery",
      "This pattern indicates cord compression — reposition the patient to the left lateral position",
      "Early decelerations reflect head compression during contractions and are a normal, benign finding",
      "This is minimal variability — a sign of possible fetal distress requiring immediate intervention"
    ],
    correct:[2],
    rationale:{ correct:"Early decelerations are caused by vagal response to fetal HEAD COMPRESSION during contractions. They are BENIGN, symmetric, mirror contractions exactly, and require NO intervention. KEY PEARL: Early = head compression = benign = no action needed. Compare: Late = placental insufficiency = dangerous = act immediately.",
      wrong:["Late decelerations begin AFTER the contraction peaks and are the dangerous pattern — early decelerations begin with and mirror contractions.","Cord compression causes VARIABLE decelerations — abrupt drops that vary in timing and shape relative to contractions.","Minimal variability refers to the baseline FHR amplitude — not the deceleration pattern described here."]}},

  { id:"q6", section:1, type:"mcq", difficulty:1,
    concept:{ num:4, name:"Fetal Heart Rate Patterns" },
    stem:"A nurse is monitoring a laboring patient and notices recurrent decelerations that begin AFTER the peak of each contraction and return to baseline slowly. Which action is the nurse's PRIORITY?",
    options:[
      "Document the finding and continue routine monitoring — this is expected during active labor",
      "Reposition the patient, apply oxygen, increase IV fluids, and notify the provider immediately",
      "Encourage the patient to push with the next contraction to expedite delivery",
      "Administer oxytocin to strengthen contractions and improve placental blood flow"
    ],
    correct:[1],
    rationale:{ correct:"Late decelerations = placental insufficiency. They begin AFTER the contraction peak, indicate the fetus is not getting adequate oxygen through the placenta, and are NEVER normal. Nursing priorities: Reposition (left lateral), O₂ via face mask, IV fluids, stop oxytocin if running, and NOTIFY the provider. NCLEX PEARL: Late decelerations = dangerous = act immediately.",
      wrong:["Late decelerations are NEVER a normal finding — documenting and continuing without intervention is inappropriate and dangerous.","Pushing increases intrauterine pressure, worsening placental perfusion — never encourage pushing with late decelerations.","Oxytocin INCREASES contractions, further reducing placental blood flow — stop oxytocin if running; never add more."]}},

  { id:"q7", section:1, type:"mcq", difficulty:1,
    concept:{ num:9, name:"Fundal Height & GTPAL" },
    stem:"A nurse is performing fundal height assessments on three patients. Which finding correctly corresponds to gestational age based on standard fundal height landmarks?",
    options:[
      "At 12 weeks, fundal height is palpable at the umbilicus",
      "At 20 weeks, fundal height is approximately at the umbilicus; at 36 weeks, it reaches the xiphoid process",
      "At 28 weeks, the fundal height is at the umbilicus and does not change until term",
      "Fundal height rises above the xiphoid process by 32 weeks, then remains at the same level"
    ],
    correct:[1],
    rationale:{ correct:"Standard fundal height landmarks: 12 weeks = just above pubic symphysis; 20 weeks = at the umbilicus (and fundal height in cm ≈ gestational age in weeks); 36 weeks = at the xiphoid process. Lightening (fetal descent into the pelvis) drops the fundus before labor. NCLEX CLUE: 20 weeks at umbilicus is the most-tested landmark.",
      wrong:["At 12 weeks, the uterus is just above the pubic symphysis — NOT at the umbilicus. The umbilicus is the 20-week landmark.","Fundal height continues to rise from 20 to 36 weeks — it does not plateau at the umbilicus.","The fundus reaches the xiphoid at 36 weeks, then DROPS (lightening) as the fetal head descends before labor — it does not stay above the xiphoid."]}},

  { id:"q8", section:1, type:"sata", difficulty:1,
    concept:{ num:8, name:"Vaccines in Pregnancy" },
    stem:"A nurse is reviewing vaccine safety with a group of pregnant patients. Select ALL vaccines that are considered safe and recommended during pregnancy.",
    options:[
      "Tdap (27–36 weeks)",
      "Influenza — injectable (inactivated)",
      "MMR (measles, mumps, rubella)",
      "COVID-19 vaccine",
      "Varicella (chickenpox)",
      "RSV vaccine (32–36 weeks in season)"
    ],
    correct:[0,1,3,5],
    rationale:{ correct:"Safe/recommended in pregnancy: Tdap (27–36 weeks to protect newborn against pertussis), Influenza injectable/inactivated (live FluMist is NOT safe), COVID-19, and RSV (32–36 weeks seasonally). Hepatitis B is also safe if indicated.",
      wrong:["MMR is a LIVE vaccine — contraindicated in pregnancy due to theoretical fetal risk. Administer postpartum.","Varicella is a LIVE vaccine — contraindicated in pregnancy. Administer postpartum.","NCLEX TRAP: Live vaccines (MMR, Varicella, FluMist, Zoster, Oral Typhoid) are NEVER given during pregnancy."]}},

  { id:"q9", section:1, type:"mcq", difficulty:1,
    concept:{ num:10, name:"Kick Counts & Fetal Well-being" },
    stem:"A nurse is teaching a patient at 30 weeks gestation how to perform daily kick counts. Which instruction is most accurate?",
    options:[
      "Count fetal movements after each meal; report to the provider if you feel fewer than 5 movements per hour",
      "After 28 weeks, count fetal movements daily. The fetus should move at least 10 times in 2 hours. Call the provider if fewer movements are felt.",
      "Fetal movement is most active in the morning — always count before breakfast for best accuracy",
      "Kick counts are only necessary in the third trimester if there are risk factors like gestational diabetes or preeclampsia"
    ],
    correct:[1],
    rationale:{ correct:"Kick count guidelines: Begin after 28 weeks; count daily; the fetus should produce at least 10 movements in 2 hours. If fewer than 10 movements in 2 hours, call the provider. Decreased fetal movement can be an early sign of fetal distress and requires immediate evaluation.",
      wrong:["The standard guideline is 10 movements in 2 hours — not 5 per hour. The timing is across 2 hours, not within a single hour.","Fetal movement is typically most active AFTER meals and in the evening when the mother is at rest — not necessarily before breakfast.","Kick counts are universally recommended for ALL patients after 28 weeks — not only high-risk pregnancies."]}},

  { id:"q10", section:1, type:"mcq", difficulty:1,
    concept:{ num:11, name:"Labs in Pregnancy" },
    stem:"A student nurse asks about which lab finding is considered NORMAL during pregnancy. Which response by the charge nurse is most accurate?",
    options:[
      "Proteinuria of 1+ on dipstick is a normal finding in any trimester — document and monitor",
      "WBC of 12,000/mm³ is highly abnormal in pregnancy and suggests active infection requiring immediate evaluation",
      "Mild dilutional anemia and WBC up to 16,000/mm³ are normal adaptations; trace glucosuria may occur without indicating diabetes",
      "Elevated uric acid and creatinine are expected changes from increased renal blood flow"
    ],
    correct:[2],
    rationale:{ correct:"Normal pregnancy labs: WBC 5,000–16,000/mm³ (mild leukocytosis is normal); Hgb/Hct ↓ (dilutional anemia due to plasma volume expansion); Platelets 150,000–400,000; Glucose — trace ↑ after meals is OK (↑GFR exceeds reabsorption threshold); BUN/Creatinine ↓ (increased GFR); Coagulation → hypercoagulable (↑fibrinogen). NCLEX TRAP: Proteinuria is NEVER normal in pregnancy — it is always a red flag.",
      wrong:["Proteinuria of 1+ (or more than trace) is NEVER normal in pregnancy — it is a key indicator of preeclampsia and requires immediate evaluation.","WBC up to 16,000/mm³ can be normal in pregnancy due to physiologic immune adaptation — it does not automatically indicate infection.","BUN and creatinine DECREASE in pregnancy due to increased GFR; uric acid also decreases. Elevated values are red flags for preeclampsia or renal disease."]}},

  // ══════════════ SECTION 2 — NCLEX APPLICATION ══════════════

  { id:"q11", section:2, type:"mcq", difficulty:2,
    concept:{ num:6, name:"Placental Abruption" },
    stem:"A nurse is triaging two laboring patients. Patient A reports sudden, severe abdominal pain with a rigid, board-like uterus and dark red vaginal bleeding. Patient B reports painless, bright red vaginal bleeding with no contractions. Which statement BEST distinguishes these two patients?",
    options:[
      "Both patients have placenta previa — the color difference is not clinically significant",
      "Patient A has signs of placental abruption (painful, dark bleeding, rigid uterus); Patient B has signs of placenta previa (painless, bright red bleeding)",
      "Patient B's bleeding is more dangerous because bright red blood indicates arterial hemorrhage",
      "Patient A's rigid uterus indicates normal early labor — it does not require immediate intervention"
    ],
    correct:[1],
    rationale:{ correct:"NCLEX PEARL to memorize: Abruption = Painful dark bleeding + rigid uterus (premature separation of placenta). Previa = Painless bright red bleeding (placenta over cervical os, disrupted by cervical changes). Both are emergencies — notify provider immediately for both. But the presentations are completely different and the NCLEX will test this distinction.",
      wrong:["These are two different obstetric emergencies — placental abruption and placenta previa. The color and pain characteristics are clinically critical distinguishing features.","Bright red blood in placenta previa comes from the disrupted placental tissue, not arterial hemorrhage in the arterial sense — both are serious emergencies regardless of blood color.","A rigid, board-like uterus is NEVER normal in labor — it indicates concealed hemorrhage with placental abruption and requires immediate notification."]}},

  { id:"q12", section:2, type:"mcq", difficulty:2,
    concept:{ num:5, name:"Placenta Previa" },
    stem:"A patient at 32 weeks gestation presents with sudden onset painless bright red vaginal bleeding. The nurse suspects placenta previa. Which nursing action is the PRIORITY?",
    options:[
      "Perform a vaginal examination to assess cervical dilation and determine if labor has begun",
      "Administer oxytocin to prepare the cervix and facilitate safe delivery",
      "Do NOT perform a vaginal examination — notify the provider immediately and monitor maternal and fetal status",
      "Prepare the patient for amniotomy to reduce intrauterine pressure and slow the bleeding"
    ],
    correct:[2],
    rationale:{ correct:"NEVER perform a vaginal examination with suspected or confirmed placenta previa — the examining finger can rupture the placental tissue over the cervical os, causing massive, life-threatening hemorrhage. Nursing priorities: NO vaginal exam, notify provider, continuous fetal monitoring, IV access, type and screen/crossmatch, keep NPO. NCLEX TRAP: This is the #1 tested contraindication for placenta previa.",
      wrong:["Vaginal examination is ABSOLUTELY CONTRAINDICATED in placenta previa — it can cause catastrophic hemorrhage. This would be a serious nursing error.","Oxytocin causes uterine contractions — at 32 weeks with placenta previa, this could trigger massive hemorrhage and is contraindicated.","Amniotomy is also contraindicated — any instrumentation through the cervix in placenta previa risks rupturing the overlying placenta."]}},

  { id:"q13", section:2, type:"mcq", difficulty:2,
    concept:{ num:7, name:"Cord Prolapse & Uterine Rupture" },
    stem:"A nurse assesses a patient whose membranes just ruptured and finds the umbilical cord visible at the vaginal introitus. Which nursing action is the PRIORITY?",
    options:[
      "Push the cord gently back into the uterus and prepare the patient for continued labor monitoring",
      "Place the patient in knee-chest or Trendelenburg position and use two gloved fingers to lift the presenting part off the cord — do NOT push the cord back — call for help immediately",
      "Administer oxytocin to strengthen contractions and accelerate delivery before cord compression occurs",
      "Encourage the patient to push with the next contraction to facilitate rapid vaginal delivery"
    ],
    correct:[1],
    rationale:{ correct:"Cord prolapse = obstetric emergency. Priority: (1) Call for emergency help, (2) Knee-chest or Trendelenburg position to use gravity to shift the fetus off the cord, (3) Two gloved fingers inside vagina to manually lift/hold the presenting part OFF the cord — maintain this until delivery. DO NOT push the cord back (causes vasospasm). Emergency cesarean is usually required. NCLEX PEARL: Preserve cord circulation until delivery — every second matters.",
      wrong:["NEVER push the cord back — it causes vasospasm that completely cuts off fetal oxygen. This is a dangerous error.","Oxytocin increases uterine contractions, which increases pressure on the prolapsed cord, worsening fetal hypoxia — it is absolutely contraindicated here.","Encouraging pushing increases intrauterine pressure on the cord — this is dangerous. The priority is relieving cord compression, not facilitating vaginal delivery."]}},

  { id:"q14", section:2, type:"mcq", difficulty:2,
    concept:{ num:4, name:"Fetal Heart Rate Patterns" },
    stem:"A nurse notices variable decelerations on the fetal monitor — abrupt drops in FHR that vary in timing and depth relative to contractions. What is the priority nursing action?",
    options:[
      "Notify the provider immediately for emergency cesarean delivery",
      "Increase the oxytocin infusion rate to improve uteroplacental blood flow",
      "Reposition the patient (left lateral or hands-and-knees), apply oxygen, and increase IV fluids; notify the provider if pattern persists",
      "Variable decelerations are always benign — document and continue routine monitoring"
    ],
    correct:[2],
    rationale:{ correct:"Variable decelerations = cord compression. They are characterized by abrupt drops, V-shape or U-shape pattern, varying in timing relative to contractions. Initial nursing actions: REPOSITION (left lateral, hands-and-knees, or Trendelenburg to relieve cord pressure), apply O₂ at 8–10 L/min via face mask, increase IV fluids. Notify provider if variables are severe (drop >60 bpm, lasting >60 seconds) or persist. NCLEX CLUE: Variable = cord compression.",
      wrong:["Variable decelerations are concerning but not always an immediate cesarean indication — repositioning and oxygen are first-line interventions.","Oxytocin increases contractions, which can worsen cord compression — STOP oxytocin if running; never increase it for variable decelerations.","Variable decelerations can indicate cord compression and are NOT always benign — severe or persistent variables require intervention and provider notification."]}},

  { id:"q15", section:2, type:"mcq", difficulty:2,
    concept:{ num:12, name:"Preeclampsia Treatment" },
    stem:"A patient with severe preeclampsia is receiving IV magnesium sulfate for seizure prophylaxis. The nurse assesses respirations of 10 breaths/min, absent deep tendon reflexes, and decreased urine output. Which action is the nurse's PRIORITY?",
    options:[
      "Increase the magnesium infusion rate — the patient's seizure risk is still elevated",
      "Stop the magnesium infusion immediately and administer calcium gluconate — these findings indicate magnesium toxicity",
      "Administer a bolus of IV fluid to increase urine output and dilute the magnesium level",
      "These are expected side effects of magnesium — document and continue the infusion at the current rate"
    ],
    correct:[1],
    rationale:{ correct:"Magnesium TOXICITY signs: respiratory rate <12 breaths/min, absent deep tendon reflexes (especially patellar reflex), decreased urine output (<30 mL/hr), and decreased LOC. ANTIDOTE: Calcium gluconate IV. Stop the infusion immediately. Keep calcium gluconate at the bedside for ALL patients on magnesium sulfate. NCLEX PEARL: Mag toxicity → STOP mag → GIVE calcium gluconate.",
      wrong:["Increasing the infusion is dangerous — these findings indicate toxicity, not undertreated seizure risk.","Fluids alone will not reverse magnesium toxicity — calcium gluconate is the antidote and must be given immediately with infusion stopped.","Respiratory rate <12/min and absent reflexes are magnesium TOXICITY — these are never 'expected and acceptable' findings. This represents a medical emergency."]}},

  { id:"q16", section:2, type:"mcq", difficulty:2,
    concept:{ num:9, name:"Fundal Height & GTPAL" },
    stem:"A patient's chart records her obstetric history as G4 T2 P1 A1 L2. How should the nurse correctly interpret this GTPAL notation?",
    options:[
      "4 total pregnancies; 2 term births; 1 preterm birth; 1 abortion/loss; 2 living children",
      "4 term births; 2 preterm births; 1 abortion; 1 living child",
      "4 total pregnancies; all at term; 2 living children; 1 miscarriage",
      "Gravida 4 means she is currently 4 months pregnant; 2 previous term deliveries"
    ],
    correct:[0],
    rationale:{ correct:"GTPAL: G = Gravida (total pregnancies, including current); T = Term births (≥37 weeks); P = Preterm births (20–36+6 weeks); A = Abortions/losses (spontaneous or induced, <20 weeks); L = Living children. So G4 T2 P1 A1 L2 = 4 pregnancies total; 2 term births; 1 preterm birth; 1 abortion; 2 living children. NCLEX TIP: L (living children) can be LESS than T+P if a child died.",
      wrong:["The letters are G-T-P-A-L in order — not rearranged. G=Gravida (total pregnancies), not number of term births.","Each letter has a specific meaning — Gravida 4 means 4 total pregnancies ever (including the current one), not current months of pregnancy."]}},

  { id:"q17", section:2, type:"mcq", difficulty:2,
    concept:{ num:1, name:"RH Incompatibility & RhoGAM" },
    stem:"An Rh-negative patient at 14 weeks gestation has a positive indirect Coombs test. What is the most important nursing implication?",
    options:[
      "Administer RhoGAM immediately — positive Coombs means she needs it now",
      "Do NOT administer RhoGAM — a positive indirect Coombs indicates she is already sensitized; RhoGAM will not prevent further sensitization",
      "Repeat the test at 28 weeks gestation before making any clinical decisions",
      "Administer RhoGAM and schedule weekly fetal monitoring to detect antibody formation"
    ],
    correct:[1],
    rationale:{ correct:"NCLEX TRAP: Do NOT give RhoGAM if the mother is already sensitized (positive indirect Coombs = maternal anti-Rh antibodies already present). RhoGAM PREVENTS sensitization — it cannot reverse it once it has occurred. Instead, these patients require serial fetal surveillance (middle cerebral artery Doppler studies, possible intrauterine transfusion) to monitor for fetal hemolytic disease.",
      wrong:["Administering RhoGAM to an already-sensitized patient is pointless and a common NCLEX distractor — it will not prevent further antibody production or protect the fetus.","Repeating the test at 28 weeks will not change the clinical reality — she is already sensitized. Action is needed NOW, not deferred.","RhoGAM will not help an already-sensitized patient — fetal surveillance (not RhoGAM) is the appropriate intervention."]}},

  { id:"q18", section:2, type:"sata", difficulty:2,
    concept:{ num:13, name:"Report Immediately" },
    stem:"A nurse is working on a prenatal unit. Select ALL findings that require IMMEDIATE provider notification.",
    options:[
      "Vaginal bleeding at any gestational age",
      "Mild bilateral ankle edema at 36 weeks",
      "Leaking fluid from the vagina before term",
      "Fever and chills in a pregnant patient",
      "Mild heartburn after meals in the second trimester",
      "Severe swelling of the face and hands",
      "Dizziness or syncope episode"
    ],
    correct:[0,2,3,5,6],
    rationale:{ correct:"Report immediately: Vaginal bleeding (placenta previa, abruption, or other emergency); leaking fluid (premature rupture of membranes → infection/cord prolapse risk); fever/chills (chorioamnionitis or other infection); severe facial/hand swelling (preeclampsia sign); dizziness/syncope (possible hemodynamic compromise).",

// ─── UI ATOMS ─────────────────────────────────────────────────────────────────
function Tag({ children, color, bg, border }) {
  return <span style={{ fontSize:11, fontWeight:600, padding:"3px 11px", borderRadius:99, letterSpacing:0.6, textTransform:"uppercase", background:bg||"#f1f5f9", color:color||"#64748b", border:border?`1px solid ${border}`:"none", whiteSpace:"nowrap" }}>{children}</span>;
}
function Btn({ children, onClick, disabled, variant="primary" }) {
  const base = { border:"none", borderRadius:12, fontFamily:"'Inter',sans-serif", fontWeight:700, cursor:disabled?"default":"pointer", letterSpacing:0.3, padding:"13px 28px", fontSize:15 };
  const styles = {
    primary: { background:disabled?"#e2e8f0":"linear-gradient(135deg,#1e293b 0%,#0f172a 100%)", color:disabled?"#94a3b8":"#fff", boxShadow:disabled?"none":"0 2px 8px rgba(15,23,42,0.18)" },
    outline:  { background:"#f8fafc", color:"#475569", border:"1.5px solid #cbd5e1" }
  };
  return <button type="button" onClick={onClick} disabled={disabled} className={variant==="primary"?"btn-primary":"btn-outline"} style={{ ...base, ...styles[variant] }}>{children}</button>;
}
function OptionBtn({ letter, text, state, onClick }) {
  const base = { display:"flex", alignItems:"flex-start", gap:12, padding:"13px 16px", borderRadius:12, border:"2px solid #e2e8f0", background:"#fafbfc", cursor:"pointer", textAlign:"left", width:"100%", fontFamily:"'Inter',sans-serif", fontSize:15 };
  const ss = { selected:{ border:"2.5px solid #0ea5e9", background:"#f0f9ff", borderLeft:"4px solid #0ea5e9" }, correct:{ border:"2px solid #10b981", background:"#f0fdf4", borderLeft:"4px solid #10b981", cursor:"default" }, wrong:{ border:"2px solid #ef4444", background:"#fef2f2", borderLeft:"4px solid #ef4444", cursor:"default" }, dim:{ border:"2px solid #f1f5f9", background:"#fafbfc", opacity:0.42, cursor:"default" }, neutral:{} };
  const cs = { selected:{ background:"#0ea5e9", color:"#fff" }, correct:{ background:"#10b981", color:"#fff" }, wrong:{ background:"#ef4444", color:"#fff" }, dim:{ background:"#e2e8f0", color:"#94a3b8" }, neutral:{ background:"#e2e8f0", color:"#475569" } };
  const s = state||"neutral", c = cs[s]||cs.neutral;
  return (
    <button type="button" aria-pressed={s==="selected"} style={{ ...base, ...(ss[s]||{}) }} className={(!s||s==="neutral"||s==="selected")?"opt-btn":""} onClick={onClick}>
      <span style={{ minWidth:26, height:26, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, flexShrink:0, marginTop:1, transition:"all 0.18s ease", ...c }}>{letter}</span>
      <span style={{ flex:1, color:"#1e293b", lineHeight:1.6, fontWeight:400 }}>{text}</span>
      {s==="correct"&&<span style={{ width:22, height:22, borderRadius:"50%", background:"#10b981", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:12, fontWeight:700, flexShrink:0 }}>✓</span>}
      {s==="wrong"  &&<span style={{ width:22, height:22, borderRadius:"50%", background:"#ef4444", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:12, fontWeight:700, flexShrink:0 }}>✗</span>}
    </button>
  );
}

function MCQQuestion({ q, submitted, selected, onSelect }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
      {q.options.map((opt,idx) => {
        let s="neutral";
        if(submitted){ if(idx===q.correct[0]) s="correct"; else if((selected||[])[0]===idx) s="wrong"; else s="dim"; }
        else if((selected||[]).includes(idx)) s="selected";
        return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={s} onClick={()=>!submitted&&onSelect(idx)} />;
      })}
    </div>
  );
}
function SATAQuestion({ q, submitted, selected, onSelect }) {
  return (
    <div>
      <div style={{ fontSize:13, color:"#64748b", marginBottom:10, fontStyle:"italic", fontWeight:500 }}>Select all that apply — choose every correct option.</div>
      <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
        {q.options.map((opt,idx) => {
          let s="neutral";
          if(submitted){ if(q.correct.includes(idx)) s="correct"; else if((selected||[]).includes(idx)) s="wrong"; else s="dim"; }
          else if((selected||[]).includes(idx)) s="selected";
          return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={s} onClick={()=>!submitted&&onSelect(idx)} />;
        })}
      </div>
    </div>
  );
}
function BowTieQuestion({ q, submitted, btState, onBTSelect }) {
  const limit={left:2,center:1,right:2};
  function BtOpt({ label, isSelected, isCorrect, isWrong, isDim, onClick }) {
    let bg="#fafbfc",border="1.5px solid #e2e8f0",color="#1e293b";
    if(isDim){color="#cbd5e1";border="1.5px solid #f1f5f9";}
    if(isSelected){bg="#f0f9ff";border="2px solid #0ea5e9";}
    if(isCorrect){bg="#f0fdf4";border="2px solid #10b981";color="#065f46";}
    if(isWrong){bg="#fef2f2";border="2px solid #ef4444";color="#991b1b";}
    return <button type="button" aria-pressed={isSelected} onClick={onClick} className={!isCorrect&&!isWrong&&!isDim?"opt-btn":""} style={{ padding:"9px 11px", borderRadius:10, border, background:bg, color, fontSize:13, textAlign:"left", cursor:(submitted||!onClick)?"default":"pointer", fontFamily:"'Inter',sans-serif", lineHeight:1.45, width:"100%", transition:"all 0.18s ease" }}>{isCorrect&&<span style={{color:"#10b981",fontWeight:700}}>✓ </span>}{isWrong&&<span style={{color:"#ef4444",fontWeight:700}}>✗ </span>}{label}</button>;
  }
  function handle(key,idx){ if(submitted)return; const lim=limit[key],sel=btState[key]||[]; let next; if(sel.includes(idx))next=sel.filter(x=>x!==idx); else if(sel.length<lim)next=[...sel,idx]; else next=lim===1?[idx]:sel; onBTSelect(key,next); }
  function renderCol(opts,corr,key){ const sel=btState[key]||[],lim=limit[key]; return opts.map((opt,idx)=>{ const isSel=sel.includes(idx),isC=submitted&&corr.includes(idx),isW=submitted&&isSel&&!corr.includes(idx),isDm=submitted&&!isC&&!isSel,isDis=!submitted&&!isSel&&sel.length>=lim; return <BtOpt key={idx} label={opt} isSelected={!submitted&&isSel} isCorrect={isC} isWrong={isW} isDim={isDm||isDis} onClick={isDis?null:()=>handle(key,idx)} />; }); }
  function Pill({cur,tot}){ return <span style={{ display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:700,background:cur===tot?"#d1fae5":"#f1f5f9",color:cur===tot?"#065f46":"#64748b",marginBottom:6,transition:"all 0.2s" }}>{cur}/{tot}</span>; }
  const col={display:"flex",flexDirection:"column",gap:6,flex:1,minWidth:150};
  return (
    <div>
      {!submitted&&<div style={{ fontSize:13,color:"#0c4a6e",marginBottom:14,fontWeight:500,background:"#f0f9ff",padding:"10px 14px",borderRadius:10,border:"1px solid #bae6fd",display:"flex",alignItems:"flex-start",gap:8 }}><span style={{fontSize:16}}>🎯</span><span><strong>Bow-Tie:</strong> Select <strong>2 actions</strong> → <strong>1 condition</strong> → <strong>2 parameters</strong></span></div>}
      <div className="bowtie-grid" style={{ display:"flex",gap:8,marginBottom:20,alignItems:"flex-start" }}>
        <div className="bowtie-column" style={col}><div style={{ fontSize:10,fontWeight:700,color:"#10b981",letterSpacing:0.8,textTransform:"uppercase",marginBottom:2 }}>⚕️ {q.leftLabel}</div><Pill cur={(btState.left||[]).length} tot={2} />{renderCol(q.leftOptions,q.correctLeft,"left")}</div>
        <div className="bowtie-arrow" aria-hidden="true" style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0,paddingTop:44 }}><div style={{ fontSize:22,color:"#0ea5e9",fontWeight:700 }}>→</div></div>
        <div className="bowtie-column" style={{ ...col,maxWidth:185 }}><div style={{ fontSize:10,fontWeight:700,color:"#8b5cf6",letterSpacing:0.8,textTransform:"uppercase",marginBottom:2 }}>🔍 {q.centerLabel}</div><Pill cur={(btState.center||[]).length} tot={1} />{renderCol(q.centerOptions,q.correctCenter,"center")}</div>
        <div className="bowtie-arrow" aria-hidden="true" style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0,paddingTop:44 }}><div style={{ fontSize:22,color:"#0ea5e9",fontWeight:700 }}>→</div></div>
        <div className="bowtie-column" style={col}><div style={{ fontSize:10,fontWeight:700,color:"#f59e0b",letterSpacing:0.8,textTransform:"uppercase",marginBottom:2 }}>🎯 {q.rightLabel}</div><Pill cur={(btState.right||[]).length} tot={2} />{renderCol(q.rightOptions,q.correctRight,"right")}</div>
      </div>
    </div>
  );
}
function CaseStudyQuestion({ q, submitted, csAnswers, onCSAnswer }) {
  return (
    <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
      {q.questions.map((sub,si) => {
        const sel=csAnswers[sub.qid]||[];
        return (
          <div key={sub.qid} style={{ background:"#fafbfc",borderRadius:12,padding:"16px 18px",border:"1px solid #e8ecf2" }}>
            <div style={{ display:"flex",alignItems:"center",gap:10,marginBottom:10 }}>
              <span style={{ width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#1e293b,#0f172a)",color:"#fff",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>{si+1}</span>
              <span style={{ fontSize:11,fontWeight:600,color:"#64748b",letterSpacing:0.4 }}>of {q.questions.length}</span>
            </div>
            <h2 style={{ fontFamily:"'Inter',sans-serif",fontSize:15,lineHeight:1.65,color:"#0f172a",marginBottom:12,fontWeight:600 }}>{sub.stem}</h2>
            {sub.type==="sata"&&<div style={{ fontSize:12,color:"#94a3b8",marginBottom:8,fontStyle:"italic" }}>Select all that apply</div>}
            <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
              {sub.options.map((opt,idx) => {
                let s="neutral";
                if(submitted){ if(sub.correct.includes(idx)) s="correct"; else if(sel.includes(idx)) s="wrong"; else s="dim"; }
                else if(sel.includes(idx)) s="selected";
                return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={s} onClick={()=>{ if(submitted)return; if(sub.type==="mcq") onCSAnswer(sub.qid,[idx]); else { const c=csAnswers[sub.qid]||[]; onCSAnswer(sub.qid,c.includes(idx)?c.filter(x=>x!==idx):[...c,idx]); }}} />;
              })}
            </div>
            {submitted&&<div role="status" aria-live="polite" style={{ marginTop:12,padding:"12px 14px",background:"#fff",borderRadius:8,borderLeft:"3px solid #0ea5e9",border:"1px solid #e2e8f0",borderLeftWidth:3,fontSize:13,color:"#374151",lineHeight:1.65 }}><strong style={{color:"#0369a1"}}>Rationale:</strong> {sub.rationale}</div>}
          </div>
        );
      })}
    </div>
  );
}

function RationalePanel({ q, isCorrect }) {
  if(q.type==="casestudy") return null;
  function extractPearl(text) {
    if(!text) return { body:text, pearl:null };
    const m=text.match(/((?:KEY PEARL|NCLEX PEARL|PEARL|NCLEX CLUE|NCLEX TRAP|Memory trick)[:\s—–-]+.+?)(?:\.|$)/i);
    if(!m) return { body:text, pearl:null };
    return { body:text.replace(m[0],"").replace(/\s+/," ").trim(), pearl:m[0] };
  }
  const sc=isCorrect?"#10b981":"#ef4444", sb=isCorrect?"#f0fdf4":"#fef2f2", sbr=isCorrect?"#86efac":"#fca5a5";
  return (
    <div role="status" aria-live="polite" style={{ marginBottom:20, display:"flex", flexDirection:"column", gap:10 }}>
      <div style={{ display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderRadius:12,background:sb,border:`1.5px solid ${sbr}` }}>
        <span style={{ width:28,height:28,borderRadius:"50%",background:sc,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:700,flexShrink:0 }}>{isCorrect?"✓":"✗"}</span>
        <span style={{ fontWeight:700,fontSize:15,color:isCorrect?"#166534":"#991b1b" }}>{isCorrect?"Correct!":"Review This Concept"}</span>
      </div>
      {q.type==="bowtie"&&(
        <div className="rationale-grid" style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
          {[{label:"Condition",icon:"🔍",text:q.rationale.condition,accent:"#8b5cf6"},{label:"Actions",icon:"⚕️",text:q.rationale.actions,accent:"#10b981"},{label:"Monitoring",icon:"🎯",text:q.rationale.outcomes,accent:"#f59e0b"},{label:"Distractors",icon:"⚠️",text:q.rationale.wrong,accent:"#ef4444"}].map(({label,icon,text,accent})=>(
            <div key={label} style={{ background:"#fff",borderRadius:10,padding:"12px 14px",border:`1px solid #e8ecf2`,borderLeftWidth:4,borderLeftColor:accent,borderLeft:`4px solid ${accent}` }}>
              <div style={{ fontSize:10,fontWeight:700,color:accent,letterSpacing:0.8,textTransform:"uppercase",marginBottom:6 }}>{icon} {label}</div>
              <div style={{ fontSize:13,color:"#374151",lineHeight:1.6 }}>{text}</div>
            </div>
          ))}
        </div>
      )}
      {q.type!=="bowtie"&&(()=>{
        const {body,pearl}=extractPearl(q.rationale.correct);
        return (<>
          <div style={{ background:"#fff",borderRadius:10,padding:"14px 16px",border:"1px solid #e8ecf2",borderLeft:"4px solid #10b981" }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#10b981",letterSpacing:0.8,textTransform:"uppercase",marginBottom:8 }}>✓ Why Correct</div>
            <div style={{ fontSize:13,color:"#374151",lineHeight:1.65 }}>{body||q.rationale.correct}</div>
          </div>
          {pearl&&<div style={{ background:"#fffbeb",borderRadius:10,padding:"12px 14px",border:"1.5px solid #f59e0b",display:"flex",gap:10,alignItems:"flex-start" }}><span style={{fontSize:16,flexShrink:0}}>⭐</span><div style={{ fontSize:13,color:"#78350f",lineHeight:1.6,fontWeight:500 }}>{pearl}</div></div>}
          {q.rationale.wrong&&(
            <div style={{ background:"#fff",borderRadius:10,padding:"14px 16px",border:"1px solid #e8ecf2",borderLeft:"4px solid #f59e0b" }}>
              <div style={{ fontSize:10,fontWeight:700,color:"#92400e",letterSpacing:0.8,textTransform:"uppercase",marginBottom:10 }}>⚠️ Common Distractors</div>
              <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
                {Array.isArray(q.rationale.wrong)?q.rationale.wrong.map((w,i)=><div key={i} style={{ padding:"8px 12px",background:"#fffbeb",borderRadius:8,fontSize:12,color:"#78350f",lineHeight:1.6 }}><span style={{fontWeight:700,color:"#ef4444",marginRight:6}}>✗</span>{w}</div>):<div style={{ padding:"8px 12px",background:"#fffbeb",borderRadius:8,fontSize:12,color:"#78350f",lineHeight:1.6 }}><span style={{fontWeight:700,color:"#ef4444",marginRight:6}}>✗</span>{q.rationale.wrong}</div>}
              </div>
            </div>
          )}
        </>);
      })()}
    </div>
  );
}

function QuizScreen({ onFinish }) {
  const [currentIdx,setCurrentIdx]=useState(0);
  const [history,setHistory]=useState([]);
  const [submitted,setSubmitted]=useState(false);
  const [showIntro,setShowIntro]=useState(true);
  const [selected,setSelected]=useState([]);
  const [btState,setBtState]=useState({left:[],center:[],right:[]});
  const [csAnswers,setCsAnswers]=useState({});
  const q=QUESTIONS[currentIdx];
  if(!q){ onFinish(history); return null; }
  if(showIntro) return <SectionIntroScreen sectionNum={q.section} onContinue={()=>setShowIntro(false)} />;
  function isComplete(){
    if(q.type==="mcq") return selected.length===1;
    if(q.type==="sata") return selected.length>0;
    if(q.type==="bowtie") return (btState.left||[]).length===2&&(btState.center||[]).length===1&&(btState.right||[]).length===2;
    if(q.type==="casestudy") return q.questions.every(sq=>(csAnswers[sq.qid]||[]).length>0);
    return false;
  }
  function calcCorrect(){
    if(q.type==="mcq") return selected[0]===q.correct[0];
    if(q.type==="sata") return [...selected].sort().join(",")===q.correct.slice().sort().join(",");
    if(q.type==="bowtie") return [...(btState.left||[])].sort().join(",")===q.correctLeft.slice().sort().join(",")&&(btState.center||[])[0]===q.correctCenter[0]&&[...(btState.right||[])].sort().join(",")===q.correctRight.slice().sort().join(",");
    if(q.type==="casestudy") return q.questions.every(sq=>[...(csAnswers[sq.qid]||[])].sort().join(",")===sq.correct.slice().sort().join(","));
    return false;
  }
  function handleNext(){
    const isCorrect=calcCorrect();
    const newHistory=[...history,{id:q.id,correct:isCorrect,concept:q.concept,section:q.section}];
    const nextIdx=currentIdx+1;
    if(nextIdx>=QUESTIONS.length){ onFinish(newHistory); return; }
    const nextQ=QUESTIONS[nextIdx];
    setHistory(newHistory); setCurrentIdx(nextIdx); setSelected([]); setBtState({left:[],center:[],right:[]}); setCsAnswers({}); setSubmitted(false);
    if(nextQ.section!==q.section) setShowIntro(true);
  }
  const sec=SECTIONS[q.section];
  const qInSec=QUESTIONS.filter(x=>x.section===q.section);
  const qNumInSec=qInSec.findIndex(x=>x.id===q.id)+1;
  const isCorrect=submitted?calcCorrect():null;
  const DIFF={1:"Foundational",2:"Applying",3:"Analyzing"};
  const DC={1:{bg:"#d1fae5",text:"#065f46"},2:{bg:"#fef3c7",text:"#92400e"},3:{bg:"#fee2e2",text:"#991b1b"}};
  const TYPE={mcq:"MCQ",sata:"SATA",bowtie:"NGN · Bow-Tie",casestudy:"NGN · Case Study"};
  const dc=DC[q.difficulty]; const isNGN=q.type==="bowtie"||q.type==="casestudy";
  return (
    <main aria-label="Module 2 practice question" style={{ minHeight:"100vh",background:"#f0f2f8",fontFamily:"'Inter',sans-serif" }}>
      <header style={{ background:"#fff",borderBottom:"1px solid #e8ecf2",padding:"0 24px",height:60,display:"flex",alignItems:"center",gap:16,boxShadow:"0 1px 4px rgba(15,23,42,0.06)" }}>
        <span style={{ padding:"4px 12px",borderRadius:99,fontSize:11,fontWeight:700,background:sec.light,border:`1px solid ${sec.border}`,color:sec.color,whiteSpace:"nowrap" }}>{sec.label}</span>
        <div role="progressbar" aria-valuemin={1} aria-valuemax={QUESTIONS.length} aria-valuenow={currentIdx+1} aria-label={`Question ${currentIdx+1} of ${QUESTIONS.length}`} style={{ flex:1,background:"#e8ecf2",borderRadius:99,height:8 }}>
          <div style={{ width:`${((currentIdx+1)/QUESTIONS.length)*100}%`,background:`linear-gradient(90deg,${sec.color},${sec.color}bb)`,borderRadius:99,height:8,transition:"width 0.4s ease" }} />
        </div>
        <div style={{ whiteSpace:"nowrap",fontSize:13,fontWeight:600 }}><span style={{color:"#0f172a"}}>Q{currentIdx+1}</span><span style={{color:"#94a3b8"}}> / {QUESTIONS.length}</span></div>
      </header>
      <div style={{ maxWidth:800,margin:"0 auto",padding:"24px 16px" }}>
        <div className="fade-up" style={{ background:"#fff",borderRadius:20,overflow:"hidden",boxShadow:"0 2px 16px rgba(15,23,42,0.08)" }}>
          <div style={{ height:5,background:`linear-gradient(90deg,${sec.color},${sec.color}99)` }} />
          <div className="quiz-card-body" style={{ padding:"28px 32px" }}>
            <div style={{ display:"inline-flex",alignItems:"center",gap:8,borderLeft:`4px solid ${sec.color}`,background:sec.light,borderRadius:"0 8px 8px 0",padding:"9px 14px",marginBottom:18 }}>
              <span style={{ width:8,height:8,borderRadius:"50%",background:sec.color,flexShrink:0 }}/>
              <div>
                <div style={{ fontSize:10,fontWeight:700,color:sec.color,letterSpacing:1.2,textTransform:"uppercase" }}>Concept #{q.concept.num}</div>
                <div style={{ fontSize:13,fontWeight:600,color:"#0f172a" }}>{q.concept.name}</div>
              </div>
            </div>
            <div style={{ display:"flex",flexWrap:"wrap",gap:8,marginBottom:18 }}>
              <Tag bg={dc.bg} color={dc.text}>{DIFF[q.difficulty]}</Tag>
              <Tag bg={isNGN?"#eef2ff":"#f1f5f9"} color={isNGN?"#6366f1":"#64748b"} border={isNGN?"#c7d2fe":undefined}>{isNGN&&<span style={{marginRight:4}}>⚡</span>}{TYPE[q.type]}</Tag>
              <Tag bg={sec.light} color={sec.color} border={sec.border}>{sec.label} · Q{qNumInSec} of {qInSec.length}</Tag>
            </div>
            {q.caseIntro&&<div style={{ borderLeft:"4px solid #0ea5e9",background:"#f0f9ff",borderRadius:"0 10px 10px 0",padding:"14px 16px",marginBottom:18 }}><div style={{ fontSize:10,fontWeight:700,color:"#0369a1",letterSpacing:1,textTransform:"uppercase",marginBottom:6 }}>Clinical Scenario</div><div style={{ fontSize:14,lineHeight:1.7,color:"#0c4a6e",fontWeight:400 }}>{q.caseIntro}</div></div>}
            <h1 style={{ fontSize:16,lineHeight:1.7,color:"#0f172a",marginBottom:20,fontWeight:600 }}>{q.stem||q.concept.name}</h1>
            {q.type==="mcq"       &&<MCQQuestion       q={q} submitted={submitted} selected={selected} onSelect={idx=>!submitted&&setSelected([idx])} />}
            {q.type==="sata"      &&<SATAQuestion      q={q} submitted={submitted} selected={selected} onSelect={idx=>!submitted&&setSelected(s=>s.includes(idx)?s.filter(x=>x!==idx):[...s,idx])} />}
            {q.type==="bowtie"    &&<BowTieQuestion    q={q} submitted={submitted} btState={btState} onBTSelect={(key,val)=>setBtState(s=>({...s,[key]:val}))} />}
            {q.type==="casestudy"&&<CaseStudyQuestion  q={q} submitted={submitted} csAnswers={csAnswers} onCSAnswer={(qid,val)=>setCsAnswers(s=>({...s,[qid]:val}))} />}
            {submitted&&<RationalePanel q={q} isCorrect={isCorrect} />}
            <div style={{ display:"flex",justifyContent:"flex-end",gap:12 }}>
              {!submitted?<Btn onClick={()=>setSubmitted(true)} disabled={!isComplete()}>Submit Answer</Btn>:<Btn onClick={handleNext}>{currentIdx+1>=QUESTIONS.length?"View Results →":(QUESTIONS[currentIdx+1]?.section!==q.section?`Continue to ${SECTIONS[QUESTIONS[currentIdx+1].section].label} →`:"Next Question →")}</Btn>}
            </div>
          </div>
        </div>
      </div>
    </main>
  );
}

function App() {
  const autoStart=new URLSearchParams(window.location.search).get('start')==='1';
  const [screen,setScreen]=useState(autoStart?"quiz":"welcome");
  const [history,setHistory]=useState([]);
  if(screen==="welcome") return <WelcomeScreen onStart={()=>setScreen("quiz")} />;
  if(screen==="quiz")    return <QuizScreen onFinish={h=>{ setHistory(h); setScreen("results"); }} />;
  if(screen==="results") return <ResultsScreen history={history} onRestart={()=>{ setHistory([]); setScreen("welcome"); }} />;
}
ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
