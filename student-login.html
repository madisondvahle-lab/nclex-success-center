<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Sign In | NCLEX Success Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#f0f2f8;color:#0f172a}.card{width:min(380px,calc(100% - 40px));background:#fff;border-radius:20px;padding:32px;box-shadow:0 18px 48px #0f172a22}h1{margin:0 0 8px;font-size:24px}p{color:#64748b;line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;font:inherit}input{margin:8px 0;border:1px solid #cbd5e1}button{margin-top:12px;border:0;background:#0d9488;color:#fff;font-weight:700;cursor:pointer}.error{min-height:20px;color:#dc2626;font-size:14px;margin-top:10px}</style></head><body><main class="card"><h1>Student sign in</h1><p>Use the email and password provided by Study with Madison, RN.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="submit">Sign in</button><div class="error" id="error"></div></main><script>const db=supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');const requestedNext=new URLSearchParams(location.search).get('next');document.getElementById('submit').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{data,error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('error').textContent='Unable to sign in. Check your email and password.';return}const{data:student}=await db.from('students').select('name').eq('auth_user_id',data.user.id).maybeSingle();const destinations={'Alyssa Dababneh':'alyssa-hub.html','Ahmed Bule':'ahmed-hub.html','Courtney Stewart':'courtney-hub.html','Kyle Batacan':'kyle-hub.html'};location.replace(requestedNext||destinations[student?.name]||'home.html')};</script></body></html>
