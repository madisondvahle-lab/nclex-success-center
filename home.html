<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCLEX Success Center · Study with Madison, RN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 75% 20%, rgba(14,165,233,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 80%, rgba(139,92,246,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 110%, rgba(16,185,129,0.07) 0%, transparent 50%);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUpSlow {
      0%   { opacity: 0; transform: translateY(20px); }
      35%  { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 48px 44px 44px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 32px 80px rgba(0,0,0,0.50);
      animation: fadeUp 0.42s cubic-bezier(0.22,1,0.36,1) both;
      position: relative;
      z-index: 1;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(14,165,233,0.08);
      border: 1px solid rgba(14,165,233,0.22);
      font-size: 10px;
      font-weight: 700;
      color: #0ea5e9;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .logo-title {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 400;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .divider-line { flex: 1; height: 1px; background: #e8ecf2; }
    .divider-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Student cards */
    .student-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      animation: fadeUpSlow 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }

    .student-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 18px;
      border-radius: 16px;
      border: 2px solid #e8ecf2;
      background: #fafbfc;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      text-align: left;
    }
    .student-btn:hover {
      border-color: #0ea5e9;
      background: #f0f9ff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14,165,233,0.14);
    }
    .student-btn:active { transform: translateY(0); }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .student-info { flex: 1; min-width: 0; }
    .student-name {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 3px;
    }
    .student-sub {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .arrow {
      font-size: 18px;
      color: #cbd5e1;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }
    .student-btn:hover .arrow {
      color: #0ea5e9;
      transform: translateX(3px);
    }

    /* Browse all */
    .browse-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: 14px;
      border: 1.5px dashed #cbd5e1;
      background: transparent;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      font-family: 'Inter', sans-serif;
    }
    .browse-link:hover {
      border-color: #94a3b8;
      color: #374151;
      background: #f8fafc;
    }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      font-weight: 400;
      position: relative;
      z-index: 1;
      animation: fadeUpSlow 0.65s cubic-bezier(0.22,1,0.36,1) both;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
    }
  </style>
</head>

  </div>

</body>
</html>
