<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Bank Manager · Study with Madison, RN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f2f8; color: #1e293b; min-height: 100vh; }

    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      padding: 32px 28px 28px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .header-title { font-size: 22px; font-weight: 800; color: #fff; }
    .header-sub { font-size: 13px; color: #64748b; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 14px; text-align: center; }
    .stat-num { font-size: 18px; font-weight: 800; color: #fff; display: block; }
    .stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .stat.flagged .stat-num { color: #fbbf24; }
    .stat.removed .stat-num { color: #ef4444; }

    .filters {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 14px 28px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .filter-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; }
    select, input[type="text"] {
      padding: 7px 12px; border: 1.5px solid #e2e8f0; border-radius: 9px;
      font-family: 'Inter', sans-serif; font-size: 13px; color: #1e293b; background: #f8fafc;
      outline: none; transition: border 0.15s;
    }
    select:focus, input[type="text"]:focus { border-color: #0ea5e9; }
    input[type="text"] { min-width: 220px; }
    .filter-sep { width: 1px; height: 28px; background: #e2e8f0; }
    .btn-export { padding: 7px 14px; border-radius: 9px; border: none; background: #0f172a; color: #fff; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-export:hover { background: #1e3a5f; }

    .main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

    .module-section { margin-bottom: 32px; }
    .module-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      padding: 12px 16px; border-radius: 12px;
    }
    .module-header h2 { font-size: 15px; font-weight: 800; color: #fff; }
    .module-header span { font-size: 12px; color: rgba(255,255,255,0.65); }

    .q-card {
      background: #fff; border-radius: 14px; border: 1.5px solid #e2e8f0;
      margin-bottom: 10px; overflow: hidden; transition: border-color 0.15s;
      box-shadow: 0 1px 6px rgba(15,23,42,0.05);
    }
    .q-card.flagged { border-color: #fbbf24; background: #fffdf0; }
    .q-card.removed { border-color: #fca5a5; background: #fff5f5; opacity: 0.7; }
    .q-card.hidden { display: none; }

    .q-header {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      cursor: pointer; user-select: none;
    }
    .q-header:hover { background: #f8fafc; }
    .q-card.flagged .q-header:hover { background: #fffbeb; }

    .q-num { font-size: 11px; font-weight: 800; color: #94a3b8; flex-shrink: 0; min-width: 32px; padding-top: 1px; }
    .q-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
    .q-tag { display: inline-flex; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; }
    .tag-mcq    { background: #e0f2fe; color: #0369a1; }
    .tag-sata   { background: #ede9fe; color: #5b21b6; }
    .tag-bowtie { background: #fef3c7; color: #92400e; }
    .tag-case   { background: #d1fae5; color: #065f46; }
    .tag-d1 { background: #f1f5f9; color: #475569; }
    .tag-d2 { background: #fef3c7; color: #92400e; }
    .tag-d3 { background: #fee2e2; color: #991b1b; }
    .tag-concept { background: #f1f5f9; color: #475569; }
    .q-stem { font-size: 13px; color: #1e293b; line-height: 1.55; flex: 1; }
    .q-stem.removed-text { text-decoration: line-through; color: #94a3b8; }

    .q-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; padding-top: 2px; }
    .btn-flag, .btn-remove, .btn-restore {
      padding: 5px 10px; border-radius: 8px; border: none; font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn-flag   { background: #fef9c3; color: #92400e; border: 1px solid #fde047; }
    .btn-flag:hover   { background: #fef08a; }
    .btn-flag.active  { background: #f59e0b; color: #fff; border-color: #f59e0b; }
    .btn-remove { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .btn-remove:hover { background: #fecaca; }
    .btn-restore { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .btn-restore:hover { background: #a7f3d0; }
    .btn-expand { background: none; border: none; font-size: 16px; color: #94a3b8; cursor: pointer; padding: 2px 4px; }

    .flag-reason-wrap { display: flex; align-items: center; gap: 5px; }
    .flag-reason-select {
      padding: 5px 8px; border-radius: 8px; border: 1.5px solid #fde047;
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
      color: #92400e; background: #fefce8; outline: none; cursor: pointer;
    }
    .flag-reason-select:focus { border-color: #f59e0b; }
    .tag-reason-session  { background: #dbeafe; color: #1e40af; }
    .tag-reason-clarify  { background: #fce7f3; color: #9d174d; }
    .tag-reason-drill    { background: #d1fae5; color: #065f46; }
    .tag-reason-discuss  { background: #ede9fe; color: #5b21b6; }

    .q-body { padding: 0 16px 14px 60px; display: none; }
    .q-body.open { display: block; }

    .q-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; margin: 10px 0 5px; }
    .options-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .option-item { display: flex; gap: 8px; font-size: 12px; color: #475569; line-height: 1.45; padding: 5px 8px; border-radius: 6px; }
    .option-item.correct { background: #f0fdf4; color: #065f46; font-weight: 600; }
    .option-item.correct::before { content: "✓"; color: #10b981; font-weight: 800; flex-shrink: 0; }
    .option-item:not(.correct)::before { content: ""; width: 12px; flex-shrink: 0; }
    .rationale-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #475569; line-height: 1.6; }
    .rationale-box strong { color: #0f172a; }

    .notes-area {
      margin-top: 10px;
    }
    .notes-area textarea {
      width: 100%; padding: 8px 10px; border: 1.5px solid #e2e8f0; border-radius: 9px;
      font-family: 'Inter', sans-serif; font-size: 12px; color: #334155; resize: vertical;
      min-height: 56px; outline: none; background: #fafbfc;
    }
    .notes-area textarea:focus { border-color: #0ea5e9; }
    .notes-area textarea::placeholder { color: #94a3b8; }

    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px; }

    @media (max-width: 600px) {
      .filters { padding: 12px 16px; }
      .q-body { padding: 0 12px 12px 12px; }
      .q-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">📋 Question Bank Manager</div>
      <div class="header-sub">Study with Madison, RN · Internal Tool · Not for GitHub</div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-num" id="stat-active">0</span><span class="stat-label">Active</span></div>
      <div class="stat flagged"><span class="stat-num" id="stat-flagged">0</span><span class="stat-label">Flagged</span></div>
      <div class="stat removed"><span class="stat-num" id="stat-removed">0</span><span class="stat-label">Removed</span></div>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
    <input type="text" id="search" placeholder="🔍  Search by keyword or concept..." oninput="applyFilters()" style="flex:1;min-width:200px;" />
  </div>
</div>

<div class="filters">
  <span class="filter-label">Filter:</span>
  <select id="f-module" onchange="applyFilters()">
    <option value="">All Modules</option>
    <option value="Module 1">Module 1 — Newborn Care</option>
    <option value="Module 2">Module 2 — Maternal & OB</option>
    <option value="Module 3">Module 3 — Pharmacology</option>
    <option value="Module 4">Module 4 — Cardiovascular</option>
    <option value="Module 5">Module 5 — Psychosocial Integrity</option>
  </select>
  <select id="f-type" onchange="applyFilters()">
    <option value="">All Types</option>
    <option value="mcq">MCQ</option>
    <option value="sata">SATA</option>
    <option value="bowtie">Bow-Tie</option>
    <option value="casestudy">Case Study</option>
  </select>
  <select id="f-diff" onchange="applyFilters()">
    <option value="">All Difficulties</option>
    <option value="1">⚪ Foundation (1)</option>
    <option value="2">🟡 Application (2)</option>
    <option value="3">🔴 NGN (3)</option>
  </select>
  <select id="f-status" onchange="applyFilters()">
    <option value="">All Statuses</option>
    <option value="active">Active</option>
    <option value="flagged">Flagged for Review</option>
    <option value="removed">Removed</option>
  </select>
  <select id="f-reason" onchange="applyFilters()">
    <option value="">All Flag Reasons</option>
    <option value="session">📋 Cover in Session</option>
    <option value="clarify">❓ Need Clarification</option>
    <option value="drill">🔁 Needs Drilling</option>
    <option value="discuss">💬 Want to Discuss</option>
  </select>
  <div class="filter-sep"></div>
  <button class="btn-export" onclick="exportFlagged()">📤 Export Flagged List</button>
</div>

<div class="main" id="bank-root"></div>

<script>
const QUESTIONS = [
  // ─── MODULE 1: NEWBORN CARE ───────────────────────────────────────────────
  { id:"m1q1",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"APGAR Scores",
    stem:"A newborn receives an APGAR score of 5 at 1 minute of life. How should the nurse interpret this finding and plan care?",
    options:["Normal (7–10) — document and continue routine newborn care","Moderate difficulty (4–6) — stimulate and provide supplemental oxygen, reassess at 5 minutes","Severe distress (0–3) — begin immediate resuscitation","This score predicts the newborn's long-term neurological outcomes"],
    correct:[1], rationale:"APGAR 4–6 = moderate difficulty. Stimulate, supplemental O₂, reassess at 5 min. APGAR does NOT predict future outcomes." },

  { id:"m1q2",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Expected vs. Unexpected Findings",
    stem:"A nurse is assessing a newborn 4 hours after birth. Which finding should be reported to the provider immediately?",
    options:["Acrocyanosis of the hands and feet","Vernix caseosa covering the skin","Central cyanosis of the lips and tongue","Mongolian spots on the lower back"],
    correct:[2], rationale:"Central cyanosis (blue lips/tongue) = emergency. Acrocyanosis, vernix, and Mongolian spots are all normal." },

  { id:"m1q3",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Newborn Circulation",
    stem:"Which structure allows blood to bypass the fetal liver, shunting it directly from the umbilical vein to the inferior vena cava?",
    options:["Ductus arteriosus","Foramen ovale","Ductus venosus","Umbilical artery"],
    correct:[2], rationale:"Ductus venosus = umbilical vein → IVC (bypasses liver). Ductus arteriosus = pulmonary artery → aorta (bypasses lungs)." },

  { id:"m1q4",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Newborn Medications",
    stem:"A parent asks why their newborn is receiving vitamin K immediately after birth. What is the nurse's best response?",
    options:["'It prevents eye infections during delivery.'","'Newborns lack clotting factors — Vitamin K prevents hemorrhagic disease of the newborn.'","'It's required by law — no specific reason for your baby.'","'It prevents jaundice by helping the liver process bilirubin.'"],
    correct:[1], rationale:"Vit K prevents HDN (hemorrhagic disease of newborn). Erythromycin eye ointment = eye infections. Vit K ≠ bilirubin." },

  { id:"m1q5",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Feeding & Wet Diapers",
    stem:"A breastfeeding mother asks how she will know if her newborn is getting enough on day 2 postpartum. Which response is most accurate?",
    options:["'By day 2, your baby should have 6–8 wet diapers per day.'","'By day 2, at least 2 wet diapers — wet diapers are the best signs of adequate intake.'","'Weight gain is the only reliable way to know.'","'Your baby should sleep at least 4 hours between feeds.'"],
    correct:[1], rationale:"Day 1→1, Day 2→2, Day 3→3, Day 4+→6–8 wet diapers. Longer sleep stretches = concern, not reassurance." },

  { id:"m1q6",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Cold Stress",
    stem:"Which physiological consequence of cold stress in newborns is most important to understand?",
    options:["Cold stress decreases oxygen consumption","Cold stress increases surfactant production","Cold stress increases blood glucose","Cold stress increases oxygen consumption, causing hypoglycemia and respiratory distress"],
    correct:[3], rationale:"Cold stress → nonshivering thermogenesis → ↑ O₂ consumption, ↓ glucose, ↓ surfactant. Cold babies = hypoglycemic babies." },

  { id:"m1q7",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Respiratory Distress",
    stem:"A nurse assesses a 1-hour-old newborn with grunting on expiration, nasal flaring, and intercostal retractions. How should these findings be interpreted?",
    options:["Normal transitional breathing in the first hour of life","Signs of respiratory distress requiring immediate intervention","Expected in a newborn who has been crying vigorously","Signs the newborn is hungry"],
    correct:[1], rationale:"Grunting, flaring, retractions = classic respiratory distress signs. Require immediate action." },

  { id:"m1q8",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Reflexes",
    stem:"A nurse strokes the outer edge of a newborn's foot from heel to toe and observes dorsiflexion of the big toe with fanning of the toes. Which reflex was elicited?",
    options:["Moro reflex","Palmar grasp reflex","Babinski reflex","Tonic neck reflex"],
    correct:[2], rationale:"Babinski = stroke outer sole → dorsiflexion big toe + fanning. Normal in newborns, abnormal in adults." },

  { id:"m1q9",  module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Weight Loss",
    stem:"A new mother is tearful that her baby has lost weight. How should the nurse respond?",
    options:["'Weight loss is abnormal — I'll notify the provider.'","'Weight loss up to 10% is normal. Birth weight is regained by 10–14 days. Use wet diapers as your daily guide.'","'Any weight loss means we need to start formula right away.'","'Newborns should not lose any weight in the first 24 hours.'"],
    correct:[1], rationale:"Up to 10% weight loss in first few days = physiologically normal. Regained by day 10–14." },

  { id:"m1q10", module:"Module 1", section:1, type:"mcq",      diff:1, concept:"Jaundice",
    stem:"A nurse notes yellowing of a newborn's skin at 36 hours. The newborn is feeding well. How should the nurse classify this?",
    options:["Pathological — jaundice should not appear until after 48 hours","Physiological — expected; jaundice appearing after 24 hours is physiologic","Concerning — suggests ABO incompatibility","Normal — jaundice in the first 24 hours is always expected"],
    correct:[1], rationale:"KEY PEARL: Jaundice AFTER 24 hrs = physiologic. Jaundice WITHIN first 24 hrs = ALWAYS pathological." },

  { id:"m1q11", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"APGAR Scores",
    stem:"APGAR at 1 min: HR 90, weak cry, some flexion, grimace only, acrocyanosis. What is the APGAR score and priority action?",
    options:["Score 5 — stimulate and supplemental O₂, reassess at 5 min","Score 7 — routine newborn care","Score 3 — immediate resuscitation","Score 8 — reassure parents"],
    correct:[0], rationale:"HR 90(1)+weak cry(1)+some flexion(1)+grimace(1)+acrocyanosis(1) = APGAR 5. Score 4–6 → stimulate + O₂." },

  { id:"m1q12", module:"Module 1", section:2, type:"sata",     diff:2, concept:"Expected vs. Unexpected Findings",
    stem:"A nurse is assessing a 12-hour-old newborn. Select ALL findings that require IMMEDIATE provider notification.",
    options:["Acrocyanosis of the hands and feet","Persistent nasal grunting between feedings","Central cyanosis of the lips and tongue","Vernix caseosa on skin folds","Apnea episode lasting 20 seconds","Milia on the nose and chin"],
    correct:[1,2,4], rationale:"Persistent grunting, central cyanosis, and apnea = report immediately. Acrocyanosis, vernix, milia = normal." },

  { id:"m1q13", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"Respiratory Distress",
    stem:"2-hour-old: RR 74, central cyanosis, intercostal retractions, grunting, SpO₂ 86%. Priority action?",
    options:["Document and reassess in 30 minutes","Ensure airway is open, call for immediate assistance, prepare O₂","Warm under radiant warmer to rule out cold stress","Feed to provide glucose and stimulate respiratory effort"],
    correct:[1], rationale:"SpO₂ 86% + central cyanosis + retractions = respiratory emergency. ABCs first — airway and call for help." },

  { id:"m1q14", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"Hypoglycemia",
    stem:"4-hour-old: jittery, weak cry, difficult to arouse, blood glucose 36 mg/dL. First action?",
    options:["Draw full metabolic panel and wait for results","Feed the newborn (breast or formula) per hypoglycemia protocol","Administer IV dextrose immediately","Place under radiant warmer, recheck in 2 hours"],
    correct:[1], rationale:"Feed first if tolerated — oral feeding is first-line for neonatal hypoglycemia. IV glucose reserved for failure to feed or respond." },

  { id:"m1q15", module:"Module 1", section:2, type:"sata",     diff:2, concept:"Thermoregulation",
    stem:"Select ALL interventions that prevent heat loss and support thermoregulation after delivery.",
    options:["Dry newborn with warm blankets","Place on cold infant scale immediately","Maintain warm, draft-free delivery room","Encourage skin-to-skin contact","Apply knit hat to head","Swaddle in pre-warmed blankets"],
    correct:[0,2,3,4,5], rationale:"Drying, warm environment, skin-to-skin, hat, swaddling = prevent heat loss. Cold scale = causes heat loss (conductive)." },

  { id:"m1q16", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"Safe Sleep",
    stem:"Which parent statement during discharge teaching indicates a need for further teaching?",
    options:["'I will always place my baby on her back to sleep.'","'We have a firm, flat crib mattress with a fitted sheet.'","'I'll put a soft blanket in the crib so she stays warm.'","'She can sleep in our room in her own bassinet.'"],
    correct:[2], rationale:"Soft blankets in sleep space = suffocation hazard. Safe sleep: back, firm surface, no soft objects, room sharing (not bed sharing)." },

  { id:"m1q17", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"Umbilical Cord Care",
    stem:"Which instruction about umbilical cord care should the nurse include in discharge teaching?",
    options:["Apply antibiotic ointment daily","Fold diaper below stump, keep clean and dry, expect separation in 7–14 days","Submerge in tub bath daily to soften cord","Cord should fall off in 3–4 days; call if it lasts longer"],
    correct:[1], rationale:"Keep dry and clean, fold diaper below, off in 7–14 days. No tub baths until cord falls off. No antibiotic ointment routinely." },

  { id:"m1q18", module:"Module 1", section:2, type:"mcq",      diff:2, concept:"Feeding & Wet Diapers",
    stem:"Home health nurse visits a 5-day-old breastfed newborn. Mother reports 4 wet diapers yesterday. How should the nurse interpret this?",
    options:["Normal — 4 wet diapers is appropriate for a 5-day-old","Concerning — day 4+ should have 6–8 wet diapers per day; 4 suggests inadequate intake","Normal — wet diaper count peaks day 3 and decreases after","Concerning — a 5-day-old should have at least 10 wet diapers"],
    correct:[1], rationale:"Day 4+ = 6–8 wet diapers expected. At day 5, only 4 = inadequate — assess latch, frequency, weight." },

  { id:"m1q19", module:"Module 1", section:2, type:"sata",     diff:2, concept:"Report Immediately",
    stem:"Select ALL newborn findings in the nursery that require IMMEDIATE provider notification.",
    options:["Mongolian spots on sacral area","Central cyanosis of lips and tongue","Apnea episode during assessment","Acrocyanosis of hands and feet","Seizure activity","Temperature instability","Lanugo on back and shoulders","Lethargy with poor feeding"],
    correct:[1,2,4,5,7], rationale:"Central cyanosis, apnea, seizures, temp instability, lethargy/poor feeding = report immediately. Mongolian spots, acrocyanosis, lanugo = normal." },

  { id:"m1q20", module:"Module 1", section:2, type:"mcq",      diff:3, concept:"NCLEX Traps",
    stem:"A nursing student sees blue discoloration of a newborn's hands and feet and asks if it should be reported. Best teaching response?",
    options:["'Yes — any blue discoloration is a cardiac emergency.'","'No — blue hands/feet (acrocyanosis) is normal. Blue lips/tongue is the emergency we watch for.'","'Yes — this is central cyanosis, prepare O₂ immediately.'","'No — newborns are blue all over for the first 24 hours.'"],
    correct:[1], rationale:"MOST COMMON NCLEX TRAP: Acrocyanosis (blue extremities) = NORMAL. Central cyanosis (lips/tongue/trunk) = EMERGENCY." },

  { id:"m1q21", module:"Module 1", section:3, type:"bowtie",   diff:3, concept:"Cold Stress",
    stem:"Bow-Tie: 30-min-old newborn, unwrapped, Temp 35.9°C, HR 176, RR 66, glucose 36 mg/dL, jittery.",
    options:["Left: Dry and swaddle in warm blankets","Left: Skin-to-skin contact","Left: Tepid bath to stimulate temp regulation","Left: Restrict oral feeds","Center: Cold stress with resultant hypoglycemia","Right: Axillary temperature trend","Right: Blood glucose after intervention"],
    correct:[0,1,4,5,6], rationale:"Cold stress → hypoglycemia. Dry/swaddle + skin-to-skin = warm. Monitor temp and glucose trends." },

  { id:"m1q22", module:"Module 1", section:3, type:"bowtie",   diff:3, concept:"Hypoglycemia",
    stem:"Bow-Tie: 38-wk LGA newborn, 1hr old, GDM mother, jittery, weak cry, glucose 34 mg/dL.",
    options:["Left: Feed per hypoglycemia protocol","Left: Restrict feeds, await IV glucose","Left: Recheck glucose 30 min after feeding","Center: Neonatal hypoglycemia","Right: Blood glucose trend (30 min post)","Right: Feeding tolerance and oral intake"],
    correct:[0,2,3,4,5], rationale:"LGA + DM mother = fetal hyperinsulinism. Feed first, recheck glucose. IV glucose only if oral fails." },

  { id:"m1q23a", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Respiratory Distress",
    stem:"[Case Study A] 2-hr-old: RR 78, grunting, flaring, retractions, SpO₂ 86%, central cyanosis. Which finding is most immediately life-threatening?",
    options:["HR 182 bpm","Central cyanosis with SpO₂ 86%","RR 78","Temp 37.0°C"],
    correct:[1], rationale:"Central cyanosis + SpO₂ 86% = severe hypoxemia. Most immediately life-threatening. ABCs first." },

  { id:"m1q23b", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Respiratory Distress",
    stem:"[Case Study B] Same patient. Select ALL signs of neonatal respiratory distress.",
    options:["Nasal flaring","Grunting on expiration","Pale skin","Intercostal retractions","Temperature 37.0°C","Central cyanosis"],
    correct:[0,1,3,5], rationale:"Flaring, grunting, retractions, central cyanosis = RDS signs. Normal temp and pale skin are not RDS criteria." },

  { id:"m1q23c", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Respiratory Distress",
    stem:"[Case Study C] ABC framework. What is the nurse's FIRST priority action?",
    options:["Call parents","Document all findings","Ensure airway is patent and call for immediate respiratory support","Obtain blood glucose to rule out hypoglycemia"],
    correct:[2], rationale:"ABCs — Airway first. Ensure patent airway and call for help. Documentation and glucose come after." },

  { id:"m1q24a", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Jaundice",
    stem:"[Case Study A] 18-hr-old, mother O+, baby A+, poor feeding, 1 wet diaper. How should the nurse classify the jaundice?",
    options:["Physiological — after 12 hours is normal","Pathological — jaundice within 24 hours is always concerning","Normal — all newborns develop visible jaundice in first 24 hours","Mild — monitor at home"],
    correct:[1], rationale:"Jaundice within FIRST 24 hours = ALWAYS pathological. This is the critical NCLEX distinction." },

  { id:"m1q24b", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Jaundice",
    stem:"[Case Study B] Same patient. Which finding is most consistent with the likely cause?",
    options:["Blood type incompatibility — O+ mother, A+ newborn","Lanugo on back","Mongolian spots","Acrocyanosis"],
    correct:[0], rationale:"ABO incompatibility (O+ mom + A+ or B+ baby) → maternal antibodies cross placenta → hemolysis → pathological jaundice." },

  { id:"m1q24c", module:"Module 1", section:3, type:"casestudy", diff:3, concept:"Jaundice",
    stem:"[Case Study C] Same patient. Select ALL appropriate nursing actions.",
    options:["Notify provider immediately","Monitor bilirubin per order","Reassure parents this is normal physiologic jaundice","Encourage frequent feeding","Assess for hemolysis signs (pallor, lethargy)","Prepare for phototherapy if ordered"],
    correct:[0,1,3,4,5], rationale:"Notify, monitor bili, feed frequently, assess for hemolysis, prep for phototherapy. Do NOT reassure as normal — it is pathological." },

  { id:"m1q25", module:"Module 1", section:3, type:"sata",     diff:3, concept:"Priority Assessments",
    stem:"Select ALL newborn nursery findings requiring IMMEDIATE intervention — above documentation or routine care.",
    options:["Central cyanosis of the lips in a 3-hr-old","Grunting and flaring with RR 78 in a 1-hr-old","Mongolian spots on sacral area of a 2-day-old","Glucose 36 mg/dL with jitteriness in an LGA infant","Acrocyanosis of hands and feet in a pink 6-hr-old","Axillary temp 35.7°C with lethargy in a 4-hr-old","Vernix on a 30-min-old","Apnea episode in a 12-hr-old"],
    correct:[0,1,3,5,7], rationale:"Central cyanosis, RDS, hypoglycemia, hypothermia+lethargy, apnea = immediate. Mongolian spots, acrocyanosis, vernix = normal." },

  // ─── MODULE 2: MATERNAL & OB ─────────────────────────────────────────────
  { id:"m2q1",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"RH Incompatibility",
    stem:"Which scenario places a fetus at risk for hemolytic disease of the newborn?",
    options:["Rh+ mother / Rh– baby","Rh– mother / Rh+ baby","Rh+ mother / Rh+ baby","Rh– mother / Rh– baby"],
    correct:[1], rationale:"Rh– mom + Rh+ baby = risk for hemolytic disease. Mom's antibodies attack baby's RBCs." },

  { id:"m2q2",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"RH Incompatibility",
    stem:"An Rh-negative patient delivers an Rh-positive infant. RhoGAM must be administered within which postpartum timeframe?",
    options:["24 hours","48 hours","72 hours","1 week"],
    correct:[2], rationale:"RhoGAM must be given within 72 hours postpartum to prevent sensitization." },

  { id:"m2q3",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Hypertensive Disorders",
    stem:"Which combination of findings establishes a diagnosis of preeclampsia?",
    options:["BP ≥140/90 after 20 weeks with no proteinuria","BP ≥140/90 after 20 weeks + proteinuria ≥300 mg/24 hr","Seizures in a patient with elevated BP","BP ≥120/80 with severe headache after 20 weeks"],
    correct:[1], rationale:"Preeclampsia = HTN ≥140/90 after 20 wks + proteinuria ≥300 mg/24hr. No protein = Gestational HTN only." },

  { id:"m2q4",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Hypertensive Disorders",
    stem:"Low platelets, elevated liver enzymes, and signs of hemolysis are consistent with which complication?",
    options:["Gestational hypertension","Preeclampsia","HELLP syndrome","Eclampsia"],
    correct:[2], rationale:"HELLP = Hemolysis, Elevated Liver enzymes, Low Platelets. May present with RUQ pain, N/V." },

  { id:"m2q5",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Fetal Heart Rate Patterns",
    stem:"Early decelerations — FHR dips symmetrically and returns to baseline with each contraction. Best nursing interpretation?",
    options:["Umbilical cord compression — reposition the patient","Placental insufficiency — notify provider immediately","Head compression — usually benign, no intervention needed","Fetal distress — prepare for emergency delivery"],
    correct:[2], rationale:"Early decels = head compression = benign. Return to baseline mirrors contraction. No intervention needed." },

  { id:"m2q6",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Fetal Heart Rate Patterns",
    stem:"Recurrent decelerations begin AFTER the peak of each contraction and return to baseline slowly. Priority action?",
    options:["Document and continue monitoring","Reposition to left lateral, O₂, IV fluids, notify provider, stop Pitocin","Increase Pitocin to strengthen contractions","Administer pain medication"],
    correct:[1], rationale:"Late decels = placental insufficiency = OMINOUS. Reposition left, O₂, IVF, notify provider, stop Pitocin." },

  { id:"m2q7",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Prenatal Pearls",
    stem:"Which fundal height finding correctly corresponds to gestational age?",
    options:["Fundal height at the umbilicus = 12 weeks","Fundal height at the umbilicus = 20 weeks","Fundal height at the xiphoid process = 28 weeks","Fundal height just above symphysis = 20 weeks"],
    correct:[1], rationale:"20 wks = umbilicus. 12 wks = just above symphysis. 36 wks = xiphoid process." },

  { id:"m2q8",  module:"Module 2", section:1, type:"sata",     diff:1, concept:"Vaccines in Pregnancy",
    stem:"Select ALL vaccines considered safe and recommended during pregnancy.",
    options:["Tdap (27–36 weeks)","MMR","Influenza (injectable)","Varicella (chickenpox)","COVID-19","Zoster (Shingles)","RSV (32–36 weeks in season)","Live Influenza (FluMist)"],
    correct:[0,2,4,6], rationale:"Safe: Tdap, injectable flu, COVID, RSV. AVOID live vaccines: MMR, Varicella, FluMist, Shingles." },

  { id:"m2q9",  module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Prenatal Pearls",
    stem:"Teaching a patient at 30 weeks about kick counts. Which instruction is most accurate?",
    options:["Count kicks starting at 20 weeks","Feel for 10 movements in 2 hours — call provider if fewer","Count only during morning hours for accuracy","5 movements per hour is the expected minimum"],
    correct:[1], rationale:"Kick counts begin at 28 weeks. Goal = 10 movements in 2 hours. Call provider if fewer than 10." },

  { id:"m2q10", module:"Module 2", section:1, type:"mcq",      diff:1, concept:"Labs in Pregnancy",
    stem:"Which lab finding is considered NORMAL during pregnancy?",
    options:["Proteinuria ≥300 mg/24 hr","Platelet count of 80,000","Mild dilutional anemia (decreased Hgb/Hct)","Elevated creatinine"],
    correct:[2], rationale:"Dilutional anemia = normal (plasma volume ↑ more than RBC). Proteinuria ≥300 mg = preeclampsia. Low platelets + elevated creatinine = concerning." },

  { id:"m2q11", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Obstetric Emergencies",
    stem:"Patient A: sudden severe abdominal pain, rigid uterus, dark red bleeding. Patient B: painless bright red bleeding, no contractions. Which best distinguishes them?",
    options:["Patient A has placenta previa; Patient B has abruption","Patient A has placental abruption; Patient B has placenta previa","Both have the same condition — placenta previa","Both need vaginal exams to distinguish"],
    correct:[1], rationale:"Abruption = PAINFUL, dark red, rigid uterus. Previa = PAINLESS, bright red. NO vaginal exam with previa." },

  { id:"m2q12", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Obstetric Emergencies",
    stem:"32-week patient with painless bright red vaginal bleeding, suspected placenta previa. Priority nursing action?",
    options:["Perform a vaginal exam to assess cervical dilation","Apply fundal pressure","Do NOT perform vaginal exam — place on bed rest, notify provider, monitor mom and fetus","Encourage ambulation to stimulate contractions"],
    correct:[2], rationale:"Placenta previa: NO vaginal exam (can cause hemorrhage). Place on bed rest, notify provider, monitor." },

  { id:"m2q13", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Obstetric Emergencies",
    stem:"Umbilical cord is visible at the vaginal introitus after membrane rupture. Priority nursing action?",
    options:["Push the cord back into the vagina","Knee-chest position, do NOT push cord in, lift presenting part, call for emergency help","Place on her back and monitor fetal HR","Prepare for immediate vaginal delivery"],
    correct:[1], rationale:"Cord prolapse: Knee-chest position, NEVER push cord in, manually lift presenting part off cord, EMERGENCY call." },

  { id:"m2q14", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Fetal Heart Rate Patterns",
    stem:"Variable decelerations — abrupt FHR drops varying in timing and depth. Priority action?",
    options:["Document and continue routine monitoring","Increase Pitocin rate","Reposition the patient, administer O₂, increase IV fluids","Notify provider to prepare for immediate C-section"],
    correct:[2], rationale:"Variable decels = cord compression. First: reposition (left lateral or knee-chest), O₂, IVF. Notify if persist." },

  { id:"m2q15", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Hypertensive Disorders",
    stem:"Patient on IV magnesium sulfate: respirations 10/min, absent DTRs, decreased urine output. Priority action?",
    options:["Increase the Mag drip rate to maintain therapeutic levels","Stop the infusion and administer calcium gluconate IV","Reposition to left lateral and increase fluids","Document and reassess in 30 minutes"],
    correct:[1], rationale:"Mag toxicity signs (resp <12, absent DTRs, ↓ UO) → STOP infusion + give calcium gluconate (antidote) immediately." },

  { id:"m2q16", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Prenatal Pearls",
    stem:"Chart records G4 T2 P1 A1 L2. How should the nurse correctly interpret this GTPAL?",
    options:["4 pregnancies, 2 term births, 1 preterm, 1 abortion, 2 living children","4 deliveries, 2 premature, 1 term, 1 abortion, 2 living","4 pregnancies, 2 term, 1 stillbirth, 1 abortion, 2 living","4 pregnancies, 2 term, 1 preterm, 1 stillbirth, 2 living"],
    correct:[0], rationale:"GTPAL: G=Gravida(total pregnancies), T=Term births, P=Preterm births, A=Abortions/losses, L=Living children." },

  { id:"m2q17", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"RH Incompatibility",
    stem:"An Rh-negative patient at 14 weeks has a positive indirect Coombs test. Most important nursing implication?",
    options:["Administer RhoGAM immediately","The patient is already sensitized — RhoGAM will NOT prevent further hemolysis","Schedule RhoGAM at 28 weeks as planned","Prepare for emergency delivery"],
    correct:[1], rationale:"Positive indirect Coombs = already sensitized. RhoGAM prevents sensitization — it CANNOT treat existing sensitization." },

  { id:"m2q18", module:"Module 2", section:2, type:"sata",     diff:2, concept:"Report Immediately",
    stem:"Select ALL prenatal findings that require IMMEDIATE provider notification.",
    options:["Mild ankle edema at the end of a long day","Sudden severe headache at 32 weeks","Painless bright red vaginal bleeding at 30 weeks","Nausea in the first trimester","Visual changes and RUQ pain at 28 weeks","Decreased fetal movement after 28 weeks"],
    correct:[1,2,4,5], rationale:"Severe headache, bright red bleeding, visual changes + RUQ pain, decreased fetal movement = report immediately. Ankle edema and 1st trimester nausea = normal." },

  { id:"m2q19", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Labs in Pregnancy",
    stem:"Which urinalysis finding requires IMMEDIATE provider notification in a pregnant patient?",
    options:["Trace protein on dipstick","Glycosuria in the absence of other symptoms","Proteinuria 2+ on dipstick at 28 weeks","↑ urinary frequency without dysuria"],
    correct:[2], rationale:"Proteinuria 2+ = significant protein loss. After 20 wks, combined with HTN = preeclampsia. Always report. Trace protein may be ok, but more than trace = NOT normal." },

  { id:"m2q20", module:"Module 2", section:2, type:"mcq",      diff:2, concept:"Priority Nursing",
    stem:"Nurse receives four messages simultaneously. Which patient should be assessed FIRST?",
    options:["28-week patient reporting decreased fetal movement for 4 hours","36-week patient with mild ankle edema","32-week patient experiencing first-trimester-type nausea","38-week patient with Braxton Hicks every 20 minutes"],
    correct:[0], rationale:"Decreased fetal movement at 28 weeks = report immediately. Reassure patient movement is the baby communicating." },

  { id:"m2q21", module:"Module 2", section:3, type:"bowtie",   diff:3, concept:"Hypertensive Disorders",
    stem:"Bow-Tie: 34-wk patient with BP 168/112, severe headache, 3+ proteinuria, RUQ pain, hyperreflexia.",
    options:["Left: Administer IV magnesium sulfate per order","Left: Keep calcium gluconate at bedside","Left: Increase Pitocin","Center: Severe preeclampsia","Right: Respiratory rate and DTRs","Right: Urine output (≥30 mL/hr)"],
    correct:[0,1,3,4,5], rationale:"Severe preeclampsia: Mag for seizure prevention, calcium gluconate antidote at bedside. Monitor resp, DTRs, and UO for toxicity." },

  { id:"m2q22", module:"Module 2", section:3, type:"bowtie",   diff:3, concept:"Obstetric Emergencies",
    stem:"Bow-Tie: Active labor patient — cord felt at introitus after spontaneous ROM, FHR 90 bpm.",
    options:["Left: Knee-chest position immediately","Left: Push cord back into vagina","Left: Manually lift presenting part off cord","Center: Umbilical cord prolapse","Right: Fetal heart rate pattern","Right: Color/perfusion of cord"],
    correct:[0,2,3,4,5], rationale:"Cord prolapse = emergency. Knee-chest, lift presenting part, never push cord in. Monitor FHR and cord perfusion." },

  { id:"m2q23a", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Hypertensive Disorders",
    stem:"[Case Study A] 32-wk patient: BP 158/106, HA, visual changes, 2+ proteinuria, hyperreflexia. Which assessment finding requires PRIORITY action before starting Mag?",
    options:["Current blood pressure reading","Baseline respiratory rate, DTRs, and urine output","Fetal heart rate tracing","Severity of headache on 1–10 scale"],
    correct:[1], rationale:"Before starting Mag, establish baseline: resp rate (must be ≥12), DTRs, and urine output to monitor for toxicity." },

  { id:"m2q23b", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Hypertensive Disorders",
    stem:"[Case Study B] 1 hour into Mag infusion. Select ALL findings that indicate MAGNESIUM TOXICITY.",
    options:["Respirations 8 per minute","BP 150/100","Absent deep tendon reflexes","Urine output 15 mL/hr","Flushing and warmth (mild)","Serum Mag level 12 mEq/L"],
    correct:[0,2,3,5], rationale:"Mag toxicity: resp <12, absent DTRs, UO <30 mL/hr, and toxic Mag level (>9 mEq/L) → STOP infusion + calcium gluconate." },

  { id:"m2q23c", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Hypertensive Disorders",
    stem:"[Case Study C] Patient has generalized tonic-clonic seizure (eclampsia). Priority nursing action DURING the seizure?",
    options:["Restrain the patient and insert oral airway","Protect from injury, maintain airway, turn to side, call for help, note seizure duration","Document the seizure and notify physician after it ends","Administer calcium gluconate IV push immediately"],
    correct:[1], rationale:"During seizure: protect from injury, side-lying (airway/aspiration), call for help, time it. Calcium gluconate = Mag antidote, not seizure treatment." },

  { id:"m2q24a", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Priority Nursing",
    stem:"[Case Study A] 4 antepartum patients. Using 'MOM FIRST' — which patient do you see FIRST?",
    options:["38-wk patient with Braxton Hicks every 15 min, no cervical change","32-wk patient with BP 172/114, visual changes, and RUQ pain","34-wk patient with painless bright red vaginal bleeding (placenta previa)","28-wk patient with regular contractions q5min, cervical change to 3 cm"],
    correct:[1], rationale:"BP 172/114 + visual changes + RUQ pain = severe preeclampsia with imminent eclampsia risk = MOST urgent life threat." },

  { id:"m2q24b", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Obstetric Emergencies",
    stem:"[Case Study B] For the placenta previa patient — which action is CONTRAINDICATED?",
    options:["Placing patient on bed rest","Monitoring fetal heart tones continuously","Performing a vaginal exam to assess dilation","Establishing IV access"],
    correct:[2], rationale:"NEVER do vaginal exam with placenta previa — can precipitate massive hemorrhage. Bed rest, FHT monitoring, and IV access are all appropriate." },

  { id:"m2q24c", module:"Module 2", section:3, type:"casestudy", diff:3, concept:"Obstetric Emergencies",
    stem:"[Case Study C] The 28-week preterm labor patient — which medication would the nurse MOST likely anticipate?",
    options:["Oxytocin (Pitocin) to strengthen contractions","Betamethasone (corticosteroid) to accelerate fetal lung maturity","Calcium gluconate to treat preterm labor","Magnesium sulfate as a tocolytic AND for fetal neuroprotection"],
    correct:[3], rationale:"Mag sulfate = tocolytic + fetal neuroprotection before 32 weeks. Betamethasone also likely. Pitocin would worsen labor." },

  { id:"m2q25", module:"Module 2", section:3, type:"sata",     diff:3, concept:"Report Immediately",
    stem:"Select ALL antepartum findings that require IMMEDIATE provider notification — above all other tasks.",
    options:["Vaginal bleeding at 28 weeks","Mild ankle edema at 36 weeks","Severe headache with visual changes at 30 weeks","Regular contractions at 33 weeks","Decreased fetal movement for 4 hours at 32 weeks","First-trimester nausea in a 10-week patient","Leaking fluid at 35 weeks","Dizziness and syncope at 24 weeks"],
    correct:[0,2,3,4,6,7], rationale:"Bleeding, severe HA+visual changes, preterm contractions, decreased FM, fluid leaking, dizziness/syncope = report immediately. Ankle edema and 1st trimester nausea = normal." },

  // ─── MODULE 3: PHARMACOLOGY ──────────────────────────────────────────────────

  // Section 1 — Foundation (diff 1)
  { id:"m3q1",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Rights of Medication Administration",
    stem:"A nurse preparing to administer a medication notices the MAR does not include the route of administration. Which action is most appropriate?",
    options:["Administer orally — it is the most common route","Contact the prescriber to clarify the route before administration","Check the pharmacist label and use that route","Hold the medication and document it as refused"],
    correct:[1], rationale:"The 10 rights include the right route. An incomplete order must be clarified with the prescriber before administration. Assumptions about route can be fatal (e.g., IV push vs. oral morphine)." },

  { id:"m3q2",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Anticoagulants — Warfarin vs. Heparin",
    stem:"A nurse is educating a patient starting warfarin therapy. Which statement best explains why frequent INR monitoring is required?",
    options:["Warfarin can cause kidney damage and creatinine must be monitored","Warfarin has a narrow therapeutic index — its effect varies by diet, genetics, and drug interactions","Warfarin is hepatotoxic and liver enzymes must be checked weekly","Warfarin causes thrombocytopenia and platelet counts must be tracked"],
    correct:[1], rationale:"Warfarin has a narrow therapeutic index affected by vitamin K intake, many drug interactions, and CYP2C9/VKORC1 genetics. INR is monitored (goal 2–3 for most indications). It is NOT nephrotoxic or directly hepatotoxic. HIT (thrombocytopenia) is caused by heparin, not warfarin." },

  { id:"m3q3",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Opioid Toxicity & Reversal",
    stem:"A patient who received morphine 4 mg IV 30 minutes ago has a respiratory rate of 8 breaths/min, pinpoint pupils, and is unresponsive to verbal stimulation. Which medication should the nurse prepare to administer?",
    options:["Flumazenil (Romazicon)","Protamine sulfate","Naloxone (Narcan)","Activated charcoal"],
    correct:[2], rationale:"Classic opioid toxicity triad: respiratory depression + pinpoint pupils (miosis) + altered LOC. Naloxone reverses all opioid effects. Flumazenil reverses benzodiazepines. Protamine reverses heparin. Activated charcoal is for ingested toxins." },

  { id:"m3q4",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Insulin — Mixing",
    stem:"A nurse is preparing to give Regular insulin 8 units and NPH insulin 20 units in one syringe. Which action is correct?",
    options:["Draw up NPH first, then Regular","Draw up Regular first, then NPH","Administer in separate syringes at separate sites","Shake both vials vigorously before drawing"],
    correct:[1], rationale:"'Clear before cloudy' — draw Regular (clear) first, then NPH (cloudy). This prevents NPH from contaminating the Regular vial. Insulin vials are gently rolled, never shaken, to avoid denaturation." },

  { id:"m3q5",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Anaphylaxis",
    stem:"A patient is receiving IV ampicillin. Five minutes in, the patient reports throat tightening and pruritus; the nurse auscultates expiratory wheezing. What is the priority action?",
    options:["Slow the infusion rate and apply supplemental oxygen","Stop the infusion immediately, maintain IV access, and call for help","Administer diphenhydramine (Benadryl) and continue monitoring","Notify the provider and document the reaction"],
    correct:[1], rationale:"This is anaphylaxis. STOP the infusion (remove the allergen), keep IV access (for epinephrine/fluids), and activate rapid response. Epinephrine is first-line. Diphenhydramine is adjunct. Slowing the infusion is not appropriate — the drug must stop." },

  { id:"m3q6",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Beta Blockers — Hold Parameters",
    stem:"A patient is prescribed metoprolol (Lopressor). Which vital sign finding causes the nurse to hold this medication and notify the provider?",
    options:["Blood pressure 148/88 mmHg","Heart rate 48 bpm","Respiratory rate 18 breaths/min","Temperature 37.2°C (99.0°F)"],
    correct:[1], rationale:"Beta blockers slow heart rate. Standard hold parameter: HR < 60 bpm — notify the provider. A heart rate of 48 is below that threshold. The other values are not concerning enough to hold metoprolol." },

  { id:"m3q7",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"ACE Inhibitors",
    stem:"A patient taking lisinopril calls to report a dry, persistent cough that started 3 weeks ago. Which response by the nurse is most appropriate?",
    options:["'This is expected and typically resolves on its own.'","'This sounds like heart failure — come to the clinic immediately.'","'Dry cough is a known, common side effect of ACE inhibitors — the provider may switch you to an ARB.'","'Stop taking the medication and come in for an appointment.'"],
    correct:[2], rationale:"Dry cough is a common ACE inhibitor side effect (bradykinin accumulation). It does NOT resolve while on the drug. The provider may switch to an ARB, which doesn't cause this effect. Patients should not stop without consulting the provider." },

  { id:"m3q8",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Loop Diuretics — Furosemide",
    stem:"A nurse administers furosemide (Lasix) 40 mg IV to a patient with fluid overload. Which finding is most important to report to the provider?",
    options:["Urine output of 800 mL over the next 2 hours","Patient reports urgency to urinate","Serum potassium of 2.9 mEq/L","Weight decreased by 1 lb"],
    correct:[2], rationale:"Furosemide is a loop diuretic that wastes potassium. K+ 2.9 mEq/L = critically low (normal 3.5–5.0). Hypokalemia risks dysrhythmias, especially in patients on digoxin. Increased UO and urgency are expected effects." },

  { id:"m3q9",  module:"Module 3", section:1, type:"mcq", diff:1, concept:"Digoxin Toxicity",
    stem:"A patient on digoxin reports nausea, vomiting, and seeing yellow-green halos around objects. Digoxin level is 2.8 ng/mL. Which action should the nurse take first?",
    options:["Administer an antacid for the nausea","Hold the next scheduled dose and notify the provider","Give the digoxin as scheduled and monitor closely","Administer atropine for the expected bradycardia"],
    correct:[1], rationale:"Classic digoxin toxicity: GI symptoms + visual disturbances (yellow-green halos) + bradycardia. Therapeutic level = 0.5–2.0 ng/mL; 2.8 = toxic. Hold and notify. Digibind is the antidote for severe toxicity. Atropine may be used for symptomatic bradycardia but is not the first action." },

  { id:"m3q10", module:"Module 3", section:1, type:"mcq", diff:1, concept:"NSAIDs — Patient Teaching",
    stem:"A nurse is teaching a patient prescribed ibuprofen for arthritis. Which instruction is most important?",
    options:["'Take on an empty stomach for best absorption.'","'Avoid aspirin while on this medication.'","'Take with food or milk to reduce GI irritation.'","'This medication is safe even if you have kidney disease.'"],
    correct:[2], rationale:"NSAIDs inhibit prostaglandins that protect the gastric mucosa — always take with food or milk to reduce GI upset/ulceration risk. NSAIDs are contraindicated in renal disease (reduce GFR). Combining with aspirin increases bleeding risk." },

  // Section 2 — Application (diff 2)
  { id:"m3q11", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Warfarin — Diet Interaction",
    stem:"A patient on long-term warfarin calls to say her most recent INR was 1.4 (goal 2–3). She recently started eating spinach and kale salads daily. Which explanation is most accurate?",
    options:["Increased green vegetables raised her INR by boosting warfarin metabolism","Increased green vegetables lowered her INR by providing more vitamin K, which opposes warfarin","Her INR is unrelated to diet — the dose simply needs adjustment","She should completely eliminate vegetables while on warfarin"],
    correct:[1], rationale:"Vitamin K (found in green leafy vegetables) counteracts warfarin — more vitamin K = lower INR = subtherapeutic anticoagulation. Patients don't need to eliminate these foods but must keep intake consistent. Dose may need adjustment." },

  { id:"m3q12", module:"Module 3", section:2, type:"sata", diff:2, concept:"Metformin — Safety",
    stem:"A patient with type 2 diabetes is prescribed metformin. Select ALL appropriate nursing actions and patient teaching points.",
    options:["Hold metformin 48 hours before and after contrast dye procedures","Monitor eGFR before initiating and periodically","Warn the patient that hypoglycemia is a common risk when taking metformin alone","GI side effects (nausea, diarrhea) are common early on — take with meals","Administer with a meal to reduce GI upset","Metformin is safe with eGFR < 30 mL/min"],
    correct:[0,1,3,4], rationale:"Hold before contrast (lactic acidosis risk), monitor renal function, GI side effects are common (take with food). Metformin does NOT cause hypoglycemia alone — it doesn't stimulate insulin. Contraindicated with eGFR <30." },

  { id:"m3q13", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Potassium-Sparing Diuretics",
    stem:"A patient is prescribed spironolactone (Aldactone). The nurse should monitor for which priority electrolyte imbalance?",
    options:["Hypokalemia (low potassium)","Hyperkalemia (high potassium)","Hyponatremia (low sodium)","Hypercalcemia (high calcium)"],
    correct:[1], rationale:"Spironolactone is a potassium-SPARING diuretic (aldosterone antagonist) — it retains potassium → HYPERKALEMIA risk. Avoid K+ supplements and K+-rich foods. Contrast with loop diuretics (furosemide) and thiazides, which WASTE potassium." },

  { id:"m3q14", module:"Module 3", section:2, type:"sata", diff:2, concept:"Opioid — Post-Administration Assessment",
    stem:"A patient received hydromorphone (Dilaudid) 1 mg IV 20 minutes ago. Select ALL findings that require IMMEDIATE nursing intervention.",
    options:["Pain rating of 6/10","Respiratory rate of 9 breaths/min","Oxygen saturation of 88%","Patient reports feeling drowsy","Pinpoint pupils bilaterally","Patient requests an additional dose"],
    correct:[1,2,4], rationale:"Opioid toxicity signs: RR <10, SpO2 <90%, pinpoint pupils (miosis) — all require immediate intervention including possible naloxone. Pain of 6/10 and drowsiness are expected effects. Requesting another dose is a clinical judgment call, not an emergency." },

  { id:"m3q15", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Tetracycline — Patient Teaching",
    stem:"A patient is prescribed tetracycline for a skin infection. Which patient teaching instruction is most important?",
    options:["'Take with a full glass of milk to prevent stomach upset.'","'Avoid prolonged sun exposure and use sunscreen — tetracycline causes photosensitivity.'","'Antacids containing calcium are safe to take with this antibiotic.'","'Take all doses even if you feel better in 2 days.'"],
    correct:[1], rationale:"Tetracycline causes significant photosensitivity — sun protection is essential. Tetracyclines should NOT be taken with dairy, antacids, or calcium (chelation reduces absorption). Completing the full course is correct for any antibiotic, but the photosensitivity teaching is most specific and important here." },

  { id:"m3q16", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Levothyroxine — Administration",
    stem:"A nurse is teaching a patient about levothyroxine (Synthroid). Which instruction is most important?",
    options:["'Take with a full breakfast to improve absorption.'","'Take at bedtime to improve sleep.'","'Take on an empty stomach 30–60 minutes before eating, at the same time each day.'","'Hold the dose if your heart rate is below 70 bpm.'"],
    correct:[2], rationale:"Levothyroxine must be taken on an empty stomach 30–60 minutes before eating (food, calcium, iron, and many medications reduce absorption). Same time each day maintains consistent hormone levels. Consistency of dosing and timing is critical." },

  { id:"m3q17", module:"Module 3", section:2, type:"sata", diff:2, concept:"Corticosteroids — Adverse Effects",
    stem:"A patient has been on prednisone 40 mg/day for 3 weeks. Select ALL expected adverse effects the nurse should monitor for.",
    options:["Hypoglycemia","Hyperglycemia","Immunosuppression and increased infection risk","Weight loss and muscle wasting","Fluid retention and edema","Osteoporosis with long-term use"],
    correct:[1,2,4,5], rationale:"Long-term corticosteroids: hyperglycemia (not hypo), immunosuppression, fluid/sodium retention (edema), osteoporosis (calcium loss). Weight GAIN (Cushingoid), not loss. Watch for mood changes and adrenal suppression with abrupt discontinuation — never stop abruptly." },

  { id:"m3q18", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Antidotes",
    stem:"A patient on a heparin infusion has a PTT of 240 seconds and is experiencing active bleeding. Which medication should the nurse anticipate administering?",
    options:["Vitamin K (phytonadione)","Protamine sulfate","Naloxone (Narcan)","Flumazenil (Romazicon)"],
    correct:[1], rationale:"Protamine sulfate = heparin antidote. Vitamin K = warfarin antidote. Naloxone = opioid antidote. Flumazenil = benzodiazepine antidote. Knowing these antidote pairs is high-yield NCLEX content." },

  { id:"m3q19", module:"Module 3", section:2, type:"mcq", diff:2, concept:"MAOIs — Food Interactions",
    stem:"A patient taking phenelzine (Nardil), an MAOI, asks which foods to avoid. Which response is most accurate?",
    options:["'Avoid grapefruit and citrus products, which affect drug metabolism.'","'Avoid foods high in tyramine — aged cheeses, cured meats, red wine — to prevent hypertensive crisis.'","'Avoid vitamin K-rich foods like spinach, which block the medication.'","'Avoid dairy products, which interfere with absorption.'"],
    correct:[1], rationale:"MAOIs + tyramine = potentially fatal hypertensive crisis. Tyramine-rich foods: aged/fermented cheeses, red wine, beer, cured meats, sauerkraut, soy sauce. Grapefruit affects CYP3A4 substrates, not MAOIs specifically. This is a critical patient safety teaching point." },

  { id:"m3q20", module:"Module 3", section:2, type:"sata", diff:2, concept:"Safe Medication Administration",
    stem:"A nurse is preparing to administer IV push medications. Select ALL safe practices that must be followed.",
    options:["Verify patient identity using two identifiers before administration","Check the medication against the MAR three times (before drawing, before giving, at bedside)","A medication with a partially torn label is acceptable if the drug name is visible","Reconstituted medications can be shared between patients if labeling is intact","Assess for allergies before administering any new medication","Document administration after the medication is given, not before"],
    correct:[0,1,4,5], rationale:"Two identifiers, three MAR checks, allergy assessment, and post-administration documentation are all correct. Damaged labels = discard (patient safety risk). Reconstituted medications prepared for one patient cannot be shared — infection control and dosing safety." },

  // Section 3 — NGN (diff 3)
  { id:"m3q21", module:"Module 3", section:3, type:"bowtie", diff:3, concept:"Digoxin Toxicity — Priority Action",
    stem:"A patient on digoxin 0.25 mg daily reports nausea, anorexia, and seeing yellow-green halos. HR 48 bpm irregular. Digoxin level: 3.1 ng/mL (therapeutic 0.5–2.0). Which TWO actions are the PRIORITY?",
    options:["Administer the next dose of digoxin as scheduled","Hold digoxin and notify the provider immediately","Prepare to administer digoxin immune fab (Digibind) now","Administer atropine 0.5 mg IV for the bradycardia","Place on continuous cardiac monitoring and establish IV access"],
    correct:[1,4], rationale:"Classic digoxin toxicity (level 3.1, bradycardia, GI symptoms, visual changes). Priority: hold digoxin + notify provider; place on telemetry and ensure IV access for potential Digibind. Digibind is reserved for severe/life-threatening toxicity. Atropine may be used if bradycardia becomes symptomatic but is not the first action." },

  { id:"m3q22", module:"Module 3", section:3, type:"casestudy", diff:3, concept:"Anticoagulation — Heparin Monitoring",
    stem:"[Case Study A] A patient with DVT is started on a weight-based heparin infusion protocol. Which laboratory value is used to monitor therapeutic heparin effect?",
    options:["International Normalized Ratio (INR)","Partial thromboplastin time (PTT / aPTT)","Prothrombin time (PT)","Platelet count"],
    correct:[1], rationale:"PTT/aPTT monitors HEPARIN. INR/PT monitors WARFARIN. Platelet count monitors for HIT (heparin-induced thrombocytopenia) — important to trend but not the primary therapeutic parameter." },

  { id:"m3q23", module:"Module 3", section:3, type:"casestudy", diff:3, concept:"Anticoagulation — HIT Recognition",
    stem:"[Case Study B] On day 4 of heparin therapy, the patient's platelet count drops from 240,000 to 82,000. Select ALL appropriate nursing actions.",
    options:["Notify the provider and anticipate discontinuing all heparin products","Draw labs for HIT antibody testing","Administer vitamin K to reverse anticoagulation","Avoid ALL heparin products, including heparin flushes and heparin-coated lines","Monitor for signs of new or worsening thrombosis","Apply compression stockings and continue heparin"],
    correct:[0,1,3,4], rationale:"HIT (heparin-induced thrombocytopenia): >50% platelet drop on days 5–10 = classic. Stop ALL heparin (including flushes). Test for HIT antibodies. Paradoxically, HIT INCREASES clotting risk — monitor for new thrombosis. An alternative anticoagulant (argatroban, bivalirudin) is started. Vitamin K reverses warfarin, not heparin." },

  { id:"m3q24", module:"Module 3", section:3, type:"casestudy", diff:3, concept:"Anticoagulation — Warfarin Bridge",
    stem:"[Case Study C] The patient is transitioned from heparin to warfarin 5 mg PO daily. On day 2, the INR is 1.4 (goal 2–3). Which nursing action is most appropriate?",
    options:["Hold the warfarin — the INR is supratherapeutic","Continue warfarin as ordered — INR takes 3–5 days to reach therapeutic range","Administer vitamin K to speed up warfarin's effect","Double the dose to achieve therapeutic INR faster"],
    correct:[1], rationale:"Warfarin takes 3–5 days to achieve full effect (must deplete existing clotting factors). INR of 1.4 on day 2 is EXPECTED — continue as ordered. The heparin bridge provides anticoagulation during transition. Never double dose without an order. Vitamin K antagonizes warfarin — it would lower the INR further." },

  { id:"m3q25", module:"Module 3", section:3, type:"sata", diff:3, concept:"High-Alert Medications",
    stem:"A new nurse asks which medications require an independent double-check before administration. Select ALL that are classified as HIGH-ALERT and require extra safety measures.",
    options:["Insulin infusions","Oral ibuprofen 400 mg","IV heparin infusions","Oral amoxicillin 500 mg","Concentrated electrolytes (KCl, hypertonic saline)","Hydromorphone (Dilaudid) IV","Oral metoprolol tablet"],
    correct:[0,2,4,5], rationale:"ISMP high-alert medications: insulin, anticoagulants (heparin), concentrated electrolytes, and IV opioids — all require independent double-checks. Routine oral antibiotics and standard oral beta-blockers are not on the high-alert list, though beta blockers have hold parameters." },

  { id:"m3q26", module:"Module 3", section:3, type:"mcq", diff:3, concept:"Medication Reconciliation — Drug Interaction",
    stem:"A patient admitted from home takes warfarin 5 mg/day (for A-fib) and self-prescribed aspirin 325 mg/day. INR on admission is 3.9. Which action is the priority?",
    options:["Continue both — they are both prescribed by providers","Notify the provider about the combination and supratherapeutic INR — both agents increase bleeding risk synergistically","Administer the aspirin with food to reduce GI risk","Hold the warfarin only until INR drops to therapeutic range"],
    correct:[1], rationale:"Warfarin + aspirin = synergistic bleeding risk (anticoagulation + platelet inhibition). INR 3.9 is already supratherapeutic. The nurse must identify the interaction and notify the provider — not independently alter the medication regimen. This is a key medication reconciliation priority." },

  { id:"m3q27", module:"Module 3", section:3, type:"bowtie", diff:3, concept:"Opioid Overdose — Rapid Response",
    stem:"A patient 2 hours post-op received morphine 6 mg IV. The nurse finds the patient unresponsive to verbal stimuli, RR 6 breaths/min, SpO2 82%, bilaterally pinpoint pupils. Select the THREE priority interventions.",
    options:["Stimulate the patient and reassess in 15 minutes","Administer naloxone (Narcan) 0.4 mg IV, titrate to respiratory effort per protocol","Call for the rapid response team immediately","Position supine and apply supplemental oxygen via non-rebreather mask","Hold all future opioid doses until the patient is more alert"],
    correct:[1,2,3], rationale:"Opioid overdose emergency: (1) call rapid response, (2) administer naloxone, (3) high-flow O2 and position for airway protection. Stimulating and waiting 15 minutes is dangerous with RR of 6 and SpO2 of 82%. Holding future opioids is appropriate but is not an immediate resuscitation priority." },

  { id:"m3q28", module:"Module 3", section:3, type:"sata", diff:3, concept:"Insulin — Hypoglycemia Management",
    stem:"A patient with type 1 diabetes has a morning blood glucose of 52 mg/dL. The patient is alert and able to swallow. Select ALL appropriate nursing interventions.",
    options:["Administer the scheduled morning insulin and recheck in 1 hour","Hold the scheduled insulin dose","Give 15–20 grams of fast-acting carbohydrates (4 oz juice or glucose tablets)","Recheck blood glucose in 15 minutes after treatment","Notify the provider of the hypoglycemic episode","Document the episode and all interventions"],
    correct:[1,2,3,4,5], rationale:"BG 52 = hypoglycemia. HOLD insulin (do NOT give more). Follow the 15-15 rule: 15g fast carbs → recheck in 15 min. Notify the provider. Document everything. If unconscious or unable to swallow → IV dextrose (D50) or glucagon — NOT oral carbs." },

  { id:"m3q29", module:"Module 3", section:3, type:"mcq", diff:3, concept:"Drug-Drug Interaction — CYP450",
    stem:"A patient taking simvastatin (Zocor) 40 mg is newly prescribed clarithromycin (Biaxin) for a respiratory infection. Which action is most appropriate?",
    options:["Administer both medications as prescribed — no clinically significant interaction exists","Notify the provider — clarithromycin inhibits CYP3A4, dramatically increasing simvastatin levels and rhabdomyolysis risk","Administer both but instruct the patient to report muscle pain","Hold both medications until the provider responds"],
    correct:[1], rationale:"Clarithromycin is a potent CYP3A4 inhibitor; simvastatin is a CYP3A4 substrate. Combination → dramatically elevated statin levels → rhabdomyolysis risk. Provider must be notified. May switch to azithromycin or temporarily hold statin during the antibiotic course." },

  { id:"m3q30", module:"Module 3", section:3, type:"sata", diff:3, concept:"Adverse Drug Reactions — Priority",
    stem:"A nurse is monitoring patients on various medications. Select ALL findings that require IMMEDIATE provider notification.",
    options:["Patient on ACE inhibitor develops sudden tongue and lip swelling","Patient on beta blocker has HR of 58 bpm, is asymptomatic","Patient on lithium reports tremors, confusion, and vomiting","Patient on fluoroquinolone antibiotic reports acute tendon pain","Patient on antipsychotic has temp 40.2°C, muscle rigidity, and altered consciousness","Patient on metformin has new eGFR of 28 mL/min"],
    correct:[0,2,3,4], rationale:"A = angioedema (airway emergency with ACE inhibitors — immediate). C = lithium toxicity (narrow therapeutic index, can be fatal — immediate). D = fluoroquinolone tendinopathy (stop drug immediately — tendon rupture risk). E = neuroleptic malignant syndrome (NMS — life-threatening emergency). Asymptomatic bradycardia at 58 on a beta blocker = monitor and notify per protocol, not necessarily immediate. Low eGFR on metformin = hold and notify soon, less acute." },

  // ─── MODULE 4: CARDIOVASCULAR ────────────────────────────────────────────────

  // Section 1 — Foundation (diff 1)
  { id:"m4q1",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"MI Recognition",
    stem:"A patient calls reporting substernal chest pressure radiating to the left jaw, diaphoresis, and nausea for the past 30 minutes. Which response by the nurse is most appropriate?",
    options:["'Take an antacid and call back if the pain gets worse.'","'Come to the clinic when you can — we'll fit you in today.'","'Call 911 immediately — do not drive yourself.'","'Take 2 ibuprofen and apply a heating pad to your chest.'"],
    correct:[2], rationale:"Classic MI symptoms — substernal pressure radiating to jaw, diaphoresis, nausea. Time is myocardium — call 911. Patient should NOT drive (risk of cardiac arrest while driving). Antacids and NSAIDs are inappropriate; NSAIDs can worsen outcomes in ACS." },

  { id:"m4q2",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Heart Failure — Left vs. Right",
    stem:"Which assessment finding is most consistent with LEFT-sided heart failure?",
    options:["Jugular venous distension","Hepatomegaly and ascites","Bilateral pitting edema of the ankles","Crackles (rales) at the bilateral lung bases"],
    correct:[3], rationale:"Left-sided HF → backup into pulmonary circulation → pulmonary edema → crackles. Right-sided HF → backup into systemic circulation → JVD, peripheral edema, hepatomegaly, ascites. KEY: Left = Lungs, Right = Rest of body." },

  { id:"m4q3",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Cardiac Biomarkers",
    stem:"Which cardiac biomarker is the MOST sensitive and specific indicator for myocardial infarction and is considered the gold standard for diagnosis?",
    options:["CK-MB (creatine kinase-MB isoenzyme)","Myoglobin","Troponin I or Troponin T","BNP (B-type natriuretic peptide)"],
    correct:[2], rationale:"Troponin I and T are the gold standard for MI — highly sensitive and specific. Rise in 3–6 hrs, peak 12–24 hrs, remain elevated 7–14 days. CK-MB rises faster but is less specific. Myoglobin is early but nonspecific. BNP is a heart failure marker, not MI." },

  { id:"m4q4",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Nitroglycerin — Patient Teaching",
    stem:"A patient with chest pain is prescribed SL nitroglycerin 0.4 mg PRN (up to 3 doses, 5 minutes apart). Which additional teaching point is most important?",
    options:["'Nitroglycerin must be swallowed whole — do not let it dissolve under your tongue.'","'If chest pain is unrelieved after 3 doses in 15 minutes, call 911 immediately.'","'Avoid all physical activity for 24 hours after taking nitroglycerin.'","'You can store the tablet in your pocket next to your body for quick access.'"],
    correct:[1], rationale:"If no relief after 3 SL NTG doses (15 min) → call 911 immediately. This is a core teaching point — persistent pain may mean MI requiring emergency care. NTG is placed SL (under tongue). Store in original dark glass bottle away from heat/light/moisture — NOT in pocket." },

  { id:"m4q5",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Digoxin — Pre-Administration Assessment",
    stem:"Before administering digoxin 0.125 mg PO, the nurse assesses an apical heart rate of 54 bpm. Which action is appropriate?",
    options:["Administer the dose as ordered — this is within the expected range","Hold the dose and notify the provider","Administer half the dose and recheck in 1 hour","Give the dose and document the bradycardia"],
    correct:[1], rationale:"Hold digoxin if apical HR < 60 bpm (adult) and notify the provider. Digoxin slows AV node conduction — giving it with a HR of 54 could cause dangerous bradycardia or heart block. Never give half a dose without an order." },

  { id:"m4q6",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Normal Sinus Rhythm",
    stem:"A telemetry strip shows: regular rhythm, rate 72 bpm, P wave before every QRS, QRS duration 0.08 seconds, PR interval 0.16 seconds. Which interpretation is correct?",
    options:["Atrial fibrillation","Normal sinus rhythm","Second-degree AV block, type I","Ventricular tachycardia"],
    correct:[1], rationale:"NSR criteria: regular rhythm, rate 60–100, P wave before every QRS, normal PR (0.12–0.20s), normal QRS (<0.12s). A-fib = no P waves, irregularly irregular. V-tach = wide QRS, no P waves, rate >100." },

  { id:"m4q7",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"Hypertension — Lifestyle",
    stem:"A patient newly diagnosed with stage 1 hypertension asks what lifestyle change has the most evidence-based impact on blood pressure reduction.",
    options:["Increasing calcium intake through dairy products","Reducing dietary sodium intake to <2,300 mg/day and following the DASH diet","Eliminating all dietary fat","Increasing vitamin C supplementation"],
    correct:[1], rationale:"The DASH diet (reduce sodium, increase fruits/vegetables/low-fat dairy) is the most evidence-based dietary intervention for hypertension. Other key lifestyle factors: weight loss, exercise, moderate alcohol, smoking cessation. Vitamin C and fat elimination alone are not specific to BP management." },

  { id:"m4q8",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"DVT Prevention",
    stem:"A post-surgical patient is on bed rest following knee replacement surgery. Which intervention is the priority for DVT prevention?",
    options:["Vigorously massage both lower extremities every 4 hours","Encourage leg crossing to promote venous return","Apply sequential compression devices (SCDs) to both lower extremities as ordered","Keep the patient on strict bed rest for 5 days"],
    correct:[2], rationale:"SCDs promote venous return and prevent DVT — priority intervention. Massage is CONTRAINDICATED if DVT is suspected (can dislodge a clot → PE). Leg crossing compresses veins and INCREASES DVT risk. Early ambulation (not prolonged bed rest) is standard post-op care." },

  { id:"m4q9",  module:"Module 4", section:1, type:"mcq", diff:1, concept:"V-Fib — Defibrillation",
    stem:"A nurse responds to a patient in cardiac arrest. The monitor shows ventricular fibrillation. Which intervention is the priority?",
    options:["Administer epinephrine 1 mg IV push","Defibrillate (unsynchronized shock) immediately","Begin CPR for 2 minutes before defibrillating","Administer amiodarone 300 mg IV push"],
    correct:[1], rationale:"V-fib = no pulse, no cardiac output. PRIORITY = defibrillation (unsynchronized). Every minute without defibrillation, survival drops ~10%. If defibrillator is available, SHOCK FIRST. CPR before if defibrillator not yet available. Epinephrine and amiodarone come later in the ACLS algorithm." },

  { id:"m4q10", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Orthostatic Hypotension",
    stem:"A patient on antihypertensives reports dizziness when standing up quickly from bed. Which nursing intervention is most appropriate?",
    options:["Increase the antihypertensive dose to stabilize blood pressure","Instruct the patient to rise slowly: sit at the edge of the bed 1–2 minutes before standing","Place the patient in Trendelenburg position","Restrict the patient to bed rest until dizziness resolves"],
    correct:[1], rationale:"Orthostatic hypotension: BP drop >20 mmHg systolic or >10 mmHg diastolic upon standing. Teaching: rise slowly, dangle legs first. Fall prevention is critical. Increasing antihypertensives would worsen symptoms. Trendelenburg is not indicated." },

  // Section 2 — Application (diff 2)
  { id:"m4q11", module:"Module 4", section:2, type:"mcq", diff:2, concept:"MI — Priority Action",
    stem:"A nurse finds a patient pale and diaphoretic, clutching the chest. VS: BP 88/60, HR 118, RR 24, SpO2 90%. What is the nurse's priority action?",
    options:["Obtain a 12-lead EKG immediately","Activate the rapid response team / emergency response system","Administer sublingual nitroglycerin for chest pain","Draw cardiac enzymes (troponin, CK-MB)"],
    correct:[1], rationale:"Patient is hemodynamically unstable (hypotension, tachycardia, hypoxia) — potential MI with cardiogenic shock. Priority = activate rapid response/code team immediately. NTG is CONTRAINDICATED with systolic BP < 90 (worsens hypotension). EKG and labs follow, but team activation comes first." },

  { id:"m4q12", module:"Module 4", section:2, type:"sata", diff:2, concept:"Heart Failure — Assessment",
    stem:"A patient is admitted for HF exacerbation. Select ALL findings consistent with this diagnosis.",
    options:["S3 gallop on cardiac auscultation","Bradycardia 48 bpm","Bilateral crackles at the lung bases","Jugular venous distension at 45 degrees","Daily weight gain of 3 lbs over the past 3 days","Decreased BNP level"],
    correct:[0,2,3,4], rationale:"HF findings: S3 gallop (volume overload), crackles (pulmonary edema), JVD (right-sided or biventricular backup), weight gain (fluid retention). BNP is ELEVATED in HF. Bradycardia is not a typical HF finding." },

  { id:"m4q13", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Atrial Fibrillation — Anticoagulation",
    stem:"A patient with newly diagnosed A-fib is prescribed warfarin. Which statement best explains the rationale for anticoagulation?",
    options:["Warfarin converts A-fib to normal sinus rhythm","Warfarin prevents clot formation in the atria, reducing stroke risk from emboli","Warfarin slows the ventricular rate in A-fib","Warfarin prevents the atria from fibrillating again after cardioversion"],
    correct:[1], rationale:"A-fib → atria quiver → blood pools → clots form → embolize to brain = STROKE. Anticoagulation (warfarin, DOACs) reduces this risk. Rate control (beta blockers, calcium channel blockers) slows ventricular rate. Rhythm control (cardioversion, antiarrhythmics) restores NSR. Warfarin does neither of those." },

  { id:"m4q14", module:"Module 4", section:2, type:"sata", diff:2, concept:"Post-PCI Nursing Care",
    stem:"A patient returns to the unit after primary PCI for STEMI via the right femoral artery. Select ALL appropriate nursing interventions in the first 4 hours.",
    options:["Assess the femoral puncture site for bleeding, hematoma, or bruit per protocol","Keep patient NPO for 24 hours post-procedure","Monitor ECG continuously for reperfusion dysrhythmias","Monitor urine output — contrast dye can be nephrotoxic","Ambulate the patient immediately to prevent DVT","Assess neurovascular status of the right lower extremity"],
    correct:[0,2,3,5], rationale:"Post-femoral PCI: monitor access site (retroperitoneal bleed risk), cardiac monitoring (reperfusion arrhythmias), urine output (contrast nephrotoxicity), neurovascular checks of limb. Leg must be kept STRAIGHT and HOB ≤30° initially (varies by protocol). NPO is not required post-PCI." },
