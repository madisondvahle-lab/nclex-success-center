    correct:[0, 1, 3, 4], rationale:"PE classic signs: sudden dyspnea (A), pleuritic chest pain (B), tachycardia (D), hemoptysis (E). Gradual productive cough (C) = pneumonia. Low-grade fever for 1 week (F) = infection. Key: PE = SUDDEN + UNEXPLAINED. Hemoptysis occurs when pulmonary infarction causes bleeding into the airways." },

  // ── Module 5 Practice Q23,
  { id:"m5pq23", module:"Module 5", section:2, type:"sata", diff:3, concept:"Respiratory/Renal",
    stem:"The nurse is reviewing ABGs for a patient with persistent vomiting and NG suctioning. Which finding is expected? SELECT ALL THAT APPLY.",
    options:["pH > 7.45", "HCO₃⁻ > 26 mEq/L", "PaCO₂ < 35 mmHg", "Metabolic alkalosis", "Respiratory acidosis", "PaCO₂ compensatory increase"],
    correct:[0, 1, 3, 5], rationale:"Vomiting/NG suction → loss of HCl (acid) → metabolic alkalosis: pH↑ (A), HCO₃⁻↑ (B), diagnosis = metabolic alkalosis (D). Lungs compensate: hypoventilate → retain CO₂ → PaCO₂ rises (F). The PaCO₂ does NOT fall in metabolic alkalosis (C is wrong). Respiratory acidosis (E) is incorrect — this is a metabolic problem." },

  // ── Module 5 Practice Q24,
  { id:"m5pq24", module:"Module 5", section:2, type:"sata", diff:3, concept:"Respiratory/Renal",
    stem:"Which nursing actions are appropriate for a patient with a chest tube? SELECT ALL THAT APPLY.",
    options:["Keep drainage system below chest level at all times", "Clamp the tube when the patient ambulates to the hallway", "Assess drainage color, amount, and consistency each shift", "Maintain the water seal chamber", "Strip the tubing every 2 hours to prevent clotting", "Report sudden increase in bright red drainage to the provider"],
    correct:[0, 2, 3, 5], rationale:"Correct chest tube care: keep below chest level (A), assess drainage (C), maintain water seal (D), report sudden bright red blood (F — may indicate hemorrhage). Never clamp without a specific order (B — risk tension pneumo). Never strip tubing (E — causes excessive negative pressure and can dislodge clots dangerously)." },

  // ── Module 5 Practice Q25,
  { id:"m5pq25", module:"Module 5", section:2, type:"sata", diff:3, concept:"Respiratory/Renal",
    stem:"A nurse is caring for a patient who is orally intubated and on mechanical ventilation. The high-pressure alarm sounds repeatedly. Which actions should the nurse take? SELECT ALL THAT APPLY.",
    options:["Suction the airway for secretions", "Silence the alarm to reduce patient anxiety", "Check tubing for kinks", "Assess whether patient is biting the tube", "Administer ordered bronchodilator if bronchospasm suspected", "Increase the tidal volume on the ventilator"],
    correct:[0, 2, 3, 4], rationale:"High-pressure = obstruction. Address causes: suction (A), check kinks (C), assess biting (D — provide bite block), bronchodilator for bronchospasm (E). NEVER silence the alarm without fixing the cause (B). Do not independently change tidal volume settings (F) — that requires RT/provider order." },

  // ── Module 5 Practice Q26,
  { id:"m5pq26", module:"Module 5", section:2, type:"mcq", diff:3, concept:"Medication Safety",
    stem:"A patient is brought to the ED with respiratory distress. Assessment reveals SpO₂ 82%, RR 32, tracheal deviation to the right, absent breath sounds on the left, and hypotension. What condition does this suggest, and what is the priority action?",
    options:["Left-sided pneumonia — obtain sputum culture and start antibiotics", "Tension pneumothorax — prepare for immediate needle decompression", "Pulmonary embolism — start heparin drip immediately", "ARDS — increase PEEP on the ventilator"],
    correct:[1], rationale:"Tension pneumothorax: tracheal deviation AWAY from affected side (to the right = left-sided tension pneumo), absent breath sounds on affected side, hypotension, severe respiratory distress. This is a life-threatening emergency requiring IMMEDIATE needle decompression (2nd intercostal space, midclavicular line) — do not wait for CXR. This is the highest-acuity respiratory emergency." },
  { id:"m5qq1", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"COPD patients should have O₂ titrated to SpO₂:",
    options:["95–100%", "88–92%", "80–85%"],
    correct:[1], rationale:"Target 88–92% for COPD. Higher O₂ suppresses the hypoxic drive → hypoventilation → CO₂ narcosis." },
  { id:"m5qq2", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A silent chest in an asthma patient means:",
    options:["The patient is improving", "No airflow — status asthmaticus emergency", "The patient just used their inhaler"],
    correct:[1], rationale:"Silent chest = no air movement = worst-case asthma. Call for help immediately." },
  { id:"m5qq3", module:"Module 5", section:3, type:"mcq", diff:2, concept:"ACE Inhibitors",
    stem:"The minimum flow rate for a simple face mask is:",
    options:["2 L/min", "4 L/min", "6 L/min"],
    correct:[2], rationale:"Minimum 6 L/min — below this, exhaled CO₂ accumulates in the mask. Use nasal cannula for lower flows." },
  { id:"m5qq4", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"ROME stands for:",
    options:["Respiratory Opposite, Metabolic Equal", "Respiratory Only, Metabolic Extreme", "Respiratory Output, Metabolic Exchange"],
    correct:[0], rationale:"Respiratory = Opposite (pH and CO₂ go opposite directions). Metabolic = Equal (pH and HCO₃⁻ go same direction)." },
  { id:"m5qq5", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"You should NEVER ___ a chest tube:",
    options:["Keep below chest level", "Clamp it", "Maintain the water seal"],
    correct:[1], rationale:"Never clamp — can cause tension pneumothorax. Keep below chest level and maintain the water seal." },
  { id:"m5qq6", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"Think PE when symptoms are:",
    options:["Gradual and productive", "Sudden and unexplained", "Worse at night only"],
    correct:[1], rationale:"PE = SUDDEN + UNEXPLAINED dyspnea, tachycardia, and/or chest pain. PE's first sign may be only tachycardia." },
  { id:"m5qq7", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A high-pressure vent alarm most likely means:",
    options:["Disconnection", "Extubation", "Secretions, kink, or bronchospasm"],
    correct:[2], rationale:"High pressure = obstruction (secretions, kink, biting, bronchospasm). Suction, check tubing, give bronchodilator." },
  { id:"m5qq8", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"Fluticasone (Flovent) requires rinsing the mouth after use to prevent:",
    options:["Dry mouth", "Oral thrush (candidiasis)", "Metallic taste"],
    correct:[1], rationale:"Inhaled steroids deposit in the oral mucosa → thrush (Candida). Always rinse and gargle after ICS use." },
  { id:"m5qq9", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"Stridor indicates:",
    options:["Lower airway secretions", "Upper airway obstruction — emergency", "Fluid in the alveoli"],
    correct:[1], rationale:"Stridor = upper airway obstruction (croup, anaphylaxis, foreign body). High-pitched, inspiratory. Act immediately." },
  { id:"m5qq10", module:"Module 5", section:3, type:"mcq", diff:2, concept:"Antibiotics",
    stem:"Before giving the first antibiotic dose for pneumonia, the nurse must:",
    options:["Give antipyretics first", "Obtain a sputum culture", "Ensure the patient is NPO"],
    correct:[1], rationale:"Culture before antibiotics — always. Antibiotics will contaminate cultures and make organism identification impossible." },

  // ── Module 6 Practice Q1,
  { id:"m6pq1", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Electrolytes",
    stem:"A patient's potassium level is 6.4 mEq/L. The nurse reviews the ECG strip. Which finding is MOST expected?",
    options:["Flattened T waves and U waves", "Peaked T waves", "Prolonged QT interval", "Widened P waves"],
    correct:[1], rationale:"Hyperkalemia → peaked (tall, narrow, tent-shaped) T waves are the FIRST ECG change. This is the hallmark of hyperkalemia. Flattened T waves and U waves = hypokalemia. Prolonged QT = hypocalcemia. Peaked T → progresses to widened QRS → sine wave → V-fib." },

  // ── Module 6 Practice Q2,
  { id:"m6pq2", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Electrolytes",
    stem:"A nurse is preparing to administer IV potassium chloride 20 mEq in 100 mL NS over 1 hour. Which action is most important before starting the infusion?",
    options:["Obtain a 12-lead ECG", "Verify urine output is at least 30 mL/hr", "Administer a test dose of 5 mEq first", "Position the patient in Trendelenburg"],
    correct:[1], rationale:"Adequate urine output (≥30 mL/hr) is essential before IV K+ — the kidneys must be able to excrete excess potassium. If the patient is oliguric and you give IV K+, levels will rise to dangerous levels. A 12-lead ECG is good practice but not the priority check. There is no 'test dose' for KCl." },

  // ── Module 6 Practice Q3,
  { id:"m6pq3", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Digoxin",
    stem:"A patient with heart failure is prescribed furosemide and digoxin. The morning potassium level returns at 3.2 mEq/L. What is the nurse's priority action?",
    options:["Administer both medications as scheduled", "Hold the furosemide and give digoxin", "Hold the digoxin and notify the provider about the low potassium", "Give both medications and recheck potassium in 4 hours"],
    correct:[2], rationale:"Hold digoxin when K⁺ is below 3.5. Hypokalemia increases myocardial sensitivity to digoxin → toxicity risk even at therapeutic levels. Notify the provider — K+ replacement is needed before resuming digoxin. Furosemide also wastes K+, so both issues need to be addressed together." },

  // ── Module 6 Practice Q4,
  { id:"m6pq4", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Hold/Give Decision",
    stem:"A patient is admitted with Na⁺ of 118 mEq/L and is having a seizure. Which IV fluid does the nurse anticipate the provider will order?",
    options:["0.9% Normal Saline", "0.45% Normal Saline", "3% Normal Saline", "Lactated Ringer's"],
    correct:[2], rationale:"Severe symptomatic hyponatremia (seizure, Na < 120) requires hypertonic saline (3% NS) to rapidly raise sodium and decrease cerebral edema. 0.9% NS is isotonic and will raise Na⁺ but too slowly for a seizing patient. 0.45% NS is hypotonic and would worsen hyponatremia. LR contains K+ but won't adequately treat this." },

  // ── Module 6 Practice Q5,
  { id:"m6pq5", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Electrolytes",
    stem:"Which patient is at HIGHEST risk for developing hypokalemia?",
    options:["A patient with renal failure on a low-potassium diet", "A patient with heart failure receiving furosemide 80 mg daily", "A patient post-op who is NPO and receiving 0.9% NS IV", "A patient with hyperparathyroidism"],
    correct:[1], rationale:"Furosemide (loop diuretic) causes significant renal wasting of potassium, magnesium, and sodium. High-dose furosemide in HF patients is a classic setup for hypokalemia. Renal failure causes hyperkalemia (can't excrete K). NPO on NS doesn't cause significant K loss. Hyperparathyroidism relates to calcium." },

  // ── Module 6 Practice Q6,
  { id:"m6pq6", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Endocrine/Neuro",
    stem:"A nurse assesses a patient 12 hours after a total thyroidectomy. The patient complains of tingling around the mouth and cramping in the hands. The nurse taps the facial nerve and observes facial twitching. What is the priority action?",
    options:["Document findings and reassess in 2 hours", "Administer the prescribed oral calcium supplement", "Notify the provider immediately and anticipate IV calcium gluconate order", "Encourage the patient to drink a glass of milk"],
    correct:[2], rationale:"Positive Chvostek's sign + perioral tingling + hand cramping = symptomatic hypocalcemia post-thyroidectomy — a medical urgency. Notify provider immediately. IV calcium gluconate is the treatment for symptomatic hypocalcemia. Oral calcium is too slow for symptomatic patients. Milk is not appropriate for acute symptomatic hypocalcemia." },

  // ── Module 6 Practice Q7,
  { id:"m6pq7", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Hold/Give Decision",
    stem:"A nurse is administering IV magnesium sulfate. Which assessment finding requires the nurse to stop the infusion immediately?",
    options:["The patient reports feeling flushed and warm", "The patient's deep tendon reflexes are absent", "The patient's blood pressure drops from 128/82 to 118/76", "The patient's respiratory rate is 14"],
    correct:[1], rationale:"Absent deep tendon reflexes (DTRs) = magnesium toxicity — this is the first warning sign before respiratory depression and cardiac arrest. STOP the infusion, call the provider, and have calcium gluconate (the antidote) ready. Flushing and warmth are expected with Mg infusion. Mild BP drop and RR of 14 are not immediately dangerous with Mg infusion." },

  // ── Module 6 Practice Q8,
  { id:"m6pq8", module:"Module 6", section:1, type:"mcq", diff:1, concept:"Endocrine/Neuro",
    stem:"A patient is admitted with severe diarrhea for 4 days. Which set of findings is MOST expected?",
    options:["HR 58, BP 148/90, crackles, JVD", "HR 118, BP 90/60, dry mucous membranes, skin tenting", "HR 90, BP 122/78, 2+ pitting edema, weight gain of 3 kg", "HR 76, BP 126/80, clear lung sounds, moist mucous membranes"],
    correct:[1], rationale:"Severe diarrhea → fluid volume deficit (FVD) → tachycardia (compensatory, first sign), hypotension, dry mucous membranes, poor skin turgor. The first vital sign change in FVD is tachycardia — hypotension comes later. The other options describe fluid volume excess or normal findings." },

  // ── Module 6 Practice Q9,
  { id:"m6pq9", module:"Module 6", section:1, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"A nurse is caring for a patient with third-spacing following major abdominal surgery. The patient has 3+ pitting edema but HR is 112 and BP is 90/58. What is the appropriate treatment?",
    options:["Administer furosemide IV to reduce the edema", "Restrict IV fluids to prevent worsening edema", "Administer isotonic IV fluids as ordered to support vascular volume", "Elevate all four extremities and monitor closely"],
    correct:[2], rationale:"Third spacing: fluid is trapped in non-functional compartments (edema, ascites, surgical space). Despite visible edema, the vascular space is depleted → hypovolemia (tachycardia, hypotension). Treatment: isotonic IV fluids to expand the vascular volume. Diuretics would worsen hypovolemia. Fluid restriction would also worsen shock. The edema resolves when the underlying condition is treated and fluid remobilizes." },

  // ── Module 6 Practice Q10,
  { id:"m6pq10", module:"Module 6", section:1, type:"mcq", diff:2, concept:"ACE Inhibitors",
    stem:"A patient's potassium is 2.8 mEq/L and magnesium is 1.1 mEq/L. The nurse administers KCl replacement as ordered, but after two doses the K+ remains at 2.9. What should the nurse suspect?",
    options:["The patient is not absorbing oral potassium", "The low magnesium is preventing potassium correction", "The patient needs a higher dose of KCl", "The lab results are inaccurate and should be redrawn"],
    correct:[1], rationale:"Hypomagnesemia prevents potassium correction — this is the key clinical pearl. Mg is required for the Na-K-ATPase pump to work properly. Until Mg is repleted, K will not correct regardless of how much KCl is given. The correct action is to notify the provider and anticipate a magnesium replacement order." },

  // ── Module 6 Practice Q11,
  { id:"m6pq11", module:"Module 6", section:1, type:"mcq", diff:2, concept:"IV Medications",
    stem:"Which IV fluid is MOST appropriate for a patient in hypovolemic shock with a BP of 78/50?",
    options:["0.45% Normal Saline", "D5W", "0.9% Normal Saline or Lactated Ringer's", "3% Normal Saline"],
    correct:[2], rationale:"Isotonic fluids (0.9% NS or LR) are used for volume resuscitation — they stay in the vascular space and expand blood volume. Hypotonic fluids (0.45% NS, D5W) would shift into cells and worsen hypotension. Hypertonic (3% NS) would pull fluid into vessels but is too concentrated for rapid large-volume resuscitation and can cause hypernatremia." },

  // ── Module 6 Practice Q12,
  { id:"m6pq12", module:"Module 6", section:1, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"A patient with hypercalcemia is prescribed treatment. Which order is MOST expected?",
    options:["0.45% Normal Saline IV + thiazide diuretic", "0.9% Normal Saline IV + furosemide", "Calcium gluconate IV", "Fluid restriction and potassium supplementation"],
    correct:[1], rationale:"Hypercalcemia treatment: isotonic NS IV (dilutes calcium and promotes renal excretion) + loop diuretic (furosemide — promotes Ca excretion in urine). Thiazide diuretics actually CAUSE hypercalcemia (retain Ca) — never use for hypercalcemia. Calcium gluconate would worsen it. Fluid restriction is for hyponatremia, not hypercalcemia." },

  // ── Module 6 Practice Q13,
  { id:"m6pq13", module:"Module 6", section:2, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"A nurse is caring for a patient with SIADH. Which finding is consistent with this diagnosis?",
    options:["Na⁺ 152, serum osmolality high, urine dilute", "Na⁺ 118, serum osmolality low, urine concentrated", "Na⁺ 140, K⁺ 2.8, urine dilute", "Na⁺ 148, K⁺ 5.2, urine dilute"],
    correct:[1], rationale:"SIADH: excess ADH causes water retention → dilutional hyponatremia (Na⁺ low), serum is dilute (low osmolality), but urine is paradoxically concentrated (ADH tells kidneys to retain water and concentrate urine). Classic: low serum Na + low serum osmolality + high urine osmolality. Treatment: fluid restriction." },

  // ── Module 6 Practice Q14,
  { id:"m6pq14", module:"Module 6", section:2, type:"mcq", diff:2, concept:"Diuretics",
    stem:"A nurse is assessing a patient who is on a loop diuretic and reporting muscle weakness and fatigue. Which electrolyte imbalance is MOST likely?",
    options:["Hyperkalemia", "Hypernatremia", "Hypokalemia", "Hypercalcemia"],
    correct:[2], rationale:"Loop diuretics (furosemide) waste potassium → hypokalemia. Classic symptoms: muscle weakness, fatigue, leg cramps, constipation, and flattened T waves on ECG. This is one of the most common NCLEX setups — patient on diuretic + muscle weakness = check potassium first." },

  // ── Module 6 Practice Q15,
  { id:"m6pq15", module:"Module 6", section:2, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"A patient's daily weight shows a gain of 2.2 kg (approximately 5 lb) overnight. What is the nurse's interpretation?",
    options:["The patient likely ate a large meal", "This represents approximately 2 liters of fluid retention", "The scale is likely inaccurate", "This is expected variation in daily weights"],
    correct:[1], rationale:"1 kg weight gain = approximately 1 liter of fluid retention. A 2.2 kg gain = ~2.2 liters of fluid retained overnight — this is significant and not normal variation. Notify the provider. This is a classic finding in fluid volume excess (HF, renal failure). Daily weights are the most sensitive monitor for fluid changes — more reliable than intake/output measurements." },

  // ── Module 6 Practice Q16,
  { id:"m6pq16", module:"Module 6", section:2, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"Which statement about hyponatremia correction is correct?",
    options:["Correct as fast as possible to prevent seizures", "Sodium should be corrected no faster than 8–12 mEq/L per 24 hours", "Use 3% NS for all cases of hyponatremia", "Fluid restriction is never appropriate for hyponatremia"],
    correct:[1], rationale:"Sodium must be corrected SLOWLY — no faster than 8–12 mEq/L per 24 hours. Rapid correction of hyponatremia causes osmotic demyelination syndrome (ODS/central pontine myelinolysis) — irreversible neurological damage. 3% NS is only for severe/symptomatic cases. Fluid restriction is the primary treatment for SIADH-related hyponatremia." },

  // ── Module 6 Practice Q17,
  { id:"m6pq17", module:"Module 6", section:2, type:"mcq", diff:3, concept:"Endocrine/Neuro",
    stem:"A patient is admitted with renal failure. Which electrolyte imbalance is the nurse MOST concerned about?",
    options:["Hyponatremia", "Hypokalemia", "Hyperkalemia", "Hypocalcemia"],
    correct:[2], rationale:"Renal failure → kidneys cannot excrete potassium → hyperkalemia. This is the most immediately life-threatening complication of renal failure because of the risk of fatal cardiac arrhythmias. Monitor K+ closely in all renal failure patients. Dietary K restriction is standard. Dialysis removes potassium when levels are critically high." },

  // ── Module 6 Practice Q18,
  { id:"m6pq18", module:"Module 6", section:2, type:"sata", diff:3, concept:"Electrolytes",
    stem:"A nurse is teaching a patient with chronic hypokalemia about dietary sources of potassium. Which foods should the nurse include? SELECT ALL THAT APPLY.",
    options:["Bananas", "White bread", "Oranges", "Avocados", "Potatoes", "Butter"],
    correct:[0, 2, 3, 4], rationale:"High-potassium foods: bananas, oranges, avocados, potatoes, tomatoes, leafy greens, cantaloupe, beans, nuts. White bread and butter are low in potassium. The classic NCLEX-tested high-K foods: bananas, oranges, potatoes, avocados." },

  // ── Module 6 Practice Q19,
  { id:"m6pq19", module:"Module 6", section:2, type:"sata", diff:3, concept:"Hold/Give Decision",
    stem:"Which nursing assessments are required BEFORE administering IV magnesium sulfate? SELECT ALL THAT APPLY.",
    options:["Deep tendon reflexes", "Respiratory rate", "Blood glucose", "Urine output", "Serum potassium", "Blood pressure"],
    correct:[0, 1, 3, 5], rationale:"Before IV Mg: check DTRs (absent = hold), RR ≥12 (respiratory depression risk), UO ≥25-30 mL/hr (Mg excreted by kidneys), BP (Mg can cause vasodilation/hypotension). Blood glucose and serum potassium are not specific pre-assessments for IV Mg. Calcium gluconate must also be at bedside as antidote." },

  // ── Module 6 Practice Q20,
  { id:"m6pq20", module:"Module 6", section:2, type:"mcq", diff:3, concept:"Endocrine/Neuro",
    stem:"A nurse is caring for four patients. Which patient requires IMMEDIATE assessment?",
    options:["Patient A: K⁺ 3.2, complaining of mild leg cramps, on oral KCl replacement", "Patient B: Na⁺ 128, mild confusion, on fluid restriction", "Patient C: K⁺ 6.8 with peaked T waves and widening QRS on monitor", "Patient D: Ca²⁺ 7.9, positive Chvostek's, awaiting IV calcium gluconate order"],
    correct:[2], rationale:"Patient C is the priority — hyperkalemia K⁺ 6.8 with ECG changes (peaked T waves + widening QRS) = imminent cardiac emergency. This can rapidly progress to ventricular fibrillation. Immediate action: notify provider STAT, continuous monitoring, anticipate calcium gluconate (cardiac protection), sodium bicarb, insulin/D50, and Kayexalate orders. The other patients need attention but are not in immediate cardiac danger." },

  // ── Module 6 Practice Q21,
  { id:"m6pq21", module:"Module 6", section:2, type:"mcq", diff:3, concept:"IV Medications",
    stem:"A patient has been receiving isotonic IV fluids post-operatively. Assessment findings include crackles bilaterally, 2+ pitting edema, jugular vein distension, and a weight gain of 3 kg since surgery. What complication has occurred?",
    options:["Third spacing with fluid remobilization", "Fluid volume excess from over-aggressive IV fluid administration", "Hyponatremia from isotonic fluids", "Normal post-operative fluid retention"],
    correct:[1], rationale:"Crackles + JVD + pitting edema + 3 kg weight gain = classic fluid volume excess (hypervolemia). This is over-aggressive IV fluid administration — a common post-operative complication. Treatment: notify provider, anticipate diuretic order (furosemide), semi-Fowler's position, fluid restriction, daily weights, monitor I&O. A 3 kg gain = 3 liters of excess fluid." },

  // ── Module 6 Practice Q22,
  { id:"m6pq22", module:"Module 6", section:2, type:"mcq", diff:3, concept:"Electrolytes",
    stem:"A patient's lab results show: K⁺ 2.6, Mg²⁺ 1.0, Ca²⁺ 7.8. Despite multiple doses of KCl, the potassium remains at 2.7. What is the priority nursing action?",
    options:["Double the dose of KCl and continue monitoring", "Notify the provider that potassium is not correcting — magnesium replacement is likely needed", "Switch from oral to IV potassium", "Check the patient's dietary intake of potassium"],
    correct:[1], rationale:"When K+ does not correct despite adequate replacement, the problem is almost always hypomagnesemia. Mg is required for the Na-K-ATPase pump — without it, potassium leaks out of cells regardless of how much is replaced. Notify the provider and anticipate a magnesium sulfate order. Correct Mg first, then K will correct." },

  // ── Module 6 Practice Q23,
  { id:"m6pq23", module:"Module 6", section:2, type:"sata", diff:3, concept:"IV Medications",
    stem:"Which IV fluid choices are appropriate for a patient with hypernatremia (Na⁺ 158)? SELECT ALL THAT APPLY.",
    options:["0.45% Normal Saline", "0.9% Normal Saline", "D5W", "3% Normal Saline", "Lactated Ringer's"],
    correct:[0, 2], rationale:"Hypernatremia (too much sodium) is treated with HYPOTONIC fluids to dilute the sodium and shift water into cells: 0.45% NS (half normal saline) and D5W (acts as free water once dextrose metabolizes). Isotonic (0.9% NS, LR) would maintain the high sodium level. Hypertonic (3% NS) would worsen hypernatremia critically." },

  // ── Module 6 Practice Q24,
  { id:"m6pq24", module:"Module 6", section:2, type:"mcq", diff:3, concept:"Endocrine/Neuro",
    stem:"A nurse is reviewing orders for a patient in acute renal failure with K⁺ 5.8. Which order should the nurse question?",
    options:["Sodium polystyrene (Kayexalate) 15 g orally", "Cardiac monitoring continuous", "Lactated Ringer's 125 mL/hr IV", "Restrict dietary potassium"],
    correct:[2], rationale:"Lactated Ringer's contains potassium (4 mEq/L) — this should NOT be used in a patient who already has hyperkalemia and renal failure. The nurse should question this order and clarify — 0.9% NS is the appropriate isotonic fluid for this patient. Kayexalate, cardiac monitoring, and K restriction are all appropriate for hyperkalemia." },

  // ── Module 6 Practice Q25,
  { id:"m6pq25", module:"Module 6", section:2, type:"mcq", diff:3, concept:"Cardiac Meds",
    stem:"A patient with suspected fluid volume deficit has the following findings: HR 108, BP 104/72 lying and 88/58 standing. What does the drop in BP from lying to standing indicate?",
    options:["Normal variation in blood pressure with position change", "Orthostatic hypotension — consistent with fluid volume deficit", "Hypertensive urgency", "Neurogenic shock"],
    correct:[1], rationale:"Orthostatic hypotension (a drop in systolic BP ≥20 mmHg or diastolic ≥10 mmHg when moving from lying to standing) is a hallmark of fluid volume deficit. The vascular space doesn't have enough volume to compensate for the position change. This patient has a 16 mmHg systolic drop — significant. Orthostatic hypotension = high fall risk — implement fall precautions and notify provider." },
  { id:"m6qq1", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"What is the FIRST ECG change seen in hyperkalemia?",
    options:["Flattened T waves", "Peaked T waves", "Prolonged QT"],
    correct:[1], rationale:"Peaked (tall, narrow, tent-shaped) T waves are the first ECG change in hyperkalemia. This progresses to widened QRS → sine wave → V-fib." },
  { id:"m6qq2", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Electrolytes",
    stem:"What is the maximum rate for IV potassium via a peripheral line?",
    options:["5 mEq/hr", "10 mEq/hr", "20 mEq/hr"],
    correct:[1], rationale:"Maximum 10 mEq/hr peripheral. Central lines allow up to 20 mEq/hr. Always via infusion pump — never IV push." },
  { id:"m6qq3", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"Chvostek's sign is tested by:",
    options:["Inflating BP cuff above systolic", "Tapping the facial nerve below the cheekbone", "Dorsiflexing the foot"],
    correct:[1], rationale:"Tap the facial nerve just below and in front of the ear → facial twitching = positive Chvostek's = hypocalcemia. Trousseau's = inflate BP cuff." },
  { id:"m6qq4", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Digoxin",
    stem:"A patient on furosemide with K⁺ 3.1 is about to receive digoxin. The nurse should:",
    options:["Give digoxin as scheduled", "Hold digoxin and notify the provider", "Give digoxin and recheck K⁺ in 2 hours"],
    correct:[1], rationale:"Hold digoxin when K⁺ < 3.5. Hypokalemia dramatically increases digoxin toxicity risk even at therapeutic levels. Notify provider for K replacement." },
  { id:"m6qq5", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"D5W acts as which type of fluid once the dextrose is metabolized?",
    options:["Isotonic", "Hypertonic", "Hypotonic"],
    correct:[2], rationale:"D5W is isotonic in the bag but acts hypotonic once dextrose is metabolized — leaving only free water. Never use for resuscitation." },
  { id:"m6qq6", module:"Module 6", section:3, type:"mcq", diff:2, concept:"ACE Inhibitors",
    stem:"When potassium replacement fails to correct hypokalemia, what should the nurse suspect?",
    options:["The dose is too low", "Hypomagnesemia is blocking correction", "The lab values are wrong"],
    correct:[1], rationale:"Hypomagnesemia prevents K+ correction — Mg is required for the Na-K pump. Fix Mg first, then K will correct." },
  { id:"m6qq7", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"Which finding indicates fluid volume deficit?",
    options:["JVD, crackles, weight gain", "Tachycardia, dry mucous membranes, dark urine", "Hypertension, pitting edema, S3 heart sound"],
    correct:[1], rationale:"FVD signs: tachycardia (first sign), hypotension, dry mucous membranes, poor skin turgor, dark concentrated urine, ↓UO." },
  { id:"m6qq8", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"Third-spacing patients have edema yet show signs of:",
    options:["Fluid volume excess", "Fluid volume deficit", "Normal fluid balance"],
    correct:[1], rationale:"Third spacing paradox: edema is present but the vascular space is depleted → tachycardia, hypotension, ↓UO. Treat the hypovolemia with IV fluids." },
  { id:"m6qq9", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Antidotes/Toxicity",
    stem:"The antidote for magnesium sulfate toxicity is:",
    options:["Naloxone", "Potassium chloride", "Calcium gluconate"],
    correct:[2], rationale:"Calcium gluconate reverses magnesium toxicity. Keep it at the bedside during any IV Mg infusion. Give if DTRs are absent or RR drops below 12." },
  { id:"m6qq10", module:"Module 6", section:3, type:"mcq", diff:2, concept:"Endocrine/Neuro",
    stem:"How much fluid does a 1 kg weight gain represent?",
    options:["500 mL", "1 liter", "2 liters"],
    correct:[1], rationale:"1 kg = ~1 liter of fluid. Daily weights are the most accurate way to monitor fluid balance. Report gains >1 kg/day to the provider." },

  // MODULE 3 — SECTION 1 PHARMACOLOGY MINDSET (NGN/Advanced)
