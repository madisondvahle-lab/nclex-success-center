  { id:"m4q15", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Hypertensive Emergency vs. Urgency",
    stem:"A patient has BP of 218/132 mmHg with severe headache, blurred vision, and confusion. What finding differentiates a hypertensive EMERGENCY from a hypertensive URGENCY?",
    options:["The severity of the blood pressure elevation","The presence of acute target organ damage (brain, kidneys, heart, eyes)","The patient's history of hypertension","The patient's compliance with antihypertensive medications"],
    correct:[1], rationale:"Hypertensive emergency = severely elevated BP + acute target organ damage (encephalopathy, AKI, aortic dissection, etc.) → requires IV antihypertensives and ICU. Hypertensive urgency = severely elevated BP WITHOUT organ damage → managed with oral medications. The number alone doesn't define emergency vs. urgency." },

  { id:"m4q16", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Pacemaker — Patient Teaching",
    stem:"A patient with a new permanent pacemaker is being discharged. Which teaching point is most important?",
    options:["'Avoid all electronic devices including cell phones and televisions.'","'You can resume all physical activities immediately — the pacemaker is fully protective.'","'Avoid MRI machines unless your pacemaker is specifically MRI-compatible; report dizziness, syncope, or palpitations immediately.'","'You will need to replace the pacemaker battery every 6 months.'"],
    correct:[2], rationale:"MRI is a major concern — magnetic fields can interfere with pacemakers unless the device is MRI-conditional. Symptoms of pacemaker malfunction (dizziness, syncope, palpitations) must be reported immediately. Cell phones are safe >6 inches from the device. Battery life is 5–15 years, not 6 months." },

  { id:"m4q17", module:"Module 4", section:2, type:"sata", diff:2, concept:"Digoxin Toxicity — Early Signs",
    stem:"A nurse is monitoring a patient on digoxin. Select ALL early signs of digoxin toxicity to assess for.",
    options:["Nausea, vomiting, and anorexia","Yellow-green visual halos or blurred vision","Hyperkalemia","Bradycardia","Hypertension","Headache and fatigue"],
    correct:[0,1,3,5], rationale:"Early digoxin toxicity: GI symptoms (nausea, vomiting, anorexia — often FIRST signs), visual disturbances (classic yellow-green halos), bradycardia, fatigue/headache. Hypokalemia WORSENS toxicity risk (not hyperkalemia). Hypertension is not a sign of digoxin toxicity." },

  { id:"m4q18", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Cardiogenic Shock",
    stem:"A patient post-MI develops BP 78/52, HR 124, cold/clammy skin, JVD, bilateral crackles, and reduced urine output. Which type of shock does this most suggest?",
    options:["Distributive (septic) shock","Hypovolemic shock","Cardiogenic shock","Obstructive shock (pulmonary embolism)"],
    correct:[2], rationale:"Cardiogenic shock: post-MI + hypotension + tachycardia + cold/clammy skin (vasoconstriction) + JVD (failure to pump forward → backup) + crackles (pulmonary edema) + oliguria. Septic shock = warm/flushed skin (early) + fever. Hypovolemic = flat neck veins, no JVD. PE = sudden respiratory distress + hypoxia." },

  { id:"m4q19", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Telemetry — Priority Recognition",
    stem:"A nurse monitoring telemetry identifies four patients. Which patient requires MOST immediate nursing response?",
    options:["HR 58, regular rhythm, normal P waves — on metoprolol, asymptomatic","HR 88, irregularly irregular, no P waves — new onset, stable BP","HR 178, wide bizarre QRS, no P waves — patient is diaphoretic and lightheaded","HR 102, narrow QRS, regular — patient just walked to the bathroom"],
    correct:[2], rationale:"Patient C = ventricular tachycardia (wide bizarre QRS, no P waves, HR 178) WITH symptoms = potentially life-threatening, may deteriorate to V-fib. Immediate intervention required. Patient B likely has new A-fib (needs attention but less urgently). Patient A has stable bradycardia on a beta blocker. Patient D has expected post-ambulation sinus tachycardia." },

  { id:"m4q20", module:"Module 4", section:2, type:"sata", diff:2, concept:"Peripheral Arterial Disease vs. Venous Disease",
    stem:"A nurse is comparing findings between peripheral arterial disease (PAD) and chronic venous insufficiency (CVI). Select ALL findings consistent with PAD (arterial disease).",
    options:["Pallor with leg elevation; rubor (redness) with dependency","Leg elevation relieves pain and reduces edema","Claudication — calf pain with activity, relieved by rest","Brawny (brown, hardened) skin discoloration around the ankles","Absent or diminished peripheral pulses","Cool, pale extremity with shiny, hairless skin"],
    correct:[0,2,4,5], rationale:"PAD (arterial): decreased perfusion → pallor on elevation, dependent rubor, claudication, absent/diminished pulses, cool/pale/shiny/hairless skin. CVI (venous): brawny skin, leg elevation relieves symptoms, varicosities. KEY: Elevate for venous relief; lower (gravity increases perfusion) for arterial relief." },

  // Section 3 — NGN (diff 3)
  { id:"m4q21", module:"Module 4", section:3, type:"bowtie", diff:3, concept:"STEMI — Priority Actions",
    stem:"A 58-year-old presents with substernal chest pain 8/10 radiating to the left arm × 45 min, diaphoresis, nausea. 12-lead EKG: ST elevation in leads II, III, aVF. VS: BP 104/68, HR 96, SpO2 94%. Select the THREE priority actions within the first 10 minutes.",
    options:["Administer ibuprofen 600 mg PO for pain relief","Establish two large-bore IVs and draw stat labs (troponin, CBC, CMP, coagulation)","Administer aspirin 325 mg PO (chewed) per protocol","Administer SL nitroglycerin × 3 doses immediately","Notify the cath lab and prepare patient for emergent PCI"],
    correct:[1,2,4], rationale:"Inferior STEMI priorities: (1) IV access + labs, (2) aspirin 325 mg chewed (antiplatelet), (3) activate cath lab for emergent PCI. NSAIDs (ibuprofen) are CONTRAINDICATED in ACS. NTG requires caution with inferior MI (right ventricular involvement possible — RV infarct contraindicates NTG due to preload dependence) and BP is borderline at 104/68." },

  { id:"m4q22", module:"Module 4", section:3, type:"casestudy", diff:3, concept:"Heart Failure — Acute Management",
    stem:"[Case Study A] A 72-year-old with chronic HF presents with 5-lb weight gain in 3 days, dyspnea at rest, bilateral crackles to mid-lungs, SpO2 88% on room air, BNP 1,840 pg/mL. Which intervention is the priority?",
    options:["Encourage aggressive oral fluid intake to maintain renal perfusion","Position supine and apply nasal cannula at 2 L/min","Elevate the HOB to high-Fowler's (60–90°) and apply supplemental oxygen","Administer a 500 mL NS bolus to improve cardiac output"],
    correct:[2], rationale:"Acute pulmonary edema: priority = improve oxygenation. High-Fowler's reduces venous return (preload), eases breathing, and improves gas exchange. High-flow O2 for SpO2 88%. Supine position worsens dyspnea. Fluid bolus and oral fluids are CONTRAINDICATED — they worsen fluid overload." },

  { id:"m4q23", module:"Module 4", section:3, type:"casestudy", diff:3, concept:"Heart Failure — Diuretic Monitoring",
    stem:"[Case Study B] Furosemide 80 mg IV is administered. Select ALL assessments the nurse should prioritize in the next 2 hours.",
    options:["Monitor intake and output hourly","Assess serum potassium and creatinine","Weigh the patient every 4 hours to track fluid loss","Monitor blood pressure for hypotension from over-diuresis","Reassess lung sounds for improvement in crackles","Independently encourage increased potassium-rich foods"],
    correct:[0,1,3,4], rationale:"Post-furosemide: I&O hourly (expected brisk diuresis), K+ and creatinine (loop diuretics waste K+ and can impair renal perfusion), BP monitoring (risk of hypotension), reassess lung sounds for improvement. Weights are tracked daily for HF — not q4h. Potassium replacement requires a provider order." },

  { id:"m4q24", module:"Module 4", section:3, type:"casestudy", diff:3, concept:"Heart Failure — Discharge Teaching",
    stem:"[Case Study C] The patient is improving and discharge teaching is planned. Which patient statement indicates a need for further teaching?",
    options:["'I'll weigh myself every morning before breakfast and call if I gain 2–3 lbs in a day or 5 lbs in a week.'","'I'll limit my fluids to about 1.5–2 liters per day.'","'I can eat as much salt as I want since I'm on a water pill.'","'I'll take my furosemide in the morning so it doesn't disrupt my sleep at night.'"],
    correct:[2], rationale:"'I can eat as much salt as I want' = INCORRECT. Low-sodium diet is essential for HF management (typically <2 g/day). Sodium causes fluid retention and worsens HF. All other statements are correct: daily weights with action parameters, fluid restriction, and morning diuretic dosing." },

  { id:"m4q25", module:"Module 4", section:3, type:"sata", diff:3, concept:"Priority Assessment — Cardiovascular",
    stem:"A nurse receives report on four cardiac patients. Select the patients who require IMMEDIATE assessment before the others.",
    options:["Patient with stable angina, pain 2/10, awaiting stress test in the morning","Patient with bigeminy on telemetry, BP 108/70, reporting mild palpitations","Patient post-MI with sudden onset sharp chest pain that worsens with inspiration","Patient with new-onset A-fib, HR 148, BP 82/50, diaphoretic"],
    correct:[2,3], rationale:"C: New sharp pleuritic chest pain post-MI = pericarditis vs. pulmonary embolism — requires immediate assessment. D: New A-fib with rapid ventricular response + hemodynamic instability (hypotension, diaphoresis) = unstable tachyarrhythmia → immediate intervention (possible cardioversion). Bigeminy with stable vitals is concerning but not immediately life-threatening." },

  { id:"m4q26", module:"Module 4", section:3, type:"mcq", diff:3, concept:"Cardiac Tamponade",
    stem:"A patient post-cardiac surgery develops Beck's Triad: hypotension (BP 80/60), muffled heart sounds, and jugular venous distension. Pulse is rapid and thready at 122 bpm; patient is increasingly anxious. What condition does this suggest, and what is the priority action?",
    options:["Pulmonary embolism — administer anticoagulants immediately","Cardiac tamponade — notify the provider immediately and prepare for emergency pericardiocentesis","Tension pneumothorax — prepare for needle decompression","Hypovolemic shock — administer a rapid 1-liter NS bolus"],
    correct:[1], rationale:"Beck's Triad = cardiac tamponade: hypotension + muffled heart sounds + JVD. Fluid/blood in the pericardial sac compresses the heart → can't fill → decreased CO. Emergency = pericardiocentesis. PE presents with respiratory distress/hypoxia. Pneumothorax = tracheal deviation, absent breath sounds. NS bolus may temporarily support BP but doesn't treat tamponade." },

  { id:"m4q27", module:"Module 4", section:3, type:"bowtie", diff:3, concept:"Acute Pulmonary Edema",
    stem:"A patient with known HF develops sudden severe dyspnea, SpO2 82%, frothy pink-tinged sputum, crackles throughout all lung fields, BP 168/104, HR 132. Select the THREE priority nursing interventions.",
    options:["Position supine to improve venous return to the heart","Apply 100% non-rebreather mask; prepare for possible BiPAP or intubation","Administer furosemide IV as ordered","Administer morphine IV as ordered — reduces preload and anxiety","Restrict all IV access to limit fluid input"],
    correct:[1,2,3], rationale:"Acute pulmonary edema treatment (LMNOP): Lasix (furosemide), Morphine (preload reduction/anxiolysis), Nitrates (vasodilation), Oxygen (high-flow), Position (high-Fowler's). Supine position worsens dyspnea and increases preload. BiPAP/intubation may be needed if O2 doesn't improve. IV access is needed to give IV medications." },

  { id:"m4q28", module:"Module 4", section:3, type:"sata", diff:3, concept:"Post-Cardiac Catheterization Care",
    stem:"A patient returns from diagnostic cardiac catheterization via the right femoral artery. Select ALL appropriate post-procedure nursing actions.",
    options:["Assess the puncture site for bleeding, hematoma, or bruit every 15 minutes per protocol","Encourage the patient to ambulate immediately to prevent DVT","Assess distal pulses, capillary refill, sensation, and warmth of the right lower extremity","Keep the right leg straight and HOB ≤30 degrees for the prescribed duration","Monitor for contrast reaction: urticaria, nausea, or changes in urine output","Restrict oral fluids to prevent fluid overload post-procedure"],
    correct:[0,2,3,4], rationale:"Femoral cath post-care: assess access site frequently (risk of retroperitoneal bleed), neurovascular checks of affected leg, keep leg straight/HOB low per protocol (prevents arterial bleeding at insertion site), and monitor for contrast nephrotoxicity and allergic reaction. Encourage oral fluids (to flush contrast) unless contraindicated. Ambulation is restricted initially — typically 2–6 hours for femoral access." },

  { id:"m4q29", module:"Module 4", section:3, type:"mcq", diff:3, concept:"Aortic Dissection",
    stem:"A patient presents with sudden, tearing chest pain radiating to the back — 'the worst pain of my life.' BP is 182/110 in the right arm and 148/86 in the left arm. Which condition does this suggest and what is the immediate priority?",
    options:["STEMI — administer aspirin and activate the cath lab","Aortic dissection — control BP aggressively with IV antihypertensives and prepare for emergent CT angiography","Pulmonary embolism — initiate anticoagulation therapy immediately","Acute pericarditis — administer NSAIDs and colchicine"],
    correct:[1], rationale:"Classic aortic dissection: tearing/ripping chest pain radiating to back + BP differential between arms (>20 mmHg). Anticoagulants and thrombolytics are CONTRAINDICATED (opposite of MI). Emergency CT angiography confirms diagnosis. IV antihypertensives (labetalol) reduce aortic wall shear stress. Ascending aorta involvement = surgical emergency." },

  { id:"m4q30", module:"Module 4", section:3, type:"sata", diff:3, concept:"V-Fib — ACLS Response",
    stem:"A telemetry patient becomes unresponsive. The monitor shows a chaotic, irregular waveform with no identifiable P waves or QRS complexes. The patient has no pulse. Select ALL priority actions.",
    options:["Call for a 12-lead EKG to confirm the rhythm","Activate the code team / call for help immediately","Defibrillate as soon as the defibrillator is available (unsynchronized shock)","Begin high-quality CPR immediately (100–120 compressions/min, 2-inch depth)","Administer epinephrine 1 mg IV every 3–5 minutes per ACLS protocol","Administer adenosine to convert the rhythm"],
    correct:[1,2,3,4], rationale:"V-fib = ACLS protocol: (1) call for help, (2) CPR immediately, (3) defibrillate ASAP, (4) epinephrine q3–5 min during ongoing CPR. Adenosine treats SVT — not V-fib. A 12-lead EKG is not a priority during active resuscitation — the chaotic waveform with no pulse is sufficient to treat." },,

  // ═══════════════════════════════════════════════════════════
  // MODULE 3–6: QUESTIONS EXTRACTED FROM MODULE FILES
  // ═══════════════════════════════════════════════════════════

  // ── Module 3 Practice Q1,
  { id:"m3pq1", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Digoxin",
    stem:"A nurse is preparing to administer digoxin to a patient. Which finding should cause the nurse to hold the medication and notify the provider?",
    options:["Blood pressure 118/72 mmHg", "Apical pulse of 56 bpm", "Potassium level of 4.1 mEq/L", "Digoxin level of 1.4 ng/mL"],
    correct:[1], rationale:"Digoxin should be held when the apical pulse is below 60 bpm. A HR of 56 warrants holding the dose and notifying the provider. The other values are within normal/therapeutic range." },

  // ── Module 3 Practice Q2,
  { id:"m3pq2", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Vancomycin",
    stem:"A patient is receiving IV vancomycin. Thirty minutes into the infusion, the nurse notices flushing and redness spreading across the patient's face, neck, and chest. What is the priority nursing action?",
    options:["Stop the infusion permanently and document a drug allergy", "Administer epinephrine and notify the physician immediately", "Slow the infusion rate and notify the provider", "Increase the infusion rate to get the drug in faster"],
    correct:[2], rationale:"This presentation is Red Man Syndrome — a rate-related reaction (not a true allergy). The priority action is to slow the infusion rate. Diphenhydramine may be given. This is NOT anaphylaxis; stopping permanently or giving epinephrine is incorrect." },

  // ── Module 3 Practice Q3,
  { id:"m3pq3", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Anticoagulants",
    stem:"A nurse is caring for a patient on warfarin therapy for atrial fibrillation. The patient's INR is 4.8. Which action by the nurse is MOST appropriate?",
    options:["Administer the next dose of warfarin as scheduled", "Hold the dose and notify the provider", "Give the dose with extra vitamin K", "Decrease the dose by half without an order"],
    correct:[1], rationale:"INR 4.8 is supratherapeutic (goal 2–3 for A-fib), significantly increasing bleeding risk. The nurse should hold the dose and notify the provider. Never adjust the dose independently." },

  // ── Module 3 Practice Q4,
  { id:"m3pq4", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Medication Safety",
    stem:"A nurse is preparing to administer morning medications. Which action BEST reflects the right of documentation?",
    options:["Recording the medication given before leaving the patient's room to save time", "Charting the medication after confirming it was administered", "Letting the oncoming nurse document since the shift is ending", "Documenting the medication at the start of the shift for all anticipated administrations"],
    correct:[1], rationale:"The right of documentation requires charting AFTER the medication is actually given — never before. Pre-charting is a serious medication error and a nursing license issue." },

  // ── Module 3 Practice Q5,
  { id:"m3pq5", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Lithium",
    stem:"A patient taking lithium for bipolar disorder reports nausea, tremors, and confusion. The nurse checks the lithium level and it is 1.9 mEq/L. What is the priority action?",
    options:["Continue the current dose — the level is barely elevated", "Administer the next dose at the scheduled time", "Hold the dose, notify the provider, and monitor for worsening symptoms", "Give the patient extra sodium-containing foods"],
    correct:[2], rationale:"A lithium level of 1.9 mEq/L is above the therapeutic maintenance range (0.6–1.2 mEq/L) and the patient has signs of toxicity. Hold the dose, notify the provider. Extra sodium can help (low Na → more Li+ retained) but does not replace provider notification." },

  // ── Module 3 Practice Q6,
  { id:"m3pq6", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Antibiotics",
    stem:"A nurse is administering morning medications and realizes the patient has a documented penicillin allergy (anaphylaxis). The prescribed antibiotic is cefazolin (a cephalosporin). What is the nurse's best action?",
    options:["Administer cefazolin — cephalosporins are unrelated to penicillin", "Hold the cefazolin and notify the provider about the allergy before administering", "Ask the patient if they think it is safe to take", "Give half the dose to test for reaction first"],
    correct:[1], rationale:"There is a cross-reactivity between penicillins and cephalosporins (~10%). A history of anaphylaxis (the most severe allergic reaction) warrants holding the drug and notifying the provider for an alternative antibiotic. Never give a partial dose as a 'test.'" },

  // ── Module 3 Practice Q7,
  { id:"m3pq7", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Antidiabetics",
    stem:"A patient is prescribed metformin 1000 mg PO twice daily for type 2 diabetes. The patient is scheduled for a CT scan with IV contrast dye tomorrow. What is the nurse's priority action?",
    options:["Give the metformin as scheduled — it does not interact with contrast", "Hold the metformin 48 hours before the procedure and notify the provider", "Double the dose today to compensate for tomorrow's missed dose", "Give the dose only after the scan is complete"],
    correct:[1], rationale:"Metformin must be held 48 hours before AND after procedures using IV contrast dye due to the risk of lactic acidosis, particularly in patients with contrast-induced renal impairment. Notify the provider so alternative glucose management can be ordered." },

  // ── Module 3 Practice Q8,
  { id:"m3pq8", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Heparin/HIT",
    stem:"A patient on IV heparin for 8 days has a new platelet count of 58,000/mm³ (down from 220,000). The patient develops a new deep vein thrombosis. What complication does the nurse suspect?",
    options:["Heparin-induced thrombocytopenia (HIT)", "Disseminated intravascular coagulation (DIC)", "Thrombocytopenic purpura (ITP)", "Normal platelet nadir from heparin"],
    correct:[0], rationale:"HIT is characterized by a >50% drop in platelets 5–10 days after heparin exposure, paradoxically causing CLOTTING (not bleeding). The platelet drop combined with a new DVT on heparin = classic HIT. Stop ALL heparin products and switch to a direct thrombin inhibitor (argatroban)." },

  // ── Module 3 Practice Q9,
  { id:"m3pq9", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Diuretics",
    stem:"A patient is prescribed furosemide (Lasix) 40 mg IV daily. The nurse should prioritize monitoring which laboratory value?",
    options:["Serum potassium", "Serum calcium", "Platelet count", "ALT/AST"],
    correct:[0], rationale:"Furosemide is a loop diuretic that causes significant potassium wasting (hypokalemia). Hypokalemia can cause cardiac arrhythmias and, in patients on digoxin, potentiates toxicity. Monitor potassium and replace as needed." },

  // ── Module 3 Practice Q10,
  { id:"m3pq10", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Insulin",
    stem:"The nurse is preparing to give insulin lispro (Humalog) to a patient. The patient states, 'I'm not hungry and don't think I want to eat my breakfast.' What is the nurse's best action?",
    options:["Give the full insulin dose — the patient needs it regardless", "Give half the dose and document the patient's refusal", "Hold the insulin and notify the provider before administering", "Give the insulin and have a snack available in case the patient eats a little"],
    correct:[2], rationale:"Rapid-acting insulin (lispro, aspart) must be given with a meal. If the patient is not eating, administering rapid-acting insulin creates serious hypoglycemia risk. Hold the dose and notify the provider for alternative orders. Do not administer without ensuring food intake." },

  // ── Module 3 Practice Q11,
  { id:"m3pq11", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Antipsychotics",
    stem:"A nurse is caring for a patient with schizophrenia on haloperidol (Haldol). The patient develops a high fever (104°F), severe muscle rigidity, altered consciousness, and labile blood pressure. What condition does the nurse suspect?",
    options:["Serotonin syndrome", "Neuroleptic malignant syndrome (NMS)", "Acute dystonia", "Tardive dyskinesia"],
    correct:[1], rationale:"NMS is a life-threatening reaction to antipsychotics characterized by: hyperthermia, muscle rigidity (lead-pipe), altered LOC, and autonomic instability. Treatment: stop the antipsychotic immediately, dantrolene, bromocriptine, cooling measures. Serotonin syndrome features clonus/hyperreflexia (not rigidity) and is caused by serotonergic drugs." },

  // ── Module 3 Practice Q12,
  { id:"m3pq12", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Antidepressants",
    stem:"A patient has been prescribed an SSRI for depression. The patient asks, 'How long will it take for this medication to work?' What is the nurse's best response?",
    options:["'You should feel better within 24–48 hours'", "'Most people notice improvement within 2–4 weeks of consistent use'", "'If you don't feel better in a week, the medication isn't working for you'", "'The medication works immediately but you may not notice it right away'"],
    correct:[1], rationale:"SSRIs typically take 2–4 weeks to reach therapeutic effect. This is critical patient teaching. The nurse should also advise the patient to continue taking the medication even if they don't notice immediate improvement, and to watch for increased suicidal ideation in the first 2 weeks." },

  // ── Module 3 Practice Q13,
  { id:"m3pq13", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Opioids",
    stem:"A nurse administers morphine 4 mg IV to a post-operative patient. Thirty minutes later the patient has a respiratory rate of 8/min and is difficult to arouse. What is the priority intervention?",
    options:["Place the patient in Trendelenburg position", "Administer naloxone (Narcan) as ordered", "Encourage the patient to take deep breaths", "Notify the provider and continue monitoring"],
    correct:[1], rationale:"RR of 8/min in a patient who received morphine = opioid-induced respiratory depression — this is a medical emergency. Priority: administer naloxone (Narcan) to reverse the opioid effect. Encourage deep breathing is inadequate for this level of respiratory compromise. Notify the provider after administering naloxone." },

  // ── Module 3 Practice Q14,
  { id:"m3pq14", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Electrolytes",
    stem:"A patient is receiving IV potassium chloride (KCl) for hypokalemia. The nurse notes the concentration is 40 mEq in 100 mL NS. What is the maximum safe infusion rate for peripheral IV potassium?",
    options:["5–10 mEq/hr", "10 mEq/hr", "20 mEq/hr", "40 mEq/hr as a rapid infusion"],
    correct:[1], rationale:"The maximum safe rate for peripheral IV potassium is 10 mEq/hr. Faster rates can cause cardiac dysrhythmias. Concentrated potassium solutions require central line access. NEVER give potassium as an IV push — cardiac arrest risk." },

  // ── Module 3 Practice Q15,
  { id:"m3pq15", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Antipsychotics",
    stem:"A nurse is teaching a patient prescribed clozapine (Clozaril) for schizophrenia. Which statement indicates correct understanding?",
    options:["'I can stop this medication whenever I want if I don't like the side effects'", "'I will need weekly blood draws to monitor my white blood cell count'", "'This medication will cause me to gain weight but that is not a concern'", "'I should avoid all physical activity while on this medication'"],
    correct:[1], rationale:"Clozapine can cause agranulocytosis (dangerously low WBCs), which is why patients require weekly CBC monitoring. If the ANC falls below 1000/mm³, the drug must be discontinued. This is a required safety monitoring program (REMS program in the US)." },

  // ── Module 3 Practice Q16,
  { id:"m3pq16", module:"Module 3", section:2, type:"mcq", diff:2, concept:"Anticoagulants",
    stem:"A patient on warfarin asks if they need to avoid all foods with vitamin K. What is the nurse's best response?",
    options:["'Yes, you should completely avoid spinach, kale, and other greens'", "'You should maintain a consistent intake of vitamin K foods rather than eliminating them'", "'Vitamin K foods have no effect on warfarin — eat what you like'", "'Increase your vitamin K intake to counteract the warfarin'"],
    correct:[1], rationale:"The key teaching point for warfarin is CONSISTENCY — not elimination. Drastically changing vitamin K intake will cause INR fluctuations. Patients should eat similar amounts of green vegetables each week. Sudden large increases in vitamin K will lower INR." },

  // ── Module 3 Practice Q17,
  { id:"m3pq17", module:"Module 3", section:2, type:"mcq", diff:3, concept:"Antibiotics",
    stem:"A nurse is administering amoxicillin 500 mg PO to a patient. The patient mentions they had 'a reaction' to penicillin years ago. What is the nurse's priority action?",
    options:["Give the medication — amoxicillin is not related to penicillin", "Hold the medication and assess the nature of the prior reaction before proceeding", "Give the medication but have epinephrine at the bedside", "Cut the dose in half as a safety measure"],
    correct:[1], rationale:"Amoxicillin IS a penicillin-class antibiotic. Before administering to a patient with a reported penicillin reaction, the nurse must assess the type of reaction (rash vs. anaphylaxis). This information must be communicated to the provider before proceeding. Never give a penicillin to a patient with unknown/anaphylactic allergy history without provider clearance." },

  // ── Module 3 Practice Q18,
  { id:"m3pq18", module:"Module 3", section:2, type:"mcq", diff:3, concept:"Hold/Give Decision",
    stem:"The nurse is preparing to administer phenytoin (Dilantin) IV. Which IV fluid should the nurse use to flush the line?",
    options:["D5W (5% dextrose in water)", "Lactated Ringer's", "Normal saline (0.9% NaCl)", "D5½NS"],
    correct:[2], rationale:"Phenytoin is compatible ONLY with normal saline. D5W causes phenytoin to precipitate (crystallize) in the tubing, making it ineffective and potentially causing embolism. Always use NS for phenytoin administration and flushing." },

  // ── Module 3 Practice Q19,
  { id:"m3pq19", module:"Module 3", section:2, type:"mcq", diff:3, concept:"Opioids",
    stem:"A patient is on a 72-hour fentanyl transdermal patch for chronic pain. The patient develops a fever of 103°F. What is the nurse's priority concern?",
    options:["The fever may be caused by the fentanyl patch", "The fever will increase skin absorption of fentanyl, risking overdose", "The patient will need a higher dose patch due to increased metabolism", "The fever indicates an allergy to the patch adhesive"],
    correct:[1], rationale:"Fever (and any heat source) increases transdermal absorption of fentanyl, which can cause opioid overdose. This is also why heating pads, electric blankets, and hot tubs are contraindicated with fentanyl patches. The nurse should notify the provider — the patch may need to be removed or the patient monitored for signs of opioid toxicity." },

  // ── Module 3 Practice Q20,
  { id:"m3pq20", module:"Module 3", section:2, type:"mcq", diff:3, concept:"Pharmacology",
    stem:"A patient is prescribed tetracycline for acne. Which instruction should the nurse include in the teaching?",
    options:["'Take the medication with a full glass of milk to protect your stomach'", "'Avoid prolonged sun exposure and use sunscreen'", "'This medication is safe to take during pregnancy'", "'You can take this with your antacid to prevent GI upset'"],
    correct:[1], rationale:"Tetracyclines cause photosensitivity — patients must use sunscreen and avoid prolonged sun exposure. Dairy products (milk), antacids, and calcium/iron supplements reduce absorption (should be taken 1–2 hours apart). Tetracyclines are contraindicated in pregnancy and children under 8." },

  // ── Module 3 Practice Q21,
  { id:"m3pq21", module:"Module 3", section:2, type:"mcq", diff:3, concept:"ACE Inhibitors",
    stem:"A nurse is reviewing a patient's medications and notes the patient takes both spironolactone and lisinopril. Which laboratory value requires priority monitoring?",
    options:["Serum sodium", "Serum potassium", "Serum magnesium", "Serum calcium"],
    correct:[1], rationale:"Spironolactone is a potassium-SPARING diuretic, and lisinopril (ACE inhibitor) also raises potassium. Together, they significantly increase the risk of dangerous hyperkalemia (cardiac arrhythmias). Monitor potassium closely and avoid additional potassium supplementation." },

  // ── Module 3 Practice Q22,
  { id:"m3pq22", module:"Module 3", section:2, type:"sata", diff:3, concept:"Antidotes/Toxicity",
    stem:"Which of the following medications requires the nurse to monitor trough levels to ensure therapeutic dosing and prevent toxicity? SELECT ALL THAT APPLY.",
    options:["Vancomycin", "Metformin", "Gentamicin", "Digoxin", "Acetaminophen", "Phenytoin"],
    correct:[0, 2, 3, 5], rationale:"Vancomycin (A), Gentamicin/aminoglycosides (C), Digoxin (D), and Phenytoin (F) all have narrow therapeutic windows and require monitoring of drug levels (peaks/troughs or serum levels) to ensure efficacy and prevent toxicity. Metformin and acetaminophen do not require routine drug level monitoring." },

  // ── Module 3 Practice Q23,
  { id:"m3pq23", module:"Module 3", section:2, type:"sata", diff:3, concept:"Digoxin",
    stem:"A nurse is educating a patient about the signs and symptoms of digoxin toxicity. Which findings should the nurse include? SELECT ALL THAT APPLY.",
    options:["Yellow-green halos around lights", "Nausea and anorexia", "Bradycardia", "Increased urine output", "Headache and confusion", "Hypertension"],
    correct:[0, 1, 2, 4], rationale:"Classic signs of digoxin toxicity: yellow/green visual halos (A), nausea/anorexia (B), bradycardia (C), and CNS effects including headache and confusion (E). Hypokalemia worsens toxicity. Digoxin does NOT cause hypertension or diuresis." },

  // ── Module 3 Practice Q24,
  { id:"m3pq24", module:"Module 3", section:2, type:"sata", diff:3, concept:"Anticoagulants",
    stem:"A nurse is reviewing discharge instructions for a patient prescribed warfarin. Which instructions are appropriate to include? SELECT ALL THAT APPLY.",
    options:["Avoid all green leafy vegetables completely", "Use an electric razor for shaving", "Report any unusual bruising or bleeding to the provider", "Take ibuprofen for minor aches and pains", "Keep all follow-up appointments for INR monitoring", "Wear a medical alert bracelet indicating anticoagulant use"],
    correct:[1, 2, 4, 5], rationale:"Correct warfarin teaching: use electric razor (B — less bleeding risk), report bleeding (C), keep INR appointments (E), wear medical alert ID (F). Avoid eliminating vitamin K foods — maintain CONSISTENCY (A is wrong). NSAIDs like ibuprofen increase bleeding risk — use acetaminophen instead (D is wrong)." },

  // ── Module 3 Practice Q25,
  { id:"m3pq25", module:"Module 3", section:2, type:"sata", diff:3, concept:"Insulin",
    stem:"The nurse is preparing to administer insulin to four different patients. Which situations require the nurse to HOLD the insulin and notify the provider? SELECT ALL THAT APPLY.",
    options:["Patient A: blood glucose 52 mg/dL before rapid-acting insulin", "Patient B: blood glucose 210 mg/dL before scheduled NPH insulin", "Patient C: patient states they are not going to eat breakfast", "Patient D: blood glucose 145 mg/dL, NPH insulin ordered", "Patient E: patient's meal is delayed 30 minutes for a procedure"],
    correct:[0, 2, 4], rationale:"Hold insulin and notify the provider when: glucose is hypoglycemic (A — 52 mg/dL is dangerous), patient is not eating (C), or meal is delayed (E — rapid-acting insulin given without a meal = hypoglycemia). Patient B (210 mg/dL) and D (145 mg/dL) are elevated and the scheduled insulins should be given." },
  { id:"m3qq1", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Digoxin",
    stem:"A patient's apical pulse is 58 bpm before you give digoxin. You should:",
    options:["Give it — 58 is close enough to 60", "Hold and notify the provider", "Give half the dose"],
    correct:[1], rationale:"Hold digoxin for HR <60. Notify the provider." },
  { id:"m3qq2", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Heparin/HIT",
    stem:"The antidote for heparin overdose is:",
    options:["Vitamin K", "Protamine sulfate", "Flumazenil"],
    correct:[1], rationale:"Protamine sulfate reverses heparin. Vitamin K reverses warfarin." },
  { id:"m3qq3", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Antidepressants",
    stem:"A patient on an SSRI asks when it will start working. You say:",
    options:["'Within 24-48 hours'", "'2-4 weeks of consistent use'", "'As soon as you take the first pill'"],
    correct:[1], rationale:"SSRIs take 2–4 weeks to reach therapeutic effect." },
  { id:"m3qq4", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Vancomycin",
    stem:"Red Man Syndrome from vancomycin is best managed by:",
    options:["Stopping vancomycin permanently", "Slowing the infusion rate", "Giving epinephrine"],
    correct:[1], rationale:"Red Man Syndrome is rate-related, not a true allergy. Slow the infusion." },
  { id:"m3qq5", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Electrolytes",
    stem:"Before administering IV potassium chloride, the nurse must never:",
    options:["Check the concentration", "Give it as an IV push", "Verify the order"],
    correct:[1], rationale:"IV potassium PUSH = cardiac arrest. Always infuse over time, max 10 mEq/hr peripherally." },
  { id:"m3qq6", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Heparin/HIT",
    stem:"A patient on heparin for 7 days has platelets drop from 250,000 to 78,000 and develops a new clot. The nurse suspects:",
    options:["DIC", "HIT", "Vitamin K deficiency"],
    correct:[1], rationale:"Heparin-Induced Thrombocytopenia (HIT): >50% platelet drop after 5-10 days + paradoxical clotting. Stop ALL heparin." },
  { id:"m3qq7", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Antipsychotics",
    stem:"Clozapine requires which unique monitoring compared to other antipsychotics?",
    options:["Monthly ECG", "Weekly CBC for agranulocytosis", "Daily lithium levels"],
    correct:[1], rationale:"Clozapine can cause life-threatening agranulocytosis. Weekly CBC/ANC monitoring is mandatory." },
  { id:"m3qq8", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Anticoagulants",
    stem:"A patient on warfarin has an INR of 2.6 for atrial fibrillation. The nurse should:",
    options:["Hold the next dose", "Administer as scheduled — INR is therapeutic", "Give vitamin K to lower the INR"],
    correct:[1], rationale:"INR 2–3 is therapeutic for A-fib. Give the scheduled dose. No intervention needed." },
  { id:"m3qq9", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"Which drug suffix indicates a medication that should not be stopped abruptly due to rebound cardiac effects?",
    options:["-prazole", "-olol", "-azole"],
    correct:[1], rationale:"-olol = beta blocker. Abrupt cessation causes rebound tachycardia and may precipitate angina or MI." },
  { id:"m3qq10", module:"Module 3", section:3, type:"mcq", diff:2, concept:"Antibiotics",
    stem:"The FIRST action before starting a patient on antibiotics is to:",
    options:["Obtain cultures", "Give the antibiotic immediately", "Check the patient's temperature"],
    correct:[0], rationale:"Cultures FIRST, then start antibiotics. This allows identification of the organism and sensitivities while not delaying treatment." },

  // ── Module 4 Practice Q1,
  { id:"m4pq1", module:"Module 4", section:1, type:"mcq", diff:1, concept:"IV Medications",
    stem:"A patient arrives to the ED with crushing chest pain radiating to the left arm, diaphoresis, and nausea. Which action is the nurse's PRIORITY?",
    options:["Administer aspirin 325 mg as ordered", "Obtain a 12-lead ECG within 10 minutes", "Draw troponin levels", "Establish IV access"],
    correct:[1], rationale:"A 12-lead ECG within 10 minutes is the priority to identify STEMI. This determines the urgency of reperfusion therapy (door-to-balloon time goal &lt;90 min). All other actions are important but the ECG guides the entire care pathway." },

  // ── Module 4 Practice Q2,
  { id:"m4pq2", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Cardiac Meds",
    stem:"The nurse auscultates crackles bilaterally in the lung bases, notes 3+ pitting edema in both ankles, and observes JVD in a patient with heart failure. Which type of heart failure does this presentation represent?",
    options:["Left-sided heart failure only", "Right-sided heart failure only", "Biventricular (both left and right) heart failure", "Normal finding in a cardiac patient"],
    correct:[2], rationale:"Crackles = left HF (fluid backing into lungs). JVD + peripheral edema = right HF (fluid backing into body). Both present together = biventricular failure." },

  // ── Module 4 Practice Q3,
  { id:"m4pq3", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Digoxin",
    stem:"A patient with heart failure is prescribed digoxin 0.125 mg PO daily. Before administering, the nurse checks the apical pulse and finds it is 56 bpm. Potassium is 3.1 mEq/L. What is the nurse's priority action?",
    options:["Give the digoxin — the pulse is close to 60", "Give the digoxin and monitor closely", "Hold the digoxin, notify the provider, and document findings", "Give half the dose and recheck the pulse in 30 minutes"],
    correct:[2], rationale:"Hold digoxin for HR &lt;60 AND notify the provider. Additionally, K+ of 3.1 is low (normal 3.5–5.0) — hypokalemia potentiates digoxin toxicity. Both findings require provider notification before any dose is given." },

  // ── Module 4 Practice Q4,
  { id:"m4pq4", module:"Module 4", section:1, type:"mcq", diff:1, concept:"IV Medications",
    stem:"The nurse is monitoring a patient's cardiac rhythm and observes a completely disorganized, chaotic waveform with no identifiable P waves or QRS complexes. The patient is unresponsive and has no pulse. What is the priority intervention?",
    options:["Administer atropine 1 mg IV push", "Begin CPR and prepare for immediate defibrillation", "Perform synchronized cardioversion", "Administer epinephrine and reassess rhythm"],
    correct:[1], rationale:"This describes ventricular fibrillation (VF) — a shockable rhythm. Priority: CPR immediately + defibrillation as soon as available. Synchronized cardioversion is for organized rhythms with a pulse (SVT, A-flutter). Atropine is for bradycardia. Epinephrine comes after the first shock." },

  // ── Module 4 Practice Q5,
  { id:"m4pq5", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Hold/Give Decision",
    stem:"A patient with a history of erectile dysfunction takes sildenafil (Viagra). He arrives at the ED with angina. The provider orders sublingual nitroglycerin. What is the nurse's best action?",
    options:["Administer the nitroglycerin as ordered", "Administer only half the dose as a safety measure", "Hold the nitroglycerin and notify the provider immediately", "Give the nitroglycerin and monitor BP closely"],
    correct:[2], rationale:"NEVER give nitroglycerin to a patient who has taken sildenafil, tadalafil, or vardenafil. The combination causes severe, potentially fatal hypotension. Hold the drug and notify the provider for an alternative pain management strategy." },

  // ── Module 4 Practice Q6,
  { id:"m4pq6", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Cardiac Meds",
    stem:"A patient is admitted with left-sided heart failure. Which assessment finding does the nurse expect?",
    options:["Jugular vein distension (JVD)", "Bilateral dependent edema", "Crackles in the lung bases bilaterally", "Ascites and hepatomegaly"],
    correct:[2], rationale:"Left HF → blood backs up into the pulmonary circulation → fluid leaks into alveoli → crackles. JVD, dependent edema, ascites, and hepatomegaly are all signs of RIGHT-sided HF (fluid backing into the body)." },

  // ── Module 4 Practice Q7,
  { id:"m4pq7", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Anticoagulants",
    stem:"A patient with atrial fibrillation is being discharged on warfarin. Which statement by the patient indicates a need for further teaching?",
    options:["'I will keep all my follow-up appointments to check my INR'", "'I need to stop eating all green vegetables since they affect warfarin'", "'I will use an electric razor to reduce my bleeding risk'", "'I should report any unusual bruising or bleeding to my doctor'"],
    correct:[1], rationale:"Patients on warfarin should maintain a CONSISTENT intake of vitamin K (green vegetables) — not eliminate them. Abrupt dietary changes cause INR fluctuations. The other statements are correct warfarin teaching." },

  // ── Module 4 Practice Q8,
  { id:"m4pq8", module:"Module 4", section:1, type:"mcq", diff:1, concept:"Cardiovascular",
    stem:"A patient presents to the ED with BP 210/118 mmHg and a sudden severe headache, slurred speech, and confusion. How does the nurse classify this finding?",
    options:["Hypertensive urgency — no immediate intervention needed", "Hypertensive emergency — requires immediate IV antihypertensives", "Stage 2 hypertension — oral medications are appropriate", "Normal variation — recheck in 30 minutes"],
    correct:[1], rationale:"BP ≥180/≥110 WITH target organ damage (neurologic symptoms = hypertensive encephalopathy/stroke) = hypertensive EMERGENCY. Requires ICU admission and IV antihypertensives. The goal is to reduce MAP by ≤25% in the first hour — not to normalize BP immediately." },

  // ── Module 4 Practice Q9,
  { id:"m4pq9", module:"Module 4", section:1, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"A nurse auscultates a low-pitched extra heart sound heard early in diastole (after S2) in a 68-year-old patient with shortness of breath and crackles. What does this finding suggest?",
    options:["This is a normal finding in an elderly patient", "This suggests ventricular overload consistent with heart failure (S3)", "This is S4 indicating a stiff, non-compliant ventricle", "This is a murmur indicating valvular disease"],
    correct:[1], rationale:"S3 (Kentucky sound) heard early in diastole in an adult = ventricular overload/heart failure — it's the sound of blood rapidly filling an already-distended ventricle. S3 is normal in children and athletes but pathologic in adults over 40." },

  // ── Module 4 Practice Q10,
  { id:"m4pq10", module:"Module 4", section:1, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"A patient with cardiogenic shock has BP 78/50, HR 118, cold clammy skin, urine output 12 mL/hr, and altered mental status. Which nursing intervention is the priority?",
    options:["Elevate legs to 90 degrees to improve venous return", "Maintain oxygenation and administer vasopressors as ordered", "Administer oral fluids and reassess in 1 hour", "Place in Trendelenburg position"],
    correct:[1], rationale:"Cardiogenic shock priority = maintain oxygenation + vasopressors (to maintain perfusion pressure). The heart is the problem — aggressive fluid resuscitation and Trendelenburg are contraindicated (worsen pulmonary edema). UO &lt;30 mL/hr = inadequate renal perfusion = critical finding." },

  // ── Module 4 Practice Q11,
  { id:"m4pq11", module:"Module 4", section:1, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"The nurse is teaching a patient newly diagnosed with heart failure. Which statement about daily weights BEST reflects accurate teaching?",
    options:["'Weigh yourself once a week, preferably in the evening'", "'Weigh yourself daily at the same time each morning, before breakfast, after urinating, and in the same clothes'", "'Weight gain of 5 pounds in one month should be reported to your doctor'", "'You only need to weigh yourself if you feel more swollen than usual'"],
    correct:[1], rationale:"Daily weights must be: same time (morning), same scale, same clothing, after urinating and before eating — to ensure consistency. Report: 2–3 lbs gained in 1 day OR 5 lbs gained in 1 week. Weight gain = fluid retention (earliest sign of HF exacerbation)." },

  // ── Module 4 Practice Q12,
  { id:"m4pq12", module:"Module 4", section:1, type:"mcq", diff:2, concept:"Cardiovascular",
    stem:"A patient with a systolic murmur radiating to the carotids presents with syncope, angina, and shortness of breath. What condition does the nurse recognize?",
    options:["Mitral stenosis", "Aortic regurgitation", "Aortic stenosis with classic symptomatic triad", "Mitral regurgitation"],
    correct:[2], rationale:"The classic triad of syncope + angina + shortness of breath with a systolic murmur radiating to the carotids = severe aortic stenosis. This triad indicates significant hemodynamic compromise. Untreated, survival averages 2–5 years. Valve replacement is required." },

  // ── Module 4 Practice Q13,
  { id:"m4pq13", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Cardiovascular",
    stem:"A nurse is caring for a patient with atrial fibrillation. Which complication is the nurse most concerned about?",
    options:["Hypoglycemia from cardiac medications", "Stroke from atrial thrombus formation", "Pulmonary embolism from deep vein thrombosis", "Hypokalemia from the irregular rhythm"],
    correct:[1], rationale:"A-fib causes blood to pool in the atria (especially the left atrial appendage) → clot formation → clot can travel to the brain → stroke. This is why anticoagulation is critical in A-fib. CHADS-VASc score guides the decision." },

  // ── Module 4 Practice Q14,
  { id:"m4pq14", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Diuretics",
    stem:"A patient who received furosemide 80 mg IV is reporting muscle cramps and weakness. The nurse checks the potassium level, which is 2.8 mEq/L. Which medication ordered for this patient is now a priority concern?",
    options:["Lisinopril", "Digoxin", "Metoprolol", "Aspirin"],
    correct:[1], rationale:"Hypokalemia (K+ &lt;3.5) potentiates digoxin toxicity — low K+ means more digoxin binds to heart receptors, increasing the risk of life-threatening dysrhythmias. Priority: hold digoxin, notify provider, replace K+ before giving digoxin." },

  // ── Module 4 Practice Q15,
  { id:"m4pq15", module:"Module 4", section:2, type:"mcq", diff:2, concept:"IV Medications",
    stem:"A patient with STEMI has a goal door-to-balloon time of less than 90 minutes. The patient arrived at 10:00 AM. It is now 10:52 AM and the patient is still in the ED waiting for the cath lab. What is the nurse's priority action?",
    options:["Continue monitoring and document arrival time", "Notify the provider and escalate urgency of cath lab activation", "Reassure the patient that 90 minutes is just a guideline", "Administer additional doses of nitroglycerin"],
    correct:[1], rationale:"Door-to-balloon goal of &lt;90 min is evidence-based — every minute = more myocardial damage. At 52 minutes elapsed, the window is narrowing. The nurse must escalate immediately — notify the provider, charge nurse, and cath lab team. This is a patient safety issue." },

  // ── Module 4 Practice Q16,
  { id:"m4pq16", module:"Module 4", section:2, type:"mcq", diff:2, concept:"Hold/Give Decision",
    stem:"A patient is being treated for hypertensive emergency with IV nicardipine. The initial BP was 220/130. After 1 hour of treatment, the BP is now 148/88. The provider has not given further orders. What should the nurse do?",
    options:["Continue the current rate — this is an appropriate reduction", "Increase the nicardipine rate to lower BP to normal more quickly", "Stop the nicardipine since the BP is near normal", "Switch to oral medications since the BP is controlled"],
    correct:[0], rationale:"Reducing MAP by ~25% in the first hour is the goal for hypertensive emergency — and this reduction is appropriate. Lowering BP too quickly can cause cerebral, cardiac, or renal ischemia. Continue the current rate and notify the provider of the current status." },

  // ── Module 4 Practice Q17,
  { id:"m4pq17", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Cardiac Meds",
    stem:"A patient is in ventricular tachycardia with a pulse and is alert and oriented with BP 106/68. Which intervention should the nurse anticipate?",
    options:["Immediate unsynchronized defibrillation", "Synchronized cardioversion", "CPR and IV epinephrine", "Vagal maneuvers (Valsalva)"],
    correct:[1], rationale:"Stable VT (pulse present, hemodynamically stable) = synchronized cardioversion or antiarrhythmic (amiodarone). Unstable VT with a pulse = synchronized cardioversion. Unsynchronized defibrillation is for pulseless VT/VF. CPR is not indicated when there IS a pulse." },

  // ── Module 4 Practice Q18,
  { id:"m4pq18", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Heparin/HIT",
    stem:"Which assessment finding in a patient on a continuous heparin infusion requires the nurse to notify the provider immediately?",
    options:["aPTT of 75 seconds", "Urine output of 45 mL/hr", "New petechiae, ecchymosis, and a platelet count of 54,000 after 8 days of heparin", "Heart rate of 88 bpm"],
    correct:[2], rationale:"Platelet count dropping significantly (from normal to 54,000) after 8 days of heparin with new bleeding signs = classic HIT (heparin-induced thrombocytopenia). STOP all heparin immediately and notify the provider. HIT paradoxically causes clotting despite low platelets." },

  // ── Module 4 Practice Q19,
  { id:"m4pq19", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Medication Safety",
    stem:"The nurse assesses a patient with right-sided heart failure. Which finding is MOST consistent with this diagnosis?",
    options:["Bilateral crackles in the lung bases", "Pink frothy sputum", "Orthopnea requiring 3 pillows", "Jugular vein distension (JVD) and 3+ pitting edema"],
    correct:[3], rationale:"Right HF = blood backs up into the systemic circulation = JVD + peripheral edema + ascites + hepatomegaly + weight gain. Crackles, pink frothy sputum, and orthopnea are all LEFT HF signs (pulmonary congestion)." },

  // ── Module 4 Practice Q20,
  { id:"m4pq20", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Cardiac Meds",
    stem:"A nurse is reviewing the concept of cardiac output. A patient has a heart rate of 90 bpm and a stroke volume of 60 mL. What is the cardiac output?",
    options:["3.6 L/min", "5.4 L/min", "6.0 L/min", "9.0 L/min"],
    correct:[1], rationale:"CO = HR × SV = 90 × 60 mL = 5,400 mL/min = 5.4 L/min. Normal CO = 4–8 L/min. This patient's CO is within normal range." },

  // ── Module 4 Practice Q21,
  { id:"m4pq21", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Cardiovascular",
    stem:"A patient's telemetry shows P waves occurring regularly at approximately 300 bpm with a sawtooth pattern, and a ventricular rate of 75 bpm. What rhythm is this?",
    options:["Atrial fibrillation", "Ventricular tachycardia", "Atrial flutter with 4:1 conduction", "Supraventricular tachycardia"],
    correct:[2], rationale:"Atrial flutter: sawtooth P waves at ~300 bpm. With 4:1 conduction (every 4th flutter wave conducts): 300/4 = 75 bpm ventricular rate. A-fib = irregularly irregular with no distinct P waves. VT = wide QRS, no distinct P waves." },

  // ── Module 4 Practice Q22,
  { id:"m4pq22", module:"Module 4", section:2, type:"mcq", diff:3, concept:"Cardiovascular",
    stem:"The nurse is caring for a patient after a myocardial infarction. Which new development requires the MOST immediate intervention?",
    options:["Troponin level of 2.1 ng/mL", "Patient reports mild chest wall soreness from ECG leads", "Telemetry shows new ventricular fibrillation", "Patient's pain is now 2/10"],
    correct:[2], rationale:"New VF = pulseless, life-threatening arrhythmia = immediate CPR + defibrillation. This is the most common cause of death post-MI. Elevated troponin is expected post-MI. Mild chest wall soreness and improved pain are not emergencies." },

  // ── Module 4 Practice Q23,
  { id:"m4pq23", module:"Module 4", section:2, type:"sata", diff:3, concept:"Cardiac Meds",
    stem:"Which nursing actions are appropriate when caring for a patient in heart failure? SELECT ALL THAT APPLY.",
    options:["Weigh patient daily at the same time", "Restrict sodium intake to less than 2 g/day", "Encourage liberal fluid intake to prevent dehydration", "Auscultate lung sounds each shift", "Administer diuretics as prescribed", "Teach patient to report weight gain of 2–3 lbs in one day"],
    correct:[0, 1, 3, 4, 5], rationale:"All are correct EXCEPT C — fluid restriction (not liberal intake) is standard HF management. All other actions (daily weights, low-Na diet, lung assessment, diuretics, weight gain reporting) are core HF nursing interventions." },

  // ── Module 4 Practice Q24,
  { id:"m4pq24", module:"Module 4", section:2, type:"sata", diff:3, concept:"Cardiac Meds",
    stem:"A patient is admitted with chest pain. The nurse notes the following: HR 102, BP 88/54, RR 24, O₂ sat 89%, skin is cold and clammy, UO 18 mL/hr in the past hour. Which conditions does this clinical picture suggest? SELECT ALL THAT APPLY.",
    options:["Cardiogenic shock", "Poor perfusion", "Acute MI with hemodynamic compromise", "Right-sided heart failure as the primary cause", "Need for immediate provider notification", "Patient is stable and can be monitored every 4 hours"],
    correct:[0, 1, 2, 4], rationale:"This picture = cardiogenic shock (hypotension + poor perfusion signs + possible MI context). Signs: cold/clammy, ↓BP, ↓UO (&lt;30 mL/hr), tachycardia, ↓O₂ sat. Immediate provider notification is required. Right HF alone doesn't explain this acute deterioration. The patient is NOT stable — reassessing q4h would be negligent." },

  // ── Module 4 Practice Q25,
  { id:"m4pq25", module:"Module 4", section:2, type:"sata", diff:3, concept:"Cardiac Meds",
    stem:"Which of the following are shockable cardiac rhythms requiring immediate defibrillation? SELECT ALL THAT APPLY.",
    options:["Ventricular fibrillation (VF)", "Asystole", "Pulseless ventricular tachycardia (pVT)", "Pulseless electrical activity (PEA)", "Atrial flutter", "Normal sinus rhythm with hypotension"],
    correct:[0, 2], rationale:"ONLY VF (A) and pulseless VT (C) are shockable rhythms — defibrillate immediately. Asystole and PEA are NOT shockable (CPR + epinephrine + treat reversible causes). Atrial flutter is cardioverted (synchronized) if unstable, not defibrillated. NSR with hypotension is not a rhythm problem." },
  { id:"m4qq1", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"CO = HR × SV. A patient has HR 80 and SV 70 mL. What is the cardiac output?",
    options:["4.8 L/min", "5.6 L/min", "6.4 L/min"],
    correct:[1], rationale:"CO = 80 × 70 = 5,600 mL/min = 5.6 L/min. Normal is 4–8 L/min." },
  { id:"m4qq2", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"Left heart failure causes fluid to back up into the:",
    options:["Body (JVD, edema)", "Lungs (crackles, SOB)", "Liver (ascites, hepatomegaly)"],
    correct:[1], rationale:"Left = Lungs. Blood backs up into the pulmonary circulation → crackles, dyspnea, orthopnea, pink frothy sputum." },
  { id:"m4qq3", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiovascular",
    stem:"Which rhythms are shockable? (Choose the correct pair)",
    options:["Asystole and PEA", "VF and pulseless VT", "SVT and atrial flutter"],
    correct:[1], rationale:"Only VF and pulseless VT are shockable. Asystole and PEA = CPR + epinephrine, no shock." },
  { id:"m4qq4", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Hold/Give Decision",
    stem:"A patient took sildenafil (Viagra) 12 hours ago and now has chest pain. The provider orders nitroglycerin. The nurse should:",
    options:["Give it — 12 hours is long enough", "Hold and notify provider — contraindicated", "Give half dose and monitor BP"],
    correct:[1], rationale:"Never give nitroglycerin with sildenafil — the window is 24 hours (some guidelines say 48 hrs for tadalafil). Fatal hypotension risk." },
  { id:"m4qq5", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Digoxin",
    stem:"Digoxin must be held if apical HR is:",
    options:["<70 bpm", ">100 bpm", "<60 bpm"],
    correct:[2], rationale:"Hold digoxin for apical HR <60 bpm. Notify the provider. Also hold if K+ is low (hypokalemia potentiates toxicity)." },
  { id:"m4qq6", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"Daily weight gain of ___ lbs in 1 day should be reported in a heart failure patient:",
    options:["5 lbs", "2-3 lbs", "10 lbs"],
    correct:[1], rationale:"Report: 2–3 lbs gained in 1 day OR 5 lbs in 1 week. Weight gain = fluid retention = early HF exacerbation sign." },
  { id:"m4qq7", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiac Meds",
    stem:"An S3 heart sound in a 65-year-old adult with dyspnea suggests:",
    options:["Normal variant — no concern", "Ventricular overload/heart failure", "Atrial stenosis"],
    correct:[1], rationale:"S3 in adults >40 = ventricular overload (heart failure). It's the sound of blood rushing into a fluid-overloaded ventricle. Normal in children and athletes." },
  { id:"m4qq8", module:"Module 4", section:3, type:"mcq", diff:2, concept:"IV Medications",
    stem:"Hypertensive emergency is treated by reducing MAP by:",
    options:["25% in the first hour", "50% in the first hour", "To normal as fast as possible"],
    correct:[0], rationale:"Reduce MAP by ≤25% in the first hour. Too-rapid reduction = cerebral, cardiac, or renal ischemia." },
  { id:"m4qq9", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiovascular",
    stem:"The classic triad of aortic stenosis is:",
    options:["JVD, edema, ascites", "Syncope, angina, shortness of breath", "Palpitations, irregular pulse, stroke"],
    correct:[1], rationale:"Aortic stenosis: Syncope + Angina + Shortness of breath = severe AS requiring valve replacement. Murmur radiates to carotids." },
  { id:"m4qq10", module:"Module 4", section:3, type:"mcq", diff:2, concept:"Cardiovascular",
    stem:"Troponin begins to rise after MI at:",
    options:["Immediately (within 30 min)", "3–6 hours", "24–48 hours"],
    correct:[1], rationale:"Troponin rises 3–6 hours after MI onset, peaks at 24 hours, and remains elevated for 7–10 days. A normal initial troponin does NOT rule out MI — serial levels are needed." },

  // ── Module 5 Practice Q1,
  { id:"m5pq1", module:"Module 5", section:1, type:"mcq", diff:1, concept:"IV Medications",
    stem:"A patient with COPD has an SpO₂ of 86% on room air. Which oxygen delivery device and flow rate is MOST appropriate?",
    options:["Non-rebreather mask at 15 L/min", "Venturi mask at 28% FiO₂ targeting SpO₂ 88–92%", "Nasal cannula at 6 L/min", "Simple mask at 8 L/min"],
    correct:[1], rationale:"COPD patients rely on a hypoxic drive to breathe — excessive O₂ can suppress the urge to breathe. Target SpO₂ 88–92% using a Venturi mask, which delivers precise, controlled FiO₂. Non-rebreather at 15 L/min would over-oxygenate and risk respiratory failure." },

  // ── Module 5 Practice Q2,
  { id:"m5pq2", module:"Module 5", section:1, type:"mcq", diff:1, concept:"Respiratory/Renal",
    stem:"A nurse is interpreting an ABG: pH 7.28, PaCO₂ 58, HCO₃⁻ 24. What is the correct interpretation?",
    options:["Metabolic acidosis, uncompensated", "Respiratory acidosis, uncompensated", "Respiratory alkalosis, partially compensated", "Metabolic alkalosis, uncompensated"],
    correct:[1], rationale:"pH 7.28 = acidosis. PaCO₂ 58 (↑) = respiratory cause. HCO₃⁻ 24 = normal (no compensation yet). Using ROME: Respiratory = Opposite (pH↓, CO₂↑). This is uncompensated respiratory acidosis — the kidneys haven't had time to compensate yet." },

  // ── Module 5 Practice Q3,
  { id:"m5pq3", module:"Module 5", section:1, type:"mcq", diff:1, concept:"ACE Inhibitors",
    stem:"A patient is admitted with asthma exacerbation. Upon auscultation, the nurse notes the patient who was previously wheezing now has a silent chest. What does this finding indicate?",
    options:["The patient is improving — the bronchospasm is resolving", "The patient has worsening obstruction — status asthmaticus, a respiratory emergency", "The patient needs a higher dose of bronchodilator", "This is expected after albuterol administration"],
    correct:[1], rationale:"A silent chest in asthma means NO airflow — airways are so severely obstructed that no sound is produced. This is NOT improvement — it's status asthmaticus, a life-threatening emergency. Call for help immediately, prepare for intubation." },

  // ── Module 5 Practice Q4,
  { id:"m5pq4", module:"Module 5", section:1, type:"mcq", diff:1, concept:"Respiratory/Renal",
    stem:"A nurse is managing a chest tube drainage system. Which action is correct?",
    options:["Clamp the tube when the patient ambulates", "Keep the drainage system above the level of the chest", "Strip the tubing every 4 hours to maintain patency", "Keep the drainage system below chest level and maintain the water seal"],
    correct:[3], rationale:"The chest tube drainage system must always be kept BELOW chest level (gravity drainage) with the water seal intact. Never clamp (→ tension pneumo), never raise above chest (fluid drains back), never strip tubing (excessive negative pressure)." },

  // ── Module 5 Practice Q5,
  { id:"m5pq5", module:"Module 5", section:1, type:"mcq", diff:1, concept:"Respiratory/Renal",
    stem:"A patient on a ventilator triggers a high-pressure alarm. What is the nurse's FIRST action?",
    options:["Silence the alarm and document it", "Call respiratory therapy and wait for their assessment", "Assess the patient and check for common causes (secretions, kinks, patient biting tube)", "Increase the pressure limit on the ventilator"],
    correct:[2], rationale:"Never silence an alarm without finding the cause. First action: assess the patient (are they in distress?), then check for high-pressure causes: secretions (suction), kinked tubing, patient biting the tube (provide bite block), bronchospasm (administer bronchodilator). Call respiratory therapy while managing." },

  // ── Module 5 Practice Q6,
  { id:"m5pq6", module:"Module 5", section:1, type:"mcq", diff:1, concept:"IV Medications",
    stem:"A post-operative patient on day 2 develops sudden onset of dyspnea, chest pain that worsens with breathing, tachycardia (HR 118), and anxiety. SpO₂ drops to 89%. What complication does the nurse suspect?",
    options:["Atelectasis from shallow breathing", "Pulmonary embolism", "Pneumonia from aspiration", "Heart failure exacerbation"],
    correct:[1], rationale:"Sudden + unexplained = think PE. Classic signs: pleuritic chest pain, anxiety, tachycardia, sudden SOB, and hypoxia in a post-op patient (high DVT/PE risk). Atelectasis develops gradually; pneumonia has fever/productive cough; HF has crackles/edema. Notify provider immediately — anticipate CT-PA." },

  // ── Module 5 Practice Q7,
  { id:"m5pq7", module:"Module 5", section:1, type:"mcq", diff:1, concept:"Antibiotics",
    stem:"A nurse is caring for a patient with pneumonia. The provider orders antibiotics. What must the nurse do BEFORE administering the first dose?",
    options:["Ensure the patient has eaten a full meal", "Obtain a sputum culture (and blood cultures if ordered)", "Administer antipyretics to reduce fever first", "Check the patient's allergy history and give the antibiotic immediately"],
    correct:[1], rationale:"Culture BEFORE antibiotics — always. The sputum culture identifies the organism and allows for targeted therapy. Once antibiotics are given, cultures may be falsely negative. Allergy check is important but is done simultaneously with or before ordering — it doesn't delay culture collection." },

  // ── Module 5 Practice Q8,
  { id:"m5pq8", module:"Module 5", section:1, type:"mcq", diff:1, concept:"Respiratory/Renal",
    stem:"A nurse is teaching a patient newly diagnosed with asthma about their inhalers. The patient asks, 'Which one do I use when I'm having an attack?' What is the nurse's best response?",
    options:["'Use your fluticasone (Flovent) inhaler — it reduces inflammation'", "'Use your albuterol (ProAir) inhaler — it opens your airways quickly'", "'Use both at the same time for the fastest relief'", "'Neither — call 911 immediately'"],
    correct:[1], rationale:"Albuterol (SABA) is the rescue inhaler — fast-acting bronchodilator for acute bronchospasm (onset 5–15 min). Fluticasone (ICS) is a maintenance inhaler that works over days to weeks to reduce inflammation — NOT for acute attacks. During an attack: albuterol first." },

  // ── Module 5 Practice Q9,
  { id:"m5pq9", module:"Module 5", section:1, type:"mcq", diff:2, concept:"IV Medications",
    stem:"A patient is receiving a fluticasone (Flovent) inhaler twice daily. Which teaching point is MOST important?",
    options:["'Use this inhaler when you feel short of breath or wheezing'", "'Rinse your mouth with water after each use to prevent thrush'", "'This medication works immediately — you will feel better within minutes'", "'You can stop using this once you feel better'"],
    correct:[1], rationale:"Inhaled corticosteroids (ICS) like fluticasone deposit in the mouth and oropharynx, causing oral candidiasis (thrush). Rinsing and gargling with water after every use is essential. ICS are maintenance drugs (not rescue), work over days to weeks, and must be continued consistently even when feeling well." },

  // ── Module 5 Practice Q10,
  { id:"m5pq10", module:"Module 5", section:1, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A nurse notes that a patient's chest tube water seal chamber has continuous bubbling. What does this finding indicate?",
    options:["This is normal — bubbling always occurs in the water seal", "The drainage system is functioning correctly", "There is an air leak — check all connections and assess the patient", "The tube needs to be clamped immediately"],
    correct:[2], rationale:"Continuous bubbling in the water seal chamber = air leak. Initially after insertion, some bubbling is expected (as air escapes from the pleural space). However, continuous vigorous bubbling later indicates a leak — check all connection points (most common cause). If no connection is loose, the leak may be at the insertion site. Never clamp — notify the provider." },

  // ── Module 5 Practice Q11,
  { id:"m5pq11", module:"Module 5", section:1, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A patient's ABG shows pH 7.50, PaCO₂ 30, HCO₃⁻ 23. What is the interpretation?",
    options:["Respiratory acidosis, uncompensated", "Metabolic alkalosis, partially compensated", "Respiratory alkalosis, uncompensated", "Metabolic acidosis, compensated"],
    correct:[2], rationale:"pH 7.50 = alkalosis. PaCO₂ 30 (↓) = respiratory cause. HCO₃⁻ 23 = normal (no compensation). Using ROME: Respiratory = Opposite (pH↑, CO₂↓). Uncompensated respiratory alkalosis. Common causes: hyperventilation, anxiety, pain, early PE, mechanical ventilation." },

  // ── Module 5 Practice Q12,
  { id:"m5pq12", module:"Module 5", section:1, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A nurse is caring for a patient with a tracheostomy. Which supplies must be kept at the bedside at all times?",
    options:["Extra bed linens and IV supplies", "Obturator, spare tracheostomy tube (same and one smaller size), suction setup, and Ambu bag", "Oral airways and tongue depressors", "Crash cart and defibrillator"],
    correct:[1], rationale:"Tracheostomy emergency supplies at bedside always: the obturator (to guide reinsertion if tube is displaced), a spare trach of the same size AND one size smaller (if same size doesn't fit), suction setup, Ambu bag, and sterile suction catheters. These are needed in case of accidental decannulation." },

  // ── Module 5 Practice Q13,
  { id:"m5pq13", module:"Module 5", section:1, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A patient with TB is being admitted to the hospital. Which room assignment is appropriate?",
    options:["A room with droplet precautions — surgical mask for staff", "A semiprivate room with contact precautions", "A negative pressure private room — staff must wear N95 respirators", "Any available room — TB only requires standard precautions"],
    correct:[2], rationale:"TB requires AIRBORNE precautions: negative pressure private room (air flows inward, not out into hallway) and N95 respirator for all staff entering the room. Surgical masks are NOT sufficient for TB — N95 or higher is required. Patient wears a surgical mask during transport." },

  // ── Module 5 Practice Q14,
  { id:"m5pq14", module:"Module 5", section:2, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"Which ABG result is MOST consistent with a patient in the early stages of a pulmonary embolism?",
    options:["pH 7.28, PaCO₂ 58, HCO₃⁻ 24", "pH 7.50, PaCO₂ 28, HCO₃⁻ 23", "pH 7.35, PaCO₂ 40, HCO₃⁻ 24", "pH 7.30, PaCO₂ 40, HCO₃⁻ 18"],
    correct:[1], rationale:"Early PE: the patient hyperventilates from anxiety and pain → blows off CO₂ → respiratory alkalosis (pH↑, PaCO₂↓). This is why PE's first ABG often shows respiratory alkalosis — a classic NCLEX finding. Late PE with severe hypoxia can progress to acidosis." },

  // ── Module 5 Practice Q15,
  { id:"m5pq15", module:"Module 5", section:2, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A nurse needs to suction a patient's tracheostomy. Which action is correct?",
    options:["Suction routinely every 2 hours regardless of assessment", "Apply suction while inserting the catheter to remove more secretions", "Preoxygenate with 100% O₂ before suctioning and limit each pass to 10–15 seconds", "Suction for up to 30 seconds per pass if secretions are thick"],
    correct:[2], rationale:"Correct suctioning: preoxygenate with 100% O₂ first (prevent hypoxia during suctioning), suction while WITHDRAWING (not inserting), limit to 10–15 seconds per pass, hyperoxgenate after. Never suction routinely — only when needed (assess first). Longer suction times cause hypoxia." },

  // ── Module 5 Practice Q16,
  { id:"m5pq16", module:"Module 5", section:2, type:"mcq", diff:2, concept:"Respiratory/Renal",
    stem:"A patient on a ventilator triggers a low-pressure alarm. The nurse finds the ventilator tubing disconnected from the endotracheal tube. What is the priority action?",
    options:["Silence the alarm and call for help", "Reconnect the tubing immediately and assess the patient", "Remove the ET tube and allow the patient to breathe on their own", "Increase the FiO₂ on the ventilator"],
    correct:[1], rationale:"Low-pressure alarm = disconnection or leak = patient not receiving breaths. Priority: reconnect immediately and assess the patient (breathing, O₂ sat, HR). If unable to reconnect quickly, manually ventilate with Ambu bag and call respiratory therapy. Never remove an ET tube without an order." },

  // ── Module 5 Practice Q17,
  { id:"m5pq17", module:"Module 5", section:2, type:"mcq", diff:2, concept:"IV Medications",
    stem:"A patient with ARDS is receiving mechanical ventilation. The nurse notes that despite FiO₂ of 80%, the SpO₂ remains at 86%. What is the significance of this finding?",
    options:["The O₂ flow rate needs to be increased to 100%", "This is normal for ARDS — no action is needed", "Refractory hypoxemia is the hallmark of ARDS — notify provider and anticipate PEEP adjustment", "The patient's oxygen mask needs to be replaced"],
    correct:[2], rationale:"Refractory hypoxemia (O₂ doesn't fix it) is the hallmark of ARDS. The damaged alveoli can't exchange gas even with high FiO₂. Management: mechanical ventilation with PEEP (positive end-expiratory pressure) to keep alveoli open. Notify provider — PEEP may need to be increased, or prone positioning considered." },

  // ── Module 5 Practice Q18,
  { id:"m5pq18", module:"Module 5", section:2, type:"mcq", diff:3, concept:"IV Medications",
    stem:"A nurse is caring for a patient using an incentive spirometer after abdominal surgery. What is the correct teaching?",
    options:["Use the device once a day for 30 minutes", "Take 10 slow deep breaths every hour while awake, holding each breath 3–5 seconds", "Use the device only when you feel shortness of breath", "Blow INTO the spirometer as hard as possible"],
    correct:[1], rationale:"Incentive spirometer: 10 breaths per hour while awake, inhale slowly and deeply, hold breath 3–5 seconds at peak to keep alveoli open. This prevents atelectasis — the #1 post-op pulmonary complication. The patient inhales (not blows) into the device. After use, encourage coughing to mobilize secretions." },

  // ── Module 5 Practice Q19,
  { id:"m5pq19", module:"Module 5", section:2, type:"mcq", diff:3, concept:"Medication Safety",
    stem:"A patient is admitted with pneumonia and a temperature of 102.8°F, productive cough with yellow sputum, crackles in the right lower lobe, and SpO₂ 91%. Which nursing action is FIRST?",
    options:["Administer the ordered antibiotic immediately", "Apply oxygen and obtain a sputum culture before administering antibiotics", "Place the patient in Trendelenburg position", "Encourage deep breathing exercises before any other intervention"],
    correct:[1], rationale:"Priority: apply oxygen (SpO₂ 91% is below goal) AND obtain sputum culture BEFORE the first antibiotic dose. Then administer antibiotics. Trendelenburg is contraindicated in respiratory distress — it increases diaphragm pressure. Semi-Fowler's (HOB 30–45°) is correct positioning." },

  // ── Module 5 Practice Q20,
  { id:"m5pq20", module:"Module 5", section:2, type:"mcq", diff:3, concept:"Respiratory/Renal",
    stem:"The nurse is caring for four patients. Which patient requires the MOST immediate assessment?",
    options:["Patient A: COPD, SpO₂ 90% on Venturi mask 28%, RR 16", "Patient B: Post-op day 1, asking for pain medication, SpO₂ 96%", "Patient C: Asthma, was wheezing 30 min ago, now has a completely silent chest, RR 28", "Patient D: Pneumonia, temp 101.2°F, productive cough, SpO₂ 94%"],
    correct:[2], rationale:"Patient C is the priority — silent chest in asthma = status asthmaticus = no airflow = life-threatening emergency. This is WORSE than wheezing. Immediate action required. Patient A's COPD with SpO₂ 90% on appropriate O₂ is acceptable. Patients B and D are stable and non-urgent." },

  // ── Module 5 Practice Q21,
  { id:"m5pq21", module:"Module 5", section:2, type:"mcq", diff:3, concept:"ACE Inhibitors",
    stem:"A patient is to receive a simple face mask for oxygen therapy. The provider orders 4 L/min. What should the nurse do?",
    options:["Set up the mask at 4 L/min as ordered", "Clarify the order — simple masks require a minimum of 6 L/min; use nasal cannula for lower flows", "Use a non-rebreather mask instead at 4 L/min", "Set the mask at 4 L/min but add humidification"],
    correct:[1], rationale:"Simple face masks require a MINIMUM of 6 L/min to flush exhaled CO₂ from the mask. Below 6 L/min, the patient rebreathes CO₂ that accumulates in the mask. The nurse should clarify the order — if low-flow O₂ is intended, a nasal cannula (1–6 L/min) is the appropriate device." },

  // ── Module 5 Practice Q22,
  { id:"m5pq22", module:"Module 5", section:2, type:"sata", diff:3, concept:"Respiratory/Renal",
    stem:"Which findings are consistent with pulmonary embolism? SELECT ALL THAT APPLY.",
    options:["Sudden onset dyspnea", "Pleuritic chest pain (worsens with inspiration)", "Gradual onset of productive cough over 3 days", "Tachycardia", "Hemoptysis", "Low-grade fever and chills for 1 week"],
