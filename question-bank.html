  { id:"m3s1q1", module:"Module 3", section:1, type:"mcq", diff:2, concept:"ACE Inhibitors/Hyperkalemia",
    stem:"A nurse is preparing to administer the following medications to a client with hypertension and chronic kidney disease. Which medication should the nurse hold and contact the provider about BEFORE administering?",
    options:["Amlodipine 10 mg PO with a potassium level of 4.2 mEq/L","Lisinopril 10 mg PO with a potassium level of 5.8 mEq/L","Metoprolol 25 mg PO with a heart rate of 68 bpm","Furosemide 40 mg PO with a potassium level of 3.8 mEq/L"],
    correct:[1], rationale:"Lisinopril is an ACE inhibitor (-pril) that blocks aldosterone, causing potassium retention. A potassium of 5.8 mEq/L is dangerously elevated (hyperkalemia). Administering lisinopril could lead to fatal cardiac dysrhythmias. Hold and notify the provider. K+ of 3.8 is within normal limits — no reason to hold furosemide." },

  { id:"m3s1q2", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Naloxone/Opioid Reversal",
    stem:"A nurse administers naloxone (Narcan) 0.4 mg IV to a client with a respiratory rate of 6 breaths/min after morphine administration. Thirty minutes later, RR is 14 and client is arousable. What is the nurse's priority action at this time?",
    options:["Document the client's response and continue monitoring","Administer a second dose of naloxone immediately","Continue to closely monitor respiratory status as the naloxone may wear off before the morphine","Prepare to administer flumazenil as a follow-up antidote"],
    correct:[2], rationale:"Naloxone has a shorter half-life (30–90 min) than most opioids. Once naloxone wears off, opioid effect can return and the client may become re-sedated. Monitor respiratory status closely and be prepared to repeat doses. Flumazenil reverses benzodiazepines, not opioids." },

  { id:"m3s1q3", module:"Module 3", section:1, type:"mcq", diff:2, concept:"Narrow Therapeutic Range/Error Prevention",
    stem:"A nurse receives an order: theophylline 600 mg IV over 30 minutes for acute asthma. The client's theophylline level drawn 2 hours ago was 18 mcg/mL (therapeutic: 10–20). What is the nurse's best action?",
    options:["Administer as ordered since the level is therapeutic","Hold and notify the provider about the current level before administering a loading dose","Administer half the dose since the level is near the high end","Administer and recheck the level in 1 hour"],
    correct:[1], rationale:"A loading dose given to a patient already at 18 mcg/mL would push the level above 20 mcg/mL (toxic), risking seizures and life-threatening arrhythmias. Hold and notify the provider. Adjusting the dose independently is outside nursing scope." },

  { id:"m3s1q4", module:"Module 3", section:1, type:"mcq", diff:1, concept:"Anticoagulants/Warfarin",
    stem:"A nurse is reviewing the medication record of a client prescribed warfarin (Coumadin). The client's current INR is 4.2. Which action should the nurse take FIRST?",
    options:["Administer vitamin K 10 mg PO as ordered","Hold the warfarin dose and notify the provider","Administer fresh frozen plasma (FFP) immediately","Recheck the INR in 4 hours and reassess"],
    correct:[1], rationale:"INR 4.2 is supratherapeutic (goal 2–3 for most). The nurse's FIRST action is to hold the dose and notify the provider. Vitamin K and FFP may be indicated by provider order — but holding and notifying is always first. Never administer vitamin K or FFP without a provider order." },

  { id:"m3s1q5", module:"Module 3", section:1, type:"sata", diff:2, concept:"Lithium Toxicity",
    stem:"A nurse is caring for a client taking lithium carbonate 300 mg TID for bipolar disorder. Which findings indicate the client is experiencing lithium toxicity? Select all that apply.",
    options:["Coarse hand tremors","Dry mouth and increased thirst","Nausea and vomiting","Ataxia (unsteady gait)","Constipation","Confusion and slurred speech"],
    correct:[0,2,3,5], rationale:"Lithium toxicity (level >1.5 mEq/L): coarse tremors (fine tremors are expected at therapeutic levels), nausea/vomiting, ataxia, and CNS changes (confusion, slurred speech). Dry mouth/thirst and constipation are not signs of toxicity — dehydration increases toxicity risk by reducing sodium and causing lithium retention." },

  { id:"m3s1q6", module:"Module 3", section:1, type:"sata", diff:2, concept:"Magnesium Sulfate Safety",
    stem:"A nurse is preparing to administer the next dose of IV magnesium sulfate to a client with severe preeclampsia. Which assessments must the nurse complete BEFORE administering? Select all that apply.",
    options:["Assess respiratory rate","Assess deep tendon reflexes (DTRs)","Assess urine output","Assess blood pressure","Assess fetal heart tones","Confirm calcium gluconate is at the bedside"],
    correct:[0,1,2,5], rationale:"Three mandatory checks before each mag dose: RR >12 breaths/min, DTRs present (loss of DTRs = first sign of toxicity), urine output >25–30 mL/hr (mag is renally excreted). Calcium gluconate MUST be at the bedside as the antidote. BP and fetal tones are important in preeclampsia but are not the required mag-specific checks." },

  { id:"m3s1q7", module:"Module 3", section:1, type:"sata", diff:3, concept:"Black Box Warnings",
    stem:"A nurse is teaching student nurses about FDA Black Box Warning medications. Which statements are correct? Select all that apply.",
    options:["Clozapine (Clozaril) requires weekly WBC monitoring due to the risk of agranulocytosis","SSRIs may increase suicidal ideation in patients under 25, especially in the first weeks of therapy","Fluoroquinolones (e.g., ciprofloxacin) carry a BBW for tendon rupture and peripheral neuropathy","Aminoglycosides carry a BBW for nephrotoxicity and ototoxicity, which may be irreversible","Warfarin carries a BBW for thromboembolism in patients with mechanical heart valves","Beta blockers should never be stopped abruptly due to risk of rebound hypertension and MI"],
    correct:[0,1,2,3,5], rationale:"All correct except E. Warfarin's BBW is for serious/potentially fatal BLEEDING, not thromboembolism. Abrupt beta blocker discontinuation carries a significant BBW risk for rebound hypertension, angina, and MI — always taper." },

  { id:"m3s1q8", module:"Module 3", section:1, type:"matrix", diff:3, concept:"Hold vs. Give Decision",
    stem:"A nurse reviews medications for four clients. [MATRIX] For each situation, select: Administer as Ordered | Hold and Notify Provider | Administer and Monitor Closely. Client A: Digoxin 0.125 mg PO — apical HR 58, K+ 3.2 | Client B: Metoprolol 25 mg PO — HR 72, BP 118/76 | Client C: Lisinopril 5 mg PO — K+ 5.6, rising creatinine | Client D: Furosemide 40 mg IV — K+ 3.4, UO 20 mL/hr last hour",
    options:["Client A: Hold and Notify (HR <60 AND hypokalemia = dual hold criteria for digoxin)","Client B: Administer as Ordered (HR 72 is above hold parameter of 60)","Client C: Hold and Notify (K+ 5.6 dangerously high + rising Cr = AKI risk with ACE inhibitor)","Client D: Administer and Monitor Closely (K+ low-normal, low UO warrants monitoring but not hold)"],
    correct:[0,1,2,3], rationale:"Client A: Both HR <60 AND hypokalemia are present — dual triggers to hold digoxin. Client B: Metoprolol held for HR <60 only; 72 is safe. Client C: ACE inhibitors retain K+ and can worsen AKI — hold with K+ 5.6 and rising Cr. Client D: Administer but monitor UO closely — 3.4 is low-normal, not critically low." },

  { id:"m3s1q9", module:"Module 3", section:1, type:"bowtie", diff:3, concept:"Opioid Toxicity Emergency",
    stem:"[BOW-TIE] A nurse cares for a 28-year-old post-op client who received hydromorphone 2 mg IV 45 minutes ago. Client is now unresponsive to verbal stimulation, RR 5 breaths/min, SpO2 84%, pupils pinpoint bilaterally. PRIORITY CUES: RR 5/min + SpO2 84% | HYPOTHESIS: Opioid-induced respiratory depression | PRIORITY ACTIONS: Administer naloxone IV + Apply oxygen + Call for help | EXPECTED FIRST IMPROVEMENT: Respiratory rate increases above 12/min",
    options:["Priority cues: RR 5/min and SpO2 84% (life-threatening hypoxia)","Hypothesis: Opioid-induced respiratory depression","Actions: Naloxone IV + oxygen + activate rapid response","Expected outcome: RR increases above 12/min first"],
    correct:[0,1,2,3], rationale:"Classic opioid toxicity: opioid given + pinpoint pupils + severe respiratory depression + hypoxia. RR of 5 and SpO2 84% are the priority life-threatening findings. Hypothesis = opioid-induced respiratory depression. Immediate actions: oxygen, call for help, naloxone. First sign of reversal = RR improves. Flumazenil reverses benzos, not opioids." },

  { id:"m3s1q10", module:"Module 3", section:1, type:"casestudy", diff:3, concept:"Heparin Safety/Antidotes",
    stem:"[CLOZE/DROP-DOWN] A nurse prepares to administer heparin 5,000 units SC. The client has a small bruise on their arm from a blood draw. The client asks if they should worry. The nurse explains the bruise is [an expected finding in a patient on anticoagulants] and is [not a sufficient] reason to hold the heparin. If the client develops blood in the urine, the priority action is to [hold the heparin, notify the provider, and assess the client]. If heparin overdose occurs with active bleeding, the antidote is [protamine sulfate].",
    options:["Blank 1 — an expected finding in a patient on anticoagulants","Blank 2 — not a sufficient reason to hold","Blank 3 — hold the heparin, notify the provider, and assess the client","Blank 4 — protamine sulfate"],
    correct:[0,1,2,3], rationale:"Small bruising is expected with anticoagulation — not a reason to hold heparin. Hold only for significant/serious bleeding. The antidote for heparin is protamine sulfate (IV slow push). Vitamin K reverses warfarin; flumazenil reverses benzos; naloxone reverses opioids. Remember: stop the drug first, then give the antidote." },

  // ─── MODULE 5: PSYCHOSOCIAL INTEGRITY ────────────────────────────────────────

  // MCQ
  { id:"psx1", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Therapeutic Communication",
    stem:"A client hospitalized after a suicide attempt says, 'My family would be better off if I had died.' Which response by the nurse is most therapeutic?",
    options:["Why would you think your family feels that way?","Tell me more about what makes you feel like a burden.","You shouldn't say things like that. Your family loves you.","Let's focus on the positive things happening today."],
    correct:[1], rationale:"Open-ended exploration encourages the client to express feelings and allows the nurse to further assess suicide risk without judgment. Asking 'why' can make clients feel defensive. Option C provides false reassurance and dismisses emotions. Option D changes the subject and minimizes concerns." },

  { id:"psx2", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Suicide Risk",
    stem:"A client admitted for severe depression quietly states, 'I finally know how to fix everything.' Which nursing action has the highest priority?",
    options:["Ask the client to describe the plan in detail.","Document the statement and continue routine observations.","Notify family members immediately.","Encourage the client to attend group therapy."],
    correct:[0], rationale:"A sudden sense of relief may indicate the client has made a decision to die. Immediate suicide assessment is the priority. Routine observation is unsafe when suicide risk is suspected. Family notification occurs after assessment. Group therapy is inappropriate before determining immediate safety." },

  { id:"psx3", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Schizophrenia",
    stem:"A client with schizophrenia suddenly stops talking and stares toward the corner of the room. Which nursing response is most appropriate?",
    options:["I understand the voices seem real to you. What are they saying right now?","There is no one there. You need to ignore the hallucinations.","You're imagining things because of your illness.","I'll ask the provider for additional medication immediately."],
    correct:[0], rationale:"Acknowledging the client's experience without validating the hallucination promotes trust while assessing for command hallucinations. Arguing increases defensiveness, dismissing damages rapport, and medication decisions should follow assessment." },

  { id:"psx4", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Bipolar Disorder",
    stem:"A client experiencing acute mania refuses meals because there is 'too much to do.' Which intervention should the nurse implement first?",
    options:["Offer high-calorie finger foods that can be eaten while moving.","Explain the importance of sitting quietly during meals.","Document the refusal and reassess later.","Restrict activity until the client agrees to eat."],
    correct:[0], rationale:"Clients experiencing mania often cannot sit still. Portable, high-calorie foods help maintain nutrition. Lengthy explanations are ineffective during acute mania. Waiting increases nutritional risk. Restricting activity is inappropriate unless safety is threatened." },

  { id:"psx5", module:"Module 5", section:1, type:"mcq", diff:4, concept:"PTSD",
    stem:"A combat veteran suddenly drops to the floor after hearing fireworks outside the hospital. What is the nurse's priority response?",
    options:["Tell the client there is no danger.","Stand over the client until he calms down.","Speak calmly, identify yourself, and help orient the client to the present.","Ask the client to explain what happened."],
    correct:[2], rationale:"Grounding techniques help clients experiencing PTSD flashbacks regain orientation to the present. Simply telling the client there is no danger is not therapeutic. Standing over the client may increase fear. Assessment questions should occur after the client is stabilized." },

  { id:"psx6", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Eating Disorders",
    stem:"A client with anorexia nervosa has gained 1.4 kg (3 lb) in four days after nutritional rehabilitation. Which assessment finding requires immediate follow-up?",
    options:["Heart rate 58/min","Serum phosphorus 1.8 mg/dL","Reports mild abdominal bloating","Requests to walk after meals"],
    correct:[1], rationale:"Hypophosphatemia is a hallmark of refeeding syndrome and can rapidly become life-threatening. Bradycardia may improve gradually. Bloating is common during refeeding. Exercise restriction is important but is not the priority over refeeding syndrome." },

  { id:"psx7", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Substance Use",
    stem:"A client says, 'I don't have a drinking problem. I just drink because everyone else does.' Which defense mechanism is demonstrated?",
    options:["Projection","Denial","Regression","Compensation"],
    correct:[1], rationale:"Denial involves refusing to acknowledge the existence or severity of a problem. Projection attributes one's feelings to others. Regression involves returning to earlier behaviors. Compensation involves emphasizing strengths to cover weaknesses." },

  { id:"psx8", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Borderline Personality Disorder",
    stem:"A client tells the nurse, 'You're the only one here who actually cares. Everyone else is incompetent.' What is the nurse's best response?",
    options:["Thank you. I'll make sure I'm assigned to you tomorrow.","I'll share your concerns with the other nurses.","It sounds like you're frustrated. All members of your treatment team are working together to help you.","Why don't you like the other nurses?"],
    correct:[2], rationale:"This response recognizes the emotion while preventing staff splitting and reinforcing team consistency. Option A accepts the split. Option B may reinforce manipulation. Option D encourages further splitting." },

  { id:"psx9", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Crisis Intervention",
    stem:"Which client should the nurse assess first?",
    options:["A client grieving the death of a spouse two weeks ago.","A client stating, 'I have a gun at home and I know exactly when I'll use it.'","A client crying after failing an examination.","A client angry about a delayed discharge."],
    correct:[1], rationale:"A client with suicidal intent, plan, and access to lethal means represents the highest priority. Normal grief is important but not immediately life-threatening. Emotional distress requires assessment but is lower priority. Anger alone is not the highest priority." },

  { id:"psx10", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Restraints",
    stem:"A client becomes physically aggressive toward staff. Which intervention should the nurse implement before applying restraints whenever possible?",
    options:["Obtain a family member's consent.","Attempt verbal de-escalation and offer less restrictive interventions.","Administer emergency medication without assessment.","Call security to immediately restrain the client."],
    correct:[1], rationale:"Least restrictive measures must be attempted first unless immediate danger prevents them. Family consent is not required. Medication requires assessment and appropriate indication. Physical restraint without attempting less restrictive measures is inappropriate when time permits." },

  { id:"psx11", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Therapeutic Communication",
    stem:"A client newly diagnosed with terminal cancer quietly says, 'I'm scared my children won't remember me.' Which nursing response is most therapeutic?",
    options:["You should stay positive for your children.","Tell me what concerns you most about that.","Your children will always remember you.","Have you considered writing them letters?"],
    correct:[1], rationale:"An open-ended response encourages expression of feelings before offering solutions. Option A minimizes emotions. Option C provides false reassurance. Option D may eventually be appropriate but prematurely shifts to problem-solving." },

  { id:"psx12", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Panic Disorder",
    stem:"A client experiencing a panic attack reports chest pain, dizziness, and fear of dying. Which intervention should the nurse implement first?",
    options:["Teach deep-breathing exercises.","Stay with the client and use short, calm statements.","Ask the client to describe previous panic attacks.","Encourage the client to join group therapy."],
    correct:[1], rationale:"Remaining with the client and providing calm reassurance decreases anxiety and promotes safety. Teaching is ineffective during severe anxiety. Detailed assessment can wait until anxiety decreases. Group therapy is inappropriate during an acute panic attack." },

  { id:"psx13", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Grief",
    stem:"A spouse whose partner died yesterday states, 'I keep expecting him to walk through the door.' Which interpretation is most appropriate?",
    options:["The client is demonstrating denial, a common grief response.","The client is experiencing psychosis.","The client is exhibiting maladaptive coping.","The client should begin antidepressant therapy immediately."],
    correct:[0], rationale:"Temporary denial is a normal early response during the grieving process. No evidence suggests psychosis. This reaction is expected immediately after a loss. Medication is not indicated solely based on this statement." },

  { id:"psx14", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Capacity & Consent",
    stem:"A client with schizophrenia refuses surgery after accurately explaining the risks, benefits, and alternatives. Which action by the nurse is most appropriate?",
    options:["Assume the client lacks decision-making capacity due to the psychiatric diagnosis.","Notify the provider that informed consent cannot be obtained.","Recognize the client's right to refuse treatment if decision-making capacity is intact.","Ask the client's sibling to sign the consent form."],
    correct:[2], rationale:"Decision-making capacity is based on the ability to understand and communicate informed decisions, not on diagnosis alone. Psychiatric illness alone does not eliminate capacity. Capacity must first be assessed. A surrogate is unnecessary if the client has capacity." },

  { id:"psx15", module:"Module 5", section:1, type:"mcq", diff:3, concept:"PTSD",
    stem:"A client with PTSD refuses to sit facing away from the door during group therapy. Which nursing action is most appropriate?",
    options:["Require the client to remain in the assigned seat.","Allow the client to choose a seat while exploring safety concerns.","Tell the client everyone must follow the same rules.","Excuse the client from therapy indefinitely."],
    correct:[1], rationale:"Allowing reasonable environmental control promotes psychological safety while encouraging participation. Requiring the assigned seat may increase anxiety. Failing to address trauma-related concerns is nontherapeutic. Avoidance should not be reinforced long term." },

  { id:"psx16", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Substance Use",
    stem:"A client hospitalized for alcohol withdrawal suddenly becomes disoriented, agitated, and begins seeing insects crawling on the wall. What is the nurse's priority action?",
    options:["Dim the lights and allow the client to sleep.","Notify the provider immediately and prepare for management of delirium tremens.","Reorient the client once every shift.","Explain that the hallucinations are not real."],
    correct:[1], rationale:"These findings suggest delirium tremens, a life-threatening emergency requiring immediate intervention. Delay in treatment increases mortality. Reorientation alone is insufficient. The priority is stabilization." },

  { id:"psx17", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Abuse",
    stem:"A client quietly tells the nurse, 'My husband hit me last night, but please don't tell anyone.' What should the nurse do first?",
    options:["Immediately notify the spouse.","Assess the client's immediate safety and review mandatory reporting requirements according to applicable laws.","Tell the client to leave the relationship immediately.","Contact social media support groups."],
    correct:[1], rationale:"Safety assessment is the priority before planning interventions or discussing available resources. Contacting the abuser is unsafe. Leaving may not be immediately safe or feasible. Social media is not the priority intervention." },

  { id:"psx18", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Schizophrenia",
    stem:"A client says, 'The television anchor is sending me secret instructions.' Which symptom is the client demonstrating?",
    options:["Concrete thinking","Thought blocking","Idea of reference","Flight of ideas"],
    correct:[2], rationale:"Ideas of reference involve believing unrelated events have special personal meaning. Concrete thinking is literal interpretation. Thought blocking is interruption of thoughts. Flight of ideas involves rapid topic changes." },

  { id:"psx19", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Depression",
    stem:"A client who has been withdrawn for several days suddenly appears cheerful and asks to wear regular clothes home tomorrow. Which nursing action is the priority?",
    options:["Congratulate the client on the improvement.","Assess the client for suicidal thoughts and intent.","Arrange immediate discharge planning.","Reduce observation because the client appears stable."],
    correct:[1], rationale:"Sudden mood improvement may indicate a client has decided to complete suicide and requires immediate reassessment. Assuming improvement may be dangerous. Discharge planning should follow assessment. Observation should not be reduced without reassessment." },

  { id:"psx20", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Defense Mechanisms",
    stem:"After receiving a diagnosis of heart failure, a client begins excessively cleaning the hospital room and organizing personal belongings. Which defense mechanism is most likely being demonstrated?",
    options:["Projection","Reaction formation","Displacement","Undoing"],
    correct:[3], rationale:"Undoing involves attempting to symbolically reverse or 'make up for' distressing thoughts or events through ritualistic behaviors. Projection attributes feelings to others. Reaction formation expresses the opposite of true feelings. Displacement redirects emotions toward a safer target." },

  { id:"psx21", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Therapeutic Communication",
    stem:"A client newly admitted with major depressive disorder says, 'Nothing you say is going to help me.' Which response by the nurse is most therapeutic?",
    options:["I'm sorry you feel that way.","What has your experience been with getting help in the past?","You'll probably feel differently after a few days here.","You need to give treatment a chance."],
    correct:[1], rationale:"Exploring previous experiences encourages discussion without arguing or offering false reassurance. Option A expresses sympathy but does not promote further communication. Option C offers false reassurance. Option D can sound judgmental and dismissive." },

  { id:"psx22", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Mania",
    stem:"A client experiencing acute mania repeatedly interrupts other clients during group therapy despite multiple reminders. Which nursing intervention is most appropriate?",
    options:["End the group session immediately.","Firmly redirect the client and consistently reinforce behavioral limits.","Ignore the behavior to avoid reinforcing it.","Privately confront the client after group concludes."],
    correct:[1], rationale:"Consistent, calm limit-setting is the most therapeutic intervention during acute mania. Ending the session punishes the entire group. Ignoring disruptive behavior is unsafe. Delayed intervention is less effective." },

  { id:"psx23", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Anxiety",
    stem:"A client awaiting biopsy results states, 'I can't stop thinking the worst is going to happen.' Which nursing response best demonstrates therapeutic communication?",
    options:["Everything will probably be fine.","Tell me what concerns you the most right now.","You shouldn't think so negatively.","Let's wait until the results come back."],
    correct:[1], rationale:"Encourages expression of fears without minimizing or judging them. Option A is false reassurance. Option C is judgmental. Option D dismisses current anxiety." },

  { id:"psx24", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Schizophrenia",
    stem:"A client says, 'If I don't count to 100 exactly three times before breakfast, everyone on my unit will die.' Which response should the nurse make first?",
    options:["That isn't possible.","What do you think would happen if you didn't complete the ritual?","I understand you're feeling anxious. Tell me more about those thoughts.","You should try distracting yourself instead."],
    correct:[2], rationale:"Acknowledges anxiety while assessing the client's thought process without reinforcing the belief. Arguing is nontherapeutic. Option B prematurely challenges the thought. Option D moves to intervention before assessment." },

  { id:"psx25", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Suicide",
    stem:"Which statement by a client being discharged after treatment for depression requires immediate follow-up?",
    options:["I'm nervous about going home.","I've started organizing all of my financial documents for my family.","I hope my medications continue helping.","I plan to attend counseling every week."],
    correct:[1], rationale:"Putting affairs in order can indicate preparation for suicide and requires immediate assessment. Option A is common discharge anxiety. Option C is an appropriate treatment expectation. Option D is a positive coping plan." },

  { id:"psx26", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Borderline Personality Disorder",
    stem:"A client tells one nurse, 'The night nurse lets me break the rules because she actually understands me.' What is the priority nursing intervention?",
    options:["Ask the night nurse whether the statement is true.","Remind staff to maintain consistent expectations and boundaries.","Allow flexibility to preserve rapport.","Transfer the client to another unit."],
    correct:[1], rationale:"Consistency among staff prevents splitting and manipulation. Option A focuses on individuals rather than team consistency. Option C reinforces manipulation. Option D avoids rather than manages the behavior." },

  { id:"psx27", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Substance Use",
    stem:"A client states, 'I know drinking has caused problems, but I'm not ready to quit.' Which nurse response best reflects motivational interviewing?",
    options:["You need to stop before things get worse.","What do you enjoy about drinking, and what concerns you about it?","I think you're making a mistake.","You've already admitted alcohol is the problem."],
    correct:[1], rationale:"Explores ambivalence without judgment, a core principle of motivational interviewing. Option A is confrontational. Option C is judgmental. Option D may provoke resistance." },

  { id:"psx28", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Cultural Considerations",
    stem:"A client's family requests that serious diagnoses not be discussed directly with the client due to cultural beliefs. Which nursing action is most appropriate?",
    options:["Automatically honor the family's request.","Assess the client's preferences regarding receiving medical information.","Refuse to involve the family in discussions.","Discuss the diagnosis only with the family."],
    correct:[1], rationale:"Patient preferences should guide communication while respecting cultural values. Option A assumes family wishes equal patient wishes. Option C excludes family unnecessarily. Option D violates patient autonomy if preferences are unknown." },

  { id:"psx29", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Grief",
    stem:"A client says, 'If I had convinced him to see the doctor sooner, he'd still be alive.' Which grief response is the client demonstrating?",
    options:["Acceptance","Bargaining","Denial","Projection"],
    correct:[1], rationale:"Bargaining often includes 'if only' statements expressing guilt and attempts to mentally change the outcome. Acceptance reflects resolution. Denial rejects the reality of the loss. Projection attributes feelings to others." },

  { id:"psx30", module:"Module 5", section:1, type:"mcq", diff:4, concept:"PTSD",
    stem:"A client with PTSD becomes visibly distressed during a routine assessment after hearing a helicopter overhead. What is the nurse's priority intervention?",
    options:["Continue the assessment to avoid reinforcing avoidance behaviors.","Move the client to a quieter environment and use grounding techniques.","Ask detailed questions about the traumatic event.","Administer PRN medication immediately."],
    correct:[1], rationale:"Reducing environmental triggers and grounding the client are priority interventions. Continued questioning increases distress. Trauma processing is inappropriate during acute distress. Medication may be needed later but assessment and grounding come first." },

  { id:"psx31", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Eating Disorders",
    stem:"A client with bulimia nervosa returns from the bathroom immediately after meals. Which nursing action is the priority?",
    options:["Remain with the client for at least one hour after meals.","Ask the client whether vomiting occurred.","Document the behavior and notify the provider.","Restrict all bathroom privileges."],
    correct:[0], rationale:"Remaining with the client after meals helps prevent purging behaviors and supports treatment goals. Questioning alone does not prevent purging. Documentation is appropriate but does not address immediate intervention. Bathroom restrictions alone are unnecessarily punitive." },

  { id:"psx32", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Capacity & Consent",
    stem:"A client with severe mania insists on leaving the psychiatric unit despite threatening to harm others. Which nursing action is most appropriate?",
    options:["Allow discharge because the client requested it.","Assess the client's decision-making capacity and immediately notify the provider of the homicidal threats.","Ask the client's spouse whether discharge is appropriate.","Wait until morning rounds to discuss the request."],
    correct:[1], rationale:"Threats toward others require immediate intervention. Decision-making capacity and safety must be evaluated before discharge. Safety concerns override routine discharge requests. A spouse cannot independently determine discharge. Waiting delays management of an immediate risk." },

  { id:"psx33", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Schizophrenia",
    stem:"A client states, 'The FBI implanted a chip in my brain to control my thoughts.' Which response by the nurse is most therapeutic?",
    options:["I don't believe that's happening.","That sounds frightening. I don't share that belief, but I'm here with you.","Tell me more about the government agents.","The FBI has never done that."],
    correct:[1], rationale:"Acknowledges the client's feelings without validating the delusion. Directly arguing may increase defensiveness. Option C may reinforce the delusion. Option D is arguing with the belief, which is nontherapeutic." },

  { id:"psx34", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Restraints",
    stem:"A client placed in violent restraints is now calm and cooperative. Which nursing action is the priority?",
    options:["Continue the restraints until the provider rounds.","Remove the restraints as soon as the client no longer meets criteria.","Wait until family members arrive.","Decrease monitoring because the client is calm."],
    correct:[1], rationale:"Restraints should be discontinued at the earliest possible time when the client is no longer an immediate danger. Restraints should never continue for staff convenience. Family presence is unrelated to removal criteria. Monitoring remains essential." },

  { id:"psx35", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Therapeutic Communication",
    stem:"A client newly diagnosed with multiple sclerosis says, 'I'm afraid my life is over.' Which response is most therapeutic?",
    options:["Many people continue living full lives with MS.","You're focusing on the worst-case scenario.","Tell me what changes concern you the most.","You shouldn't think that way."],
    correct:[2], rationale:"Explores the client's concerns while encouraging emotional expression. Option A provides reassurance before assessment. Option B is judgmental. Option D dismisses the client's feelings." },

  { id:"psx36", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Abuse",
    stem:"A school-age child quietly tells the nurse, 'Please don't tell anyone my stepfather hit me.' What is the nurse's priority response?",
    options:["I won't tell anyone.","You did the right thing by telling me. My first job is to help keep you safe.","I need to ask your stepfather what happened.","If you promise it won't happen again, we don't have to report it."],
    correct:[1], rationale:"Provides support without making promises that cannot legally be kept and prioritizes the child's safety. Option A is a false promise. Option C potentially places the child at greater risk. Option D ignores mandatory reporting requirements." },

  { id:"psx37", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Depression",
    stem:"A client taking sertraline for three weeks states, 'The medicine isn't helping.' Which nursing response is most appropriate?",
    options:["You should stop taking it if it isn't working.","Antidepressants often require several weeks before full improvement occurs.","The dose probably isn't high enough.","Let's ask the provider to change medications today."],
    correct:[1], rationale:"SSRIs commonly require 4 to 6 weeks for maximum therapeutic benefit. Stopping abruptly is inappropriate. Dose adjustments require provider evaluation. Medication changes are premature at 3 weeks." },

  { id:"psx38", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Homicide Risk",
    stem:"A client angrily tells the nurse, 'When I leave here, I'm going to make my boss pay.' What is the nurse's priority action?",
    options:["Document the statement and continue the assessment.","Assess the specificity, intent, and access to means while notifying the provider.","Advise the client that revenge is never appropriate.","Encourage the client to journal about the anger."],
    correct:[1], rationale:"Potential threats toward others require immediate lethality assessment and provider notification. Documentation alone is insufficient. Moralizing is nontherapeutic. Journaling does not address immediate risk." },

  { id:"psx39", module:"Module 5", section:1, type:"mcq", diff:3, concept:"Defense Mechanisms",
    stem:"A client diagnosed with lung cancer states, 'The CT scan must belong to someone else.' Which defense mechanism is the client demonstrating?",
    options:["Projection","Denial","Displacement","Suppression"],
    correct:[1], rationale:"Denial is a temporary refusal to accept reality and commonly occurs after serious diagnoses. Projection attributes feelings to others. Displacement redirects emotions. Suppression is a conscious decision to postpone thinking about something." },

  { id:"psx40", module:"Module 5", section:1, type:"mcq", diff:4, concept:"Prioritization",
    stem:"The nurse receives report on four clients. Which client should be assessed first?",
    options:["A client with generalized anxiety disorder requesting PRN medication before bedtime.","A client with schizophrenia who quietly states, 'The voices are telling me to hurt the nurse.'","A client with depression who declined breakfast.","A client with obsessive-compulsive disorder washing hands repeatedly."],
    correct:[1], rationale:"Command hallucinations directing harm to others represent an immediate safety threat requiring priority assessment and intervention. Routine anxiety is lower priority. Poor appetite is common with depression but is not immediately life-threatening. Compulsive behaviors require intervention but are lower priority than imminent violence." },

  // SATA
  { id:"psx_s1", module:"Module 5", section:2, type:"sata", diff:3, concept:"Therapeutic Communication",
    stem:"The nurse is caring for a client newly diagnosed with multiple sclerosis who begins crying and says, 'I'm terrified my children will have to take care of me.' Which nursing responses are therapeutic? Select all that apply.",
    options:["Tell me more about what worries you the most.","Your children will probably never have to do that.","It sounds like you're worried about becoming dependent.","What has your provider told you about the expected course of your illness?","You need to stay positive.","I'm here to listen if you'd like to talk."],
    correct:[0,2,3,5], rationale:"Open-ended questions, reflection, clarification, and offering self facilitate therapeutic communication. Option B provides false reassurance. Option E minimizes the client's concerns." },

  { id:"psx_s2", module:"Module 5", section:2, type:"sata", diff:4, concept:"Suicide Risk",
    stem:"The nurse is assessing a client for suicide risk. Which findings indicate an increased immediate risk? Select all that apply.",
    options:["The client has access to a firearm.","The client reports a detailed suicide plan.","The client recently gave away treasured possessions.","The client expresses hope about the future.","The client has a history of previous suicide attempts.","The client suddenly appears unusually cheerful after weeks of severe depression."],
    correct:[0,1,2,4,5], rationale:"Access to lethal means, a plan, giving away possessions, previous attempts, and sudden mood improvement are high-risk findings. Hopefulness generally represents a protective factor." },

  { id:"psx_s3", module:"Module 5", section:2, type:"sata", diff:3, concept:"Mania",
    stem:"The nurse is planning care for a client experiencing acute mania. Which interventions are appropriate? Select all that apply.",
    options:["Provide frequent high-calorie finger foods.","Maintain a quiet, low-stimulation environment.","Set clear, consistent behavioral limits.","Encourage competitive group activities.","Allow unlimited caffeine intake.","Provide opportunities for rest periods."],
    correct:[0,1,2,5], rationale:"Clients with mania benefit from nutrition support, low stimulation, consistent limits, and rest. Competition increases stimulation. Caffeine worsens manic symptoms." },

  { id:"psx_s4", module:"Module 5", section:2, type:"sata", diff:4, concept:"Schizophrenia",
    stem:"A client reports hearing voices telling him to harm himself. Which nursing actions are appropriate? Select all that apply.",
    options:["Assess what the voices are saying.","Determine whether the client intends to act on the voices.","Argue that the voices are not real.","Remain with the client while assessing safety.","Institute suicide precautions if indicated.","Leave the client alone to reduce stimulation."],
    correct:[0,1,3,4], rationale:"Command hallucinations require immediate assessment and safety interventions. Arguing is nontherapeutic. Leaving the client alone increases risk." },

  { id:"psx_s5", module:"Module 5", section:2, type:"sata", diff:3, concept:"PTSD",
    stem:"The nurse is caring for a client diagnosed with PTSD. Which nursing interventions are appropriate? Select all that apply.",
    options:["Identify environmental triggers.","Use grounding techniques during flashbacks.","Encourage the client to relive traumatic events during an acute flashback.","Speak calmly using simple, reassuring statements.","Allow the client to choose a seat facing the doorway if desired.","Tell the client the fear is irrational."],
    correct:[0,1,3,4], rationale:"Reducing triggers, grounding, calm communication, and allowing reasonable environmental control promote safety and reduce anxiety. Trauma processing should not occur during an acute flashback. Dismissing the client's fear is nontherapeutic." },

  { id:"psx_s6", module:"Module 5", section:2, type:"sata", diff:4, concept:"Eating Disorders",
    stem:"A client with anorexia nervosa has just begun nutritional rehabilitation. Which findings should the nurse recognize as possible signs of refeeding syndrome? Select all that apply.",
    options:["Peripheral edema","Serum phosphorus of 1.7 mg/dL","New cardiac dysrhythmias","Bradycardia improving from baseline","Generalized muscle weakness","Sudden hypertension"],
    correct:[0,1,2,4], rationale:"Hypophosphatemia, edema, muscle weakness, and dysrhythmias are classic findings of refeeding syndrome. Improving bradycardia is generally expected with nutritional recovery. Hypertension is not a hallmark finding." },

  { id:"psx_s7", module:"Module 5", section:2, type:"sata", diff:3, concept:"Substance Use Disorders",
    stem:"The nurse is using motivational interviewing with a client who has alcohol use disorder. Which nurse statements are consistent with motivational interviewing? Select all that apply.",
    options:["What concerns do you have about your drinking?","Tell me what you enjoy about drinking.","You have to stop drinking immediately.","On a scale from 1 to 10, how ready are you to make a change?","It sounds like part of you wants things to be different.","If you cared about your family, you'd quit."],
    correct:[0,1,3,4], rationale:"Motivational interviewing explores ambivalence, assesses readiness for change, and avoids confrontation or judgment. Confrontational and guilt-based statements are nontherapeutic." },

  { id:"psx_s8", module:"Module 5", section:2, type:"sata", diff:4, concept:"Borderline Personality Disorder",
    stem:"The nurse is caring for a client with borderline personality disorder. Which nursing interventions are appropriate? Select all that apply.",
    options:["Maintain consistent boundaries among staff.","Respond consistently to manipulative behaviors.","Make exceptions to unit rules to build rapport.","Use a matter-of-fact, nonjudgmental approach.","Encourage staff members to independently negotiate rules.","Communicate regularly with the treatment team regarding client behaviors."],
    correct:[0,1,3,5], rationale:"Consistency, teamwork, and clear boundaries reduce splitting and manipulation. Special exceptions reinforce maladaptive behaviors. Inconsistent expectations encourage staff splitting." },

  { id:"psx_s9", module:"Module 5", section:2, type:"sata", diff:3, concept:"Grief",
    stem:"A client is experiencing anticipatory grief after being diagnosed with terminal cancer. Which nursing interventions are appropriate? Select all that apply.",
    options:["Encourage the client to discuss fears about the future.","Support meaningful family interactions.","Discourage conversations about death to maintain hope.","Offer referrals to spiritual care if desired.","Validate the client's emotions without attempting to fix them.","Change the subject when the client becomes tearful."],
    correct:[0,1,3,4], rationale:"Open communication, family support, spiritual resources, and emotional validation promote healthy coping. Avoiding discussions about death may increase isolation. Changing the subject minimizes emotions." },

  { id:"psx_s10", module:"Module 5", section:2, type:"sata", diff:4, concept:"Restraints and Seclusion",
    stem:"Which actions are appropriate when caring for a client placed in violent restraints? Select all that apply.",
    options:["Use restraints only after less restrictive measures fail, unless immediate danger exists.","Obtain a provider order according to policy.","Assess circulation, airway, and skin integrity regularly.","Continue restraints until the end of the shift regardless of improvement.","Document behaviors requiring continued restraint.","Remove restraints as soon as criteria are no longer met."],
    correct:[0,1,2,4,5], rationale:"Violent restraints require continuous reassessment, documentation, and removal at the earliest safe opportunity. Restraints should never remain in place solely because of the time of day or shift." },

  { id:"psx_s11", module:"Module 5", section:2, type:"sata", diff:3, concept:"Depression",
    stem:"Which findings place a client with major depressive disorder at increased risk for suicide? Select all that apply.",
    options:["History of previous suicide attempt.","Recent loss of a spouse.","Sudden improvement in mood after prolonged depression.","Future-oriented plans with family.","Access to firearms.","Hopelessness."],
    correct:[0,1,2,4,5], rationale:"Previous attempts, significant losses, sudden mood improvement, hopelessness, and access to lethal means are established suicide risk factors. Future-oriented thinking generally represents a protective factor." },

  { id:"psx_s12", module:"Module 5", section:2, type:"sata", diff:4, concept:"Psychopharmacology",
    stem:"The nurse is assessing a client taking clozapine. Which findings require immediate follow-up? Select all that apply.",
    options:["Temperature of 38.8°C (101.8°F).","Sore throat.","WBC count of 2,100/mm³.","Dry mouth.","Reports of fatigue.","Absolute neutrophil count below recommended parameters."],
    correct:[0,1,2,5], rationale:"Fever, sore throat, leukopenia, and neutropenia may indicate agranulocytosis, a life-threatening adverse effect of clozapine. Dry mouth is a common nonemergent side effect. Fatigue alone is nonspecific." },

  { id:"psx_s13", module:"Module 5", section:2, type:"sata", diff:3, concept:"Child Abuse",
    stem:"The nurse suspects child abuse during an emergency department visit. Which actions are appropriate? Select all that apply.",
    options:["Document objective findings carefully.","Report suspected abuse according to state law.","Interview the child privately when appropriate.","Confront the suspected abuser aggressively.","Photograph injuries according to facility policy.","Promise the child that no report will be made."],
    correct:[0,1,2,4], rationale:"Objective documentation, mandatory reporting, private interviewing, and policy-based evidence collection are appropriate. Aggressive confrontation may increase danger. Mandatory reporting prevents promises of secrecy." },

  { id:"psx_s14", module:"Module 5", section:2, type:"sata", diff:4, concept:"Anxiety Disorders",
    stem:"The nurse is caring for a client experiencing severe anxiety. Which nursing interventions are appropriate? Select all that apply.",

const STORE_KEY = 'nclex_qbank_madison';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function getStatus(state, id) {
  return (state[id] && state[id].status) || 'active';
}
function getNotes(state, id) {
  return (state[id] && state[id].notes) || '';
}
function getFlagReason(state, id) {
  return (state[id] && state[id].flagReason) || '';
}

const FLAG_REASON_LABELS = {
  session:  '📋 Cover in Session',
  clarify:  '❓ Need Clarification',
  drill:    '🔁 Needs Drilling',
  discuss:  '💬 Want to Discuss',
};
const FLAG_REASON_CLASSES = {
  session: 'tag-reason-session',
  clarify: 'tag-reason-clarify',
  drill:   'tag-reason-drill',
  discuss: 'tag-reason-discuss',
};

function typeTag(t) {
  const map = { mcq:'MCQ', sata:'SATA', bowtie:'Bow-Tie', casestudy:'Case Study' };
  const cls = { mcq:'tag-mcq', sata:'tag-sata', bowtie:'tag-bowtie', casestudy:'tag-case' };
  return `<span class="q-tag ${cls[t]||''}">${map[t]||t}</span>`;
}
function diffTag(d) {
  const map = {1:'⚪ Foundation', 2:'🟡 Application', 3:'🔴 NGN'};
  const cls = {1:'tag-d1', 2:'tag-d2', 3:'tag-d3'};
  return `<span class="q-tag ${cls[d]||''}">${map[d]||d}</span>`;
}

function renderAll() {
  const state = loadState();
  const root = document.getElementById('bank-root');
  const modules = ['Module 1', 'Module 2', 'Module 3', 'Module 4'];
  const fMod = document.getElementById('f-module').value;
  const fType = document.getElementById('f-type').value;
  const fDiff = document.getElementById('f-diff').value;
  const fStatus = document.getElementById('f-status').value;
  const fReason = document.getElementById('f-reason').value;
  const search = document.getElementById('search').value.toLowerCase();

  let total = 0, active = 0, flagged = 0, removed = 0;
  QUESTIONS.forEach(q => {
    const st = getStatus(state, q.id);
    total++;
    if (st === 'active') active++;
    if (st === 'flagged') flagged++;
    if (st === 'removed') removed++;
  });
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-flagged').textContent = flagged;
  document.getElementById('stat-removed').textContent = removed;

  let html = '';
  modules.forEach(mod => {
    if (fMod && fMod !== mod) return;
    const qs = QUESTIONS.filter(q => {
      if (q.module !== mod) return false;
      if (fType && q.type !== fType) return false;
      if (fDiff && String(q.diff) !== fDiff) return false;
      const st = getStatus(state, q.id);
      if (fStatus && st !== fStatus) return false;
      if (fReason && getFlagReason(state, q.id) !== fReason) return false;
      if (search && !q.stem.toLowerCase().includes(search) && !q.concept.toLowerCase().includes(search) && !(getNotes(state,q.id).toLowerCase().includes(search))) return false;
      return true;
    });
    if (!qs.length) return;

    const modColorMap = { 'Module 1':'#059669', 'Module 2':'#7c3aed', 'Module 3':'#0369a1', 'Module 4':'#dc2626' };
    const modEmojiMap = { 'Module 1':'🍼', 'Module 2':'🤰', 'Module 3':'💊', 'Module 4':'❤️' };
    const modColor = modColorMap[mod] || '#475569';
    const modEmoji = modEmojiMap[mod] || '📚';
    html += `<div class="module-section">
      <div class="module-header" style="background:${modColor};">
        <span style="font-size:20px;">${modEmoji}</span>
        <h2>${mod}</h2>
        <span>${qs.length} question${qs.length!==1?'s':''} shown</span>
      </div>`;

    qs.forEach((q, i) => {
      const st = getStatus(state, q.id);
      const notes = getNotes(state, q.id);
      const reason = getFlagReason(state, q.id);
      const cardClass = st === 'flagged' ? 'flagged' : st === 'removed' ? 'removed' : '';
      const stemClass = st === 'removed' ? 'removed-text' : '';
      const flagActive = st === 'flagged' ? 'active' : '';
      const qNum = i + 1;

      const optHtml = (q.options||[]).map((o,oi) => {
        const isCorrect = (q.correct||[]).includes(oi);
        return `<div class="option-item ${isCorrect?'correct':''}">${o}</div>`;
      }).join('');

      const reasonTagHtml = (st === 'flagged' && reason)
        ? `<span class="q-tag ${FLAG_REASON_CLASSES[reason]||''}">${FLAG_REASON_LABELS[reason]||reason}</span>`
        : '';

      const reasonDropdown = st === 'flagged' ? `
        <div class="flag-reason-wrap" onclick="event.stopPropagation()">
          <select class="flag-reason-select" onchange="setFlagReason('${q.id}', this.value)">
            <option value="" ${!reason?'selected':''}>— Why flagged? —</option>
            <option value="session"  ${reason==='session' ?'selected':''}>📋 Cover in Session</option>
            <option value="clarify"  ${reason==='clarify' ?'selected':''}>❓ Need Clarification</option>
            <option value="drill"    ${reason==='drill'   ?'selected':''}>🔁 Needs Drilling</option>
            <option value="discuss"  ${reason==='discuss' ?'selected':''}>💬 Want to Discuss</option>
          </select>
        </div>` : '';

      html += `<div class="q-card ${cardClass}" id="card-${q.id}">
        <div class="q-header" onclick="toggleBody('${q.id}')">
          <div class="q-num">#${qNum}</div>
          <div style="flex:1;">
            <div class="q-meta">
              ${typeTag(q.type)}${diffTag(q.diff)}<span class="q-tag tag-concept">📚 ${q.concept}</span>
              ${st==='flagged'?'<span class="q-tag" style="background:#fef9c3;color:#92400e;">🚩 Flagged</span>':''}
              ${reasonTagHtml}
              ${st==='removed'?'<span class="q-tag" style="background:#fee2e2;color:#991b1b;">🗑️ Removed</span>':''}
            </div>
            <div class="q-stem ${stemClass}">${q.stem}</div>
          </div>
          <div class="q-actions" onclick="event.stopPropagation()">
            ${reasonDropdown}
            ${st!=='removed'?`<button class="btn-flag ${flagActive}" onclick="toggleFlag('${q.id}')">${st==='flagged'?'🚩 Flagged':'🚩 Flag'}</button>`:''}
            ${st!=='removed'?`<button class="btn-remove" onclick="removeQ('${q.id}')">🗑️ Remove</button>`:`<button class="btn-restore" onclick="restoreQ('${q.id}')">↩️ Restore</button>`}
            <button class="btn-expand" onclick="toggleBody('${q.id}')">▾</button>
          </div>
        </div>
        <div class="q-body" id="body-${q.id}">
          <div class="q-section-label">Answer Options</div>
          <div class="options-list">${optHtml}</div>
          ${q.rationale ? `<div class="q-section-label">Rationale</div><div class="rationale-box">${typeof q.rationale==='string'?q.rationale:(q.rationale.correct||JSON.stringify(q.rationale))}</div>` : ''}
          <div class="notes-area">
            <div class="q-section-label" style="margin-top:12px;">📝 Your Notes</div>
            <textarea placeholder="Add notes here — e.g. 'consider updating distractor C' or 'student keeps missing this concept'" onchange="saveNote('${q.id}',this.value)">${notes}</textarea>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  if (!html) html = '<div class="empty-state">No questions match your filters.</div>';
  root.innerHTML = html;
}

function toggleBody(id) {
  const el = document.getElementById('body-' + id);
  if (el) el.classList.toggle('open');
}
function toggleFlag(id) {
  const state = loadState();
  if (!state[id]) state[id] = {};
  if (state[id].status === 'flagged') {
    state[id].status = 'active';
    delete state[id].flagReason;
  } else {
    state[id].status = 'flagged';
  }
  saveState(state);
  renderAll();
}
function setFlagReason(id, reason) {
  const state = loadState();
  if (!state[id]) state[id] = {};
  state[id].flagReason = reason;
  saveState(state);
  renderAll();
}
function removeQ(id) {
  if (!confirm('Mark this question as Removed? You can restore it anytime.')) return;
  const state = loadState();
  if (!state[id]) state[id] = {};
  state[id].status = 'removed';
  saveState(state);
  renderAll();
}
function restoreQ(id) {
  const state = loadState();
  if (!state[id]) state[id] = {};
  state[id].status = 'active';
  saveState(state);
  renderAll();
}
function saveNote(id, val) {
  const state = loadState();
  if (!state[id]) state[id] = {};
  state[id].notes = val;
  saveState(state);
}
function applyFilters() { renderAll(); }

function exportFlagged() {
  const state = loadState();
  const flagged = QUESTIONS.filter(q => getStatus(state, q.id) === 'flagged');
  if (!flagged.length) { alert('No questions are currently flagged for review.'); return; }
  let txt = 'FLAGGED QUESTIONS FOR REVIEW\nStudy with Madison, RN\n' + new Date().toLocaleDateString() + '\n';
  txt += '='.repeat(50) + '\n\n';
  flagged.forEach((q,i) => {
    const notes = getNotes(state, q.id);
    const reason = getFlagReason(state, q.id);
    const reasonLabel = reason ? (FLAG_REASON_LABELS[reason] || reason) : 'No reason set';
    txt += `${i+1}. [${q.module}] [${q.type.toUpperCase()}] [Diff: ${q.diff}] — ${q.concept}\n`;
    txt += `   Reason: ${reasonLabel}\n`;
    txt += `   ${q.stem}\n`;
    if (notes) txt += `   Notes: ${notes}\n`;
    txt += '\n';
  });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flagged-questions.txt';
  a.click();
}

renderAll();
</script>
</body>
</html>
