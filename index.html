options:["Ensuring the client participates in care decisions when able","Reporting suspected neglect to the appropriate agency","Requesting an interpreter for informed consent discussions","Completing the consent form without provider explanation","Notifying the provider when the client's condition changes","Telling the family the client's diagnosis without the client's permission"],
correct:[0,1,2,4],rationale:{correct:"Advocacy includes supporting autonomy, reporting abuse/neglect, ensuring communication access, and communicating clinical changes.",wrong:["Consent forms cannot substitute for provider explanation of risks and benefits.","Sharing diagnosis against the client's wishes violates confidentiality and autonomy."]}},

{id:"rm22",type:"sata",difficulty:3,blueprint:"Physiological Integrity",category:"Reduction of Risk Potential",
stem:"A nurse is monitoring a postoperative client. Select ALL findings that should be reported to the provider immediately.",
options:["Urine output 15 mL/hr for 2 hours in a hemodynamically unstable client","Unilateral calf swelling and pain after knee surgery","Blood glucose 102 mg/dL before lunch","Wound redness limited to 0.5 cm at the incision line on day 1","Sudden restlessness and confusion in an older adult after opioid administration","Pain 3/10 after scheduled analgesia"],
correct:[0,1,4],rationale:{correct:"Oliguria in an unstable client, possible DVT signs, and acute opioid-related neuro changes require immediate provider notification.",wrong:["Blood glucose 102 mg/dL is not an emergency finding in this context.","Minimal day-1 incision redness can be expected.","Mild pain after analgesia is not an emergency."]}},

{id:"rm23",type:"bowtie",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A 78-year-old client is admitted from a long-term care facility with fever, confusion, blood pressure 86/48, heart rate 118, respiratory rate 24, and lactate 3.8 mmol/L. The client has an indwelling urinary catheter inserted 5 days ago. The provider suspects sepsis.",
stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
leftLabel:"Nursing Actions (Select 2)",centerLabel:"Condition",rightLabel:"Parameters to Monitor (Select 2)",
leftOptions:["Obtain blood cultures before antibiotics if ordered and not yet given","Encourage oral fluids and delay notification until morning","Initiate sepsis bundle orders per protocol and maintain IV access","Place client in high Fowler's only without hemodynamic monitoring"],
centerOptions:["Sepsis","Fluid volume excess","Acute pain","Risk for falls only"],
rightOptions:["Blood pressure and urine output","Blood glucose and appetite","Lactate and temperature","Pain rating and sleep pattern"],
correctLeft:[0,2],correctCenter:[0],correctRight:[0,2],
rationale:{condition:"Fever, hypotension, tachycardia, tachypnea, confusion, and elevated lactate meet sepsis criteria.",actions:"Blood cultures before antibiotics when possible and rapid implementation of sepsis bundle care support early treatment.",outcomes:"Blood pressure and urine output reflect perfusion; lactate and temperature track response to sepsis treatment.",wrong:"Delaying care or focusing only on positioning without monitoring worsens outcomes in sepsis."}},

{id:"rm24",type:"bowtie",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Safety & Infection Prevention",
caseIntro:"A 62-year-old client with MRSA-infected wound drainage is admitted to a semiprivate room. The client is alert, requires wound dressing changes, and will be transported to radiology later today.",
stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
leftLabel:"Nursing Actions (Select 2)",centerLabel:"Condition",rightLabel:"Parameters to Monitor (Select 2)",
leftOptions:["Implement contact precautions with gown and gloves for contact with client or environment","Place client in airborne isolation with N95 at all times","Perform hand hygiene before and after client contact","Assign the client to share bathroom supplies with the roommate"],
centerOptions:["Risk for transmission of multidrug-resistant organism","Risk for impaired skin integrity only","Deficient knowledge","Ineffective airway clearance"],
rightOptions:["Wound drainage and signs of spreading infection","Roommate respiratory status and new MRSA screening needs","Daily weight and oral intake only","Sleep pattern and visitor preferences"],
correctLeft:[0,2],correctCenter:[0],correctRight:[0,1],
rationale:{condition:"MRSA wound drainage requires contact precautions to prevent transmission.",actions:"Gown and gloves for contact plus hand hygiene are core contact precaution interventions.",outcomes:"Monitor wound status and evaluate exposure risk to the roommate and environment.",wrong:"Airborne isolation is not indicated for MRSA. Sharing supplies increases transmission risk."}},

{id:"rm25",type:"bowtie",difficulty:3,blueprint:"Physiological Integrity",category:"Reduction of Risk Potential",
caseIntro:"A 55-year-old client returns from surgery after a total abdominal hysterectomy. Eight hours post-op, the client reports sudden shortness of breath, oxygen saturation is 90% on 2 L nasal cannula, heart rate 112, and the right calf is swollen and tender.",
stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
leftLabel:"Nursing Actions (Select 2)",centerLabel:"Condition",rightLabel:"Parameters to Monitor (Select 2)",
leftOptions:["Notify the provider immediately and keep the client on bed rest","Massage the affected calf to improve circulation","Apply supplemental oxygen to maintain prescribed saturation","Encourage early ambulation in the hallway now"],
centerOptions:["Risk for pulmonary embolism","Risk for constipation","Acute pain","Deficient fluid volume"],
rightOptions:["Respiratory rate and oxygen saturation","Calf circumference and pain in the extremity","Bowel sounds and last bowel movement","Daily weight and oral intake"],
correctLeft:[0,2],correctCenter:[0],correctRight:[0,1],
rationale:{condition:"Sudden dyspnea with tachycardia and unilateral calf findings after surgery suggest pulmonary embolism risk.",actions:"Immediate provider notification, bed rest, and oxygen support are priority nursing actions.",outcomes:"Respiratory status and leg findings monitor for embolism progression and treatment response.",wrong:"Massaging a possible DVT and ambulating before evaluation may increase embolization risk."}},

{id:"rm26",type:"casestudy",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A 70-year-old client is admitted for elective colon resection. The client speaks limited English and the adult son insists on signing the surgical consent because he is the healthcare proxy. The client is alert, oriented, and nodding during the discussion. The provider has not yet explained risks in a language the client understands.",
questions:[
{qid:"rm26a",stem:"Which TWO nursing actions are the priority before the procedure?",type:"sata",
options:["Request a qualified interpreter for the informed consent discussion","Allow the son to sign because he is the healthcare proxy","Verify that the provider explains risks, benefits, and alternatives in a language the client understands","Proceed with pre-op antibiotics because surgery is scheduled","Notify the surgical team to delay until informed consent requirements are met","Ask the UAP to witness consent after the son signs"],
correct:[0,2],rationale:"A qualified interpreter and verified understanding of risks, benefits, and alternatives are required for valid informed consent when language is a barrier."},
{qid:"rm26b",stem:"The son states, 'My father would want the surgery even if he does not understand everything.' What is the nurse's best response?",type:"mcq",
options:["'I will make sure the provider explains everything with an interpreter so your father can decide.'","'Because you are the proxy, we can proceed without his understanding.'","'He can sign now and ask questions later.'","'The consent form is only a formality.'"],
correct:[0],rationale:"The nurse advocates for the client's right to informed consent and facilitates communication through appropriate interpreter services."},
{qid:"rm26c",stem:"After the procedure, the client develops a fever and the nurse notes inadequate handoff communication from the OR. What is the nurse's best action?",type:"mcq",
options:["Use SBAR to clarify the missing information and report changes to the provider","Wait until the next shift to review the chart","Document fever only and continue routine care","Ask the family to explain what happened in surgery"],
correct:[0],rationale:"SBAR promotes clear communication during handoff and supports timely provider notification when the client's status changes."}
]},

{id:"rm27",type:"casestudy",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A medical-surgical nurse receives report on four clients at 0700: Client A has new chest pain and diaphoresis; Client B needs a dressing change for a nonbleeding surgical wound; Client C is stable but requesting PRN anxiolytic for anxiety before a test; Client D needs routine morning medications and breakfast assistance.",
questions:[
{qid:"rm27a",stem:"Which client should the nurse see first?",type:"mcq",
options:["Client A with new chest pain and diaphoresis","Client B who needs a dressing change","Client C who is anxious before a test","Client D who needs medications and breakfast"],
correct:[0],rationale:"New chest pain with diaphoresis may indicate acute coronary syndrome and is the highest priority."},
{qid:"rm27b",stem:"Select ALL tasks the nurse may appropriately delegate to UAP after initial assessment.",type:"sata",
options:["Assisting Client D with breakfast for a stable client","Measuring intake and output for Client D","Assessing Client A's pain before nitroglycerin administration","Changing Client B's nonsterile dressing without nurse evaluation of the wound","Obtaining routine vital signs on Client C who is stable","Evaluating dizziness after blood pressure medication"],
correct:[0,1,4],rationale:"Routine feeding assistance, I&O measurement, and stable vital signs may be delegated with appropriate supervision after nursing assessment."},
{qid:"rm27c",stem:"Client C says, 'I do not want the sedating medication because it makes me too sleepy for my test.' What is the nurse's best action?",type:"mcq",
options:["Administer the medication because it was scheduled","Support the client's decision and offer nonpharmacological anxiety interventions","Tell the client the test cannot proceed without the medication","Ask the family to convince the client to take the medication"],
correct:[1],rationale:"The nurse respects client autonomy and advocates by supporting refusal while offering appropriate alternatives."}
]},

{id:"rm28",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse delegates feeding a stable client to a UAP. Thirty minutes later, the UAP reports the client is coughing during lunch. What is the nurse's priority action?",
options:["Instruct the UAP to feed the client more slowly","Assess the client immediately because supervision and evaluation cannot be delegated","Document the coughing and continue the lunch","Ask the UAP to complete the feeding and report back later"],
correct:[1],rationale:{correct:"When a delegated task reveals a change in client status, the nurse must assess and intervene. Evaluation of clinical changes remains an RN responsibility.",wrong:["Slowing feeding without assessment may not address aspiration risk.","Documentation alone does not address a potential safety event.","Continuing delegation after a concerning report neglects supervisory responsibility."]}},

{id:"rm29",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"Which task is appropriate for the nurse to delegate to an experienced UAP on a stable medical-surgical unit?",
options:["Determining whether a postoperative client is ready to ambulate","Collecting a urine specimen from an indwelling catheter using sterile technique","Comparing a new prescription with the medication administration record before giving a drug","Teaching a client how to use an incentive spirometer"],
correct:[1],rationale:{correct:"Collecting a urine specimen from an indwelling catheter is a routine technical task that may be delegated when the client is stable and the UAP has been trained.",wrong:["Readiness for ambulation requires nursing assessment and judgment.","Medication verification and administration require nursing responsibility.","Client teaching requires nursing judgment and cannot be delegated to UAP."]}},

{id:"rm30",type:"mcq",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse receives report on four clients. Which client should the nurse assess first?",
options:["A client with diabetes whose blood glucose is 248 mg/dL and who is alert and drinking fluids","A client with a fresh tracheostomy who has thick secretions and an SpO2 of 90%","A client requesting a PRN stool softener for constipation","A client who needs discharge paperwork completed before noon"],
correct:[1],rationale:{correct:"A client with a new tracheostomy, thick secretions, and hypoxemia has potential airway compromise and is the highest priority.",wrong:["Hyperglycemia in an alert client drinking fluids requires follow-up but is not the first priority.","Constipation is important but not urgent compared with airway compromise.","Discharge paperwork is a lower priority than an unstable airway."]}},

{id:"rm31",type:"mcq",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"At the start of the shift, a nurse has these pending tasks: administer 0900 medications to four stable clients, respond to a call light from a client reporting chest pressure, and complete an admission assessment for a client who arrived 10 minutes ago. What should the nurse do first?",
options:["Administer the 0900 medications to all four clients","Complete the admission assessment because it is a new client","Assess the client reporting chest pressure immediately","Finish the admission paperwork before seeing any other clients"],
correct:[2],rationale:{correct:"Chest pressure may indicate an acute cardiac event and takes priority over routine medications, admission tasks, and documentation.",wrong:["Routine medications for stable clients can be delayed briefly when an acute symptom requires assessment.","Admission assessment is important but not before assessing a potentially life-threatening symptom.","Paperwork should not delay assessment of chest pressure."]}},

{id:"rm32",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A hospitalized adolescent tells the nurse, 'Please do not tell my parents I am pregnant. I want to talk to the provider myself.' The adolescent is alert and oriented. What is the nurse's best action?",
options:["Notify the parents immediately because they are the legal guardians","Respect the client's request for confidentiality and assist with provider communication","Tell the client that parents must be informed before any care is given","Document the pregnancy in the chart and ask the parents to come to the unit"],
correct:[1],rationale:{correct:"The nurse advocates for the client by respecting confidentiality within legal and ethical limits and facilitating appropriate care communication.",wrong:["Automatic parental notification may violate adolescent confidentiality laws in many states.","Care can be provided while respecting confidentiality when the client has decision-making capacity.","Informing parents against the client's request without legal basis violates advocacy and confidentiality."]}},

{id:"rm33",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse notices that a cognitively intact older adult is not receiving scheduled pain medication because the family told the UAP to withhold it. What is the nurse's priority action?",
options:["Follow the family's request because they know the client best","Assess the client and advocate for pain management based on the client's report and orders","Document the family's request and take no further action","Ask the UAP to continue withholding medication until the provider rounds"],
correct:[1],rationale:{correct:"The nurse advocates for the client by assessing pain and ensuring ordered care is provided according to the client's needs and consent.",wrong:["Family preferences do not override the competent client's right to pain management and ordered care.","Failure to act leaves the client undertreated.","Delaying until provider rounds prolongs unnecessary pain."]}},

{id:"rm34",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A client is scheduled for a colonoscopy with conscious sedation. The client signed the consent form but tells the nurse, 'I still do not understand what could go wrong.' What is the nurse's best action?",
options:["Proceed because the consent form is already signed","Notify the provider to re-explain the procedure, risks, benefits, and alternatives before sedation","Have the UAP witness a second signature and continue","Tell the client to read the consent form again independently"],
correct:[1],rationale:{correct:"Valid informed consent requires understanding. The nurse must ensure the provider addresses unanswered questions before the procedure.",wrong:["A signature alone does not confirm informed consent when understanding is lacking.","UAP cannot resolve informed consent deficiencies.","Reading the form without explanation may not ensure understanding."]}},

{id:"rm35",type:"mcq",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A charge nurse is assigning staff at the beginning of the shift. Which assignment is most appropriate for a newly licensed RN?",
options:["A client with unstable angina who just received thrombolytic therapy","A stable postoperative client who had an appendectomy 2 days ago","A client with diabetic ketoacidosis on an insulin drip","A client with active suicidal ideation and one-to-one observation"],
correct:[1],rationale:{correct:"A stable postoperative client on day 2 is an appropriate assignment for a new graduate with support from the charge nurse.",wrong:["Unstable cardiac clients require experienced nursing judgment.","Insulin drip management is high acuity for a new graduate.","Suicidal clients with one-to-one observation require experienced assessment and safety management."]}},

{id:"rm36",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse is caring for multiple clients. Which situation requires the nurse's immediate attention?",
options:["A client waiting 15 minutes for assistance to the bathroom","A client whose IV pump is beeping due to an occluded line and who reports arm pain","A family member requesting an extra blanket","A client asking for help contacting pastoral care"],
correct:[1],rationale:{correct:"An occluded IV with arm pain may indicate infiltration or phlebitis and requires immediate nursing assessment and intervention.",wrong:["Bathroom assistance is important but generally not emergent if the client is safe.","A blanket request is a comfort need with lower priority.","Pastoral care can be arranged after urgent clinical needs are addressed."]}},

{id:"rm37",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A client with limited English proficiency needs education about a new anticoagulant before discharge. What is the nurse's best advocacy action?",
options:["Provide the education in English and ask the family to translate","Request a qualified medical interpreter and teach using teach-back method","Give the client a printed handout and skip verbal teaching","Ask the UAP who speaks the client's language to explain the medication"],
correct:[1],rationale:{correct:"Advocacy includes ensuring effective communication through a qualified interpreter and verifying understanding with teach-back.",wrong:["Family translation is not a substitute for qualified medical interpretation of medication teaching.","A handout alone may not ensure understanding.","Medication teaching requires nursing judgment and cannot be delegated to UAP."]}},

{id:"rm38",type:"mcq",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A client is brought to the preoperative area and states, 'I changed my mind. I do not want surgery today.' The client is alert and oriented. What is the nurse's priority action?",
options:["Tell the client it is too late to cancel and prepare for transfer","Support the client's right to refuse and notify the provider and surgical team","Ask the family to convince the client to proceed","Have the client sign another consent form to confirm the decision"],
correct:[1],rationale:{correct:"A competent client may withdraw consent at any time. The nurse advocates for autonomy and communicates the refusal to the team.",wrong:["It is never too late for a competent client to refuse surgery.","Family cannot override a competent adult's refusal.","Additional signatures are not required to validate refusal."]}},

{id:"rm39",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse is witnessing informed consent for a client undergoing a hysterectomy. Which nurse action is most appropriate?",
options:["Explain the surgical risks in detail to the client","Verify that the client had opportunity to ask questions and appears to understand before witnessing","Obtain consent from the client's spouse in case the client changes their mind later","Tell the client to sign quickly so surgery is not delayed"],
correct:[1],rationale:{correct:"The nurse's role in informed consent is to witness and verify understanding after the provider explains risks, benefits, and alternatives.",wrong:["Risk explanation is the provider's responsibility, not the nurse witness role.","Spousal consent is not required when the client has capacity.","Rushing consent undermines voluntariness and understanding."]}},

{id:"rm40",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A UAP reports that a client fell in the bathroom while trying to get up alone. The client is awake and complaining of hip pain. What is the nurse's first action?",
options:["Help the UAP get the client back into bed immediately","Assess the client and initiate fall protocol and provider notification","Complete the incident report before assessing the client","Delegate reassessment to the UAP in 30 minutes"],
correct:[1],rationale:{correct:"After a fall, the nurse must assess for injury and follow institutional fall protocols. Assessment cannot be delegated.",wrong:["Moving the client before assessment may worsen injury.","Incident reporting follows assessment and immediate safety actions.","Reassessment cannot be delegated when injury is suspected."]}},

{id:"rm41",type:"mcq",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse overhears a provider discussing a client's HIV status in the elevator with a drug representative. What is the nurse's best action?",
options:["Ignore the conversation because it happened off the unit","Report the breach of confidentiality through appropriate institutional channels","Confront the drug representative only","Post a reminder about HIPAA on the unit bulletin board and take no further action"],
correct:[1],rationale:{correct:"The nurse advocates for client rights by reporting a suspected HIPAA violation through proper channels.",wrong:["Ignoring a confidentiality breach fails the nurse's ethical duty.","Confronting only the representative does not address the provider's violation.","A bulletin board notice does not address the specific breach."]}},

{id:"rm42",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse has completed morning medications for all assigned clients. Which task should the nurse complete next?",
options:["Document all medications given","Assess a client who now has new onset shortness of breath","Return a call from a stable client's family requesting a visit time","Restock the medication cart"],
correct:[1],rationale:{correct:"A new physiological symptom takes priority over documentation, family calls, and supply tasks.",wrong:["Documentation is important but not before assessing acute shortness of breath.","A routine family call can wait when a client has a new respiratory symptom.","Cart restocking is a lower priority than client assessment."]}},

{id:"rm43",type:"sata",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse is delegating care to UAP on a busy unit. Select ALL tasks that may be appropriately delegated to UAP.",
options:["Bathing a stable client who ambulates independently","Interpreting abnormal vital signs and determining the need for provider notification","Measuring and recording vital signs on a stable postoperative client","Deciding whether a client may have a regular diet after surgery","Ambulating a stable client after the nurse determines readiness","Evaluating whether a wound dressing needs to be changed"],
correct:[0,2,4],rationale:{correct:"Bathing, routine vital signs on stable clients, and ambulation after RN readiness assessment may be delegated with supervision.",wrong:["Interpreting abnormal findings and deciding provider notification require nursing judgment.","Diet advancement decisions require nursing assessment.","Wound evaluation requires nursing judgment."]}},

{id:"rm44",type:"sata",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"Select ALL actions that demonstrate client advocacy by the nurse.",
options:["Supporting a competent client's refusal of a procedure","Requesting a social work consult for a client experiencing homelessness","Sharing a client's diagnosis with visitors without the client's permission","Notifying risk management when a client reports care concerns","Encouraging a client to participate in care planning","Telling a client that the provider's decision is final and cannot be questioned"],
correct:[0,1,3,4],rationale:{correct:"Advocacy includes supporting autonomy, securing resources, reporting concerns, and involving the client in care planning.",wrong:["Sharing diagnosis without permission violates confidentiality.","Discouraging questions undermines advocacy and informed decision-making."]}},

{id:"rm45",type:"sata",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A nurse is prioritizing care at the beginning of the shift. Select ALL clients the nurse should assess first.",
options:["A client with a new onset of slurred speech and facial droop","A client requesting PRN acetaminophen for a headache rated 3/10","A client with a blood pressure of 88/46 and altered mental status","A client who needs routine morning insulin before breakfast","A client with an SpO2 of 85% on room air","A client asking for help ordering lunch"],
correct:[0,2,4],rationale:{correct:"Stroke symptoms, hypotension with altered mental status, and severe hypoxemia are emergent priorities.",wrong:["Mild headache is lower priority.","Routine insulin timing is important but not before emergent findings.","Lunch ordering is a low-priority comfort request."]}},

{id:"rm46",type:"sata",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A client is scheduled for an elective procedure. Select ALL nursing responsibilities related to informed consent.",
options:["Confirm the consent form is signed before the procedure","Ensure the provider explained risks, benefits, and alternatives","Determine whether the client understands the information","Perform the surgical procedure if the provider is delayed","Notify the provider if the client has unanswered questions","Witness the client's signature when required by policy"],
correct:[0,1,2,4,5],rationale:{correct:"The nurse verifies consent completeness, facilitates understanding, communicates concerns to the provider, and witnesses as required.",wrong:["Performing surgery is not within nursing scope."]}},

{id:"rm47",type:"sata",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"Select ALL situations in which the nurse should intervene to protect client rights.",
options:["A provider discusses a client's case loudly in the cafeteria using the client's name","A competent client is pressured by staff to accept a blood transfusion","A family member insists on staying during a sensitive exam and the client agrees","A client is asked to sign consent while sedated from premedication","A UAP reminds a client about a scheduled shower","A client requests a second opinion before surgery"],
correct:[0,1,3,5],rationale:{correct:"Confidentiality breaches, coercion, invalid consent due to sedation, and the right to a second opinion all require nurse advocacy.",wrong:["If the client agrees to the family presence, no rights violation exists.","Reminding a client about hygiene is routine care, not a rights issue."]}},

{id:"rm48",type:"sata",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
stem:"A charge nurse is making assignments. Select ALL factors the charge nurse should consider when delegating tasks.",
options:["Competency and training of the delegatee","Stability and acuity of the client","Whether the task requires nursing judgment","The delegatee's personal preference for certain clients","State nurse practice act and institutional policy","Availability of supervision by the RN"],
correct:[0,1,2,4,5],rationale:{correct:"Safe delegation requires evaluating competency, client stability, judgment requirements, legal scope, and RN supervision.",wrong:["Personal preference alone is not a primary delegation criterion."]}},

{id:"rm49",type:"bowtie",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A 64-year-old client is admitted with chest pain. The provider orders cardiac monitoring, nitroglycerin PRN, and telemetry. One hour later, the client reports crushing chest pain rated 9/10, blood pressure 90/60, diaphoresis, and nausea. The nurse has four other stable clients assigned.",
stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
leftLabel:"Nursing Actions (Select 2)",centerLabel:"Condition",rightLabel:"Parameters to Monitor (Select 2)",
leftOptions:["Assess the client immediately and notify the provider","Delegate reassessment of the client to the UAP","Administer prescribed PRN nitroglycerin per protocol after assessment","Complete routine documentation for the other four clients first"],
centerOptions:["Acute coronary syndrome","Risk for infection","Deficient knowledge","Impaired mobility"],
rightOptions:["Chest pain characteristics and blood pressure","Bowel pattern and appetite","Troponin trend and cardiac rhythm","Sleep pattern and visitor status"],
correctLeft:[0,2],correctCenter:[0],correctRight:[0,2],
rationale:{condition:"Crushing chest pain with hypotension, diaphoresis, and nausea suggests acute coronary syndrome.",actions:"Immediate assessment and provider notification are priorities; nitroglycerin may be given per protocol after assessment.",outcomes:"Pain and blood pressure reflect perfusion; troponin and rhythm monitor for myocardial injury and dysrhythmia.",wrong:"Delegating reassessment or delaying care for documentation places the client at risk."}},

{id:"rm50",type:"bowtie",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A 58-year-old client is scheduled for a total knee replacement in 2 hours. The client is alert, anxious, and states, 'I do not think I want the surgery anymore.' The spouse says, 'Sign the papers anyway — we already waited months.' The consent form is unsigned.",
stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
leftLabel:"Nursing Actions (Select 2)",centerLabel:"Condition",rightLabel:"Parameters to Monitor (Select 2)",
leftOptions:["Notify the provider and surgical team of the client's expressed refusal","Ask the spouse to sign the consent form","Assess the client's understanding and explore concerns privately","Proceed to pre-op because the case is already scheduled"],
centerOptions:["Risk for decisional conflict related to informed consent","Risk for infection","Impaired physical mobility","Acute pain"],
rightOptions:["Client's stated understanding and questions about surgery","Surgical site and preoperative vital signs","Family pressure and client's expressed wishes","Bowel sounds and last meal time"],
correctLeft:[0,2],correctCenter:[0],correctRight:[0,2],
rationale:{condition:"The client expresses refusal and family pressure, indicating decisional conflict around informed consent.",actions:"Advocacy requires private assessment of understanding and notifying the team of the client's wishes.",outcomes:"Monitoring the client's understanding and expressed wishes supports valid voluntary consent.",wrong:"Spousal consent and proceeding without valid consent violate client autonomy."}},

{id:"rm51",type:"casestudy",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A nurse on a medical-surgical unit is caring for four clients. Client 1 is stable and needs a bed bath. Client 2 has a new order for IV furosemide and reports increased shortness of breath. Client 3 is waiting for discharge teaching about warfarin. Client 4 is asleep after receiving PRN zolpidem. The UAP asks the nurse what to do first.",
questions:[
{qid:"rm51a",stem:"Which client should the nurse assess first?",type:"mcq",
options:["Client 1 who needs a bed bath","Client 2 with new shortness of breath and IV furosemide order","Client 3 waiting for discharge teaching","Client 4 who is asleep after sedative administration"],
correct:[1],rationale:"New shortness of breath in a client with a diuretic order suggests possible fluid overload or worsening heart failure and is the highest priority."},
{qid:"rm51b",stem:"Select ALL tasks the nurse may delegate to UAP after appropriate assessment.",type:"sata",
options:["Bed bath for stable Client 1","Reassessment of Client 2's lung sounds after diuretic administration","Routine vital signs on stable Client 1","Discharge teaching for Client 3 about warfarin","Ambulating Client 1 after the nurse determines stability","Monitoring Client 4 for sedation-related respiratory depression"],
correct:[0,2,4],rationale:"Bed bath, routine vitals, and ambulation after RN readiness assessment may be delegated. Lung sound reassessment, medication teaching, and sedation monitoring require nursing judgment."},
{qid:"rm51c",stem:"Client 3 says, 'I do not want to learn about warfarin today. I just want to go home.' What is the nurse's best advocacy action?",type:"mcq",
options:["Cancel discharge because teaching was refused","Assess barriers, offer brief essential safety teaching, and involve case management if needed","Tell the client discharge cannot occur without a full class","Ask the family to sign that teaching was refused and send the client home"],
correct:[1],rationale:"The nurse advocates by assessing needs, providing essential safety information, and coordinating resources without denying appropriate discharge planning."}
]},

{id:"rm52",type:"casestudy",difficulty:3,blueprint:"Safe & Effective Care Environment",category:"Management of Care",
caseIntro:"A 45-year-old client is admitted for an elective cholecystectomy. The client has decision-making capacity but is hard of hearing and did not receive a hearing aid today. The provider obtained a signed consent earlier in a crowded room while the client nodded but asked no questions. The client's adult daughter says, 'Just take him to surgery — he already agreed.'",
questions:[
{qid:"rm52a",stem:"What is the nurse's priority action before the client goes to the operating room?",type:"mcq",
options:["Transport the client because consent is signed","Hold the transfer and ensure informed consent is verified with effective communication","Let the daughter answer any remaining questions for the client","Ask the UAP to witness a second signature"],
correct:[1],rationale:"The nurse must ensure valid informed consent, including effective communication and verified understanding, before elective surgery."},
{qid:"rm52b",stem:"Select ALL nurse actions that support informed consent and advocacy.",type:"sata",

// ─── CAT ENGINE ───────────────────────────────────────────────────────────────
const MIN_Q = 85;
const MAX_Q = 150;
const PASS_THRESHOLD = 0.72;
const FAIL_THRESHOLD = 0.28;
const CONFIDENCE_CUTOFF = 0.90;

function updateAbility(ability, correct, difficulty) {
  const diffMap = { 1: -0.5, 2: 0, 3: 0.5 };
  const delta = correct ? 0.15 + (diffMap[difficulty] || 0) * 0.05 : -0.15 + (diffMap[difficulty] || 0) * 0.05;
  return Math.max(0, Math.min(1, ability + delta));
}

function getConfidence(history) {
  if (history.length < 10) return 0;
  const recentCorrect = history.slice(-10).filter(h => h.correct).length / 10;
  const spread = history.length / MAX_Q;
  return Math.min(0.99, spread * 0.6 + Math.abs(recentCorrect - 0.5) * 0.8);
}

function shouldStop(history, ability) {
  if (history.length < MIN_Q) return null;
  const confidence = getConfidence(history);
  if (confidence >= CONFIDENCE_CUTOFF) {
    return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  }
  if (history.length >= MAX_Q) {
    return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  }
  return null;
}

function pickNextQuestion(bank, history, profile, ability) {
  const usedIds = new Set(history.map(h => h.id));
  const available = bank.filter(q => !usedIds.has(q.id));
  if (!available.length) return null;

  let targetDiff;
  if (ability >= 0.7) targetDiff = 3;
  else if (ability >= 0.4) targetDiff = 2;
  else targetDiff = 1;

  const weak = profile?.weakAreas || [];
  const weakMatches = available.filter(q =>
    weak.some(w => q.blueprint?.toLowerCase().includes(w.toLowerCase()) || q.category?.toLowerCase().includes(w.toLowerCase()))
  );
  const pool = (weakMatches.length > 0 && Math.random() < 0.6) ? weakMatches : available;
  return [...pool].sort((a, b) => Math.abs(a.difficulty - targetDiff) - Math.abs(b.difficulty - targetDiff))[0];
}

function Btn({ children, onClick, disabled, variant="primary", small }) {

function OptionBtn({ letter, text, state, onClick }) {

function BowTieQuestion({ q, submitted, btState, onBTSelect }) {
  const col = { display:"flex", flexDirection:"column", gap:6, flex:1, minWidth:160 };
  const colHead = { fontSize:11, fontWeight:700, color:"#64748b", letterSpacing:0.8, textTransform:"uppercase", marginBottom:4 };
  const colLimit = { left:2, center:1, right:2 };

  function BtOpt({ label, selected, correct, wrong, dim, onClick }) {
    let bg="#f8fafc",border="1.5px solid #e2e8f0",color="#1e293b";
    if(dim){color="#cbd5e1";border="1.5px solid #f1f5f9";}
    if(selected){bg="#f0f9ff";border="1.5px solid #0ea5e9";}
    if(correct){bg="#f0fdf4";border="1.5px solid #10b981";color="#065f46";}
    if(wrong){bg="#fef2f2";border="1.5px solid #ef4444";color="#991b1b";}
    return <button onClick={onClick} style={{ padding:"8px 10px", borderRadius:8, border, background:bg, color, fontSize:13, textAlign:"left", cursor:(submitted||!onClick)?"default":"pointer", fontFamily:"Georgia,serif", lineHeight:1.4, width:"100%" }}>{correct&&"✓ "}{wrong&&"✗ "}{label}</button>;
  }

  function handleSelect(key, idx) {
    if(submitted) return;
    const limit = colLimit[key];
    const sel = btState[key]||[];
    let next;
    if(sel.includes(idx)) { next = sel.filter(x=>x!==idx); }
    else if(sel.length < limit) { next = [...sel, idx]; }
    else { next = limit===1 ? [idx] : sel; } // for center (limit 1), replace selection
    onBTSelect(key, next);
  }

  function renderCol(options, correctArr, key) {
    const sel = btState[key]||[];
    const limit = colLimit[key];
    return options.map((opt,idx) => {
      const isSel=sel.includes(idx);
      const isCorr=submitted&&correctArr.includes(idx);
      const isWrong=submitted&&isSel&&!correctArr.includes(idx);
      const isDim=submitted&&!isCorr&&!isSel;
      const isDisabled=!submitted&&!isSel&&sel.length>=limit;
      return <BtOpt key={idx} label={opt} selected={!submitted&&isSel} correct={isCorr} wrong={isWrong} dim={isDim||isDisabled} onClick={isDisabled?null:()=>handleSelect(key,idx)} />;
    });
  }

  const leftSel=(btState.left||[]).length, centerSel=(btState.center||[]).length, rightSel=(btState.right||[]).length;

  function SlotBadge({ filled, total }) {
    return <div style={{ fontSize:10, color: filled===total?"#10b981":"#94a3b8", marginBottom:6, fontWeight:600 }}>{filled}/{total} selected</div>;
  }

  return (
    <div>
      {!submitted&&(
        <div style={{ fontSize:12, color:"#64748b", marginBottom:14, fontStyle:"italic", background:"#f0f9ff", padding:"10px 14px", borderRadius:8, border:"1px solid #bae6fd" }}>
          🎯 <strong>Bow-Tie Format:</strong> Select <strong>2 nursing actions</strong> (left) → identify <strong>1 condition</strong> (center) → select <strong>2 parameters to monitor</strong> (right)
        </div>
      )}
      <div style={{ display:"flex", gap:8, marginBottom:20, alignItems:"flex-start" }}>
        <div style={col}>
          <div style={colHead}>⚕️ {q.leftLabel}</div>
          {!submitted&&<SlotBadge filled={leftSel} total={2} />}
          {renderCol(q.leftOptions, q.correctLeft, "left")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={{ ...col, maxWidth:180 }}>
          <div style={colHead}>🔍 {q.centerLabel}</div>
          {!submitted&&<SlotBadge filled={centerSel} total={1} />}
          {renderCol(q.centerOptions, q.correctCenter, "center")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={col}>
          <div style={colHead}>🎯 {q.rightLabel}</div>
          {!submitted&&<SlotBadge filled={rightSel} total={2} />}
          {renderCol(q.rightOptions, q.correctRight, "right")}
        </div>
      </div>
    </div>
  );
}

              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontSize:13, color:"#0f172a" }}>{bp}</span>
                <span style={{ fontSize:13, fontWeight:700, color:bpPct>=75?"#10b981":"#ef4444" }}>{bpPct}% ({data.correct}/{data.total})</span>
              </div>
              <div style={{ height:6, background:"#e2e8f0", borderRadius:99 }}>
                <div style={{ height:"100%", width:`${bpPct}%`, background:col, borderRadius:99 }} />
              </div>
            </div>
          );})}
        </div>

        {/* Question Review */}
        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:12, fontWeight:700, color:"#64748b", letterSpacing:0.8, textTransform:"uppercase", marginBottom:10 }}>Question Review</div>
          {history.map((h,i)=>(
            <div key={i} style={{ padding:"10px 14px", background:"#f8fafc", borderRadius:8, marginBottom:6, borderLeft:`4px solid ${h.correct?"#10b981":"#ef4444"}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ fontSize:11, color:"#94a3b8", marginBottom:2 }}>{h.blueprint} · {NGN_LABELS[h.type]}</div>
                <div style={{ fontSize:13, color:"#475569" }}>Q{i+1}: {h.stem?h.stem.substring(0,65)+"...":"(NGN Case Study)"}</div>
              </div>
              <span style={{ color:h.correct?"#10b981":"#ef4444", fontWeight:700, fontSize:15, marginLeft:12 }}>{h.correct?"✓":"✗"}</span>
            </div>
          ))}
        </div>

        {profile.notes&&<div style={{ background:"#f8fafc", borderRadius:10, padding:"12px 16px", marginBottom:20, fontSize:13, color:"#475569", border:"1px solid #e2e8f0" }}><strong>Tutor Notes:</strong> {profile.notes}</div>}
        <button onClick={onRestart} style={{ width:"100%", padding:"13px", background:"#0f172a", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"Georgia,serif" }}>New Session</button>
      </div>
    </div>
  );
}

// ─── QUIZ SCREEN ──────────────────────────────────────────────────────────────
function QuizScreen({ profile, onFinish }) {
  const [history, setHistory] = useState([]);
  const [ability, setAbility] = useState(0.5);
  const activeBank = profile.mode==="remediation" ? REMEDIATION_BANK : QUESTION_BANK;
  const [currentQ, setCurrentQ] = useState(()=>pickNextQuestion(activeBank,[],profile,0.5));
  const [selected, setSelected] = useState([]);
  const [btState, setBtState] = useState({left:[],center:[],right:[]});
  const [csAnswers, setCsAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [catResult, setCatResult] = useState(null);
  const isNCLEX = profile.mode==="nclex";

  const q = currentQ;
  if(!q){ onFinish(history, catResult); return null; }

  const catColor = CAT_COLORS[q.blueprint]||"#6366f1";
  const diffStyle = DIFF_COLORS[q.difficulty];

  function isAnswered() {
    if(q.type==="mcq") return selected.length===1;
    if(q.type==="sata") return selected.length>0;
    if(q.type==="bowtie") return btState.left.length===2&&btState.center.length===1&&btState.right.length===2;
    if(q.type==="casestudy") return q.questions.every(sq=>(csAnswers[sq.qid]||[]).length>0);
    return false;
  }

  function calcCorrect() {
    if(q.type==="mcq") return selected[0]===q.correct[0];
    if(q.type==="sata") return [...selected].sort().join(",")===q.correct.slice().sort().join(",");
    if(q.type==="bowtie") {
      return [...(btState.left||[])].sort().join(",")===q.correctLeft.slice().sort().join(",")&&
             [...(btState.center||[])].sort().join(",")===q.correctCenter.slice().sort().join(",")&&
             [...(btState.right||[])].sort().join(",")===q.correctRight.slice().sort().join(",");
    }
    if(q.type==="casestudy") return q.questions.every(sq=>[...(csAnswers[sq.qid]||[])].sort().join(",")===sq.correct.slice().sort().join(","));
    return false;
  }

  function handleSubmit() {
    if(!isAnswered()) return;
    setSubmitted(true);
  }

  function handleNext() {
    const isCorrect = calcCorrect();
    const newAbility = updateAbility(ability, isCorrect, q.difficulty);
    const newHistory = [...history, { id:q.id, type:q.type, blueprint:q.blueprint, stem:q.stem||null, correct:isCorrect }];
    setHistory(newHistory);
    setAbility(newAbility);

    if(isNCLEX) {
      const result = shouldStop(newHistory, newAbility);
      if(result) { setCatResult(result); onFinish(newHistory, result); return; }
    } else {
      if(newHistory.length>=profile.qCount) { onFinish(newHistory, null); return; }
    }

    const next = pickNextQuestion(activeBank, newHistory, profile, newAbility);
    if(!next){ onFinish(newHistory, isNCLEX?shouldStop(newHistory,newAbility)||"PASS":null); return; }
    setCurrentQ(next); setSelected([]); setBtState({left:[],center:[],right:[]}); setCsAnswers({}); setSubmitted(false);
  }

  const qNum = history.length+1;
  const correctSoFar = history.filter(h=>h.correct).length;
  const progressPct = isNCLEX ? Math.min(100,(qNum/MIN_Q)*100) : (qNum/profile.qCount)*100;

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f172a,#1e293b)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"32px 16px", fontFamily:"Georgia,serif" }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"30px 34px", maxWidth:860, width:"100%", boxShadow:"0 25px 60px rgba(0,0,0,0.4)" }}>

        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18, gap:12, flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:18, fontWeight:700, color:"#0f172a", letterSpacing:2 }}>NCLEX-RN</div>
            <div style={{ fontSize:10, color:"#94a3b8", letterSpacing:1, textTransform:"uppercase" }}>{profile.name} · {isNCLEX?"CAT Simulation":"Practice"}</div>
          </div>
          <div style={{ flex:1, maxWidth:260 }}>
            <div style={{ fontSize:11, color:"#64748b", marginBottom:5 }}>
              {isNCLEX ? `Question ${qNum} · Min ${MIN_Q} required` : `Question ${qNum} of ${profile.qCount}`}
            </div>
            <div style={{ height:5, background:"#e2e8f0", borderRadius:99 }}>
              <div style={{ height:"100%", width:`${progressPct}%`, background: isNCLEX?"#8b5cf6":"#0ea5e9", borderRadius:99, transition:"width 0.4s" }} />
            </div>
          </div>
          <div style={{ fontSize:12, fontWeight:600, color:"#475569", background:"#f8fafc", padding:"5px 12px", borderRadius:99, border:"1px solid #e2e8f0" }}>
            {isNCLEX ? `Q${qNum}` : `${correctSoFar}/${history.length} correct`}
          </div>
        </div>

        {/* Tags */}
        <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:14 }}>
          <Tag children={q.blueprint} color={catColor} bg={catColor+"18"} border={catColor+"44"} />
          <Tag children={DIFF_LABELS[q.difficulty]} color={diffStyle.text} bg={diffStyle.bg} />
          <Tag children={NGN_LABELS[q.type]} color="#6366f1" bg="#eef2ff" border="#c7d2fe" />
          <Tag children={q.category} />
        </div>

        {/* Case intro */}
        {q.caseIntro&&(
          <div style={{ background:"#f0f9ff", border:"1px solid #bae6fd", borderRadius:10, padding:"14px 16px", marginBottom:16, fontSize:14, lineHeight:1.7, color:"#0c4a6e", fontStyle:"italic" }}>
            <strong style={{ fontStyle:"normal", color:"#0369a1" }}>Clinical Scenario: </strong>{q.caseIntro}
          </div>
        )}

        {/* Stem */}
        <div style={{ fontSize:16, lineHeight:1.7, color:"#0f172a", marginBottom:18, fontFamily:"Georgia,serif" }}>{q.stem}</div>

        {/* Question */}
        {q.type==="mcq"&&<MCQQuestion q={q} submitted={submitted} selected={selected} onSelect={idx=>!submitted&&setSelected([idx])} />}
        {q.type==="sata"&&<SATAQuestion q={q} submitted={submitted} selected={selected} onSelect={idx=>!submitted&&setSelected(s=>s.includes(idx)?s.filter(x=>x!==idx):[...s,idx])} />}
        {q.type==="bowtie"&&<BowTieQuestion q={q} submitted={submitted} btState={btState} onBTSelect={(col,arr)=>setBtState(s=>({...s,[col]:arr}))} />}
        {q.type==="casestudy"&&<CaseStudyQuestion q={q} submitted={submitted} csAnswers={csAnswers} onCSAnswer={(qid,val)=>setCsAnswers(s=>({...s,[qid]:val}))} />}

        {/* Rationale */}
        {submitted&&q.type!=="casestudy"&&(
          <div style={{ background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:12, padding:"18px 20px", marginBottom:20 }}>
            <div style={{ fontWeight:700, fontSize:13, color:"#0f172a", marginBottom:10, letterSpacing:0.5 }}>📋 RATIONALE</div>
            {q.type==="bowtie" ? (
              <>
                <div style={{ background:"#d1fae5", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>Condition:</strong> {q.rationale.condition}</div>
                <div style={{ background:"#dbeafe", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#1e40af", lineHeight:1.6 }}><strong>Actions:</strong> {q.rationale.actions}</div>
                <div style={{ background:"#f0fdf4", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>Outcomes:</strong> {q.rationale.outcomes}</div>
                <div style={{ background:"#fef2f2", padding:"10px 14px", borderRadius:8, fontSize:13, color:"#991b1b", lineHeight:1.6 }}><strong>Incorrect options:</strong> {q.rationale.wrong}</div>
              </>
            ) : (
              <>
                <div style={{ background:"#d1fae5", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>✓ Correct:</strong> {q.rationale.correct}</div>
                {q.options.map((_,idx)=>{ if(q.correct.includes(idx)) return null; const wrongItems=q.options.map((_,i)=>i).filter(i=>!q.correct.includes(i)); const wi=wrongItems.indexOf(idx); return wi>=0&&q.rationale.wrong[wi]?(<div key={idx} style={{ padding:"8px 12px", background:"#fff", borderRadius:8, border:"1px solid #f1f5f9", fontSize:12, color:"#475569", lineHeight:1.6, marginBottom:5 }}><strong>✗ {String.fromCharCode(65+idx)}:</strong> {q.rationale.wrong[wi]}</div>):null; })}
              </>
            )}
          </div>
        )}

        {/* Actions */}
        <div style={{ display:"flex", justifyContent:"flex-end", gap:10 }}>
          {!submitted ? (
            <Btn onClick={handleSubmit} disabled={!isAnswered()}>Submit Answer</Btn>
          ) : (
            <Btn onClick={handleNext}>
              {isNCLEX ? "Continue Exam →" : (qNum>=profile.qCount?"View Results →":"Next Question →")}
            </Btn>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("profile");
  const [profile, setProfile] = useState(null);
  const [finalHistory, setFinalHistory] = useState([]);
  const [catResult, setCatResult] = useState(null);

  if(screen==="profile") return <ProfileScreen onStart={p=>{ setProfile(p); setScreen("quiz"); }} />;
  if(screen==="quiz") return <QuizScreen profile={profile} onFinish={(h,r)=>{ setFinalHistory(h); setCatResult(r); setScreen("results"); }} />;
  if(screen==="results") return <ResultsScreen profile={profile} history={finalHistory} catResult={catResult} onRestart={()=>{ setProfile(null); setFinalHistory([]); setCatResult(null); setScreen("profile"); }} />;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
