  <script type="text/babel">

// ─── QUESTION BANK (65 questions) ─────────────────────────────────────────────
const QUESTION_BANK = [

  // ══ SAFE & EFFECTIVE CARE ENVIRONMENT — Management of Care ══
  { id:"m1", type:"mcq", difficulty:1, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A registered nurse is preparing to delegate tasks at the start of the shift. Which task is most appropriate to delegate to an unlicensed assistive personnel (UAP)?",
    options:["Assessing bilateral breath sounds after bronchodilator therapy","Ambulating a stable post-op day 2 client to the hallway","Educating a diabetic client on insulin self-injection technique","Interpreting a client's telemetry rhythm change"],
    correct:[1], rationale:{ correct:"Ambulating a stable post-op day 2 client is a routine task requiring no clinical judgment — appropriate for UAP.", wrong:["Assessing breath sounds requires clinical interpretation — RN only.","Client education requires nursing judgment — not delegable to UAP.","Telemetry interpretation requires clinical judgment — RN only."]}},

  { id:"m2", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is using the SBAR communication tool to report a change in a client's condition to the provider. Which component addresses the nurse's clinical assessment of the problem?",
    options:["Situation","Background","Assessment","Recommendation"],
    correct:[2], rationale:{ correct:"Assessment is the nurse's clinical interpretation of what is happening — the 'A' in SBAR.", wrong:["Situation describes what is happening right now (the problem statement).","Background provides relevant clinical history.","Recommendation is the nurse's request for action."]}},

  { id:"m3", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A charge nurse observes a new graduate RN performing a sterile dressing change using incorrect technique. What is the charge nurse's priority action?",
    options:["Document the incident and address it at the next staff meeting","Immediately intervene and assist the nurse to complete the dressing change correctly","Complete an incident report and notify the manager","Ask the client if they noticed the error"],
    correct:[1], rationale:{ correct:"Client safety is the immediate priority — the charge nurse must intervene to correct the technique before harm occurs.", wrong:["Delaying until a staff meeting leaves the client at risk for infection.","An incident report may be completed later, but immediate client safety comes first.","Asking the client is inappropriate and does not address the safety concern."]}},

  { id:"m4", type:"mcq", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is caring for four clients. Which client should be assigned to the traveling (agency) nurse?",
    options:["A client with COPD admitted 2 days ago, stable on 2L O2 via nasal cannula","A client admitted this morning with new-onset chest pain awaiting cardiac workup","A client post-op day 1 following a coronary artery bypass graft","A client with diabetic ketoacidosis receiving an insulin drip"],
    correct:[0], rationale:{ correct:"The stable COPD client on 2L O2 is the most predictable assignment — appropriate for an agency nurse unfamiliar with the unit's protocols.", wrong:["A new chest pain admission requires assessment by a nurse familiar with the unit's cardiac protocols.","A post-op CABG day 1 client has high acuity and complex needs — not appropriate for an agency nurse.","A client on an insulin drip requires close titration and familiarity with unit protocols."]}},

  { id:"m5", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A client tells the nurse, 'I do not want my family to know I have been diagnosed with HIV.' What is the nurse's best response?",
    options:["'I understand, but your family needs to know for your safety.'","'Your information is confidential and will not be shared without your consent.'","'I will need to tell your emergency contact if your condition worsens.'","'You should tell your family yourself so they can support you.'"],
    correct:[1], rationale:{ correct:"Client confidentiality is a legal and ethical right — the nurse must protect this information unless legally required to disclose.", wrong:["Overriding the client's wishes violates HIPAA and patient rights.","Emergency contact notification does not apply here and is not legally required for HIV status.","Encouraging disclosure is appropriate over time, but the immediate response must affirm confidentiality."]}},

  { id:"m6", type:"sata", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    stem:"A nurse is preparing to perform a surgical time-out before a procedure. Select ALL components that must be verified during the time-out.",
    options:["Client identity using two identifiers","Client's insurance information","Correct surgical site and side","Type of procedure to be performed","Surgeon's board certification","Correct client position for the procedure"],
    correct:[0,2,3,5], rationale:{ correct:"The surgical time-out (Universal Protocol) requires verification of client identity, correct site/side, procedure type, and positioning.", wrong:["Insurance information is not part of the surgical time-out safety protocol.","Surgeon board certification is credentialed during privileging, not the time-out."]}},

  // ══ SAFE & EFFECTIVE — Safety & Infection Prevention ══
  { id:"si1", type:"mcq", difficulty:1, blueprint:"Safe & Effective Care Environment", category:"Safety & Infection Prevention",
    stem:"A nurse is caring for a client with active pulmonary tuberculosis. Which type of transmission-based precaution is required?",
    options:["Contact precautions","Droplet precautions","Airborne precautions","Reverse isolation"],
    correct:[2], rationale:{ correct:"TB is transmitted via airborne droplet nuclei (<5 microns) — airborne precautions with a negative-pressure room and N95 respirator are required.", wrong:["Contact precautions are for direct-contact organisms like MRSA or C. diff.","Droplet precautions are for larger respiratory droplets (influenza, pertussis) — not TB.","Reverse isolation protects immunocompromised clients from the environment."]}},

  { id:"si2", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Safety & Infection Prevention",
    stem:"A nurse is preparing to insert a urinary catheter. After opening the sterile field and adding supplies, the nurse's hand accidentally touches the sterile drape. What should the nurse do?",
    options:["Continue — the drape is not part of the sterile field","Document the event and proceed carefully","Discard the setup and obtain a new sterile catheter kit","Clean the drape with a sterile alcohol wipe and continue"],
    correct:[2], rationale:{ correct:"Once a sterile field is contaminated, the entire setup must be discarded and a new sterile kit obtained.", wrong:["The sterile drape is the border of the sterile field — contamination of it compromises the entire setup.","Documentation without replacing the kit does not restore sterility.","Alcohol wipes do not re-sterilize a contaminated sterile field."]}},

  { id:"si3", type:"mcq", difficulty:1, blueprint:"Safe & Effective Care Environment", category:"Safety & Infection Prevention",
    stem:"A nurse is caring for a client with Clostridioides difficile (C. diff) diarrhea. Which hand hygiene method is most effective before exiting the room?",
    options:["Alcohol-based hand rub for 20 seconds","Soap and water handwashing for at least 20 seconds","Chlorhexidine hand wipe followed by hand rub","Either soap or alcohol-based hand rub — both are equally effective"],
    correct:[1], rationale:{ correct:"C. diff spores are NOT killed by alcohol-based hand rubs — soap and water is required to physically remove the spores.", wrong:["Alcohol-based hand rubs are ineffective against C. diff spores.","Chlorhexidine wipes do not adequately remove C. diff spores.","They are not equally effective — alcohol rubs fail against C. diff."]}},

  { id:"si4", type:"mcq", difficulty:2, blueprint:"Safe & Effective Care Environment", category:"Safety & Infection Prevention",
    stem:"A nurse is caring for four clients. Which client requires contact precautions?",
    options:["A client with active pulmonary tuberculosis","A client with influenza","A client with a wound infected with methicillin-resistant Staphylococcus aureus (MRSA)","A client with meningococcal meningitis"],
    correct:[2], rationale:{ correct:"MRSA is transmitted by direct or indirect contact — contact precautions (gown and gloves) are required.", wrong:["TB requires airborne precautions.","Influenza requires droplet precautions.","Meningococcal meningitis requires droplet precautions."]}},

  // ══ HEALTH PROMOTION & MAINTENANCE ══
  { id:"hp1", type:"mcq", difficulty:1, blueprint:"Health Promotion & Maintenance", category:"Health Promotion",
    stem:"A nurse provides discharge teaching to a client who is 8 weeks pregnant. Which statement requires further teaching?",
    options:["'I will take my prenatal vitamins with a full glass of water daily.'","'I can have one or two glasses of wine on special occasions.'","'I should call my provider if I notice decreased fetal movement after 28 weeks.'","'I will avoid eating raw sushi during my pregnancy.'"],
    correct:[1], rationale:{ correct:"No amount of alcohol is safe in pregnancy — any consumption risks fetal alcohol spectrum disorder.", wrong:["Daily prenatal vitamins are correct — no teaching needed.","Reporting decreased fetal movement after 28 weeks shows correct understanding.","Avoiding raw sushi is correct due to listeria and mercury risk."]}},

  { id:"hp2", type:"mcq", difficulty:1, blueprint:"Health Promotion & Maintenance", category:"Health Screening",
    stem:"A nurse is teaching a 50-year-old client with no family history of colorectal cancer about recommended cancer screenings. Which statement is correct?",
    options:["Colonoscopy is recommended every 5 years starting at age 45","Colorectal cancer screening should begin at age 50 with annual fecal occult blood testing only","Average-risk individuals should begin colorectal cancer screening at age 45","Screening is only recommended if the client has symptoms"],
    correct:[2], rationale:{ correct:"The American Cancer Society recommends colorectal cancer screening beginning at age 45 for average-risk individuals.", wrong:["Colonoscopy is recommended every 10 years (not 5) for average-risk individuals.","Multiple screening modalities are acceptable — annual FOBT is just one option.","Screening is preventive — waiting for symptoms defeats its purpose."]}},

  { id:"hp3", type:"mcq", difficulty:2, blueprint:"Health Promotion & Maintenance", category:"Developmental Stages",
    stem:"A nurse is assessing a 15-month-old child during a well-child visit. Which finding should the nurse report to the provider as a developmental concern?",
    options:["The child uses 5–10 words","The child walks independently","The child does not yet use a spoon","The child does not respond to their name when called"],
    correct:[3], rationale:{ correct:"Responding to one's name is a milestone expected by 9–12 months. Failure at 15 months is a red flag for autism spectrum disorder or hearing loss.", wrong:["5–10 words at 15 months is appropriate — milestone is at least 1 word by 12 months.","Independent walking at 15 months is normal — milestone is by 15 months.","Using a spoon independently is typically mastered between 15–18 months."]}},

  { id:"hp4", type:"mcq", difficulty:2, blueprint:"Health Promotion & Maintenance", category:"Health Promotion",
    stem:"A nurse is teaching a client about a low-sodium diet. Which meal choice indicates the client understands the teaching?",
    options:["Canned chicken noodle soup with crackers","Grilled salmon with steamed broccoli and brown rice","A deli turkey sandwich on whole wheat bread","Cottage cheese with canned fruit cocktail"],
    correct:[1], rationale:{ correct:"Fresh grilled salmon with steamed vegetables and whole grains is naturally low in sodium — an appropriate choice.", wrong:["Canned soups are very high in sodium — often 800–1200 mg per serving.","Deli meats are heavily processed and high in sodium.","Canned fruits are often packed in syrups and may contain added sodium."]}},

  { id:"hp5", type:"sata", difficulty:2, blueprint:"Health Promotion & Maintenance", category:"Health Promotion",
    stem:"A nurse is teaching a client about reducing cardiovascular risk factors. Select ALL modifiable risk factors the nurse should address.",
    options:["Hypertension","Family history of heart disease","Cigarette smoking","Age over 65","Sedentary lifestyle","Hyperlipidemia"],
    correct:[0,2,4,5], rationale:{ correct:"Hypertension, smoking, sedentary lifestyle, and hyperlipidemia are all modifiable through lifestyle changes and/or medications.", wrong:["Family history is a non-modifiable risk factor — it cannot be changed.","Age is a non-modifiable risk factor."]}},

  { id:"hp6", type:"mcq", difficulty:3, blueprint:"Health Promotion & Maintenance", category:"Ante/Intra/Postpartum",
    stem:"A nurse is assessing a client at 36 weeks gestation who reports a sudden onset of painless, bright red vaginal bleeding. Which condition does the nurse suspect?",
    options:["Abruptio placentae","Placenta previa","Preterm labor","Ruptured ectopic pregnancy"],
    correct:[1], rationale:{ correct:"Painless bright red vaginal bleeding in the third trimester is the classic presentation of placenta previa — the placenta covers the cervical os.", wrong:["Abruptio placentae typically presents with painful, dark bleeding and uterine rigidity.","Preterm labor presents with contractions — not painless bleeding.","Ectopic pregnancy rupture occurs in the first trimester, not at 36 weeks."]}},

  // ══ PSYCHOSOCIAL INTEGRITY ══
  { id:"ps1", type:"mcq", difficulty:2, blueprint:"Psychosocial Integrity", category:"Coping & Adaptation",
    stem:"A nurse is caring for a client newly diagnosed with type 1 diabetes who states, 'I just don't believe this is really happening to me.' Which response is most therapeutic?",
    options:["'Don't worry — many people live full lives with diabetes.'","'It sounds like this news is really difficult to process.'","'You need to start learning about insulin injections today.'","'Let me get the diabetes educator to speak with you right away.'"],
    correct:[1], rationale:{ correct:"Reflecting the client's emotional experience demonstrates therapeutic communication and acknowledges feelings without dismissing or redirecting.", wrong:["Minimizing feelings is non-therapeutic.","Focusing on education ignores the emotional state — teaching is ineffective during denial.","Consulting the educator is appropriate later, but the immediate priority is acknowledging feelings."]}},

  { id:"ps2", type:"mcq", difficulty:2, blueprint:"Psychosocial Integrity", category:"Mental Health Concepts",
    stem:"A client with schizophrenia tells the nurse, 'The television is sending me secret messages.' How should the nurse document this finding?",
    options:["'Client reports delusions of reference — TV sends secret messages.'","'Client is delusional and psychotic.'","'Client states the television is sending secret messages.'","'Client appears to be experiencing a hallucination.'"],
    correct:[2], rationale:{ correct:"Objective documentation uses the client's exact words in quotes — it avoids interpretation and is legally defensible.", wrong:["While 'delusion of reference' is clinically accurate, quoting the client is more objective and appropriate.", "Labeling the client as 'delusional and psychotic' is judgmental and not objective documentation.","The described phenomenon is a delusion (false fixed belief), not a hallucination (false sensory perception)."]}},

  { id:"ps3", type:"mcq", difficulty:3, blueprint:"Psychosocial Integrity", category:"Crisis Intervention",
    stem:"A nurse is triaging calls at a mental health crisis line. A caller states, 'I have a loaded gun in my hand and I'm thinking about ending it.' What is the nurse's priority action?",
    options:["Assess the caller's support system and encourage them to call a trusted friend","Ask the caller to describe the events that led to this crisis","Direct the caller to emergency services and stay on the line","Schedule a follow-up appointment with a mental health provider"],
    correct:[2], rationale:{ correct:"This is an imminent safety emergency — the caller has means, plan, and intent. The priority is immediate emergency services while maintaining connection.", wrong:["Assessing support systems is not the priority when there is imminent danger.","Exploring history delays immediate life-saving action.","Scheduling follow-up is entirely inappropriate for an active suicidal emergency."]}},

  { id:"ps4", type:"mcq", difficulty:2, blueprint:"Psychosocial Integrity", category:"Therapeutic Communication",
    stem:"A client who lost their spouse 3 days ago says, 'I keep expecting to hear his key in the door.' Which response is most therapeutic?",
    options:["'That is a normal part of grieving — it will get easier with time.'","'Have you considered speaking with a grief counselor?'","'It must be very hard not having him here. Tell me more about that.'","'You need to give yourself permission to heal and move forward.'"],
    correct:[2], rationale:{ correct:"This response acknowledges the client's pain and invites them to share more — it is empathetic and open-ended.", wrong:["Telling a grieving person it 'will get easier' minimizes their immediate pain.", "Redirecting to a counselor, while potentially appropriate, blocks the therapeutic communication opportunity.", "Telling a 3-day widow to 'move forward' is dismissive and inappropriate."]}},

  { id:"ps5", type:"mcq", difficulty:2, blueprint:"Psychosocial Integrity", category:"Mental Health Concepts",
    stem:"A client with anorexia nervosa has a BMI of 15.5 and is admitted for medical stabilization. Which nursing priority takes precedence?",
    options:["Begin therapeutic communication to explore the causes of the eating disorder","Monitor and correct electrolyte imbalances","Implement a structured eating program immediately","Obtain a dietary consult"],
    correct:[1], rationale:{ correct:"Physiological stability is the priority — severe malnutrition causes life-threatening electrolyte imbalances (especially hypokalemia) that must be corrected first.", wrong:["Therapeutic communication is important but secondary to physiological stabilization.", "Refeeding must be done carefully to avoid refeeding syndrome — not immediately.", "Dietary consult is appropriate but not the first priority."]}},

  { id:"ps6", type:"sata", difficulty:2, blueprint:"Psychosocial Integrity", category:"Therapeutic Communication",
    stem:"A nurse is caring for a client who has been prescribed haloperidol. Select ALL findings that indicate the client may be experiencing extrapyramidal side effects (EPS).",
    options:["Shuffling gait and muscle rigidity","Weight gain of 10 lbs in 2 weeks","Involuntary tongue movements and grimacing","Restlessness and inability to sit still","Dry mouth and urinary retention","Sustained involuntary muscle contractions causing abnormal postures"],
    correct:[0,2,3,5], rationale:{ correct:"Shuffling gait/rigidity (pseudoparkinsonism), tardive dyskinesia (tongue/facial movements), akathisia (restlessness), and acute dystonia (muscle contractions) are all EPS.", wrong:["Weight gain is a metabolic side effect of antipsychotics, not EPS.","Dry mouth and urinary retention are anticholinergic effects, not EPS."]}},

  // ══ PHYSIOLOGICAL INTEGRITY — Basic Care & Comfort ══
  { id:"bc1", type:"mcq", difficulty:1, blueprint:"Physiological Integrity", category:"Basic Care & Comfort",
    stem:"A nurse is caring for a client who is postoperative following abdominal surgery and reports pain of 7/10. The client's last analgesic was 4 hours ago and is due in 30 minutes. What is the nurse's best action?",
    options:["Ask the client to wait 30 minutes until the medication is due","Reposition the client and apply distraction techniques while preparing to administer the medication at the scheduled time","Notify the provider that the current analgesic regimen is ineffective","Contact the provider to request a PRN dose now"],
    correct:[1], rationale:{ correct:"Non-pharmacological comfort measures (repositioning, distraction) can be used now, while preparing to administer the scheduled analgesic on time — this is the most comprehensive response.", wrong:["Telling a client in pain to simply 'wait' is inadequate nursing care.","One report of pain at 7/10 doesn't immediately indicate regimen failure — first optimize current orders.","A PRN dose request is appropriate if the scheduled analgesic was just given — here, maximizing current orders is the priority."]}},

  { id:"bc2", type:"mcq", difficulty:1, blueprint:"Physiological Integrity", category:"Basic Care & Comfort",
    stem:"A nurse is caring for a client receiving nasogastric tube feedings. Which action prevents aspiration?",
    options:["Administer feedings with the head of bed flat","Verify tube placement by auscultating air over the epigastrium","Maintain head of bed elevation at 30–45 degrees during and after feedings","Flush the tube with 10 mL of water before and after each feeding"],
    correct:[2], rationale:{ correct:"Elevating the head of bed 30–45 degrees uses gravity to keep gastric contents from refluxing into the airway — the primary prevention for aspiration during tube feeding.", wrong:["Flat positioning greatly increases aspiration risk.","Auscultation of air is no longer considered a reliable method of confirming tube placement.","Flushing maintains tube patency but does not prevent aspiration."]}},

  { id:"bc3", type:"sata", difficulty:2, blueprint:"Physiological Integrity", category:"Basic Care & Comfort",
    stem:"A nurse is caring for a client with a new tracheostomy. Select ALL interventions the nurse should include in the plan of care.",
    options:["Keep a spare tracheostomy tube of the same size at the bedside","Suction the airway every hour regardless of clinical assessment","Secure tracheostomy ties with one finger-width of slack","Humidify inspired air or oxygen","Change the inner cannula per facility protocol","Place the client in Trendelenburg during suctioning"],
    correct:[0,2,3,4], rationale:{ correct:"A spare tube for emergencies, properly secured ties, humidification to prevent secretion crusting, and regular inner cannula changes all maintain airway safety.", wrong:["Suctioning should be based on clinical assessment — not on a fixed schedule.","Trendelenburg is contraindicated; semi-Fowler's or upright positioning is correct."]}},

  { id:"bc4", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Basic Care & Comfort",
    stem:"A nurse is caring for a client with a stage 3 pressure injury on the sacrum. Which intervention is the priority?",
    options:["Apply a moisture barrier cream to the wound bed","Reposition the client every 2 hours","Irrigate the wound with povidone-iodine solution","Place a donut-shaped foam ring under the sacrum"],
    correct:[1], rationale:{ correct:"Repositioning every 2 hours relieves pressure — the underlying cause of the injury. Offloading pressure is the priority intervention.", wrong:["Moisture barrier cream protects surrounding skin but does not address the cause of the injury.","Povidone-iodine is cytotoxic and destroys granulation tissue — contraindicated in wound care.","Donut rings concentrate pressure around the wound edges — actually worsen tissue damage."]}},

  // ══ PHYSIOLOGICAL INTEGRITY — Pharmacological & Parenteral Therapies ══
  { id:"ph1", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is caring for a client receiving IV heparin for pulmonary embolism. The aPTT returns at 180 seconds. What is the priority action?",
    options:["Continue the infusion and reassess in 6 hours","Increase the infusion rate per protocol","Hold the infusion and notify the provider immediately","Administer protamine sulfate without waiting for orders"],
    correct:[2], rationale:{ correct:"Therapeutic aPTT is 60–100 seconds. At 180 seconds the client is supratherapeutic with high hemorrhage risk — hold and notify.", wrong:["Continuing a supratherapeutic infusion risks life-threatening bleeding.","Increasing the rate compounds the risk.","Protamine sulfate requires a provider order."]}},

  { id:"ph2", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is reviewing morning labs for a client on digoxin. Which finding requires holding the medication and contacting the provider?",
    options:["Serum potassium of 4.2 mEq/L","Serum sodium of 138 mEq/L","Serum digoxin level of 2.4 ng/mL","BUN of 18 mg/dL"],
    correct:[2], rationale:{ correct:"Therapeutic digoxin is 0.5–2.0 ng/mL. A level of 2.4 ng/mL is toxic — hold and notify.", wrong:["Potassium 4.2 is normal (3.5–5.0).","Sodium 138 is normal (136–145).","BUN 18 is normal (7–20)."]}},

  { id:"ph3", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is caring for a client prescribed lithium carbonate for bipolar disorder. Which client statement requires immediate follow-up?",
    options:["'I try to drink about 8 glasses of water a day.'","'I've been having a lot of diarrhea and my hands are shaking.'","'I take my medication with food to reduce nausea.'","'I had my lithium level checked last month — it was 0.9.'"],
    correct:[1], rationale:{ correct:"Diarrhea causes sodium and fluid loss, which raises lithium levels. Tremors are a sign of toxicity. This client needs immediate lithium level assessment.", wrong:["Adequate hydration helps maintain stable lithium levels — appropriate behavior.","Taking lithium with food to reduce GI side effects is a correct strategy.","A level of 0.9 mEq/L is within the therapeutic range of 0.6–1.2 mEq/L."]}},

  { id:"ph4", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A client is receiving vancomycin 1g IV. During the infusion, the nurse notes the client's face, neck, and upper chest are flushed and red. What is the nurse's priority action?",
    options:["Administer diphenhydramine IV and continue the infusion","Stop the infusion and prepare for anaphylaxis treatment","Slow the infusion rate and monitor the client","Discontinue the IV line and notify the provider of a medication error"],
    correct:[2], rationale:{ correct:"This is Red Man Syndrome — a rate-related reaction to vancomycin, not a true allergy. Slowing the infusion rate typically resolves the reaction.", wrong:["Diphenhydramine may be used as adjunct treatment but slowing the rate is the first intervention.","Red Man Syndrome is not anaphylaxis — it is a rate-related infusion reaction.","The IV line does not need to be discontinued — slowing the rate resolves the reaction."]}},

  { id:"ph5", type:"sata", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is preparing to administer a blood transfusion. Select ALL actions the nurse must perform before initiating the infusion.",
    options:["Verify blood product with two licensed nurses at the bedside","Prime IV tubing with dextrose 5% in water","Obtain baseline vital signs","Ensure IV access with at least an 18-gauge catheter","Confirm client identity using two identifiers","Start the infusion at the fastest rate to prevent product wastage"],
    correct:[0,2,3,4], rationale:{ correct:"Two-nurse verification, baseline vitals, 18G or larger catheter, and two-identifier client verification are all required before blood transfusion.", wrong:["Blood must be primed with 0.9% normal saline only — D5W causes hemolysis.","Blood must be infused slowly for the first 15 minutes to monitor for transfusion reactions."]}},

  { id:"ph6", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is preparing to administer metformin to a client scheduled for a contrast CT scan this afternoon. What is the appropriate action?",
    options:["Administer the metformin as scheduled","Hold the metformin and notify the provider","Administer half the dose and document","Ask the client if they have had contrast before and proceed accordingly"],
    correct:[1], rationale:{ correct:"Metformin must be held before and after iodinated contrast due to the risk of contrast-induced nephropathy leading to lactic acidosis.", wrong:["Administering metformin before contrast is contraindicated due to lactic acidosis risk.","Giving half the dose does not adequately reduce the risk.", "History of prior contrast use does not eliminate the contraindication with metformin."]}},

  { id:"ph7", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is caring for a client who received an opioid analgesic 30 minutes ago. The client's respiratory rate is now 8 breaths/min and they are difficult to arouse. What is the priority action?",
    options:["Administer oxygen via nasal cannula and continue to monitor","Stimulate the client and ask them to take deep breaths","Administer naloxone as ordered and prepare for emergency support","Document the findings and reassess in 15 minutes"],
    correct:[2], rationale:{ correct:"A respiratory rate of 8 and unresponsiveness indicate opioid-induced respiratory depression — a medical emergency requiring naloxone administration immediately.", wrong:["Oxygen alone does not reverse opioid-induced respiratory depression.","Stimulation is insufficient for significant respiratory depression.","Documenting and waiting 15 minutes is dangerous — this is an emergency."]}},

  { id:"ph8", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Pharmacological & Parenteral Therapies",
    stem:"A nurse is teaching a client newly prescribed warfarin. Which statement by the client indicates a need for further teaching?",
    options:["'I will have my INR checked regularly.'","'I should avoid drastic changes to how much leafy green vegetables I eat.'","'I can take ibuprofen for my headaches since it's not a blood thinner.'","'I need to report any unusual bruising or bleeding to my provider.'"],
    correct:[2], rationale:{ correct:"NSAIDs like ibuprofen increase bleeding risk when combined with warfarin by inhibiting platelet aggregation — clients should use acetaminophen instead.", wrong:["Regular INR monitoring is required to ensure therapeutic anticoagulation.","Consistent vitamin K intake (from leafy greens) is important for stable INR.","Reporting unusual bleeding is essential client education for warfarin."]}},

  // ══ PHYSIOLOGICAL INTEGRITY — Reduction of Risk Potential ══
  { id:"rr1", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Reduction of Risk Potential",
    stem:"A nurse is reviewing morning labs for a client on digoxin. Which finding requires holding the medication and contacting the provider?",
    options:["Serum potassium of 4.2 mEq/L","Serum sodium of 138 mEq/L","Serum digoxin level of 2.4 ng/mL","BUN of 18 mg/dL"],
    correct:[2], rationale:{ correct:"Therapeutic digoxin is 0.5–2.0 ng/mL. A level of 2.4 ng/mL is toxic — hold and notify.", wrong:["Potassium 4.2 is normal.","Sodium 138 is normal.","BUN 18 is normal."]}},

  { id:"rr2", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Reduction of Risk Potential",
    stem:"A nurse assesses a client post-thyroidectomy and notes stridor, hoarseness, and tingling around the mouth. Which complication does the nurse suspect?",
    options:["Thyroid storm","Hypocalcemia due to inadvertent parathyroid removal","Respiratory infection","Recurrent laryngeal nerve damage only"],
    correct:[1], rationale:{ correct:"Tingling around the mouth and stridor post-thyroidectomy indicate hypocalcemia from accidental parathyroid removal, causing tetany and laryngospasm.", wrong:["Thyroid storm presents with hyperthermia, tachycardia, and hypertension — not these findings.","Infection is not an immediate post-op complication causing these neurological signs.","Laryngeal nerve damage alone causes hoarseness — not perioral tingling or stridor from tetany."]}},

  { id:"rr3", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Reduction of Risk Potential",
    stem:"A nurse is caring for a client four hours after a lumbar puncture. The client reports a severe headache that worsens when sitting up. What is the priority nursing action?",
    options:["Administer prescribed acetaminophen and reassess in 1 hour","Encourage the client to increase fluid intake and remain flat","Notify the provider immediately of possible spinal cord injury","Position the client in high-Fowler's and apply a cold pack"],
    correct:[1], rationale:{ correct:"This is a classic post-lumbar puncture headache caused by CSF leakage. Lying flat reduces the pressure gradient, and increased fluids help replenish CSF volume.", wrong:["Acetaminophen alone without positional changes is insufficient for post-LP headache.", "A post-LP headache is expected and does not indicate spinal cord injury.","Sitting up (high-Fowler's) worsens the headache — the client should remain flat."]}},

  { id:"rr4", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Reduction of Risk Potential",
    stem:"A nurse is caring for a client with chronic kidney disease (CKD). Which laboratory value is most critical to monitor?",
    options:["Serum albumin","Serum potassium","Serum calcium","Hemoglobin A1C"],
    correct:[1], rationale:{ correct:"Hyperkalemia is a life-threatening complication of CKD because impaired kidneys cannot excrete potassium — it can cause fatal dysrhythmias.", wrong:["Albumin is monitored for nutrition but is not the most critical in CKD.","Calcium is important in CKD but hyperkalemia poses the most immediate life threat.","HbA1C is relevant if diabetes is the cause of CKD but is not the most critical CKD lab."]}},

  { id:"rr5", type:"sata", difficulty:3, blueprint:"Physiological Integrity", category:"Reduction of Risk Potential",
    stem:"A nurse is caring for a client who is 12 hours post-op following a right hip replacement. Select ALL findings that require immediate notification of the provider.",
    options:["Temperature of 37.4°C (99.3°F)","Right calf pain and warmth","Urine output of 20 mL over the past 2 hours","Capillary refill of 2 seconds in the right foot","Serosanguineous drainage on the dressing","Pain rated 8/10 despite IV analgesic given 30 minutes ago"],
    correct:[1,2,5], rationale:{ correct:"Calf pain/warmth suggests DVT. Urine output of 20 mL/hr is oliguria (normal is ≥30 mL/hr). Uncontrolled pain 30 min after IV analgesic needs reassessment.", wrong:["Temp 37.4°C (99.3°F) is normal — mild elevation is expected post-op.","Capillary refill of 2 seconds is normal.","Serosanguineous drainage is expected in early post-op wound healing."]}},

  // ══ PHYSIOLOGICAL INTEGRITY — Physiological Adaptation ══
  { id:"pa1", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client in the ICU with the following ABG results: pH 7.28, PaCO2 52 mmHg, HCO3 24 mEq/L, PaO2 70 mmHg. How should the nurse interpret these results?",
    options:["Metabolic acidosis, uncompensated","Respiratory acidosis, uncompensated","Respiratory alkalosis, compensated","Metabolic alkalosis, uncompensated"],
    correct:[1], rationale:{ correct:"pH <7.35 = acidosis. Elevated PaCO2 (>45) = respiratory cause. HCO3 is normal (22–26) = no compensation yet. This is respiratory acidosis, uncompensated.", wrong:["Metabolic acidosis would show low HCO3, not elevated CO2 as the primary abnormality.","Respiratory alkalosis would show elevated pH and low CO2.","Metabolic alkalosis would show elevated pH and HCO3."]}},

  { id:"pa2", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client with heart failure who has gained 3 lbs overnight and has worsening shortness of breath. Which intervention should the nurse perform first?",
    options:["Weigh the client again to confirm accuracy","Administer the prescribed PRN furosemide","Elevate the head of bed and apply supplemental oxygen","Restrict the client's oral fluid intake for the rest of the day"],
    correct:[2], rationale:{ correct:"Positioning and oxygenation address the immediate symptom of dyspnea first — then pharmacological intervention follows.", wrong:["Reweighing delays treatment of active respiratory distress.","Furosemide is indicated but the immediate priority is alleviating respiratory distress.","Fluid restriction is appropriate but not the priority when the client is actively dyspneic."]}},

  { id:"pa3", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client with burns over 40% total body surface area who is 6 hours post-injury. The nurse notes urine output of 15 mL/hr. What is the priority action?",
    options:["Document the finding and reassess in 1 hour","Increase IV fluid administration per the Parkland formula and notify the provider","Restrict fluids to prevent fluid overload","Administer a diuretic to increase urine output"],
    correct:[1], rationale:{ correct:"Adequate urine output (0.5–1 mL/kg/hr in burn patients) signals adequate resuscitation. 15 mL/hr is inadequate — increase fluids per Parkland formula and notify provider.", wrong:["Documenting without acting allows further hemodynamic compromise.","Fluid restriction in a burn patient with oliguria worsens shock.","Diuretics are contraindicated — they worsen volume depletion in burn resuscitation."]}},

  { id:"pa4", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client with increased intracranial pressure (ICP). Which intervention should the nurse question if ordered?",
    options:["Elevate the head of bed to 30 degrees","Administer mannitol IV as prescribed","Encourage coughing and deep breathing every 2 hours","Maintain a quiet, low-stimulation environment"],
    correct:[2], rationale:{ correct:"Coughing increases intrathoracic pressure which impairs cerebral venous drainage and dramatically raises ICP — this intervention is contraindicated.", wrong:["HOB at 30° promotes cerebral venous drainage and is standard ICP management.","Mannitol is an osmotic diuretic used to reduce cerebral edema.","Minimizing stimulation reduces ICP spikes — appropriate intervention."]}},

  { id:"pa5", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client in diabetic ketoacidosis (DKA). After IV fluids are initiated, which intervention does the nurse anticipate next?",
    options:["Administer IV sodium bicarbonate","Begin a regular insulin infusion","Administer IV potassium before starting insulin","Replace fluids with D5W immediately"],
    correct:[2], rationale:{ correct:"In DKA, insulin drives potassium into cells, causing hypokalemia. IV potassium must be replaced and verified adequate before insulin is started to prevent life-threatening arrhythmias.", wrong:["Bicarb is reserved for severe acidosis (pH <6.9) — not routine in DKA management.","Insulin is the definitive treatment but must be held until potassium is ≥3.5 mEq/L.","D5W is used later to prevent hypoglycemia once glucose drops to 200 mg/dL — not immediately."]}},

  { id:"pa6", type:"mcq", difficulty:3, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is caring for a client who is 2 days post-op following bowel resection. Which assessment finding indicates the client may be developing anastomotic leak?",
    options:["Passage of flatus","Serosanguineous wound drainage","Sudden onset of severe abdominal pain with abdominal rigidity","Urine output of 35 mL/hr"],
    correct:[2], rationale:{ correct:"Sudden severe abdominal pain with rigidity post-bowel surgery is a red flag for anastomotic leak, which can cause peritonitis — a surgical emergency.", wrong:["Passage of flatus is a positive sign indicating return of bowel function.","Serosanguineous drainage is expected in early post-op wound healing.","Urine output of 35 mL/hr is normal — above the minimum threshold of 30 mL/hr."]}},

  { id:"pa7", type:"mcq", difficulty:2, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    stem:"A nurse is assessing a client admitted with pneumonia. Which finding is the priority concern?",
    options:["Temperature 38.6°C (101.5°F)","Productive cough with yellow sputum","Oxygen saturation of 88% on room air","Respiratory rate of 22 breaths per minute"],
    correct:[2], rationale:{ correct:"SpO2 of 88% indicates significant hypoxemia — immediate supplemental oxygen is required to prevent respiratory failure.", wrong:["Fever is expected with pneumonia and requires monitoring but is not immediately life-threatening.","Productive yellow sputum is consistent with bacterial pneumonia — expected finding.","RR of 22 is mildly elevated — concerning but not the priority over hypoxemia."]}},

  { id:"bt1", type:"bowtie", difficulty:3, blueprint:"Physiological Integrity", category:"Physiological Adaptation",

    leftLabel:"Nursing Actions (Select 2)", centerLabel:"Condition", rightLabel:"Parameters to Monitor (Select 2)",

    rightOptions:["Urine output and weight","SpO2 and respiratory rate","Blood glucose and temperature","Serum potassium and BUN"],

  { id:"bt2", type:"bowtie", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Safety & Infection Prevention",
    caseIntro:"A 72-year-old client is admitted following a fall at home. PMH: osteoporosis, hypertension, taking amlodipine and hydrochlorothiazide. Admission VS: BP 102/64 (sitting), HR 96, RR 18, SpO2 97%. Client reports feeling dizzy when standing up.",
    stem:"Complete the bow-tie clinical judgment item. Select the ONE condition, TWO nursing actions, and TWO parameters to monitor.",
    leftLabel:"Nursing Actions (Select 2)", centerLabel:"Condition", rightLabel:"Parameters to Monitor (Select 2)",
    leftOptions:["Instruct client to change positions slowly","Apply bilateral compression stockings","Review antihypertensive medications with provider","Encourage high-sodium foods to raise BP"],
    centerOptions:["Orthostatic hypotension","Hypertensive urgency","Dehydration-related fall risk","Risk for deep vein thrombosis"],
    rightOptions:["Blood pressure with position changes","Fall incidents during hospitalization","Daily weight and fluid balance","Heart rate and SpO2"],

    rationale:{ condition:"BP 102/64 with dizziness on standing confirms orthostatic hypotension — a known side effect of amlodipine and hydrochlorothiazide, creating significant fall risk.", actions:"Slow position changes prevent sudden pressure drops. Reviewing antihypertensives with the provider addresses the root pharmacological cause.", outcomes:"Monitoring BP with position changes tracks whether orthostasis resolves. Tracking fall incidents is the primary safety outcome.", wrong:"Compression stockings address DVT, not orthostatic hypotension. Encouraging sodium is not a nursing-scope intervention for this client."}}  ,

  // ══ NGN — CASE STUDIES ══
  { id:"cs1", type:"casestudy", difficulty:3, blueprint:"Safe & Effective Care Environment", category:"Management of Care",
    caseIntro:"A 54-year-old client arrives to the ED confused, febrile (T 38.8°C / 101.8°F), hypotensive (BP 94/60), tachycardic (HR 122), and tachypneic (RR 22). Point-of-care glucose: 38 mg/dL. Family reports the client has not eaten or taken medications in 24 hours and had a seizure at home. PMH: Type 2 diabetes, hypertension. Medications: metformin, lisinopril.",
    questions:[
      { qid:"cs1a", stem:"Which TWO conditions are the nurse's priority concerns based on this data?", type:"sata",
        options:["Hypoglycemia","Hypertensive crisis","Sepsis","Medication overdose","New-onset seizure disorder","Hypovolemia only"],
        correct:[0,2], rationale:"Glucose of 38 mg/dL is critically low — immediate intervention required. Fever, hypotension, tachycardia, and altered mental status meet SIRS/sepsis criteria. Both are immediate life threats."},
      { qid:"cs1b", stem:"After administering dextrose 50% IV push, what is the nurse's priority reassessment?", type:"mcq",
        options:["Recheck blood pressure","Recheck point-of-care glucose in 15 minutes","Reassess level of consciousness immediately","Obtain a 12-lead ECG"],
        correct:[1], rationale:"After D50 administration, rechecking glucose in 15 minutes confirms treatment efficacy and guides whether repeat dosing is needed."},
      { qid:"cs1c", stem:"The provider orders blood cultures × 2, lactate, CBC, BMP, and 1L NS bolus. Which action should the nurse perform first?", type:"mcq",
        options:["Administer the NS bolus","Draw blood cultures before initiating IV fluids","Obtain the CBC first to assess leukocytosis","Call pharmacy to prepare antibiotics"],
        correct:[1], rationale:"In suspected sepsis, blood cultures MUST be drawn before IV fluids or antibiotics to prevent contaminating culture results and ensure accurate identification of the organism."}
    ]},

  { id:"cs2", type:"casestudy", difficulty:3, blueprint:"Physiological Integrity", category:"Physiological Adaptation",
    caseIntro:"A 45-year-old client is admitted to the telemetry unit following an emergency department visit for chest pain. 12-lead ECG shows ST elevation in leads II, III, and aVF. Troponin I is 4.2 ng/mL (elevated). The client is diaphoretic, pale, and rates pain 9/10. VS: BP 88/54, HR 58, RR 20, SpO2 94%.",
    questions:[
      { qid:"cs2a", stem:"Based on the ECG findings and clinical presentation, which area of the myocardium is most likely affected?", type:"mcq",
        options:["Anterior wall","Lateral wall","Inferior wall","Posterior wall"],
        correct:[2], rationale:"ST elevation in leads II, III, and aVF indicates inferior wall MI, typically caused by right coronary artery occlusion."},
      { qid:"cs2b", stem:"The provider orders nitroglycerin 0.4 mg sublingual. Given this client's vital signs, what is the nurse's priority action before administration?", type:"mcq",
        options:["Administer as ordered — pain relief is the priority","Hold the nitroglycerin and notify the provider of the blood pressure","Administer half the dose and monitor BP closely","Ask the client to rate the pain again before administering"],
        correct:[1], rationale:"Nitroglycerin causes vasodilation and can severely worsen hypotension. A BP of 88/54 is a contraindication — the provider must be notified before administration."},
      { qid:"cs2c", stem:"Select ALL nursing interventions appropriate for this client at this time.", type:"sata",
        options:["Administer aspirin 325 mg PO as ordered","Apply supplemental oxygen to maintain SpO2 >94%","Prepare the client for emergent PCI","Encourage the client to ambulate to prevent DVT","Administer morphine IV for pain as ordered","Restrict IV fluids to prevent volume overload"],
        correct:[0,1,2,4], rationale:"Aspirin (antiplatelet), oxygen (treat hypoxemia), emergent PCI (reperfusion therapy), and morphine (reduce oxygen demand/pain) are all appropriate for STEMI management. Ambulation is contraindicated in acute STEMI. Fluid restriction is not appropriate — this client may need volume support given hypotension."}
    ]}
];

{id:"rm6",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",

{id:"rm8",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Management of Care",

{id:"rm9",type:"mcq",difficulty:2,blueprint:"Safe & Effective Care Environment",category:"Safety & Infection Prevention",
