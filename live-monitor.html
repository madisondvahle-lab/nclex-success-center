<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Monitor · NCLEX Success Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 18px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-badge {
      padding: 4px 12px; border-radius: 99px;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
      font-size: 10px; font-weight: 700; color: #f87171; letter-spacing: 1.4px; text-transform: uppercase;
    }
    .topbar-badge.live { animation: pulse-badge 2s ease-in-out infinite; }
    @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .topbar-title { font-size: 18px; font-weight: 800; color: #f8fafc; }
    .topbar-sub { font-size: 13px; color: #64748b; }
    .refresh-status { font-size: 12px; color: #475569; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse-dot 2s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

    .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    /* Alert banner */
    #alert-banner {
      display: none;
      background: linear-gradient(135deg, #064e3b, #065f46);
      border: 1.5px solid #10b981;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex; align-items: flex-start; gap: 16px;
      animation: slide-in 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slide-in { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
    .alert-icon { font-size: 28px; flex-shrink: 0; }
    .alert-title { font-size: 17px; font-weight: 800; color: #34d399; margin-bottom: 4px; }
    .alert-body { font-size: 14px; color: #6ee7b7; line-height: 1.6; }
    .alert-time { font-size: 11px; color: #059669; margin-top: 6px; font-weight: 600; }

    /* Section label */
    .section-label { font-size: 10px; font-weight: 700; color: #475569; letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 14px; margin-top: 28px; }

    /* Student cards */
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .student-card {
      background: #1e293b; border-radius: 18px; border: 1.5px solid #334155;
      padding: 20px 22px; transition: all 0.2s ease; position: relative; overflow: hidden;
    }
    .student-card.completed {
      border-color: #10b981; background: linear-gradient(135deg, #064e3b22, #1e293b);
    }
    .student-card.in-progress {
      border-color: #f59e0b; background: linear-gradient(135deg, #78350f22, #1e293b);
    }
    .student-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; flex-shrink: 0;
    }
    .student-name { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .student-email { font-size: 11px; color: #64748b; margin-top: 1px; }
    .status-pill {
      margin-left: auto;
      padding: 4px 11px; border-radius: 99px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      flex-shrink: 0;
    }
    .status-waiting { background: #1e293b; border: 1px solid #334155; color: #64748b; }
    .status-in-progress { background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #fbbf24; }
    .status-completed { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #34d399; }

    .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-label { font-size: 11px; color: #64748b; font-weight: 600; }
    .card-value { font-size: 13px; color: #cbd5e1; font-weight: 600; }
    .card-value.green { color: #34d399; }
    .card-value.amber { color: #fbbf24; }
    .card-value.red { color: #f87171; }

    .score-bar-wrap { margin-top: 12px; }
    .score-bar-bg { height: 6px; background: #334155; border-radius: 99px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

    .waiting-state { text-align: center; padding: 16px 0 4px; }
    .waiting-state .spinner { font-size: 22px; animation: spin 2s linear infinite; display: inline-block; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .waiting-text { font-size: 12px; color: #64748b; margin-top: 8px; line-height: 1.5; }

    /* History table */
    .history-wrap { background: #1e293b; border-radius: 18px; border: 1px solid #334155; overflow: hidden; }
    .history-header { padding: 16px 22px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .history-title { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .history-count { font-size: 12px; color: #64748b; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 10px 22px; text-align: left; font-size: 10px; font-weight: 700; color: #475569; letter-spacing: 1.2px; text-transform: uppercase; border-bottom: 1px solid #334155; }
    tbody tr { border-bottom: 1px solid #1e293b; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #243044; }
    tbody td { padding: 12px 22px; font-size: 13px; color: #cbd5e1; }
    .result-pass { color: #34d399; font-weight: 700; }
    .result-fail { color: #f87171; font-weight: 700; }
    .empty-state { padding: 40px; text-align: center; color: #475569; font-size: 14px; }

    /* Sound toggle */
    .sound-btn {
      padding: 8px 14px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
    }
    .sound-btn:hover { border-color: #475569; color: #cbd5e1; }
    .sound-btn.on { border-color: #10b981; color: #34d399; background: rgba(16,185,129,0.08); }

    .back-link { display: inline-flex; align-items: center; gap: 8px; color: #64748b; font-size: 13px; font-weight: 600; text-decoration: none; margin-bottom: 24px; transition: color 0.15s; }
    .back-link:hover { color: #94a3b8; }

    @media (max-width: 600px) {
      .topbar { padding: 14px 16px; }
      .main { padding: 20px 14px 60px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-badge live" id="live-badge">● LIVE</div>
    <div>
      <div class="topbar-title">Session Monitor</div>
      <div class="topbar-sub">NCLEX Success Center · Study with Madison, RN</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div class="refresh-status">
      <div class="dot" id="poll-dot"></div>
      <span id="last-checked">Checking...</span>
    </div>
    <button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔔 Alert Sound: ON</button>
  </div>
</div>

<div class="main">

  <a href="dashboard.html" class="back-link">← Tutor Dashboard</a>

  <!-- Completion alert (hidden until a student finishes) -->
  <div id="alert-banner" style="display:none;">
    <div class="alert-icon">🎉</div>
    <div>
      <div class="alert-title" id="alert-title">Student finished!</div>
      <div class="alert-body" id="alert-body"></div>
      <div class="alert-time" id="alert-time"></div>
    </div>
  </div>

  <div class="section-label">Student Status</div>
  <div class="student-grid" id="student-grid">
    <div style="color:#475569;font-size:14px;padding:20px;">Loading...</div>
  </div>

  <div class="section-label">Completed Sessions</div>
  <div class="history-wrap">
    <div class="history-header">
      <div class="history-title">All Diagnostic Results</div>
      <div class="history-count" id="history-count">—</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Date & Time</th>
          <th>Score</th>
          <th>Result</th>
          <th>Questions</th>
          <th>Top Weak Area</th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="6" class="empty-state">No completed sessions yet</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const SB_URL = 'https://pmjwwktwlsqpetwfvolb.supabase.co';
const SB_KEY = 'sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT';
const POLL_INTERVAL = 15000; // 15 seconds

const STUDENTS = [
  { id: '7711737d-1cc0-4d99-8ae4-80b58a593cd5', name: 'Ahmed',   email: 'southviewconsultingservices@gmail.com', pin: '1950', avatarBg: 'linear-gradient(135deg,#d1fae5,#a7f3d0)', avatarColor: '#065f46', nclex_target: null },
  { id: 'ae748de7-2bc5-46b3-9e74-aa3a736e0427', name: 'Alyssa',  email: 'alyssadababneh@yahoo.com',              pin: '7284', avatarBg: 'linear-gradient(135deg,#e0f2fe,#bae6fd)', avatarColor: '#0369a1', nclex_target: '2026-09-01' },
  { id: '2df04188-d5e6-4dbf-aa42-856b7f9d67b1', name: 'Courtney',email: 'stewartxcrunner@gmail.com',             pin: '0508', avatarBg: 'linear-gradient(135deg,#fce7f3,#fbcfe8)', avatarColor: '#9d174d', nclex_target: '2026-09-14' },
];

// State
let knownScoreIds = new Set();
let soundEnabled = true;
let previousScoreCount = null;

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundEnabled ? '🔔 Alert Sound: ON' : '🔕 Alert Sound: OFF';
  btn.classList.toggle('on', soundEnabled);
}

function playAlert() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Play 3 pleasant ascending tones
    [440, 554, 659].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.18);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.18 + 0.05);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.18 + 0.3);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.35);
    });
  } catch(e) {}
}

function showAlert(studentName, score, result) {
  const banner = document.getElementById('alert-banner');
  document.getElementById('alert-title').textContent = `🎉 ${studentName} just finished their diagnostic!`;
  document.getElementById('alert-body').textContent = `Score: ${(score * 100).toFixed(1)}% · Result: ${result} · Go to the dashboard to review their full report.`;
  document.getElementById('alert-time').textContent = `Completed at ${new Date().toLocaleTimeString()}`;
  banner.style.display = 'flex';
  playAlert();

  // Browser notification
  if (Notification.permission === 'granted') {
    new Notification(`${studentName} finished! · NCLEX Success Center`, {
      body: `Score: ${(score * 100).toFixed(1)}% · ${result}`,
      icon: 'https://madisondvahle-lab.github.io/nclex-success-center/favicon.ico'
    });
  }
}

async function sbFetch(path) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
  return res.json();
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function renderStudentGrid(scores) {
  const grid = document.getElementById('student-grid');
  const scoreByStudent = {};
  scores.forEach(s => {
    if (!scoreByStudent[s.student_id] || new Date(s.completed_at || s.created_at) > new Date(scoreByStudent[s.student_id].completed_at || scoreByStudent[s.student_id].created_at)) {
      scoreByStudent[s.student_id] = s;
    }
  });

  grid.innerHTML = STUDENTS.map(st => {
    const score = scoreByStudent[st.id];
    const days = daysUntil(st.nclex_target);
    const daysStr = days !== null ? `${days} days to NCLEX` : 'No target date set';

    if (score) {
      const pct = Math.round((score.ability_score || 0) * 100);
      const result = score.result || (pct >= 72 ? 'PASS' : 'FAIL');
      const barColor = result === 'PASS' ? '#10b981' : '#ef4444';
      const completedAt = score.completed_at || score.created_at;
      return `<div class="student-card completed">
        <div class="student-card-header">
          <div class="avatar" style="background:${st.avatarBg};color:${st.avatarColor};">${st.name[0]}</div>
          <div>
            <div class="student-name">${st.name}</div>
            <div class="student-email">${daysStr}</div>
          </div>
          <div class="status-pill status-completed">✓ Done</div>
        </div>
        <div class="card-row"><span class="card-label">Score</span><span class="card-value ${result==='PASS'?'green':'red'}">${pct}%</span></div>
        <div class="card-row"><span class="card-label">Result</span><span class="card-value ${result==='PASS'?'green':'red'}">${result}</span></div>
        <div class="card-row"><span class="card-label">Questions</span><span class="card-value">${score.total_questions || '—'}</span></div>
        <div class="card-row"><span class="card-label">Completed</span><span class="card-value">${formatDate(completedAt)}</span></div>
        <div class="score-bar-wrap">
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
        </div>
      </div>`;
    } else {
      return `<div class="student-card in-progress" id="card-${st.id}">
        <div class="student-card-header">
          <div class="avatar" style="background:${st.avatarBg};color:${st.avatarColor};">${st.name[0]}</div>
          <div>
            <div class="student-name">${st.name}</div>
            <div class="student-email">${daysStr}</div>
          </div>
          <div class="status-pill status-in-progress">⏳ Pending</div>
        </div>
        <div class="waiting-state">
          <div class="spinner">⏳</div>
          <div class="waiting-text">Waiting for ${st.name} to complete their diagnostic.<br>This page refreshes every 15 seconds.</div>
        </div>
      </div>`;
    }
  }).join('');
}

function renderHistory(scores) {
  const tbody = document.getElementById('history-tbody');
  const countEl = document.getElementById('history-count');

  if (!scores.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No completed sessions yet — check back soon!</td></tr>';
    countEl.textContent = '0 sessions';
    return;
  }

  countEl.textContent = `${scores.length} session${scores.length !== 1 ? 's' : ''}`;

  const sorted = [...scores].sort((a,b) => new Date(b.completed_at||b.created_at) - new Date(a.completed_at||a.created_at));
  tbody.innerHTML = sorted.map(s => {
    const st = STUDENTS.find(x => x.id === s.student_id) || { name: s.student_name || 'Unknown' };
    const pct = Math.round((s.ability_score || 0) * 100);
    const result = s.result || (pct >= 72 ? 'PASS' : 'FAIL');
    const weakArea = s.weak_blueprints?.[0] || s.top_weak_area || '—';
    const completedAt = s.completed_at || s.created_at;
    return `<tr>
      <td style="font-weight:700;color:#f1f5f9;">${st.name}</td>
      <td>${formatDate(completedAt)}</td>
      <td style="font-weight:700;color:${result==='PASS'?'#34d399':'#f87171'}">${pct}%</td>
      <td class="${result==='PASS'?'result-pass':'result-fail'}">${result}</td>
      <td>${s.total_questions || '—'}</td>
      <td style="font-size:12px;color:#94a3b8;">${weakArea}</td>
    </tr>`;
  }).join('');
}

async function poll() {
  try {
    const scores = await sbFetch('student_scores?select=*&order=created_at.desc');

    // Check for NEW completions since last poll
    if (previousScoreCount !== null && scores.length > previousScoreCount) {
      const newScores = scores.filter(s => !knownScoreIds.has(s.id));
      newScores.forEach(s => {
        const st = STUDENTS.find(x => x.id === s.student_id);
        if (st) showAlert(st.name, s.ability_score || 0, s.result || 'COMPLETE');
      });
    }
    scores.forEach(s => knownScoreIds.add(s.id));
    previousScoreCount = scores.length;

    renderStudentGrid(scores);
    renderHistory(scores);

    const now = new Date().toLocaleTimeString();
    document.getElementById('last-checked').textContent = `Last checked: ${now}`;
  } catch(e) {
    document.getElementById('last-checked').textContent = `Error: ${e.message}`;
    document.getElementById('poll-dot').style.background = '#ef4444';
  }
}

// Request notification permission on load
if (Notification.permission === 'default') {
  Notification.requestPermission();
}

// Initial load + start polling
poll();
setInterval(poll, POLL_INTERVAL);
</script>
</body>
</html>
