// ─── CAT-STYLE DIAGNOSTIC ENGINE ─────────────────────────────────────────────
const MIN_Q = 30;
const MAX_Q = 45;
const FULL_MOCK_MIN_Q = 85;
const FULL_MOCK_MAX_Q = 150;
const FULL_MOCK_DEFAULT_TIME_MS = 5 * 60 * 60 * 1000;
const FULL_MOCK_TIME_MULTIPLIERS = [1, 1.5, 2];
const PASS_THRESHOLD = 0.60;
const CONFIDENCE_Z = 1.96;
const ITEM_DIFFICULTIES = { 1: 0.28, 2: 0.50, 3: 0.72 };
const BLUEPRINT_MINIMUMS = {
  "Safe & Effective Care Environment": 8,
  "Health Promotion & Maintenance": 4,
  "Psychosocial Integrity": 4,
  "Physiological Integrity": 14
};
const CORE_BLUEPRINT = window.NCLEX_CORE_BLUEPRINT;
if (!CORE_BLUEPRINT) { document.getElementById('root').innerHTML = '<div style="font-family:Georgia,serif;padding:60px;text-align:center;color:#64748b"><p style="font-size:18px;font-weight:700;color:#0f172a">Unable to load the question engine.</p><p style="margin-top:12px;font-size:14px">Please refresh the page. If this continues, contact Madison.</p></div>'; throw new Error("NCLEX_CORE_BLUEPRINT not loaded"); }
const CORE_REQUIREMENTS = CORE_BLUEPRINT.requirements;
const MOCK_CATEGORY_TARGETS = CORE_BLUEPRINT.nclexCategoryTargets;
const MOCK_CATEGORY_RANGES = CORE_BLUEPRINT.nclexCategoryRanges;
const MOCK_CATEGORY_MINIMUMS = Object.fromEntries(
  Object.entries(MOCK_CATEGORY_RANGES).map(([category, range]) => [category, Math.ceil(FULL_MOCK_MIN_Q * range.min / 100)])
);
const MOCK_CATEGORY_MAXIMUMS = Object.fromEntries(
  Object.entries(MOCK_CATEGORY_RANGES).map(([category, range]) => [category, Math.floor(FULL_MOCK_MIN_Q * range.max / 100)])
);
const ASSESSMENT_PERSONALIZATION = window.NCLEX_ASSESSMENT_PERSONALIZATION;
const ASSESSMENT_ONLY = new URLSearchParams(window.location.search).get('mode') === 'assessment';
const getCoreTags = item => CORE_BLUEPRINT.tagsForItem(item);
const getNCLEXCategory = item => {
  if (item.blueprint === "Safe & Effective Care Environment") {
    return item.category === "Management of Care" ? "Management of Care" : "Safety & Infection Prevention";
  }
  if (item.blueprint === "Health Promotion & Maintenance") return "Health Promotion & Maintenance";
  if (item.blueprint === "Psychosocial Integrity") return "Psychosocial Integrity";
  return item.category;
};

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
function formatExamTime(milliseconds) {
  const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}
const SUPABASE_URL = 'https://pmjwwktwlsqpetwfvolb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT';
const assessmentKeyForMode = mode => mode === 'assessment' ? 'readiness-assessment' : `diagnostic-${mode}`;

function assessmentDb() {
  if (!window.supabase) throw new Error('Supabase is unavailable');
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function readinessCheckpoint({ selected, btState, csAnswers, examTimer, schemaVersion = 3, assessmentVersion = 'in-house-core-v1' }) {
  return {
    schemaVersion,
    assessmentVersion,
    examTimer: examTimer ? {
      multiplier: examTimer.multiplier,
      showTimer: examTimer.showTimer,
      showQuestionCount: examTimer.showQuestionCount,
      remainingMs: examTimer.remainingMs,
      runningSince: examTimer.runningSince || null,
      overTime: Boolean(examTimer.overTime)
    } : null,
    draft: {
      selected,
      btState,
      csAnswers,
      submitted: false
    }
  };
}

function restoreResponseHistory(responses) {
  return (responses || []).map(response => {
    const sourceId = response.sourceId || (response.item_id.includes(':') ? response.item_id.split(':')[0] : response.item_id);
    const parent = [...QUESTION_BANK, ...REMEDIATION_BANK].find(item => item.id === sourceId);
    const subId = response.item_id.includes(':') ? response.item_id.split(':').pop() : null;
    const item = parent?.type === 'casestudy'
      ? parent.questions.find(question => question.qid === subId)
      : parent;
    return {
      id: response.item_id,
      sourceId,
      type: response.question_type || item?.type || 'mcq',
      difficulty: response.difficulty,
      blueprint: response.blueprint || parent?.blueprint,
      nclexCategory: response.nclex_category,
      coreTags: response.core_tags || [],
      source: response.item_source,
      system: response.system,
      topic: response.topic || item?.topic,
      cognitiveLevel: response.cognitive_level || item?.cognitiveLevel,
      stem: response.interaction?.prompt || response.interaction?.stem || item?.stem || null,
      selectedAnswer: response.selected_answer,
      correctAnswer: response.correct_answer,
      rationale: response.rationale,
      correct: response.is_correct,
      credit: response.credit,
      scoringVersion: response.scoringVersion,
      scoringModel: response.scoringModel,
      interaction: response.interaction,
      contentVersion: response.contentVersion,
      caseIndex: response.caseIndex,
      caseLength: response.caseLength
    };
  });
}

function itemProbability(ability, difficulty) {
  const itemDifficulty = ITEM_DIFFICULTIES[difficulty] ?? 0.50;
  return 1 / (1 + Math.exp(-(ability - itemDifficulty) * 6));
}

function updateAbility(ability, correct, difficulty) {
  const expected = itemProbability(ability, difficulty);
  const response = correct ? 1 : 0;
  return clamp(ability + 0.18 * (response - expected), 0.05, 0.95);
}

function getStandardError(history, ability) {
  if (!history.length) return Infinity;
  const information = history.reduce((total, item) => {
    const probability = itemProbability(ability, item.difficulty);
    return total + 36 * probability * (1 - probability);
  }, 0);
  return information > 0 ? 1 / Math.sqrt(information) : Infinity;
}

function hasBlueprintCoverage(history) {
  const counts = history.reduce((totals, item) => {
    totals[item.blueprint] = (totals[item.blueprint] || 0) + 1;
    return totals;
  }, {});
  return Object.entries(BLUEPRINT_MINIMUMS).every(([blueprint, minimum]) => (counts[blueprint] || 0) >= minimum);
}

function coreCoverageCounts(history) {
  return history.reduce((totals, item) => {
    (item.coreTags || []).forEach(tag => { totals[tag] = (totals[tag] || 0) + 1; });
    return totals;
  }, {});
}

function missingCoreRequirements(history) {
  const counts = coreCoverageCounts(history);
  return CORE_REQUIREMENTS.filter(requirement => !(counts[requirement.key] || 0));
}

function hasCoreCoverage(history) {
  return missingCoreRequirements(history).length === 0;
}

function shouldStop(history, ability) {
  if (history.length < MIN_Q || !hasBlueprintCoverage(history) || !hasCoreCoverage(history)) return null;
  const standardError = getStandardError(history, ability);
  const lowerBound = ability - CONFIDENCE_Z * standardError;
  const upperBound = ability + CONFIDENCE_Z * standardError;
  if (lowerBound > PASS_THRESHOLD) return "PASS";
  if (upperBound < PASS_THRESHOLD) return "FAIL";
  if (history.length >= MAX_Q) return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  return null;
}

function hasMockCategoryCoverage(history) {
  const counts = history.reduce((totals, item) => {
    const category = item.nclexCategory || getNCLEXCategory(item);
    totals[category] = (totals[category] || 0) + 1;
    return totals;
  }, {});
  return Object.entries(MOCK_CATEGORY_MINIMUMS).every(([category, minimum]) => (counts[category] || 0) >= minimum);
}

function categoryPersonalizationWeight(profile, category) {
  const weight = Number(profile?.externalCategoryWeights?.[category]);
  return Number.isFinite(weight) ? clamp(weight, 0.8, 1.65) : 1;
}

function mockPriorityCategory(counts, profile) {
  const categories = Object.keys(MOCK_CATEGORY_TARGETS).filter(
    category => (counts[category] || 0) < MOCK_CATEGORY_MAXIMUMS[category]
  );
  const pool = categories.length ? categories : Object.keys(MOCK_CATEGORY_TARGETS);
  const belowMinimum = pool.filter(category => (counts[category] || 0) < MOCK_CATEGORY_MINIMUMS[category]);
  const candidates = belowMinimum.length ? belowMinimum : pool;
  return candidates.map(category => {
    const count = counts[category] || 0;
    const target = MOCK_CATEGORY_TARGETS[category];
    const weight = categoryPersonalizationWeight(profile, category);
    const coverage = belowMinimum.length ? count / MOCK_CATEGORY_MINIMUMS[category] : count / (target * weight);
    return { category, coverage, count };
  }).sort((a, b) => a.coverage - b.coverage || a.count - b.count)[0]?.category || null;
}

function shouldStopMock(history, ability) {
  if (history.length < FULL_MOCK_MIN_Q || !hasCoreCoverage(history) || !hasMockCategoryCoverage(history)) return null;
  const standardError = getStandardError(history, ability);
  const lowerBound = ability - CONFIDENCE_Z * standardError;
  const upperBound = ability + CONFIDENCE_Z * standardError;
  if (lowerBound > PASS_THRESHOLD) return "PASS";
  if (upperBound < PASS_THRESHOLD) return "FAIL";
  if (history.length >= FULL_MOCK_MAX_Q) return ability >= PASS_THRESHOLD ? "PASS" : "FAIL";
  return null;
}

function pickNextQuestion(bank, history, profile, ability) {
  const usedIds = new Set(history.map(item => item.sourceId || item.id));
  const isMock = profile?.mode === "mock" || profile?.mode === "assessment";
  const available = bank.filter(item => {
    if (usedIds.has(item.id)) return false;
    if (isMock && item.type === "casestudy" && history.length + item.questions.length > FULL_MOCK_MAX_Q) return false;
    return true;
  });
  if (!available.length) return null;

  const blueprintCounts = history.reduce((totals, item) => {
    totals[item.blueprint] = (totals[item.blueprint] || 0) + 1;
    return totals;
  }, {});
  const neededBlueprints = Object.entries(BLUEPRINT_MINIMUMS)
    .filter(([blueprint, minimum]) => (blueprintCounts[blueprint] || 0) < minimum)
    .sort(([blueprintA, minimumA], [blueprintB, minimumB]) =>
      ((blueprintCounts[blueprintA] || 0) / minimumA) - ((blueprintCounts[blueprintB] || 0) / minimumB)
    );
  const coreNeeded = missingCoreRequirements(history);
  const mockCounts = history.reduce((totals, item) => {
    const category = item.nclexCategory || getNCLEXCategory(item);
    totals[category] = (totals[category] || 0) + 1;
    return totals;
  }, {});
  let candidates = available;
  const priorityBlueprint = neededBlueprints[0]?.[0];
  const priorityCategory = isMock ? mockPriorityCategory(mockCounts, profile) : null;
  if (coreNeeded.length) {
    const requiredTag = coreNeeded[0].key;
    const coreCandidates = available.filter(item => getCoreTags(item).includes(requiredTag));
    const categoryMatched = priorityCategory ? coreCandidates.filter(item => getNCLEXCategory(item) === priorityCategory) : [];
    const blueprintMatched = !priorityCategory && priorityBlueprint ? coreCandidates.filter(item => item.blueprint === priorityBlueprint) : [];
    candidates = categoryMatched.length ? categoryMatched : (blueprintMatched.length ? blueprintMatched : coreCandidates);
  } else if (priorityCategory) {
    candidates = available.filter(item => getNCLEXCategory(item) === priorityCategory);
  } else if (priorityBlueprint) {
    candidates = available.filter(item => item.blueprint === priorityBlueprint);
  }
  if (!candidates.length) candidates = available;

  const weakAreas = profile?.weakAreas || [];
  const weakCandidates = candidates.filter(item =>
    weakAreas.some(area =>
      item.blueprint?.toLowerCase().includes(area.toLowerCase()) ||
      item.category?.toLowerCase().includes(area.toLowerCase())
    )
  );
  if (weakCandidates.length && Math.random() < 0.45) candidates = weakCandidates;

  const recentBlueprints = history.slice(-2).map(item => item.blueprint);
  const ranked = candidates
    .map(item => {
      const externalWeight = categoryPersonalizationWeight(profile, getNCLEXCategory(item));
      return {
        item,
        score:
          Math.abs((ITEM_DIFFICULTIES[item.difficulty] ?? 0.50) - ability) +
          (recentBlueprints.includes(item.blueprint) ? 0.18 : 0) -
          (externalWeight - 1) * 0.08
      };
    })
    .sort((a, b) => a.score - b.score);
  const bestScore = ranked[0].score;
  const shortlist = ranked.filter(entry => entry.score <= bestScore + 0.04).slice(0, 3);
  return shortlist[Math.floor(Math.random() * shortlist.length)].item;
}

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const CAT_COLORS = {
  "Safe & Effective Care Environment": "#0ea5e9",
  "Physiological Integrity": "#10b981",
  "Health Promotion & Maintenance": "#f59e0b",
  "Psychosocial Integrity": "#8b5cf6"
};
const DIFF_LABELS = { 1: "Foundational", 2: "Applying", 3: "Analyzing" };
const DIFF_COLORS = { 1:{ bg:"#d1fae5", text:"#065f46" }, 2:{ bg:"#fef3c7", text:"#92400e" }, 3:{ bg:"#fee2e2", text:"#991b1b" } };
const NGN_LABELS = { mcq:"MCQ", sata:"SATA", bowtie:"NGN · Bow-Tie", casestudy:"NGN · Case Study", highlight:"NGN · Highlight", matrix:"NGN · Matrix", cloze:"NGN · Drop-down", fill:"Numeric response" };

// ─── UI ATOMS ─────────────────────────────────────────────────────────────────
function Tag({ children, color, bg, border }) {
  return <span className="category-pill" style={{ fontWeight:700, padding:"3px 10px", borderRadius:99, textTransform:"uppercase", background:bg||"#f1f5f9", color:color||"#64748b", border:border?`1px solid ${border}`:"none" }}>{children}</span>;
}

function Btn({ children, onClick, disabled, variant="primary", small }) {
  const base = { border:"none", borderRadius:10, fontWeight:700, cursor:disabled?"default":"pointer", letterSpacing:0.5, padding: small?"9px 18px":"13px 28px", fontSize: small?13:15 };
  const variants = {
    primary:{ background:disabled?"#e2e8f0":"#0f172a", color:disabled?"#94a3b8":"#fff" },
    outline:{ background:"#f8fafc", color:"#475569", border:"1.5px solid #e2e8f0" }
  };
  return <button style={{...base,...variants[variant]}} onClick={onClick} disabled={disabled}>{children}</button>;
}

function OptionBtn({ letter, text, state, onClick }) {
  const base = { display:"flex", alignItems:"flex-start", gap:12, padding:"13px 16px", borderRadius:10, border:"2px solid #e2e8f0", background:"#f8fafc", cursor:"pointer", textAlign:"left", width:"100%", fontSize:16, transition:"all 0.15s" };
  const states = { selected:{ border:"2px solid #0ea5e9", background:"#f0f9ff" }, correct:{ border:"2px solid #10b981", background:"#f0fdf4", cursor:"default" }, wrong:{ border:"2px solid #ef4444", background:"#fef2f2", cursor:"default" }, dim:{ border:"2px solid #f1f5f9", background:"#f8fafc", opacity:0.45, cursor:"default" }, neutral:{} };
  return (
    <button style={{...base,...states[state||"neutral"]}} onClick={onClick}>
      <span style={{ minWidth:26, height:26, borderRadius:"50%", background:"#e2e8f0", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:"#475569", flexShrink:0, marginTop:1 }}>{letter}</span>
      <span style={{ flex:1, color:"#1e293b", lineHeight:1.6 }}>{text}</span>
      {state==="correct" && <span style={{ color:"#10b981", fontWeight:700, fontSize:16 }}>✓</span>}
      {state==="wrong" && <span style={{ color:"#ef4444", fontWeight:700, fontSize:16 }}>✗</span>}
    </button>
  );
}

// ─── QUESTION RENDERERS ───────────────────────────────────────────────────────
function MCQQuestion({ q, submitted, examMode, selected, onSelect }) {
  const showFeedback = submitted && !examMode;
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
      {q.options.map((opt,idx) => {
        let state = "neutral";
        if (showFeedback) { if(idx===q.correct[0]) state="correct"; else if(idx===(selected||[])[0]&&idx!==q.correct[0]) state="wrong"; else state="dim"; }
        else if ((selected||[]).includes(idx)) state="selected";
        return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>!submitted&&onSelect(idx)} />;
      })}
    </div>
  );
}

function SATAQuestion({ q, submitted, examMode, selected, onSelect }) {
  const showFeedback = submitted && !examMode;
  return (
    <div>
      <div className="instruction-text" style={{ marginBottom:10 }}>Select all that apply — choose every correct option.</div>
      <div style={{ display:"flex", flexDirection:"column", gap:9, marginBottom:20 }}>
        {q.options.map((opt,idx) => {
          let state = "neutral";
          if (showFeedback) { if(q.correct.includes(idx)) state="correct"; else if((selected||[]).includes(idx)) state="wrong"; else state="dim"; }
          else if ((selected||[]).includes(idx)) state="selected";
          return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>!submitted&&onSelect(idx)} />;
        })}
      </div>
    </div>
  );
}

function BowTieQuestion({ q, submitted, examMode, btState, onBTSelect }) {
  const showFeedback = submitted && !examMode;
  const col = { display:"flex", flexDirection:"column", gap:6, flex:1, minWidth:160 };
  const colHead = { fontSize:11, fontWeight:700, color:"#64748b", letterSpacing:0.8, textTransform:"uppercase", marginBottom:4 };
  const colLimit = { left:2, center:1, right:2 };

  function BtOpt({ label, selected, correct, wrong, dim, onClick }) {
    let bg="#f8fafc",border="1.5px solid #e2e8f0",color="#1e293b";
    if(dim){color="#cbd5e1";border="1.5px solid #f1f5f9";}
    if(selected){bg="#f0f9ff";border="1.5px solid #0ea5e9";}
    if(correct){bg="#f0fdf4";border="1.5px solid #10b981";color="#065f46";}
    if(wrong){bg="#fef2f2";border="1.5px solid #ef4444";color="#991b1b";}
    return <button onClick={onClick} style={{ padding:"8px 10px", borderRadius:8, border, background:bg, color, fontSize:14, textAlign:"left", cursor:(submitted||!onClick)?"default":"pointer", lineHeight:1.5, width:"100%" }}>{correct&&"✓ "}{wrong&&"✗ "}{label}</button>;
  }

  function handleSelect(key, idx) {
    if(submitted) return;
    const limit = colLimit[key];
    const sel = btState[key]||[];
    let next;
    if(sel.includes(idx)) { next = sel.filter(x=>x!==idx); }
    else if(sel.length < limit) { next = [...sel, idx]; }
    else { next = limit===1 ? [idx] : sel; } // for center (limit 1), replace selection
    onBTSelect(key, next);
  }

  function renderCol(options, correctArr, key) {
    const sel = btState[key]||[];
    const limit = colLimit[key];
    return options.map((opt,idx) => {
      const isSel=sel.includes(idx);
      const isCorr=showFeedback&&correctArr.includes(idx);
      const isWrong=showFeedback&&isSel&&!correctArr.includes(idx);
      const isDim=showFeedback&&!isCorr&&!isSel;
      const isDisabled=!submitted&&!isSel&&sel.length>=limit;
      return <BtOpt key={idx} label={opt} selected={!showFeedback&&isSel} correct={isCorr} wrong={isWrong} dim={isDim||isDisabled} onClick={isDisabled||submitted?null:()=>handleSelect(key,idx)} />;
    });
  }

  const leftSel=(btState.left||[]).length, centerSel=(btState.center||[]).length, rightSel=(btState.right||[]).length;

  function SlotBadge({ filled, total }) {
    return <div style={{ fontSize:12, color: filled===total?"#10b981":"#64748b", marginBottom:6, fontWeight:600 }}>{filled}/{total} selected</div>;
  }

  return (
    <div>
      {!submitted&&(
        <div className="instruction-text" style={{ marginBottom:14, background:"#f0f9ff", padding:"10px 14px", borderRadius:8, border:"1px solid #bae6fd" }}>
          🎯 <strong>Bow-Tie Format:</strong> Select <strong>2 nursing actions</strong> (left) → identify <strong>1 condition</strong> (center) → select <strong>2 parameters to monitor</strong> (right)
        </div>
      )}
      <div style={{ display:"flex", gap:8, marginBottom:20, alignItems:"flex-start" }}>
        <div style={col}>
          <div style={colHead}>⚕️ {q.leftLabel}</div>
          {!submitted&&<SlotBadge filled={leftSel} total={2} />}
          {renderCol(q.leftOptions, q.correctLeft, "left")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={{ ...col, maxWidth:180 }}>
          <div style={colHead}>🔍 {q.centerLabel}</div>
          {!submitted&&<SlotBadge filled={centerSel} total={1} />}
          {renderCol(q.centerOptions, q.correctCenter, "center")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, paddingTop:40, gap:4 }}>
          <div style={{ fontSize:20, color:"#0ea5e9" }}>⟶</div>
        </div>
        <div style={col}>
          <div style={colHead}>🎯 {q.rightLabel}</div>
          {!submitted&&<SlotBadge filled={rightSel} total={2} />}
          {renderCol(q.rightOptions, q.correctRight, "right")}
        </div>
      </div>
    </div>

}

function CaseStudyQuestion({ q, submitted, examMode, showQuestionCount, csAnswers, onCSAnswer }) {
  const showFeedback = submitted && !examMode;
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      {q.questions.map((sub,si) => {
        const sel = csAnswers[sub.qid]||[];
        return (
          <div key={sub.qid} style={{ background:"#f8fafc", borderRadius:12, padding:"16px 18px", border:"1px solid #e2e8f0" }}>
            {(!examMode || showQuestionCount) && <div style={{ fontWeight:700, fontSize:12, color:"#64748b", marginBottom:8, letterSpacing:0.5 }}>QUESTION {si+1} OF {q.questions.length}</div>}

            {sub.type==="sata"&&<div className="instruction-text" style={{ marginBottom:8 }}>Select all that apply</div>}
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {sub.options.map((opt,idx) => {
                let state="neutral";
                if(showFeedback){ if(sub.correct.includes(idx)) state="correct"; else if(sel.includes(idx)) state="wrong"; else state="dim"; }
                else if(sel.includes(idx)) state="selected";
                return <OptionBtn key={idx} letter={String.fromCharCode(65+idx)} text={opt} state={state} onClick={()=>{ if(submitted)return; if(sub.type==="mcq") onCSAnswer(sub.qid,[idx]); else { const cur=csAnswers[sub.qid]||[]; onCSAnswer(sub.qid,cur.includes(idx)?cur.filter(x=>x!==idx):[...cur,idx]); }}} />;

            </div>

          </div>
        );
      })}
    </div>
  );
}

const lbl={ fontSize:12, fontWeight:700, color:"#475569", letterSpacing:0.5, textTransform:"uppercase", display:"block", marginBottom:6 };

function getReviewItem(entry) {
  if(entry.interaction)return entry.interaction;
  const parentId = entry.sourceId || String(entry.id || '').split(':')[0];
  const source = [...QUESTION_BANK, ...REMEDIATION_BANK].find(item => item.id === parentId);
  if (!source) return null;
  const item = source.type === 'casestudy'
    ? source.questions.find(question => question.qid === String(entry.id || '').split(':').pop())
    : source;
  if (!item) return null;
  if (item.type === 'bowtie') {
    return {
      ...item,
      correctLeft: entry.correctAnswer?.left,
      correctCenter: entry.correctAnswer?.center,
      correctRight: entry.correctAnswer?.right,
      rationale: entry.rationale
    };
  }
  return {
    ...item,
    correct: Array.isArray(entry.correctAnswer) ? entry.correctAnswer : [entry.correctAnswer],
    rationale: entry.rationale
  };
}

function rationaleSections(item) {
  const rationale = item?.rationale;
  if (typeof rationale === 'string' && rationale.trim()) return [{ label:'Rationale', text:rationale }];
  if (!rationale || typeof rationale !== 'object') return [];
  if (rationale.condition || rationale.actions || rationale.outcomes) {
    return [
      { label:'Condition', text:rationale.condition },
      { label:'Actions', text:rationale.actions },
      { label:'Outcomes', text:rationale.outcomes },
      { label:'Other options', text:rationale.wrong }
    ].filter(section => typeof section.text === 'string' && section.text.trim());
  }
  return [
    { label:'Correct response', text:rationale.correct },
    ...(Array.isArray(rationale.wrong) ? rationale.wrong.map((text, index) => ({ label:`Other option ${index + 1}`, text })) : [])
  ].filter(section => typeof section.text === 'string' && section.text.trim());
}

function correctResponseText(item) {
  if (!item) return '';
  const joinOptions = (options, indexes) => (indexes || []).map(index => options?.[index]).filter(Boolean).join('; ');
  if (item.type === 'bowtie') {
    return [
      `Actions: ${joinOptions(item.leftOptions, item.correctLeft)}`,
      `Condition: ${joinOptions(item.centerOptions, item.correctCenter)}`,
      `Parameters: ${joinOptions(item.rightOptions, item.correctRight)}`
    ].filter(part => !part.endsWith(': ')).join(' · ');
  }
  return joinOptions(item.options, item.correct);
}

              <div style={{ padding:"10px 14px", background:"#f8fafc", borderRadius:8, borderLeft:`4px solid ${h.correct?"#10b981":"#ef4444"}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:11, color:"#64748b", marginBottom:2 }}>{h.blueprint} · {NGN_LABELS[h.type]}</div>
                  <div style={{ fontSize:13, color:"#334155" }}>Q{i+1}: {h.stem?h.stem.substring(0,65)+"...":"(NGN Case Study)"}</div>
                </div>
                <span style={{ color:h.correct?"#166534":"#b91c1c", fontWeight:700, fontSize:15, marginLeft:12 }}>{h.credit?`${h.credit.earned}/${h.credit.max} points`:h.correct?"✓":"✗"}</span>
              </div>
              {h.interaction&&<details style={{padding:14}}>
                <summary>View response, score, and rationale</summary>
                <p>Scoring: {h.credit.rule} · {h.scoringVersion}{h.caseLength>1?` · Case item ${h.caseIndex+1} of ${h.caseLength}`:""}</p>
                <div dangerouslySetInnerHTML={{__html:ExamUI.reviewHtml(h.interaction,h.selectedAnswer)}} />
                <p>{h.interaction.rationale}</p>
                <p style={{fontSize:11}}>Content version: {h.contentVersion}</p>
              </details>}
              {!h.interaction&&(isMock||isNCLEX) && sections.length>0 && <details style={{ padding:"8px 14px 12px", background:"#fff", border:"1px solid #e2e8f0", borderTop:0, borderRadius:"0 0 8px 8px", color:"#334155" }}>
                <summary style={{ cursor:"pointer", fontSize:12, fontWeight:700 }}>View rationale</summary>
                <div style={{ display:"grid", gap:10, marginTop:10 }}>
                  {answerText && <p style={{ margin:0, fontSize:13, lineHeight:1.6 }}><strong>Correct response:</strong> {answerText}</p>}
                  {sections.map((section,index)=><p key={index} style={{ margin:0, fontSize:13, lineHeight:1.6 }}>
                    <strong>{section.label}:</strong> {section.text}
                  </p>)}
                </div>
              </details>}
            </div>;
          })}
        </div>

        {profile.notes&&<div style={{ background:"#f8fafc", borderRadius:10, padding:"12px 16px", marginBottom:20, fontSize:13, color:"#475569", border:"1px solid #e2e8f0" }}><strong>Tutor Notes:</strong> {profile.notes}</div>}
        <button onClick={onRestart} style={{ width:"100%", padding:"13px", background:"#0f172a", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:"pointer" }}>New Session</button>
      </div>
    </div>
  );
}

// ─── QUIZ SCREEN ──────────────────────────────────────────────────────────────
function CATInteraction({ item, answer, tabId, onAnswer, onTab, readOnly }) {
  const host = useRef(null), engine = useRef(null);
  const callbacks = useRef({onAnswer,onTab});
  callbacks.current = {onAnswer,onTab};
  useEffect(() => {
    const key=item.case?.id || item.id;
    const exam=new ExamUI.Exam(host.current,{
      title:"Clinical record",items:[item],answer,
      tabState:tabId?{[key]:tabId}:{},embedded:true,showTimer:false,noFeedback:true,readOnly,
      onAnswer:value=>callbacks.current.onAnswer(JSON.parse(JSON.stringify(value))),
      onTab:value=>callbacks.current.onTab(value)
    });
    engine.current=exam;
    return ()=>{exam.destroy();engine.current=null};
  },[item.id]);
  useEffect(()=>{
    if(engine.current){engine.current.o.readOnly=readOnly;engine.current.show(0)}
  },[readOnly]);
  return <div ref={host} />;
}

function QuizScreen({ profile, onFinish, onPause }) {
  const isAssessment = profile.mode === "assessment";
  const isTimedFullMock = profile.mode === "mock";
  const persistenceEnabled = Boolean(profile.studentId);
  const activeBank = profile.mode==="remediation" ? REMEDIATION_BANK : QUESTION_BANK;
  const resumeCheckpoint = profile.resumeAttempt?.checkpoint || {};
  const resumeDraft = resumeCheckpoint.draft || {};
  const savedTimer = resumeCheckpoint.examTimer || {};
  const initialMultiplier = FULL_MOCK_TIME_MULTIPLIERS.includes(savedTimer.multiplier)
    ? savedTimer.multiplier
    : (FULL_MOCK_TIME_MULTIPLIERS.includes(profile.examTimerSettings?.multiplier) ? profile.examTimerSettings.multiplier : 1);
  const initialRemainingMs = (() => {
    const stored = Number(savedTimer.remainingMs);
    const remaining = Number.isFinite(stored) && stored >= 0
      ? stored
      : FULL_MOCK_DEFAULT_TIME_MS * initialMultiplier;
    const runningSince = Date.parse(savedTimer.runningSince || '');
    return Math.max(0, remaining - (Number.isFinite(runningSince) ? Math.max(0, Date.now() - runningSince) : 0));
  })();
  const resumeQuestion = profile.resumeAttempt?.currentItem || (resumeCheckpoint.currentItemId
    ? activeBank.find(item => item.id === resumeCheckpoint.currentItemId)
    : null);
  const [history, setHistory] = useState(() => restoreResponseHistory(profile.resumeAttempt?.responses));
  const [ability, setAbility] = useState(() => Number(profile.resumeAttempt?.ability_estimate ?? resumeCheckpoint.ability ?? 0.5));
  const [currentQ, setCurrentQ] = useState(() => resumeQuestion);
  const [selected, setSelected] = useState(resumeDraft.selected || []);
  const [btState, setBtState] = useState(resumeDraft.btState || {left:[],center:[],right:[]});
  const [csAnswers, setCsAnswers] = useState(resumeDraft.csAnswers || {});
  const [ngnAnswer,setNGNAnswer]=useState(resumeDraft.ngn?.answer);
  const [ngnTab,setNGNTab]=useState(resumeDraft.ngn?.tabId || null);
  const [submitted, setSubmitted] = useState(Boolean(resumeDraft.submitted));
  const [submissionResult, setSubmissionResult] = useState(null);
  const [timerRemainingMs,setTimerRemainingMs] = useState(initialRemainingMs);
  const [timerRunning,setTimerRunning] = useState(isTimedFullMock && !savedTimer.overTime && initialRemainingMs > 0);
  const [timerOverTime,setTimerOverTime] = useState(Boolean(savedTimer.overTime || (isTimedFullMock && initialRemainingMs <= 0 && profile.resumeAttempt)));
  const [timerVisible,setTimerVisible] = useState(savedTimer.showTimer ?? profile.examTimerSettings?.showTimer ?? true);
  const [questionCountVisible,setQuestionCountVisible] = useState(savedTimer.showQuestionCount ?? profile.examTimerSettings?.showQuestionCount ?? true);
  const timerDeadline = useRef(Date.now() + initialRemainingMs);
  const isNCLEX = profile.mode==="nclex";
  const isMock = profile.mode==="mock";
  const isCAT = isNCLEX || isMock || (isAssessment && (!profile.resumeAttempt || profile.resumeAttempt.checkpoint?.scoringModel==="in-house-ngn-v1"));
  const [attempt, setAttempt] = useState(profile.resumeAttempt ? {
    id:profile.resumeAttempt.id,
    sessionKey:profile.resumeAttempt.session_key,
    revision:profile.resumeAttempt.checkpoint_revision,
    targetQuestions:profile.resumeAttempt.target_questions,
    qaMode:profile.resumeAttempt.qa_mode,
    assessmentKey:profile.resumeAttempt.assessment_key || assessmentKeyForMode(profile.mode),
    checkpoint:profile.resumeAttempt.checkpoint,
    responses:profile.resumeAttempt.responses || []
  } : null);
  const [persistenceState, setPersistenceState] = useState({ status:persistenceEnabled ? "starting" : "idle", error:null });

  useEffect(() => {
    if (!isTimedFullMock || !timerRunning) return undefined;
    const updateTimer = () => {
      const remaining = Math.max(0, timerDeadline.current - Date.now());
      setTimerRemainingMs(remaining);
      if (remaining === 0) {
        setTimerRunning(false);
        setTimerOverTime(true);
      }
    };
    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);
  }, [isTimedFullMock, timerRunning]);

  function examTimerCheckpoint(paused = false) {
    if (!isTimedFullMock) return null;
    const remainingMs = timerOverTime ? 0 : timerRunning
      ? Math.max(0, timerDeadline.current - Date.now())
      : timerRemainingMs;
    const overTime = timerOverTime || remainingMs <= 0;
    return {
      multiplier: initialMultiplier,
      showTimer: timerVisible,
      showQuestionCount: questionCountVisible,
      remainingMs,
      runningSince: !paused && timerRunning && !overTime ? new Date().toISOString() : null,
      overTime
    };
  }

  useEffect(() => {
    if (!persistenceEnabled || attempt) return;
    let active = true;
    const startAttempt = async () => {
      try {
        const created = await NCLEX_ASSESSMENT_PERSISTENCE.createAttempt({
          supabase: assessmentDb(),
          sessionKey:profile.sessionKey,
          profile
        });
        if (active) {
          const restored = restoreResponseHistory(created.responses);
          setAttempt({
            id:created.id,
            sessionKey:created.session_key || profile.sessionKey,
            revision:created.checkpoint_revision,
            targetQuestions:created.target_questions,
            qaMode:created.qa_mode,
            assessmentKey:created.assessment_key || assessmentKeyForMode(profile.mode),
            checkpoint:created.checkpoint,
            responses:created.responses || []
          });
          setHistory(restored);
          setAbility(Number(created.ability_estimate ?? 0.5));
          setCurrentQ(created.currentItem || activeBank.find(item => item.id === created.currentItemId) || null);
          setNGNAnswer(created.checkpoint?.draft?.ngn?.answer);
          setNGNTab(created.checkpoint?.draft?.ngn?.tabId || null);
          setPersistenceState({ status:"ready", error:null });
        }
      } catch (error) {
        if (active) setPersistenceState({ status:"failed", error:error.message || "Unable to start the readiness assessment." });
      }
    };
    startAttempt();
    return () => { active = false; };
  }, [persistenceEnabled, attempt, profile.sessionKey]);

  const q = currentQ;
  const sharedInteraction = Boolean(q?.qid);
  if(!q) return <div className="assessment-interface" style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:"#0f172a", color:"#fff", padding:24 }}>
    <div>{persistenceState.status==="failed" ? persistenceState.error : "Preparing your assessment…"}</div>
  </div>;
  function finishSession(records, result, abilityEstimate=ability, completedAttemptId=attempt?.id) {
    const timerState = examTimerCheckpoint();
    onFinish(records, result, abilityEstimate, completedAttemptId, Boolean(timerState?.overTime));
  }

  const catColor = CAT_COLORS[q.blueprint]||"#6366f1";
  const diffStyle = DIFF_COLORS[q.difficulty] || DIFF_COLORS[2];

  function isAnswered() {
    if(sharedInteraction) {
      return ExamUI.isAnswered({...q,scoringVersion:"ngn-v1"},ngnAnswer ?? NGNScoring.emptyAnswer(q));
    }
    if(q.type==="mcq") return selected.length===1;
    if(q.type==="sata") return selected.length>0;
    if(q.type==="bowtie") return btState.left.length===2&&btState.center.length===1&&btState.right.length===2;
    if(q.type==="casestudy") return q.questions.every(sq=>(csAnswers[sq.qid]||[]).length>0);
    return false;
  }

  function withFeedback(question, outcomes) {
    const feedbackFor = id => outcomes?.find(outcome => outcome.item_id === id);
    if (question.type === "casestudy") {
      return {
        ...question,
        questions: question.questions.map(sub => {
          const outcome = feedbackFor(`${question.id}:${sub.qid}`);
          return outcome?.correct_answer === undefined ? sub : {
            ...sub,
            correct: Array.isArray(outcome.correct_answer) ? outcome.correct_answer : [outcome.correct_answer],
            rationale: outcome.rationale
          };
        })
      };
    }
    const outcome = feedbackFor(question.id);
    if (!outcome || outcome.correct_answer === undefined) return question;
    if (question.type === "bowtie") {
      return {
        ...question,
        correctLeft: outcome.correct_answer.left,
        correctCenter: outcome.correct_answer.center,
        correctRight: outcome.correct_answer.right,
        rationale: outcome.rationale
      };
    }
    return {
      ...question,
      correct: Array.isArray(outcome.correct_answer) ? outcome.correct_answer : [outcome.correct_answer],
      rationale: outcome.rationale
    };
  }

  async function handleSubmit() {
    if(!isAnswered() || !attempt || persistenceState.status==="saving") return;
    setPersistenceState({ status:"saving", error:null });
    try {
      const result = await NCLEX_ASSESSMENT_PERSISTENCE.recordResponse({
        supabase:assessmentDb(),
        attemptId:attempt.id,
        expectedRevision:attempt.revision,
        itemId:q.id,
        answer:sharedInteraction ? ngnAnswer : q.type==="mcq" ? selected[0] : q.type==="sata" ? selected : q.type==="bowtie" ? btState : undefined,
        caseAnswers:q.type==="casestudy" ? csAnswers : undefined,
        examTimer:examTimerCheckpoint()
      });
      const nextCheckpoint = {
        ...(attempt.checkpoint || {}),
        currentItemId:result.nextItemId,
        ability:result.abilityEstimate ?? attempt.checkpoint?.ability,
        answeredItemIds:(result.responses || []).map(response => response.item_id),
        examTimer:examTimerCheckpoint(),
        draft:{ selected:[], btState:{left:[],center:[],right:[]}, csAnswers:{}, submitted:false }
      };
      setAttempt(current => current ? {
        ...current,
        revision:result.checkpointRevision,
        checkpoint:nextCheckpoint,
        responses:result.responses || []
      } : current);
      setHistory(restoreResponseHistory(result.responses));
      if (result.abilityEstimate !== null) setAbility(Number(result.abilityEstimate));
      setSubmissionResult(result);
      setSubmitted(true);
      setPersistenceState({ status:"ready", error:null });
    } catch (error) {
      setPersistenceState({ status:"failed", error:error.message || "Unable to save this response." });
    }
  }

  async function handleSaveExit() {
    if (!persistenceEnabled || !attempt || persistenceState.status==="saving") return;
    setPersistenceState({ status:"saving", error:null });
    const timerSnapshot = examTimerCheckpoint(true);
    if (timerSnapshot) {
      setTimerRemainingMs(timerSnapshot.remainingMs);
      setTimerRunning(false);
      setTimerOverTime(timerSnapshot.overTime);
    }
    try {
      const checkpoint = {
        ...(attempt.checkpoint || {}),
        currentItemId:attempt.checkpoint?.currentItemId || q.id,
        ...readinessCheckpoint({
          selected:submitted ? [] : selected,
          btState:submitted ? {left:[],center:[],right:[]} : btState,
          csAnswers:submitted ? {} : csAnswers,
          examTimer:timerSnapshot,
          schemaVersion:attempt.checkpoint?.schemaVersion,
          assessmentVersion:attempt.checkpoint?.assessmentVersion
        })
      };
      if(sharedInteraction&&!submitted)checkpoint.draft.ngn={answer:ngnAnswer ?? NGNScoring.emptyAnswer(q),tabId:ngnTab};
      const revision = await NCLEX_ASSESSMENT_PERSISTENCE.checkpointAttempt({
        supabase: assessmentDb(),
        attemptId: attempt.id,
        expectedRevision: attempt.revision,
        checkpoint
      });
      onPause({...attempt, currentItem:submitted?submissionResult?.nextItem:sharedInteraction?q:null, assessment_key:attempt.assessmentKey, session_key:attempt.sessionKey, checkpoint, checkpoint_revision:revision, total_questions:history.length, updated_at:new Date().toISOString()});
    } catch (error) {
      if (timerSnapshot && !timerSnapshot.overTime) {
        timerDeadline.current = Date.now() + timerSnapshot.remainingMs;
        setTimerRunning(true);
      }
      setPersistenceState({ status:"failed", error:error.message || "Unable to save your progress." });
    }
  }

  function handleNext() {
    if (!submitted || !submissionResult) return;
    if (submissionResult.completed) {
      const completedHistory = restoreResponseHistory(submissionResult.responses);
      setHistory(completedHistory);
      finishSession(
        completedHistory,
        submissionResult.result,
        submissionResult.abilityEstimate ?? ability,
        attempt?.id
      );
      return;
    }
    const next = submissionResult.nextItem || activeBank.find(item => item.id === submissionResult.nextItemId);
    if (!next) {
      setPersistenceState({ status:"failed", error:"The server-selected next item is missing from the published question bank." });
      return;
    }
    setCurrentQ(next);
    setSelected([]);
    setBtState({left:[],center:[],right:[]});
    setCsAnswers({});
    setNGNAnswer(undefined);
    setNGNTab(null);
    setSubmitted(false);
    setSubmissionResult(null);
  }

  const caseItemCount = q.type==="casestudy" ? q.questions.length : 1;
  const qNum = history.length + 1 - (submitted ? caseItemCount : 0);
  const correctSoFar = history.filter(h=>h.correct).length;
  const progressPct = isNCLEX ? Math.min(100,(qNum/MAX_Q)*100) : isMock ? Math.min(100,(qNum/FULL_MOCK_MAX_Q)*100) : isAssessment ? Math.min(100,(qNum/FULL_MOCK_MIN_Q)*100) : (qNum/profile.qCount)*100;
  const feedbackQuestion = withFeedback(q, submissionResult?.outcomes);

  return (
    <div className="assessment-interface" style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f172a,#1e293b)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"32px 16px" }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"30px 34px", maxWidth:860, width:"100%", boxShadow:"0 25px 60px rgba(0,0,0,0.4)" }}>

        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18, gap:12, flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:18, fontWeight:700, color:"#0f172a", letterSpacing:2 }}>NCLEX-RN</div>
            <div className="progress-text" style={{ letterSpacing:1, textTransform:"uppercase" }}>{profile.name} · {isNCLEX?"Core-Safe CAT":isMock?"SWM-CAT":isAssessment?"Readiness Assessment":"Practice"}</div>
          </div>
          {(!isTimedFullMock || questionCountVisible) && <div style={{ flex:1, maxWidth:260 }}>
            <div className="progress-text" style={{ marginBottom:5 }}>
              {isNCLEX ? `Question ${qNum} · CAT range ${MIN_Q}–${MAX_Q}` : isMock ? `${caseItemCount>1?"Questions":"Question"} ${qNum}${caseItemCount>1?`–${qNum+caseItemCount-1}`:""} · mock CAT range ${FULL_MOCK_MIN_Q}–${FULL_MOCK_MAX_Q}` : isAssessment ? `${caseItemCount>1?"Questions":"Question"} ${qNum}${caseItemCount>1?`–${qNum+caseItemCount-1}`:""} of ${profile.qCount} · readiness assessment` : `Question ${qNum} of ${profile.qCount}` }
            </div>
            <div style={{ height:5, background:"#e2e8f0", borderRadius:99 }}>
              <div style={{ height:"100%", width:`${progressPct}%`, background: isNCLEX?"#8b5cf6":"#0ea5e9", borderRadius:99, transition:"width 0.4s" }} />
            </div>
          </div>}
          {!isTimedFullMock && <div style={{ fontSize:12, fontWeight:600, color:"#475569", background:"#f8fafc", padding:"5px 12px", borderRadius:99, border:"1px solid #e2e8f0" }}>
            {isNCLEX ? `Q${qNum}` : isAssessment ? `Question ${qNum} of ${profile.qCount}` : `${correctSoFar}/${history.length} correct`}
          </div>}
          {isTimedFullMock && <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-end", gap:8, flexWrap:"wrap" }}>
            {timerVisible && !timerOverTime && <div role="timer" aria-label={`Time remaining ${formatExamTime(timerRemainingMs)}`}
              style={{ fontVariantNumeric:"tabular-nums", fontSize:14, fontWeight:700, color:timerRemainingMs<10*60*1000?"#b91c1c":"#334155", background:"#f8fafc", padding:"7px 10px", borderRadius:8, border:"1px solid #e2e8f0" }}>
              {formatExamTime(timerRemainingMs)}
            </div>}
            {timerVisible && timerOverTime && <div role="status" style={{ fontSize:12, fontWeight:700, color:"#9a3412", background:"#fff7ed", padding:"7px 10px", borderRadius:8, border:"1px solid #fdba74" }}>Over allotted time</div>}
            <button className="exam-display-toggle" type="button" onClick={()=>setTimerVisible(visible=>!visible)} aria-pressed={timerVisible}
              style={{ padding:"7px 9px", border:"1px solid #cbd5e1", borderRadius:8, background:"#fff", color:"#475569", fontSize:11, fontWeight:700, cursor:"pointer" }}>
              {timerVisible?"Hide timer":"Show timer"}
            </button>
            <button className="exam-display-toggle" type="button" onClick={()=>setQuestionCountVisible(visible=>!visible)} aria-pressed={questionCountVisible}
              style={{ padding:"7px 9px", border:"1px solid #cbd5e1", borderRadius:8, background:"#fff", color:"#475569", fontSize:11, fontWeight:700, cursor:"pointer" }}>
              {questionCountVisible?"Hide count":"Show count"}
            </button>
          </div>}
        </div>

        {/* Tags */}
        <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:14 }}>
          <Tag children={q.blueprint} color={catColor} bg={catColor+"18"} border={catColor+"44"} />
          <Tag children={DIFF_LABELS[q.difficulty]} color={diffStyle.text} bg={diffStyle.bg} />
          <Tag children={NGN_LABELS[q.type]} color="#6366f1" bg="#eef2ff" border="#c7d2fe" />
          <Tag children={q.category} />
        </div>

        {/* Case intro */}
        {q.caseIntro&&(
          <div className="clinical-scenario" style={{ background:"#f0f9ff", border:"1px solid #bae6fd", borderRadius:10, padding:"14px 16px", marginBottom:16 }}>
            <strong style={{ fontStyle:"normal", color:"#0369a1" }}>Clinical Scenario: </strong>{q.caseIntro}
          </div>
        )}

        {/* Stem */}
        {!sharedInteraction&&<div className="question-stem" style={{ marginBottom:18 }}>{q.stem}</div>}

        {/* Question */}
        {sharedInteraction&&<CATInteraction key={q.id} item={q} answer={ngnAnswer} tabId={ngnTab} onAnswer={setNGNAnswer} onTab={setNGNTab} readOnly={submitted||persistenceState.status==="saving"} />}
        {!sharedInteraction&&q.type==="mcq"&&<MCQQuestion q={feedbackQuestion} submitted={submitted} examMode={isCAT} selected={selected} onSelect={idx=>!submitted&&setSelected([idx])} />}
        {!sharedInteraction&&q.type==="sata"&&<SATAQuestion q={feedbackQuestion} submitted={submitted} examMode={isCAT} selected={selected} onSelect={idx=>!submitted&&setSelected(s=>s.includes(idx)?s.filter(x=>x!==idx):[...s,idx])} />}
        {!sharedInteraction&&q.type==="bowtie"&&<BowTieQuestion q={feedbackQuestion} submitted={submitted} examMode={isCAT} btState={btState} onBTSelect={(col,arr)=>setBtState(s=>({...s,[col]:arr}))} />}
        {q.type==="casestudy"&&<CaseStudyQuestion q={feedbackQuestion} submitted={submitted} examMode={isCAT} showQuestionCount={questionCountVisible} csAnswers={csAnswers} onCSAnswer={(qid,val)=>setCsAnswers(s=>({...s,[qid]:val}))} />}

        {/* Rationale */}
        {submitted&&isCAT&&<div role="status" style={{ marginBottom:18, color:"#475569", fontSize:13 }}>Response recorded. Item feedback will be available after the exam.</div>}
        {submitted&&!isCAT&&q.type!=="casestudy"&&(
          <div style={{ background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:12, padding:"18px 20px", marginBottom:20 }}>
            <div style={{ fontWeight:700, fontSize:13, color:"#0f172a", marginBottom:10, letterSpacing:0.5 }}>📋 RATIONALE</div>
            {feedbackQuestion.type==="bowtie" ? (
              <>
                <div style={{ background:"#d1fae5", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>Condition:</strong> {feedbackQuestion.rationale?.condition}</div>
                <div style={{ background:"#dbeafe", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#1e40af", lineHeight:1.6 }}><strong>Actions:</strong> {feedbackQuestion.rationale?.actions}</div>
                <div style={{ background:"#f0fdf4", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>Outcomes:</strong> {feedbackQuestion.rationale?.outcomes}</div>
                <div style={{ background:"#fef2f2", padding:"10px 14px", borderRadius:8, fontSize:13, color:"#991b1b", lineHeight:1.6 }}><strong>Incorrect options:</strong> {feedbackQuestion.rationale?.wrong}</div>
              </>
            ) : (
              <>
                <div style={{ background:"#d1fae5", padding:"10px 14px", borderRadius:8, marginBottom:8, fontSize:13, color:"#065f46", lineHeight:1.6 }}><strong>✓ Correct:</strong> {feedbackQuestion.rationale?.correct}</div>
                {q.options.map((_,idx)=>{ if(feedbackQuestion.correct?.includes(idx)) return null; const wrongItems=q.options.map((_,i)=>i).filter(i=>!feedbackQuestion.correct?.includes(i)); const wi=wrongItems.indexOf(idx); return wi>=0&&feedbackQuestion.rationale?.wrong?.[wi]?(<div key={idx} style={{ padding:"8px 12px", background:"#fff", borderRadius:8, border:"1px solid #f1f5f9", fontSize:12, color:"#475569", lineHeight:1.6, marginBottom:5 }}><strong>✗ {String.fromCharCode(65+idx)}:</strong> {feedbackQuestion.rationale.wrong[wi]}</div>):null; })}
              </>
            )}
          </div>
        )}

        {/* Actions */}
        <div style={{ display:"flex", justifyContent:"flex-end", gap:10 }}>
          {persistenceEnabled && !submissionResult?.completed && <Btn onClick={handleSaveExit} disabled={!attempt || persistenceState.status==="saving"} variant="outline" small>
            {persistenceState.status==="saving" ? "Saving…" : "Save & Exit"}
          </Btn>}
          {!submitted ? (
            <Btn onClick={handleSubmit} disabled={!isAnswered() || (persistenceEnabled && (!attempt || persistenceState.status==="saving"))}>Submit Answer</Btn>
          ) : (
            <Btn onClick={handleNext} disabled={persistenceEnabled && persistenceState.status==="saving"}>
              {submissionResult?.completed || qNum>=profile.qCount ? "View Results →" : isNCLEX ? "Continue Exam →" : "Next Question →"}
            </Btn>
          )}
        </div>
        {persistenceEnabled && persistenceState.status==="failed" && (
          <div style={{ marginTop:10, color:"#b91c1c", fontSize:13, textAlign:"right" }}>
            {persistenceState.error} <button onClick={handleSaveExit} style={{ border:0, background:"transparent", color:"#991b1b", textDecoration:"underline", fontWeight:700, cursor:"pointer" }}>Retry</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("profile");
  const [assessmentProfile, setAssessmentProfile] = useState(null);
  const [assessmentLoading, setAssessmentLoading] = useState(true);
  const [assessmentLoadError, setAssessmentLoadError] = useState(null);
  useEffect(() => {
    let active = true;
    async function loadAssessmentHistory() {
      if (window.NCLEX_ASSESSMENT_PERSISTENCE?.CLIENT_PROTOCOL !== "ngn-cat-v1" ||
          window.ExamUI?.CLIENT_PROTOCOL !== "ngn-cat-v1" || window.NGNScoring?.VERSION !== "ngn-v1") {
        throw new Error("The updated CAT modules could not load. Refresh the portal; your saved progress is unchanged.");
      }
      if (!window.supabase || !ASSESSMENT_PERSONALIZATION) throw new Error("The assessment service is unavailable. Please refresh or contact Madison.");
      const db = supabase.createClient('https://pmjwwktwlsqpetwfvolb.supabase.co','sb_publishable_MDgerX5UJd44TlYgMOalDw_DqNMvxfT');
      const { data: { session }, error: sessionError } = await db.auth.getSession();
      if (sessionError) throw sessionError;
      if (!session) { location.replace('student-login.html'); return; }
      const { data: student, error: studentError } = await db.from('students').select('id,name,portal_stage').eq('auth_user_id', session.user.id).maybeSingle();
      if (studentError) throw studentError;
      if (!student) {
        if (active) {
          setAssessmentLoadError("No student profile is linked to this account. Contact Madison to finish assigning your Success Center access.");
          setAssessmentLoading(false);
        }
        return;
      }
      if (ASSESSMENT_ONLY && student.portal_stage !== 'assessment') { location.replace('student-dashboard.html'); return; }
      const { data: assessments, error: assessmentError } = await db.from('external_assessments').select('platform,taken_at,created_at,category_scores').eq('student_id', student.id).order('taken_at',{ascending:false});
      if (assessmentError) throw assessmentError;
      const result = ASSESSMENT_PERSONALIZATION.buildProfile(assessments || []);
      const modes = ASSESSMENT_ONLY ? ['assessment'] : ['practice', 'nclex', 'mock', 'remediation'];
      const activeAttempts = {};
      await Promise.all(modes.map(async mode => {
        activeAttempts[assessmentKeyForMode(mode)] = await NCLEX_ASSESSMENT_PERSISTENCE.resumeAttempt({
          supabase:db,
          assessmentKey:assessmentKeyForMode(mode)
        });
      }));
      if (active) {
        setAssessmentProfile({
          ...result,
          studentId:student.id,
          studentName: student.name,
          activeAttempt: activeAttempts['readiness-assessment'] || null,
          activeAttempts
        });
        setAssessmentLoading(false);
      }
    }
    loadAssessmentHistory().catch(error => {
      if (active) {
        setAssessmentLoadError(error.message || "Unable to load your assessment profile.");
        setAssessmentLoading(false);
      }
    });
    return () => { active = false; };
  }, []);
  const [profile, setProfile] = useState(null);
  const [finalHistory, setFinalHistory] = useState([]);
  const [catResult, setCatResult] = useState(null);
  const [finalAbility, setFinalAbility] = useState(0.5);
  const [finalAttemptId, setFinalAttemptId] = useState(null);
  const [finalOverTime, setFinalOverTime] = useState(false);

  if(screen==="profile") return <ProfileScreen assessmentProfile={assessmentProfile} assessmentLoading={assessmentLoading} assessmentLoadError={assessmentLoadError}
    onAbandonAttempt={async attempt => {
      await NCLEX_ASSESSMENT_PERSISTENCE.abandonAttempt({ supabase:assessmentDb(), attemptId:attempt.id });
      setAssessmentProfile(current => {
        if (!current) return current;
        const activeAttempts = {...(current.activeAttempts || {})};
        delete activeAttempts[attempt.assessment_key];
        return {...current, activeAttempt:activeAttempts['readiness-assessment'] || null, activeAttempts};
      });
    }}
    onStart={p=>{ const sessionKey=p.resumeAttempt?.session_key || (globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : `assessment-${Date.now()}-${Math.random().toString(36).slice(2)}`); setProfile({...p,sessionKey}); setScreen("quiz"); }} />;
  if(screen==="quiz") return <QuizScreen profile={profile} onPause={attempt=>{
    setAssessmentProfile(current => {
      if (!current) return current;
      const activeAttempts = {...(current.activeAttempts || {}), [attempt.assessment_key]:attempt};
      return {...current, activeAttempt:activeAttempts['readiness-assessment'] || null, activeAttempts};
    });
    setProfile(null);
    setScreen("profile");
  }} onFinish={(h,r,a,attemptId,overTime)=>{
    setFinalHistory(h);
    setCatResult(r);
    setFinalAbility(a);
    setFinalOverTime(Boolean(overTime));
    setFinalAttemptId(attemptId);
    setScreen("results");
  }} />;
  if(screen==="results") return <ResultsScreen profile={profile} history={finalHistory} ability={finalAbility} catResult={catResult} attemptId={finalAttemptId} overTime={finalOverTime} onRestart={()=>{ setProfile(null); setFinalHistory([]); setCatResult(null); setFinalAbility(0.5); setFinalAttemptId(null); setFinalOverTime(false); setScreen("profile"); }} />;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
