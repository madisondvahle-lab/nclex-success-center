<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── PIN-only body ── */
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(251,146,60,0.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 20% 80%, rgba(244,63,94,0.10) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* ── PIN card ── */
    .pin-card {
      background: #fff; border-radius: 24px; padding: 44px 40px 40px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5); position: relative; z-index: 1;
    }
    .pin-avatar {
      width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 20px;
      background: linear-gradient(135deg,#fce7f3,#fbcfe8);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #9d174d; letter-spacing: -1px;
    }
    .pin-title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .pin-sub { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.5; }
    .pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .pin-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #e2e8f0; transition: background 0.15s ease;
    }
    .pin-dot.filled { background: #ea580c; }
    .pin-dot.error  { background: #ef4444; }
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .pin-key {
      padding: 16px; border-radius: 14px; border: 1.5px solid #e2e8f0;
      background: #f8fafc; font-size: 18px; font-weight: 700; color: #0f172a;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.12s ease;
    }
    .pin-key:hover  { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
    .pin-key:active { transform: scale(0.95); background: #ffedd5; }
    .pin-key.del    { color: #94a3b8; font-size: 16px; }
    .pin-error { font-size: 13px; color: #ef4444; font-weight: 600; min-height: 20px; margin-top: 4px; }
    .pin-hint { font-size: 12px; color: #94a3b8; margin-top: 16px; }

    /* ── Hub styles (only matter after unlock) ── */
    body.unlocked {
      background: #f0f2f8;
      display: block;
      padding: 0;
    }
    body.unlocked::before { display: none; }

    .site-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 52px 24px 48px; text-align: center; position: relative; overflow: hidden;
    }
    .site-header::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 70% 40%, rgba(251,146,60,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(244,63,94,0.10) 0%, transparent 55%);
      pointer-events: none;
    }
    .header-badge {
      display: inline-block; padding: 4px 14px; border-radius: 99px;
      background: rgba(251,146,60,0.12); border: 1px solid rgba(251,146,60,0.35);
      font-size: 11px; font-weight: 700; color: #fb923c; letter-spacing: 1.4px;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .header-greeting { font-size: clamp(26px,5vw,40px); font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px; }
    .header-sub { font-size: 15px; color: #94a3b8; max-width: 440px; margin: 0 auto 10px; line-height: 1.65; }
    .header-byline { font-size: 13px; color: #475569; font-weight: 500; }

    .main { max-width: 860px; margin: 0 auto; padding: 44px 20px 80px; }
    .section-label { font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 16px; }

    .card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 4px 24px rgba(15,23,42,0.09); margin-bottom: 16px; }
    .card-accent-orange { height: 5px; background: linear-gradient(90deg, #ea580c, #fb923c); }
    .card-accent-sky    { height: 5px; background: linear-gradient(90deg, #0ea5e9, #38bdf8); }
    .card-accent-slate  { height: 5px; background: linear-gradient(90deg, #94a3b8, #cbd5e1); }
    .card-accent-red    { height: 5px; background: linear-gradient(90deg, #ef4444, #f87171); }
    .card-accent-blue   { height: 5px; background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .card-accent-teal   { height: 5px; background: linear-gradient(90deg, #0d9488, #2dd4bf); }
    .card-accent-green  { height: 5px; background: linear-gradient(90deg, #10b981, #34d399); }
    .card-accent-purple { height: 5px; background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .card-body { padding: 28px 34px 32px; }

    .module-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
    .module-title-group { display: flex; align-items: center; gap: 14px; }
    .module-emoji-wrap { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .emoji-orange { background: linear-gradient(135deg,#fff7ed,#ffedd5); border: 1px solid #fdba74; }

    .emoji-blue   { background: linear-gradient(135deg,#eff6ff,#dbeafe); border: 1px solid #93c5fd; }

    .emoji-green  { background: linear-gradient(135deg,#f0fdf4,#dcfce7); border: 1px solid #86efac; }
    .emoji-purple { background: linear-gradient(135deg,#faf5ff,#ede9fe); border: 1px solid #c4b5fd; }
    .module-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px; }
    .eyebrow-orange { color: #ea580c; }

    .eyebrow-red    { color: #ef4444; }
    .eyebrow-blue   { color: #3b82f6; }
    .eyebrow-teal   { color: #0d9488; }

    .badge-sky    { background: #f0f9ff; border: 1px solid #7dd3fc; color: #0369a1; }
    .badge-yellow { background: #fef9c3; border: 1px solid #fde047; color: #854d0e; }
    .badge-red    { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; }
    .badge-blue   { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
    .badge-teal   { background: #f0fdfa; border: 1px solid #5eead4; color: #134e4a; }

    .module-desc { font-size: 14px; color: #475569; line-height: 1.7; margin-bottom: 20px; font-weight: 400; }

    .flow-label { font-size: 10px; font-weight: 700; color: #94a3b8; letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 10px; }
    .flow-steps { display: flex; align-items: stretch; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
    .flow-step { flex: 1; min-width: 110px; background: #f8fafc; border: 1px solid #e8ecf2; border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; }
    .flow-step.active-orange { background: #fff7ed; border-color: #fdba74; }
    .flow-step-icon { font-size: 15px; }
    .flow-step-text { font-size: 11px; font-weight: 600; color: #1e293b; line-height: 1.4; }

    .module-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .meta-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 99px; background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 11px; font-weight: 600; color: #475569; }

    .info-box { background: #fff7ed; border: 1px solid #fdba74; border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; display: flex; gap: 12px; align-items: flex-start; }
    .info-icon { font-size: 20px; flex-shrink: 0; }
    .info-text { font-size: 13px; color: #7c2d12; line-height: 1.65; font-weight: 500; }

    .start-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 28px; border: none; border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; letter-spacing: 0.2px; transition: all 0.18s ease; width: 100%; }
    .btn-orange { background: linear-gradient(135deg,#c2410c,#ea580c); color:#fff; box-shadow:0 4px 14px rgba(234,88,12,0.30); }
    .btn-orange:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-sky    { background: linear-gradient(135deg,#0369a1,#0ea5e9); color:#fff; box-shadow:0 4px 14px rgba(14,165,233,0.28); }
    .btn-sky:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-red    { background: linear-gradient(135deg,#dc2626,#ef4444); color:#fff; box-shadow:0 4px 14px rgba(220,38,38,0.28); }
    .btn-red:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-blue   { background: linear-gradient(135deg,#1d4ed8,#3b82f6); color:#fff; box-shadow:0 4px 14px rgba(59,130,246,0.28); }
    .btn-blue:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-teal   { background: linear-gradient(135deg,#0f766e,#0d9488); color:#fff; box-shadow:0 4px 14px rgba(13,148,136,0.28); }
    .btn-teal:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-green  { background: linear-gradient(135deg,#059669,#10b981); color:#fff; box-shadow:0 4px 14px rgba(16,185,129,0.30); }
    .btn-green:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-purple { background: linear-gradient(135deg,#6d28d9,#8b5cf6); color:#fff; box-shadow:0 4px 14px rgba(139,92,246,0.28); }
    .btn-purple:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .btn-outline { background:#f8fafc; color:#475569; border:1.5px solid #cbd5e1; }
    .btn-outline:hover { background:#f1f5f9; border-color:#94a3b8; }

    .coming-soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 11px; }
    .coming-card { background:#fff; border-radius:16px; padding:18px 16px; border:1px solid #e8ecf2; opacity:0.68; cursor:default; box-shadow:0 1px 6px rgba(15,23,42,0.04); position:relative; overflow:hidden; }
    .coming-card::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(241,245,249,0.5) 10px,rgba(241,245,249,0.5) 11px); pointer-events:none; }
    .coming-card-icon { font-size:22px; margin-bottom:7px; }
    .coming-card-num { font-size:10px; font-weight:700; color:#94a3b8; letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
    .coming-card-name { font-size:13px; font-weight:700; color:#64748b; margin-bottom:7px; line-height:1.3; }
    .coming-soon-badge { display:inline-block; padding:3px 9px; border-radius:99px; background:#f1f5f9; border:1px solid #e2e8f0; font-size:10px; font-weight:700; color:#94a3b8; letter-spacing:0.8px; text-transform:uppercase; }

    .site-footer { text-align:center; padding:28px 24px; font-size:13px; color:#94a3b8; border-top:1px solid #e8ecf2; background:#fff; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .fade-up   { animation: fadeUp 0.38s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-up-2 { animation: fadeUp 0.38s 0.08s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-up-3 { animation: fadeUp 0.38s 0.16s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-up-4 { animation: fadeUp 0.38s 0.24s cubic-bezier(0.22,1,0.36,1) both; }

    @media (max-width: 600px) {
      .card-body { padding: 20px 16px 24px; }
      .flow-steps { flex-direction: column; }
      .flow-arrow { display: none; }
    }
  </style>
</head>

  function renderAssignedModules(accessMap, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const enabled = MODULES_CATALOG.filter(m => accessMap[m.key]);
    if (!enabled.length) {
      container.innerHTML = '<p style="color:#94a3b8;font-size:14px;padding:20px 0;">No modules assigned yet — check back after your session with Madison.</p>';
      return;
    }
    const sorted = [...enabled].sort((a,b) => a.num - b.num);
    const current = sorted[sorted.length - 1];
    const completed = sorted.slice(0, -1);
    const accentColors = { m1:'green', m2:'purple', m3:'sky', m4:'red', m5:'blue', m6:'teal' };
    const colorMap = {
      green:  { emoji:'emoji-green',  eyebrow:'eyebrow-green',  btn:'btn-green',  badge:'badge-green' },
      purple: { emoji:'emoji-purple', eyebrow:'eyebrow-purple', btn:'btn-purple', badge:'badge-purple' },
      sky:    { emoji:'emoji-sky',    eyebrow:'eyebrow-sky',    btn:'btn-sky',    badge:'badge-sky' },
      red:    { emoji:'emoji-red',    eyebrow:'eyebrow-red',    btn:'btn-red',    badge:'badge-red' },
      blue:   { emoji:'emoji-blue',   eyebrow:'eyebrow-blue',   btn:'btn-blue',   badge:'badge-blue' },
      teal:   { emoji:'emoji-teal',   eyebrow:'eyebrow-teal',   btn:'btn-teal',   badge:'badge-teal' },
    };
    let html = '';
    const c = current;
    const cc = colorMap[accentColors[c.key]] || colorMap['sky'];
    html += `
      <div class="section-label fade-up" style="margin-bottom:16px;">📌 This Week's Assignment</div>
      <div class="card fade-up" style="margin-bottom:16px;">
        <div class="card-accent-${accentColors[c.key] || 'sky'}"></div>
        <div class="card-body">
          <div class="module-header">
            <div class="module-title-group">
              <div class="module-emoji-wrap ${cc.emoji}">${c.emoji}</div>
              <div>
                <div class="module-eyebrow ${cc.eyebrow}">Module ${c.num}</div>
                <div class="module-name">${c.name}</div>
              </div>
            </div>
            <span class="badge badge-yellow">📌 Assigned This Week</span>
          </div>
          <p class="module-desc">${c.desc}</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            ${c.guideUrl ? `<a href="${c.guideUrl}" class="start-btn ${cc.btn}" style="flex:1;">📖 Study Guide →</a>` : ''}
            ${c.quizUrl  ? `<a href="${c.quizUrl}?start=1" class="start-btn ${cc.btn}" style="flex:1;">🎯 Start Quiz →</a>` : ''}
          </div>
        </div>
      </div>`;
    if (completed.length) {
      html += `<div class="section-label fade-up-2" style="margin-top:28px;margin-bottom:16px;">✅ Completed — Review Anytime</div>`;
      completed.reverse().forEach(m => {
        const mc = colorMap[accentColors[m.key]] || colorMap['green'];
        html += `
          <div class="card fade-up-2" style="margin-bottom:12px;">
            <div class="card-accent-${accentColors[m.key] || 'green'}"></div>
            <div class="card-body" style="padding-top:20px;padding-bottom:20px;">
              <div class="module-header">
                <div class="module-title-group">
                  <div class="module-emoji-wrap ${mc.emoji}">${m.emoji}</div>
                  <div>
                    <div class="module-eyebrow ${mc.eyebrow}">Module ${m.num}</div>
                    <div class="module-name">${m.name}</div>
                  </div>
                </div>
                <span class="badge ${mc.badge}">✅ Completed</span>
              </div>
              <p class="module-desc" style="margin-bottom:14px;">${m.desc}</p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;">
                ${m.guideUrl ? `<a href="${m.guideUrl}" class="start-btn btn-outline" style="font-size:14px;flex:1;">📖 Review Guide →</a>` : ''}
                ${m.quizUrl  ? `<a href="${m.quizUrl}?start=1" class="start-btn btn-outline" style="font-size:14px;flex:1;">🎯 Retake Quiz →</a>` : ''}
              </div>
            </div>
          </div>`;
      });
    }
    container.innerHTML = html;
  }

  function renderCurriculumGrid(accessMap, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const html = MODULES_CATALOG.map(m => {
      const enabled = !!accessMap[m.key];
      const unavailable = !m.available;
      if (enabled) {
        const href = [m.guideUrl, m.quizUrl].filter(Boolean)[0] || '#';
        return `<a href="${href}" style="text-decoration:none;">
          <div class="coming-card" style="opacity:1;cursor:pointer;border:2px solid #0d9488;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);">
            <div class="coming-card-icon">${m.emoji}</div>
            <div class="coming-card-num" style="color:#134e4a;">Module ${m.num}</div>
            <div class="coming-card-name" style="color:#1e293b;">${m.name}</div>
            <span class="coming-soon-badge" style="background:#ccfbf1;border-color:#5eead4;color:#134e4a;">Open →</span>
          </div></a>`;
      } else if (unavailable) {
        return `<div class="coming-card"><div class="coming-card-icon">${m.emoji}</div><div class="coming-card-num">Module ${m.num}</div><div class="coming-card-name">${m.name}</div><span class="coming-soon-badge">Coming Soon</span></div>`;
      } else {
        return `<div class="coming-card"><div class="coming-card-icon">${m.emoji}</div><div class="coming-card-num">Module ${m.num}</div><div class="coming-card-name">${m.name}</div><span class="coming-soon-badge">Pending Assignment</span></div>`;
      }
    }).join('');
    container.innerHTML = html;
  }

  async function loadAndRenderModules(studentId, assignedContainerId, curriculumContainerId) {
    const { data: catalog } = await sbClient.from('modules').select('*').order('module_number');
    if (catalog && catalog.length) {
      MODULES_CATALOG = catalog.map(m => ({ key:m.module_key, num:m.module_number, name:m.name, emoji:m.emoji, available:m.is_available, guideUrl:m.guide_url, quizUrl:m.quiz_url, desc:m.description }));
    }
    const { data } = await sbClient.from('student_module_access').select('module_key, enabled').eq('student_id', studentId);
    const accessMap = {};
    (data || []).forEach(r => { accessMap[r.module_key] = r.enabled; });
    if (assignedContainerId) renderAssignedModules(accessMap, assignedContainerId);
    if (curriculumContainerId) renderCurriculumGrid(accessMap, curriculumContainerId);
    localStorage.setItem('nclex_module_access', JSON.stringify(accessMap));
  }

  // Check stored session on load
  (async function init() {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) { location.replace('student-login.html?next=courtney-hub.html'); return; }
    const { data: student } = await sbClient.from('students').select('id,name').eq('auth_user_id', session.user.id).maybeSingle();
    if (student && student.name === 'Courtney Stewart') { unlockHub(student.id, 'Courtney'); return; }
    const el = document.getElementById('pin-error');
    if (el) el.textContent = 'This account is not assigned to Courtney’s hub.';
  })();

  // PIN input
  let pinBuffer = '';
  function pinKey(digit) {
    if (pinBuffer.length >= 4) return;
    pinBuffer += digit;
    updateDots();
    if (pinBuffer.length === 4) checkPin();
  }
  function pinDel() {
    pinBuffer = pinBuffer.slice(0, -1);
    const el = document.getElementById('pin-error');
    if (el) el.textContent = '';
    updateDots(false);
  }
  function updateDots(err) {
    for (let i = 0; i < 4; i++) {
      const d = document.getElementById('d' + i);
      if (!d) return;
      d.classList.toggle('filled', i < pinBuffer.length);
      d.classList.toggle('error', !!err);
    }
  }
  document.addEventListener('keydown', function(e) {
    if (document.body.classList.contains('unlocked')) return;
    if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pinKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); pinDel(); }
  });

  async function checkPin() {
    const el = document.getElementById('pin-error');
    if (el) el.textContent = 'Please sign in with Courtney’s assigned email account.';
    pinBuffer = '';
    updateDots(true);
  }
</script>
